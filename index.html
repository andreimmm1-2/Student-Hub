  (workedExamples?'<section class="science-lesson-section"><h3>Worked exam calculations</h3><p>Follow the method, substitute values with units and check that the final answer is sensible.</p>'+workedExamples+'</section>':'')+
  (mistakes?'<section class="science-lesson-section"><h3>Common exam traps</h3><ul class="science-lesson-points">'+mistakes+'</ul></section>':'')+
  '<section class="science-lesson-section science-lesson-visual"><h3>Visual study guide</h3><p>Organise the topic around its central idea. Connect each term to its structure, role, process and observable outcome.</p><div class="science-concept-map"><div class="science-map-centre">'+escape(t.title)+'</div><div class="science-map-branches">'+t.terms.slice(0,6).map((x,j)=>'<div class="science-map-branch"><span>'+String(j+1).padStart(2,'0')+'</span><b>'+escape(x.split(' — ')[0])+'</b><small>Definition · process · application</small></div>').join('')+'</div></div></section>'+
  '<section class="science-lesson-section science-lesson-practical"><span class="pill">PRACTICAL &amp; APPLICATION</span><h3>Practical focus</h3><p>'+escape(t.practical||'Identify the independent, dependent and control variables, choose suitable equipment, repeat measurements, calculate a mean and evaluate uncertainty.')+'</p></section>'+
  (practicalGuides?'<section class="science-lesson-section science-practical-library"><span class="pill">AQA REQUIRED PRACTICALS · '+practicalGuides.length+' WALKTHROUGHS</span><h3>Practical method guides</h3><p>Open each method to revise the aim, procedure, variables, calculations, evaluation and safety considerations. Follow your teacher’s risk assessment and school laboratory instructions for any real experiment.</p>'+practicalGuides+'</section>':'')+
  '<section class="science-lesson-section"><h3>Check your understanding</h3><div class="science-check-card"><b>Recall question</b><p>'+escape(t.q)+'</p><p class="muted">Answer from memory in full sentences. Use the relevant scientific terms and explain the reasoning.</p></div></section>'+
  '<section class="science-lesson-section science-lesson-exam"><span class="pill">AQA EXAM PRACTICE</span><h3>Apply your knowledge</h3><p>'+escape(t.exam)+'</p><p><b>Exam technique:</b> identify the command word, select the relevant scientific knowledge, then link each point directly to the question. For calculations, show each step, use consistent units and give the final unit.</p><button type="button" data-sci-check="exam" data-sci-subject="'+subject+'" data-sci-topic="'+t.id+'">Reveal indicative mark points</button><div id="scienceExamMark-'+t.id+'" class="hidden"><p>'+escape(t.mark)+'</p></div>'+extraExam+'</section>'+
  '<div class="science-lesson-footer"><span>AQA GCSE Science · '+(scienceStarter[subject]?.title||'Science')+'</span><button type="button" class="primary" data-sci-revise="'+t.id+'">Revise this topic →</button></div></article>';
}
function scienceTopicPage(subject,topic){
 const t=scienceStarter[subject]?.topics.find(x=>x.id===topic);if(!t)return '<p>Topic not found.</p>';

function scienceActivityData(){

  organisation:['Why must large insoluble food molecules be broken down during digestion?','What is an enzyme and how does its active site interact with a substrate?','What does a double circulatory system mean?','How do arteries, veins and capillaries differ in their roles?'],

  bonding:['What happens to electrons during ionic bonding?','How are electrons involved in a covalent bond?','What holds a metallic structure together?','Why do simple molecular substances often have low melting points?'],

e is dismissed – man seeks dominance over nature</li><li>Explores the impact of nature but it is man&#39;s thought processes and imagination that gives nature its power</li></ul><h4>Exposure</h4><ul><li>Nature is dominant and causes man to reflect on his state</li><li>Significant psychological and physical impact – causes man to regress to a basic state</li></ul></section><section class="card learn-matrix"><h3>Powerful Rulers &amp; Institutions: Comparisons</h3><h4>Shared Points (Ozymandias &amp; My Last Duchess)</h4><ul><li>Both poems explore the nature of powerful leaders</li><li>Both poems explore leaders who are corrupt and narcissistic</li><li>Both poets criticise leaders</li></ul><h4>Ozymandias</h4><ul><li>Explores the power of the state</li><li>The ruler&#39;s power fades</li><li>Nature overwhelms Ozymandias</li></ul><h4>My Last Duchess</h4><ul><li>Explores patriarchal power</li><li>The Duke still retains control over the Duchess as he controls the one-sided narrative</li><li>The Duke&#39;s power is not overwhelmed</li></ul><h4>Powerful Institutions: Shared Points (London &amp; Tissue)</h4><ul><li>Both explore institutions that are corrupt</li><li>Both explore the failure of institutions and the impact they can have</li><li>Both challenge the status quo</li></ul><h4>London</h4><ul><li>Blake offers mental freedom and free thought as the solutions to the issues he explores</li><li>As a Romantic poet, Blake criticises authority and aspects of the Industrial Revolution</li></ul><h4>Tissue</h4><ul><li>Dharker offers light and transparency as the solution to the issues she explores</li><li>Dharker draws upon the traditions of Romanticism and champions nature</li></ul></section><section class="card learn-matrix"><h3>Identity: Comparisons</h3><h4>Shared Points (The Émigrée &amp; Checking Out Me History)</h4><ul><li>Both poems deal with the loss of identity</li><li>Both poems explore the power of one&#39;s own history and how it shapes a personal narrative/identity</l function practiceDeckData(){
 const rows=poems.flatMap(p=>(p[3]||[]).map((x,i)=>{
  const note=(exactNotes[p[0]]||[]).find(n=>n[0]===x[0]);
  // Keep the Learn booklet analysis as its original, separate bullet points.
  const analysisPoints=Array.isArray(note?.[2])?[...note[2]]:String(note?.[2]||x[2]||'').split(/(?<=[.!?])\\s+/).filter(Boolean);
  return {id:p[0]+'-'+i,poem:p[0],author:p[1]||'',theme:p[2]||'',quote:x[0]||'',method:note?.[1]||x[1]||'',analysisPoints,analysis:analysisPoints.join(' '),context:x[3]||''};
 })).filter(x=>x.quote);
 // Include the complete second quotation from Learn's exact notes where it is not already in the poem data.
 const existing=new Set(rows.map(x=>x.poem+'|'+x.quote));
 return rows.concat(poems.flatMap(p=>(exactNotes[p[0]]||[]).filter(n=>!existing.has(p[0]+'|'+n[0])).map((n,i)=>({
  id:p[0]+'-extra-'+i,poem:p[0],author:p[1]||'',theme:p[2]||'',quote:n[0],method:n[1]||'',
  analysisPoints:Array.isArray(n[2])?[...n[2]]:String(n[2]||'').split(/(?<=[.!?])\s+/).filter(Boolean),
  analysis:Array.isArray(n[2])?n[2].join(' '):String(n[2]||''),context:p[3]?.[0]?.[3]||''
 }))));
}

 function answerQuestion(answer,q){

function practiceMatchGaps(){

 let mode='matching',matchFormat='quote-poem',gapFormat='typed',rapid=false,timed=false;
 let remaining=180,tick=null,items=[],rightOrder=[],matched=[],selected=null,attempts=[],questionIndex=0,score=0;
 function renderSetup(){

 function startTimer(){

 function timerText(){return Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0')}
 function makePairs(){
  const unique=[...new Map(all.map(x=>[x.poem,x])).values()];
  const selectedItems=practiceShuffle(unique).slice(0,Math.min(5,unique.length));
  return selectedItems.map((c,i)=>{

function practiceExplainIt(){
 const started=Date.now(),area=$('reviseArea'),deck=practiceShuffle(practiceDeckData());
 const uid=user.id,weakStore=practiceReadStore('rc-progression-weak-'+uid);
 let current=null,stage=0,ratings={},notes={};
 const steps=[
  {id:'idea',title:'Develop the idea',prompt:'What is the poem saying about power, conflict or human experience?',model:c=>c.context||c.theme||c.poem+' explores '+c.theme+'.'},

  $('progressionPoem').onchange=refreshQuotes;refreshQuotes();

   const quoteId=$('progressionQuote').value;current=deck.find(c=>c.id===quoteId)||deck.find(c=>c.poem===$('progressionPoem').value)||deck[0];stage=0;ratings={};notes={};renderStep();
  };
 }
 function refreshQuotes(){

 }
 function renderStep(){
  const item=steps[stage],key=current.id+'|'+item.id,model=item.model(current);
  practiceMount(practiceHeader('Explain It / '+item.title,'Stage '+(stage+1)+' of 4 · Build your response from memory before revealing the model.')+
   '<section class="progression-task"><div class="progression-topline"><span class="rev-kicker">ANALYSIS BUILDER</span><span>'+practiceSafe(current.poem)+'</span></div>'+practiceProgressBar(stage+1,steps.length)+
   '<div class="progression-step-heading"><span>0'+(stage+1)+'</span><div><h2>'+practiceSafe(item.title)+'</h2><p>'+practiceSafe(item.prompt)+'</p></div></div>'+
   '<div class="progression-quote-context"><span class="rev-kicker">YOUR QUOTATION</span><blockquote>“'+practiceSafe(current.quote)+'”</blockquote></div>'+
   '<label class="progression-recall-label">Your recall<textarea id="progressionDraft" class="field" rows="5" placeholder="Write your explanation in your own words before revealing the model…">'+practiceSafe(notes[item.id]||'')+'</textarea></label>'+
   '<div class="progression-model-area"><button id="progressionReveal">Reveal model answer</button><div id="progressionModel" class="progression-model hidden"><span class="rev-kicker">MODEL ANSWER</span><p>'+practiceSafe(model)+'</p></div></div>'+
   '<div class="progression-rating"><span>How secure is this stage?</span><button id="progressionWeak">Needs more practice</button><button id="progressionStrong" class="primary">I remembered it</button></div>'+
   '<div class="progression-navigation"><button id="progressionPrevious" '+(stage===0?'disabled':'')+'>Previous stage</button><button id="progressionNext">Continue →</button><span>'+(Object.keys(ratings).length)+' / 4 stages assessed</span></div></section>');
  $('progressionReveal').onclick=()=>{$('progressionModel').classList.remove('hidden');$('progressionReveal').textContent='Model answer revealed'};
  const saveDraft=()=>{notes[item.id]=$('progressionDraft').value};
  $('progressionDraft').oninput=saveDraft;
  $('progressionWeak').onclick=()=>markStage(false);
  $('progressionStrong').onclick=()=>markStage(true);
  $('progressionPrevious').onclick=()=>{saveDraft();if(stage>0){stage--;renderStep()}};
  $('progressionNext').onclick=()=>{saveDraft();if(stage===3)finishProgression();else{stage++;renderStep()}};
 }
 function markStage(secure){
  notes[steps[stage].id]=$('progressionDraft').value;
  ratings[steps[stage].id]=secure;
  const k=current.id+'|'+steps[stage].id;
  weakStore[k]=secure?Math.max(0,(weakStore[k]||0)-1):(weakStore[k]||0)+1;
  if(!weakStore[k])delete weakStore[k];
  practiceWriteStore('rc-progression-weak-'+uid,weakStore);
  if(stage===3)finishProgression();else{stage++;renderStep()}
 }
 async function finishProgression(){
  const secure=steps.filter(x=>ratings[x.id]===true),weak=steps.filter(x=>ratings[x.id]===false),answered=Object.keys(ratings).length,accuracy=Math.round(secure.length/steps.length*100);
  const detail='<div class="practice-result-grid"><div><b>'+secure.length+'</b><span>Secure stages</span></div><div><b>'+weak.length+'</b><span>To revisit</span></div><div><b>'+accuracy+'%</b><span>Confidence score</span></div></div><div class="progression-results-steps">'+steps.map((x,i)=>'<article><span>0'+(i+1)+'</span><div><b>'+practiceSafe(x.title)+'</b><p>'+(ratings[x.id]===true?'Marked secure':ratings[x.id]===false?'Needs more practice':'Not assessed')+'</p>'+(notes[x.id]?'<small>Your note: '+practiceSafe(notes[x.id])+'</small>':'')+'</div><strong>'+(ratings[x.id]===true?'SECURE':ratings[x.id]===false?'REVISIT':'—')+'</strong></article>').join('')+'</div><p>'+(weak.length?'Next time, spend more time on '+weak.map(x=>x.title.toLowerCase()).join(' and ')+'.':'You marked every stage as secure. Keep practising to strengthen recall.')+'</p>';
  await practiceAward('progression',secure.length,current.poem,accuracy,{total_questions:answered,correct_answers:secure.length,weak_stages:weak.map(x=>x.id),strong_stages:secure.map(x=>x.id)},'Your analysis progression',secure.length+' of 4 stages marked secure',detail,started,practiceExplainIt);
 }
 renderStart();
}

async function loadAdmin(){const [pr,sr,ur,ar]=await Promise.all([supabase.from('profiles').select('id,username,display_name').order('username'),supabase.from('study_sessions').select('user_id,activity,xp_earned,duration_seconds,created_at').order('created_at',{ascending:false}).limit(500),supabase.from('user_presence').select('user_id,last_seen,current_page,study_status,session_started_at'),supabase.from('admin_users').select('user_id')]);if(pr.error){$('adminUsers').textContent=pr.error.message;return}const presence=Object.fromEntries((ur.data||[]).map(x=>[x.user_id,x])),admins=new Set((ar.data||[]).map(x=>x.user_id)),stats={};(sr.data||[]).forEach(x=>{stats[x.user_id]??={seconds:0,points:0};stats[x.user_id].seconds+=Number(x.duration_seconds||0);stats[x.user_id].points+=Number(x.xp_earned||0)});$('adminAccess').innerHTML='<select id="adminPerson" class="field">'+(pr.data||[]).map(x=>'<option value="'+x.id+'">'+escape(x.display_name||x.username)+' (@'+escape(x.username)+')'+(admins.has(x.id)?' · Admin':'')+'</option>').join('')+'</select><div class="row"><button id="grantAdmin" class="primary">Make admin</button><button id="removeAdmin">Remove admin</button></div><p id="adminAccessMsg"></p>';$('grantAdmin').onclick=async()=>{let r=await supabase.from('admin_users').insert({user_id:$('adminPerson').value});$('adminAccessMsg').textContent=r.error?(r.error.code==='23505'?'Already an admin.':r.error.message):'Admin access granted.';loadAdmin()};$('removeAdmin').onclick=async()=>{let id=$('adminPerson').value;if(id===user.id&&admins.size<=1){$('adminAccessMsg').textContent='Cannot remove the last admin.';return}let r=await supabase.from('admin_users').delete().eq('user_id',id);$('adminAccessMsg').textContent=r.error?r.error.message:'Admin access removed.';loadAdmin()};$('publishAnnouncement').onclick=async()=>{let title=$('announcementTitle').value.trim(),body=$('announcementBody').value.trim();if(!title||!body){$('announcementMsg').textContent='Enter a title and message.';return}let r=await supabase.from('announcements').insert({title,body,created_by:user.id});$('announcementMsg').textContent=r.error?r.error.message:'Announcement published.';if(!r.error){$('announcementTitle').value='';$('announcementBody').value=''}};$('adminUsers').innerHTML=(pr.data||[]).map(x=>{let p=presence[x.id],st=stats[x.id]||{seconds:0,points:0},online=p&&Date.now()-new Date(p.last_seen).getTime()<90000;return '<div class="feedback"><b>'+escape(x.username)+'</b> '+(admins.has(x.id)?'<span class="pill">ADMIN</span>':'')+' · '+(online?'Online':'Offline')+'<p>'+escape(p?.study_status||'offline')+' · '+escape(p?.current_page||'—')+' · Quiz time '+Math.round(st.seconds/60)+' min · Points '+st.points+'</p><input class="field" id="rename-'+x.id+'" value="'+escape(x.display_name||x.username)+'"><button data-rename="'+x.id+'">Save display name</button></div>'}).join('');$('adminUsers').onclick=async e=>{let id=e.target.dataset.rename;if(!id)return;let r=await supabase.from('profiles').update({display_name:$('rename-'+id).value.trim()}).eq('id',id);if(r.error)alert(r.error.message);else loadAdmin()}}
async function startPresence(){if(!user?.id)return;if(window.rcPresenceTimer)clearInterval(window.rcPresenceTimer);const uid=user.id,sessionStart=new Date().toISOString();const send=async()=>{if(!user?.id||user.id!==uid)return;const {error}=await supabase.from('user_presence').upsert({user_id:uid,last_seen:new Date().toISOString(),current_page:page,study_status:['revise','poem'].includes(page)?'studying':'online',session_started_at:sessionStart},{onConflict:'user_id'});if(error)console.warn('Presence update failed:',error.message)};await send();window.rcPresenceTimer=setInterval(send,30000)}

/* Native select data remains the source of truth; custom menus provide the UI. */
(()=>{
 const openMenus=new Set();
 let typeTimer=null,typeText='';
 function optionsFor(select){return [...select.options].map((o,i)=>({value:o.value,label:o.textContent.trim(),disabled:o.disabled,selected:i===select.selectedIndex,index:i}))}
 function sync(select){
  const host=select.closest('.custom-select-host');if(!host)return;
  const trigger=host.querySelector('.custom-select-trigger'),value=trigger?.querySelector('.custom-select-value');
  if(value)value.textContent=select.selectedOptions[0]?.textContent.trim()||'Choose an option';
  if(trigger){trigger.disabled=select.disabled;trigger.setAttribute('aria-label',select.getAttribute('aria-label')||select.closest('label')?.childNodes[0]?.textContent?.trim()||'Choose an option')}
  const menu=host.querySelector('.custom-select-menu');if(menu)renderOptions(select,menu);
 }
 function renderOptions(select,menu){
  menu.innerHTML='';
  optionsFor(select).forEach(o=>{
   const b=document.createElement('button');b.type='button';b.className='custom-select-option';b.disabled=o.disabled;b.setAttribute('role','option');b.setAttribute('aria-selected',String(o.selected));b.dataset.value=o.value;
   const label=document.createElement('span');label.textContent=o.label;b.append(label);
   if(o.selected){const check=document.createElement('span');check.className='custom-select-check';check.textContent='✓';check.setAttribute('aria-hidden','true');b.append(check)}
   b.addEventListener('click',()=>{select.value=o.value;select.dispatchEvent(new Event('change',{bubbles:true}));close(hostFor(select));select.closest('.custom-select-host')?.querySelector('.custom-select-trigger')?.focus()});
   menu.append(b);
  });
 }
 function hostFor(select){return select.closest('.custom-select-host')}
 function position(host){
  const trigger=host.querySelector('.custom-select-trigger'),menu=host.querySelector('.custom-select-menu');if(!trigger||!menu)return;
  const r=trigger.getBoundingClientRect(),gap=6,roomBelow=innerHeight-r.bottom-gap,roomAbove=r.top-gap;
  const max=Math.min(320,Math.max(120,Math.max(roomBelow,roomAbove)-8));
  menu.style.maxHeight=max+'px';menu.style.minWidth=Math.min(Math.max(r.width,180),innerWidth-24)+'px';
  const height=Math.min(menu.scrollHeight,max),above=roomBelow<Math.min(220,menu.scrollHeight)&&roomAbove>roomBelow;
  menu.style.left=Math.max(10,Math.min(r.left,innerWidth-menu.offsetWidth-10))+'px';
  menu.style.top=(above?Math.max(10,r.top-gap-height):Math.min(innerHeight-height-10,r.bottom+gap))+'px';
 }
 function close(host,focus=false){
  if(!host)return;const trigger=host.querySelector('.custom-select-trigger'),menu=host.querySelector('.custom-select-menu');
  trigger?.setAttribute('aria-expanded','false');menu?.remove();openMenus.delete(host);if(focus)trigger?.focus();
 }
 function open(host){
  const select=host.querySelector('select'),trigger=host.querySelector('.custom-select-trigger');if(!select||select.disabled)return;
  [...openMenus].forEach(h=>close(h));const menu=document.createElement('div');menu.className='custom-select-menu';menu.setAttribute('role','listbox');menu.id=host.dataset.menuId;
  renderOptions(select,menu);document.body.append(menu);host.append(menu);trigger.setAttribute('aria-expanded','true');openMenus.add(host);position(host);
  const active=menu.querySelector('[aria-selected="true"]:not(:disabled)')||menu.querySelector('button:not(:disabled)');active?.focus();
 }
 function enhance(select){
  if(select.dataset.customized==='true'||!select.parentNode)return;
  const host=document.createElement('span');host.className='custom-select-host';host.dataset.menuId='custom-menu-'+Math.random().toString(36).slice(2);
  select.parentNode.insertBefore(host,select);host.append(select);select.classList.add('custom-select-native');select.dataset.customized='true';select.tabIndex=-1;select.setAttribute('aria-hidden','true');
  const trigger=document.createElement('button');trigger.type='button';trigger.className='custom-select-trigger';trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');trigger.setAttribute('aria-controls',host.dataset.menuId);
  const value=document.createElement('span');value.className='custom-select-value';const chevron=document.createElement('span');chevron.className='custom-select-chevron';chevron.setAttribute('aria-hidden','true');trigger.append(value,chevron);host.append(trigger);
  trigger.addEventListener('click',()=>openMenus.has(host)?close(host):open(host));
  trigger.addEventListener('keydown',e=>{
   if(['ArrowDown','ArrowUp','Enter',' '].includes(e.key)){e.preventDefault();open(host)}
  });
  select.addEventListener('change',()=>sync(select));sync(select);
 }
 document.addEventListener('click',e=>{for(const h of [...openMenus])if(!h.contains(e.target)&&!h.querySelector('.custom-select-menu')?.contains(e.target))close(h)});
 document.addEventListener('keydown',e=>{
  const host=[...openMenus].find(h=>h.querySelector('.custom-select-menu')?.contains(document.activeElement));if(!host)return;
  const menu=host.querySelector('.custom-select-menu'),items=[...menu.querySelectorAll('button:not(:disabled)')],i=items.indexOf(document.activeElement);
  if(e.key==='Escape'){e.preventDefault();close(host,true)}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();items[Math.max(0,Math.min(items.length-1,i+(e.key==='ArrowDown'?1:-1))) ]?.focus()}
  else if(e.key==='Home'){e.preventDefault();items[0]?.focus()}
  else if(e.key==='End'){e.preventDefault();items.at(-1)?.focus()}
  else if(e.key==='Tab')close(host);
  else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey){typeText+=e.key.toLowerCase();clearTimeout(typeTimer);typeTimer=setTimeout(()=>typeText='',650);const found=items.find(b=>b.textContent.trim().toLowerCase().startsWith(typeText));found?.focus()}
 });
 const scan=root=>{if(root.matches?.('select'))enhance(root);root.querySelectorAll?.('select').forEach(enhance)};
 const observer=new MutationObserver(records=>records.forEach(rec=>{const owner=rec.target.nodeType===1?rec.target.closest('select'):rec.target.parentElement?.closest('select');if(owner?.dataset.customized==='true')sync(owner);rec.addedNodes.forEach(n=>{if(n.nodeType===1)scan(n)})}));
 document.addEventListener('DOMContentLoaded',()=>{scan(document);observer.observe(document.body,{childList:true,subtree:true})});
 if(document.readyState!=='loading'){scan(document);observer.observe(document.body,{childList:true,subtree:true})}
 window.addEventListener('resize',()=>openMenus.forEach(position));window.addEventListener('scroll',()=>openMenus.forEach(position),true);
})();
</script></body></html>
