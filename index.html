/* Hub refresh: clearer hierarchy, calmer spacing, responsive navigation */

.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px}

#app{display:block}#page{min-width:0}.nav{display:flex!important;overflow-x:auto}.field{margin:10px 0 18px;min-height:48px}.auth .field{display:block;margin-bottom:18px}.board-row{padding:13px 0;border-bottom:1px solid var(--line)}.board-bar{height:13px;margin-top:9px;background:var(--soft);border-radius:99px}.board-bar span{border-radius:99px;transition:width .35s ease}.subject-card{min-height:220px}.subject-card .pill{width:max-content}.coming-card{border-style:dashed}.coming-card .pill{background:#fff0cc;color:#93600c;border:0}

.home-intro{margin:18px 0 16px}.home-intro h2{font-size:clamp(25px,4vw,34px);margin:12px 0 4px}.home-intro p{margin:4px 0 0}.hub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.hub-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;min-height:clamp(190px,25vw,270px);padding:clamp(18px,3vw,30px);border:0;border-radius:20px;color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.12);overflow:hidden;transition:transform .18s,filter .18s}.hub-tile:hover{transform:translateY(-3px);filter:brightness(1.06)}.hub-tile:focus-visible{outline:3px solid #fff;outline-offset:3px}.learn-tile{background:linear-gradient(145deg,#315c91,#203c68)}.community-tile{background:linear-gradient(145deg,#187b6d,#14534e)}.practice-tile{background:linear-gradient(145deg,#315f91,#263f63)}.progress-tile{background:linear-gradient(145deg,#b46b35,#704323)}.tile-icon{font-size:clamp(32px,5vw,46px);line-height:1}.tile-title{font-size:clamp(23px,3vw,30px);font-weight:800;letter-spacing:-.7px}.tile-copy{font-size:14px;color:rgba(255,255,255,.84)}.tile-arrow{position:absolute;right:22px;top:20px;font-size:24px;color:rgba(255,255,255,.85)}.home-lower{margin-top:15px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.home-lower h3{margin:9px 0 0}.home-lower p{margin:3px 0}.nav{display:flex!important}.immersive header,.immersive .nav{display:none!important}.immersive .wrap{max-width:100%;padding:12px 18px 24px}.immersive #page{max-width:1000px;margin:0 auto}.immersive .flash{min-height:55vh}.immersive .card{box-shadow:none}.immersive-exit{display:flex;justify-content:flex-end;margin-bottom:10px}

.wrap{max-width:1440px}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px clamp(18px,4vw,42px);margin:8px 0 22px;border-radius:22px;color:#fff;min-height:160px}.page-heading h2{font-size:clamp(30px,4vw,44px);margin:10px 0 4px;color:#fff}.page-heading p{color:rgba(255,255,255,.82);margin:0;max-width:680px}.page-heading .pill{border-color:rgba(255,255,255,.35);color:#fff}.page-heading-icon{font-size:clamp(48px,7vw,76px);line-height:1;opacity:.95;padding:12px}.community-heading{background:linear-gradient(120deg,#176b61,#164b63)}.practice-heading{background:linear-gradient(120deg,#315f91,#263f63)}.progress-heading{background:linear-gradient(120deg,#a95f32,#6b452f)}.updates-heading{background:linear-gradient(120deg,#315f91,#3c477e)}.admin-heading{background:linear-gradient(120deg,#3d4859,#222c3b)}.community-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:16px;align-items:start}.community-main{grid-row:span 2}.community-board{grid-column:1/-1}.section-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}.section-heading h3{margin:0}.section-heading p{margin:4px 0}.friend-add-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.friend-add-row .field{margin:4px 0}.duel-panel{background:linear-gradient(150deg,#e9f6f3,#fff)}body.dark .duel-panel{background:linear-gradient(150deg,#183e3a,#1b1f23)}.duel-panel .tile-icon{font-size:38px;margin:12px 0}.duel-panel h3{font-size:24px}.community-board{min-width:0}.practice-page{max-width:1180px;margin:0 auto}.practice-tabs{padding:8px;background:var(--soft);border-radius:14px;width:max-content;max-width:100%}.practice-tabs button.active{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.08)}.progress-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.progress-stats .card{min-height:145px}.progress-stats .score{font-size:clamp(30px,4vw,44px);font-weight:8 a{padding:12px}body.activity-session #reviseArea .flash-study-card{padding:20px 16px}}

/* Polished two-sided flashcard and less wasteful activity layouts. */

/* Clear subject and course navigation, with a scannable themed poem library. */

/* Refined neutral palette: graphite, slate blue and teal; no lavender or purple accents. */
:root{--bg:#f4f5f6;--card:rgba(255,255,255,.82);--ink:#202326;--muted:#68717c;--line:#dfe3e8;--accent:#315f91;--soft:#edf1f5;--shadow:0 12px 34px rgba(30,38,48,.07);--glass:rgba(255,255,255,.74);--glass-strong:rgba(255,255,255,.9)}
body{background:linear-gradient(135deg,#f5f6f7,#eceff2);background-attachment:fixed}

.card,.poem.card,.poem-library-grid .poem,.subject-course,.subject-hero,.auth,.practice-start,.learn-tabs,.subject-tabs,.feedback,.activity-top,.flash-stage,.blurt-session,.quiz-session,.progression-session{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(16px) saturate(115%);-webkit-backdrop-filter:blur(16px) saturate(115%)}
.card,.poem.card,.poem-library-grid .poem,.subject-course,.subject-hero,.auth{border-radius:20px}
.nav{background:var(--glass-strong);border:1px solid var(--line);box-shadow:0 8px 28px rgba(25,30,45,.06);backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%)}

/* Consistent custom select controls */
.custom-select-host{position:relative;display:inline-block;width:100%;min-width:0;vertical-align:middle}
.custom-select-native{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;opacity:0!important;pointer-events:none!important}
.custom-select-trigger{width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:13px;background:var(--glass-strong);color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer;transition:border-color .18s,box-shadow .18s,background .18s}
.custom-select-trigger:hover{border-color:var(--accent)}
.custom-select-trigger:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:2px}
.custom-select-trigger:disabled{opacity:.55;cursor:not-allowed}
.custom-select-trigger .custom-select-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.custom-select-chevron{width:8px;height:8px;flex:0 0 8px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.65;transition:transform .18s}
.custom-select-trigger[aria-expanded="true"] .custom-select-chevron{transform:rotate(225deg) translate(-1px,-1px)}
.custom-select-menu{position:fixed;z-index:10000;min-width:180px;max-width:min(360px,calc(100vw - 24px));max-height:min(320px,calc(100dvh - 24px));overflow:auto;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--card,var(--glass-strong));color:var(--ink);box-shadow:0 16px 42px rgba(15,23,42,.2);overscroll-behavior:contain}
.custom-select-option{display:flex;width:100%;align-items:center;gap:10px;padding:10px 11px;border:0;border-radius:9px;background:transparent;color:inherit;font:inherit;font-size:13px;text-align:left;cursor:pointer}
.custom-select-option:hover,.custom-select-option[aria-selected="true"]{background:var(--soft)}
.custom-select-option[aria-selected="true"]{font-weight:750}
.custom-select-option:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.custom-select-option:disabled{opacity:.45;cursor:not-allowed}
.custom-select-check{margin-left:auto;color:var(--accent);font-weight:800}

function learningPoints(text){return '<ul class="learning-points">'+String(text||'').split(/(?<=[.!?])\\s+/).filter(Boolean).map(x=>'<li>'+escape(x.trim())+'</li>').join('')+'</ul>'}
const poems=[
['Remains','Simon Armitage','Victims and effects of war',[['blood-shadow','Metaphor','The compound noun “blood-shadow” fuses physical violence with something that follows the speaker. A shadow is difficult to escape, so the image suggests that the memory of killing has attached itself to the soldier and continues to haunt him after the event. Armitage makes guilt feel like a permanent presence rather than a passing emotion.','The violent act leaves lasting psychological trauma; the effects of conflict continue long after the battlefield.'],['tosses his guts','Violent imagery','The verb “tosses” is casual and almost dismissive, as if the body parts are an ordinary object. This matter-of-fact diction clashes with the horrific image of “guts”, making the violence feel brutally routine. Armitage may be showing how soldiers use detached language to cope with extreme experiences.','Conflict can normalise brutality and leave soldiers emotionally detached, even while they suffer lasting guilt.']]],
['War Photographer','Carol Ann Duffy','Victims and effects of war',[['light is red','Colour imagery','The simple colour image “red” can suggest blood, danger and suffering. Its starkness makes the photograph’s subject feel immediate, while the controlled darkroom setting contrasts with the chaos of the conflict being recorded. Duffy draws attention to the photographer’s difficult role: turning distant suffering into an image others can see.','The poem explores how war creates victims and how those far away encounter their suffering through images.']]],
['Poppies','Jane Weir','Victims and effects of war',[['bandaged ... Poppies ... blockade','War imagery','The word “bandaged” suggests injury and the need to protect something vulnerable, while “blockade” implies an obstacle that cannot easily be crossed. By placing these images alongside the poppies, Weir connects the physical language of conflict with the speaker’s emotional attempt to hold on to her child. The ordinary domestic moment becomes marked by separation and loss.','War affects those left at home as well as those who fight; separation creates emotional wounds for families.']]],
['Bayonet Charge','Ted Hughes','War',[['cold clockwork','Metaphor','The metaphor “cold clockwork” makes the soldier seem mechanical, as though his body is moving through a process he cannot control. “Cold” removes warmth and humanity, while “clockwork” suggests repetitive, automatic movement. Hughes presents the soldier as overwhelmed by the machinery and violence of war rather than acting with heroic certainty.','War dehumanises individuals and reduces them to frightened bodies reacting instinctively.']]],
['Kamikaze','Beatrice Garland','War',[['crab, prawns ... dark prince','Contrast','Fishing imagery -> captures childhood innocence and pure joy.','The poem questions the pressure of patriotic duty and shows the personal cost of conflict.']]],
['The Charge of the Light Brigade','Alfred Tennyson','War',[['valley of Death','Biblical allusion','The biblical echo of the “valley of Death” gives the battlefield the scale of a spiritual trial and makes the soldiers’ danger seem almost inevitable. The capitalised “Death” personifies their enemy as an overwhelming force. Tennyson both honours their courage and exposes the terrible cost of unquestioning obedience.','The poem presents the soldiers as courageous but vulnerable to the destructive consequences of orders.']]],
['The Prelude','William Wordsworth','Nature',[['act of stealth','Diction','The phrase “act of stealth” suggests secrecy and wrongdoing, as if the speaker knows that taking the boat is a transgression. This language reveals his confidence before the mountain appears: he initially treats the natural world as something he can use. The later change in tone exposes the limits of that confidence.','Nature humbles human pride and makes the speaker recognise that he is not in control.']]],
['Storm on the Island','Seamus Heaney','Nature',[['spits like a tame cat','Simile','The simile initially compares the storm to a familiar, apparently harmless pet, making the threat seem manageable. However, “spits” gives the weather an aggressive action, so the comparison becomes unsettling: something that appears tame can still attack. Heaney uses this shift to challenge the islanders’ confidence in their ability to withstand nature.','Nature is unpredictable; human confidence can be undermined by forces that seem familiar or harmless.']]],
['My Last Duchess','Robert Browning','Powerful Rulers',[['my...I','Pronouns / Dramatic Monologue','The possessive pronoun “my” makes the Duchess sound like the Duke’s property rather than an independent person. Combined with “last”, it hints at his control over her fate and reveals how he treats relationships as possessions. Browning lets the Duke expose his own arrogance through his choice of words.','The poem criticises patriarchal power and the way authority can become possessive and abusive.']]],
['London','William Blake','Powerful institutions',[['mind-forged manacles','Metaphor','The metaphor “mind-forged manacles” turns psychological oppression into the image of physical chains. “Forged” suggests that these restraints have been made and reinforced by people and institutions, while “manacles” conveys imprisonment. Blake implies that social systems shape how people think until oppression becomes internalised.','Powerful institutions restrict freedom both physically and through the beliefs people are taught to accept.']]],
['Tissue','Imtiaz Dharker','Powerful institutions',[['Koran ... maps ... slips','Symbolism','The list brings together sacred writing, political borders and fragile pieces of paper, suggesting that human structures depend on materials that can easily be damaged. Dharker places different kinds of authority alongside one another to question how securely people build power, identity and boundaries. The fragile paper becomes a symbol of the limits of human control.','Human systems and claims to authority are fragile; power does not last forever.']]],
['The Émigrée','Carol Rumens','Identity',[['bright ... shadow','Contrast','The contrast between “bright” and “shadow” places the speaker’s hopeful memory beside the darker reality of political conflict. Light suggests warmth, belonging and an idealised homeland, whereas shadow hints at danger and loss. Rumens shows that the speaker’s attachment to home survives even when the place itself has changed.','Memory can preserve identity and belonging even when conflict makes returning home difficult.']]],
['Checking Out Me History','John Agard','Identity',[['Dem','Dialect / pronoun','The repeated colloquial pronoun “Dem” creates a clear distinction between the speaker and the people who control the version of history he has been taught. Its repetition gives the voice rhythm and resistance, challenging the authority of the dominant group. Agard uses dialect to assert an identity that official education has marginalised.','The poem challenges cultural oppression and shows the speaker reclaiming his identity and history.']]],
['Exposure','Wilfred Owen','Nature',[['black with snow','Colour imagery','The paradoxical image “black with snow” combines a colour associated with darkness and death with snow, which is usually associated with whiteness and purity. This disturbing contrast makes the landscape feel unnatural and hostile, reflecting the soldiers’ psychological despair. Owen presents nature not as comforting but as another force attacking exhausted men.','Nature becomes an enemy, intensifying the soldiers’ physical suffering and mental disintegration.'],['cringe in holes','Verb / imagery','The verb “cringe” suggests fear, shame and an instinctive shrinking away from danger. It makes the soldiers seem small and vulnerable, almost animal-like, while “holes” implies that they are trapped and exposed in the landscape. Owen strips away traditional images of military glory and focuses instead on the soldiers’ degradation and fear.','War reduces soldiers to vulnerable, dehumanised figures and exposes the reality behind patriotic ideas of heroism.']]],
['Ozymandias','Percy Bysshe Shelley','Powerful Rulers',[['sunk ... shattered visage','Visual imagery','The verbs “sunk” and “shattered” create a picture of a face physically broken and partly swallowed by the sand. “Shattered” suggests not only the destruction of the statue but also the collapse of Ozymandias’ authority and reputation. The fragmentary description makes his attempt to preserve his greatness seem futile: time and the natural world have outlasted the ruler and his empire.','Shelley presents political power and human pride as temporary; time and nature eventually overwhelm human achievements.'],['King of Kings','Irony / allusion','The title “King of Kings” is a biblical allusion usually associated with supreme, divine authority. Ozymandias applies this grand title to himself, revealing his arrogance and belief that he is above other rulers. The irony is that the inscription survives while the kingdom it celebrates has vanished, so the boast becomes evidence of his failure rather than his greatness.','Shelley mocks rulers who imagine themselves godlike and suggests that no human power can defeat time.']]]
];
const exactNotes={"Remains":[["inside out...tosses his guts","Horrific imagery / Colloquial language",["Brutal/unemotional language -> soldier mentally distances from violence.","\"tosses\" -> connotations of carelessness; war desensitizes soldiers.","Colloquial tone -> speaker unable to process military memories normally.","Critical stance -> attacks romanticized view of war."]],["blood-shadow","Metaphor",["Stain/shadow -> overpowering guilt; imprinted memory of dead man.","\"shadow\" -> absence of light; explores dark subject matter.","Trauma -> highlights difficulty overcoming war experiences."]]],"War Photographer":[["light is red","Colour Imagery",["Red -> connotations of blood; highlights dangers of war zones.","Red light -> links to church tabernacle where photographer seeks comfort.","Parallels -> compares priest and war photographer exposed to death/suffering."]],["blood stained.... foreign dust","Imagery",["Stained -> links to memories and deep psychological scarring.","Distance -> avoids naming a place to distance himself from horror.","Isolation -> mirrors how people isolate themselves from trauma."]]],"Poppies":[["bandaged ... Poppies ... blockade","Semantic field of war",["The semantic field reinforces the idea of pain and injury, with the physical injury explored representing the emotional injury that the speaker suffers from.","The idea of \"Poppies\" has connotations of blood and death, showing that there is no way back for the speaker to regain her previous joy of motherhood."]],["my stomach busy... making tucks, darts, pleats","Imagery",["Here, Duffy explores the psychological impact of conflict and death, from a maternal perspective.","The imagery creates a sense of unease and anxiety, with the layers of folds, mirroring the layers of grief and suffering that she experiences.","The sharpness or edged nature of those folds, mirrors the sharpness of her memories and anguish."]]],"Bayonet Charge":[["cold clockwork ....stars... nations","Metaphor",["Clockwork -> mechanical, unemotional state of existence; transformed into killers.","Exploitation -> questions how the state controls and decides their fate.","Cog in a machine -> highlights lack of choice and indignation at leadership."]],["King, honour, human dignity, etcetera","List",["Battle fear -> shows patriotic ideals are instantly replaced with fear.","Self-indulgence -> ideals are irrelevant and must be abandoned to survive.","Hollow concepts -> highlights patriotic ideas as meaningless in brutal war."]]],"Kamikaze":[["crab, prawns ... dark prince","Contrast",["Fishing imagery -> captures childhood innocence and pure joy.","Parallels -> fish and people are both trapped, unable to escape fate.","\"dark price\" -> forebodes a darker end; war blights all life."]],["eight","Symbolism",["Infinity symbol -> flag emphasizes power of state; soldier cannot escape destiny.","Sailing knot -> reinforces idea that pilot is completely trapped.","Unlimited nature -> continuous cycle of pain/shame; cannot return to normal life."]]],"The Charge of the Light Brigade":[["valley of Death... jaws of death","Metaphor / Personification",["Biblical reference -> connotations of hell; highlights battlefield horrors.","Predator -> personifies battlefield to show the vicious nature of war.","Bravery -> emphasizes the extreme bravery of the charging soldiers."]],["honour","Imperatives / Form: Lament",["Remembrance -> emphasizes central message of respect for sacrifice.","Immortalises -> clear purpose to keep soldiers' memory alive forever.","Conflict -> questions the battle; weighs bravery against blunders of leadership.","Celebration -> poem is traditionally a lament/mourning, but twists into celebration."]]],"The Prelude":[["act of stealth","Symbolism",["Theft of boat -> highlights overwhelming pride leading to immoral actions.","Aggression -> man is aggressive, dominant, corrupt; detracts from nature.","Spiritual journey -> man discovers humanity has no authority over nature."]],["upreared its head","Personification / Enjambment",["Attack -> nature acts as a deadly force, metaphorically attacking man.","Hostile force -> nature is subverted, transforming into something harsh and brutal.","Simplistic vocabulary -> shows how nature can shock and overwhelm man's pride.","The Sublime -> inspires intense feelings of awe and terror; impacts emotional state.","Enjambment -> emphasizes intensity of weather; mirrors chaotic emotional response."]]],"Storm on the Island":[["strafe... salvo... bombarded","Semantic field of war / Blank verse",["Unpredictable force -> demonstrates nature as an active military aggressor.","No mercy -> community is left entirely at the mercy of the storm.","Romanticism subverted -> updates traditions by showing nature as hostile.","The Troubles -> context of conflict suggests war upsets balance between man and nature."]],["spits like a tame cat / a huge nothing","Simile / Oxymoron",["Aggression -> \"spits\" has connotations of unpredictable natural anger.","Domesticity -> simile offers a familiar image, undermining nature's actual power.","Imagination -> oxymoron shows human imagination exacerbates natural fears."]]],"Exposure":[["black with snow","Oxymoron",["The oxymoron creates a stifling tone, full of despair. It shows how the soldiers face a psychological struggle.","The oxymoron highlights how nature has been subverted. Nature's power is on display as it attacks the soldiers.","The idea of \"black\" has connotations of decay and moral corruption, emphasising how the equilibrium between man and nature has become disturbed by man's actions during war."]],["cringe in holes","Imagery",["The idea of \"cringe\" shows how the soldiers are left vulnerable and defeated, seeking refuge, having lost their dignity.","The imagery highlights the power of nature as the soldiers are dehumanised.","Owen shows that nature and war have reduced the soldiers to an animalistic state.","Owen's use of caesura, shows how war and nature are unpredictable, and this contributes to the soldiers' mental disintegration."]]],"My Last Duchess":[["my...I","Pronouns / Dramatic Monologue",["The pronoun \"my\" is used to highlight the Duke's possessive nature, showing how the Duchess is objectified.","Browning uses the pronouns to emphasise the Duke's self-obsession and vanity.","The pronouns, along with the form of the dramatic monologue, show that he is the sole dominant voice, with his control over the narrative mirroring how he controlled the Duchess."]],["Neptune ...Taming a sea-horse","Metaphor",["Here, the metaphor of Neptune, links to the Roman God of the sea. We can draw parallels between the Duke and Neptune as both are dominant and overwhelming.","The metaphor introduces the idea of scale, when considering the size of the sea horse compared to Neptune. This shows the power imbalance present in the household, which mirrors the power imbalance in patriarchal society.","Browning uses the poem to criticise leaders who abuse their power in a domestic setting, with him perhaps being critical over inequality in relation to who holds power."]]],"London":[["black'ning church","Symbolism",["The idea of \"black'ning\" has connotations of decay, emphasising the corrupt nature of the institution.","Through the symbolism, Blake creates a sense of shame, showing how the church has failed in its mission.","Blake is highly critical of the church, criticising their role in oppressing the poor."]],["mind-forged manacles","Metaphor",["The metaphor to show how people are shackled by poverty.","Blake uses the metaphor to highlight the idea of an inner conflict in the citizens of London, as they are left powerless due to the way that they think. This links to Rousseau's belief that authority controls and in order to achieve freedom a revolution is required.","Blake however, does not use the poem to advocate for a physical revolution. Instead he wants a revolution in the way that people think in order to challenge the status quo."]]],"Tissue":[["Koran... maps ... slips","Symbolism",["The symbolism is used to represent powerful institutions and forces, with the \"Koran\" representing religion, \"maps\" representing nations and \"slips\" representing finance.","Dharker uses the symbolism to criticise these institutions due to their divisive nature.","The poem is used to consider what the world would be like if these institutions share the characteristics of tissue, including transparency."]],["light","Symbolism",["Dharker uses the symbolism to show that nature is a force that can overpower any man made centres of power.","The idea of \"light\" has connotations of religion. Therefore, perhaps Dharker uses the symbolism to show that nature and God are the solutions to conflict and institutional corruption.","Dharker draws upon the traditions of Romanticism to champion nature."]]],"The Émigrée":[["bright.... shadow","Contrast",["Warmth -> \"bright\" connotes nostalgia, idealising her past home.","Identity -> devotion and deep emotional attachment to birthplace is central.","Reality -> \"shadow\" captures the threatening, dark reality of the current city.","Internal struggle -> highlights attempts to reconcile opposing views of home."]],["city","Setting",["Hostile place -> setting shows the direct effects of war creating a totalitarian state.","Psychological impact -> childhood vision is completely ruined by a darker reality.","Metaphor -> represents growth from dreamlike childhood to adult understanding."]]],"Checking Out Me History":[["Dem","Anaphora",["Authority conflict -> emphasizes barrier between rulers and the speaker.","Worldview -> highlights how those in power actively force their history on others.","Accusatory tone -> criticises authority for denying him his true culture."]],["carving","Metaphor",["Care -> process is slow, showing reclaiming identity takes massive effort.","Cultural identity -> highlights validation of personal history.","Resolute stance -> conveys absolute willingness to struggle against status quo."]]]};
Object.assign(exactNotes,{"Ozymandias":[["sunk... shattered visage","LFS: Symbolism",["“shattered” connotations destruction and ruin; symbolism of statue highlights downfall of egoistic rulers.","human power temporary and fall of powerful rulers inevitable.","Shelley's critical stance towards powerful rulers, critique of King George III.","Ozymandias mixture of Shakespearean and Petrarchan Sonnet; breaking traditional form shows nothing, including traditions, lasts forever; rebellion against sonnet form mirrors rebellion against authoritative rulers, typical of Romantics."]],["King of Kings","LFS: Allegory / Setting",["allegory religious connotations supreme power, emphasising narcissistic nature of corrupt rulers.","Shelley attacks Godlike rulers and pride.","allegory direct reference to Jesus; desert setting where temptation of Jesus took place; power as tempting force overwhelming rulers.","Romantic poet uses nature to overwhelm human creations, showing nature supreme."]]],"My Last Duchess":[["my...I","LFS: Pronouns / Dramatic Monologue",["pronoun “my” highlights Duke's possessive nature and Duchess objectification.","pronouns emphasise Duke's self-obsession and vanity.","pronouns plus dramatic monologue show he is sole dominant voice; control of narrative mirrors how he controlled Duchess."]],["Neptune ...Taming a sea-horse","LFS: Metaphor",["Neptune Roman God of sea; parallels between Duke and Neptune as dominant and overwhelming.","metaphor introduces scale; sea horse vs Neptune; power imbalance household mirrors patriarchal society.","Browning criticises leaders abusing power in domestic setting, perhaps inequality over who holds power."]]]});
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){const {data}=await supabase.auth.getUser();user=data.user||null;$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('logout').classList.toggle('hidden',!user);if(user){let r=await supabase.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=r.data;const ar=await supabase.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();isAdmin=!!ar.data;if(isAdmin){$('adminButton')?.classList.remove('hidden')}else{$('adminButton')?.classList.add('hidden')}$('who').textContent=profile?.username||user.email;startPresence();render()}}
function say(id,msg){$(id).textContent=msg}
$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,username=$('username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');if(!email||!email.includes('@'))return say('authmsg','Enter a valid email address.');if(password.length<6)return say('authmsg','Password must be at least 6 characters.');if(username.length<3)return say('authmsg','Username must be at least 3 characters.');$('signup').disabled=true;try{const {data,error}=await supabase.auth.signUp({email,password,options:{data:{username,display_name:username}}});if(error){say('authmsg',error.message+' If this email already has an account, use Log in instead.');return}say('authmsg',data.session?'Account created!':'Check your inbox to confirm your email, then log in.');if(data.session)await refresh()}catch(e){say('authmsg','Sign-up failed: '+(e.message||'Please try again.'))}finally{$('signup').disabled=false}};
$('login').onclick=async()=>{const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});say('authmsg',error?.message||'Signed in.');if(!error)refresh()};
$('logout').onclick=async()=>{await supabase.auth.signOut();refresh()};

const scienceStarter={
 biology:{title:'Biology',topics:[
 {id:'cell-biology',title:'Cell biology',tag:'Combined & Separate',summary:'Cell structures, microscopy, specialised cells and transport.',notes:['Animal and plant cells are eukaryotic: their DNA is enclosed in a nucleus.','Bacterial cells are prokaryotic: they have no nucleus and their DNA is a single circular chromosome, sometimes with plasmids.','The nucleus controls cell activities; mitochondria are the site of aerobic respiration; ribosomes make proteins.','Plant cells also have a cellulose cell wall, a permanent vacuole and chloroplasts in photosynthetic cells.'],terms:['Eukaryote — a cell with DNA enclosed in a nucleus.','Prokaryote — a cell without a nucleus.','Diffusion — net movement of particles from high to low concentration.','Osmosis — net movement of water through a partially permeable membrane.'],q:'Name two structures found in plant cells but not animal cells.',a:['cell wall','chloroplasts','permanent vacuole'],exam:'Explain why a root hair cell is adapted for absorbing water and mineral ions.',mark:'A large surface area increases absorption; a thin wall gives a short diffusion distance; mitochondria provide energy for active transport of mineral ions.'},
 {id:'organisation',title:'Organisation',tag:'Combined & Separate',summary:'Digestive system, enzymes, the heart, blood and plant tissues.',notes:['The digestive system breaks large insoluble food molecules into small soluble molecules that can be absorbed.','Enzymes are biological catalysts. Their active site is complementary to a specific substrate.','The heart pumps blood through a double circulatory system: lungs and body.','Arteries carry blood away from the heart; veins carry blood towards it; capillaries allow exchange with tissues.'],terms:['Enzyme — a biological catalyst that speeds up reactions.','Substrate — the molecule an enzyme acts on.','Denaturation — a change to an enzyme’s active site so its substrate no longer fits.','Villi — small-intestine structures that increase surface area for absorption.'],q:'Which blood vessel carries blood away from the heart?',a:['artery'],exam:'Explain how villi are adapted for absorption in the small intestine.',mark:'They provide a large surface area, have a thin epithelium for a short diffusion distance and a good blood supply to maintain concentration gradients.'}
 ]},

function scienceTopicPage(subject,topic){
 const t=scienceStarter[subject]?.topics.find(x=>x.id===topic);if(!t)return '<p>Topic not found.</p>';

ass="learn-section learn-comparison-section"><div class="learn-section-heading"><div><span class="pill">02 · COMPARISON GUIDES</span><h3>Make connections between poems</h3><p>Use these guides to compare viewpoints, methods and themes.</p></div></div></section></div>'+'<section class="card learn-matrix" style="margin-top:20px"><h3>Powerful Rulers: Comparisons Matrix</h3><h4>Shared points (Ozymandias and My Last Duchess)</h4><ul><li>Both poems explore powerful leaders.</li><li>Both explore corrupt/narcissistic leaders.</li><li>Both poets criticise leaders.</li></ul><h4>Ozymandias</h4><ul><li>Power of state.</li><li>Ruler&#39;s power fades.</li><li>Nature overwhelms Ozymandias.</li></ul><h4>My Last Duchess</h4><ul><li>Patriarchal power.</li><li>Duke retains control over Duchess through one-sided narrative.</li><li>Duke&#39;s power is not overwhelmed.</li></ul></section><section class="card learn-matrix" style="margin-top:20px"><h3>Nature: Comparisons Matrix</h3><h4>Shared Themes (The Prelude, Storm on the Island, Exposure)</h4><ul><li>All three poems explore the immense, overwhelming power of nature.</li><li>They examine the connection, balance, and natural impact on humanity.</li><li>All explicitly explore the Sublime (feelings of awe and terrifying natural power).</li></ul><h4>Direct Commonalities</h4><ul><li>Both The Prelude and Exposure present nature as a completely dominant force.</li><li>In both poems, this absolute dominance forces man to reflect on his status.</li><li>Both poems showcase a massive physical and psychological impact on human beings.</li></ul><h4>Direct Contrasts</h4><ul><li>Storm on the Island differs because humans initially dismiss nature to seek dominance over it.</li><li>In The Prelude, natural impact leads to deep reflection; in Exposure, it forces men to regress to an animalistic state.</li><li>Unlike the other two where nature is inherently hostile, Storm on the Island shows human imagination is what gives nature its terrifying power.</li></ul></section><section class="card learn-matrix"><h3>Victims/Effects of War: Comparisons</h3><h4>Remains</h4><ul><li>Explores horrors of war</li><li>Speaker attempts to distance himself from war</li><li>Pain and suffering - guilt</li><li>Psychological toll</li><li>Soldier&#39;s perspective</li></ul><h4>War Photographer</h4><ul><li>Explores horrors of war</li><li>Poem shows how people distance themselves from war</li><li>Pain and suffering - civilians</li><li>Less psychological toll</li><li>Photographer&#39;s perspective</li></ul><h4>Poppies</h4><ul><li>Explores impact of war on domestic life</li><li>Speaker doesn&#39;t attempt to distance themselves from trauma of losing son</li><li>Pain and suffering - grief</li><li>Psychological toll</li><li>Maternal perspective</li></ul></section><section class="card learn-matrix"><h3>War: Comparisons</h3><h4>Bayonet Charge</h4><ul><li>An insight into the realities/horrors of the battlefield</li><li>Explores soldier&#39;s thought process</li><li>War = waste</li><li>State Ideology is dismissed</li></ul><h4>Kamikaze</h4><ul><li>A reflective journey towards the battlefield</li><li>Explores pilot&#39;s thought process</li><li>War = waste</li><li>State ideology is dismissed</li></ul><h4>COTLB (Charge of the Light Brigade)</h4><ul><li>An insight into the realities/horrors of the battlefield</li><li>Soldiers have no individuality</li><li>War = glorious</li><li>State ideology and patriotism is reinforced</li></ul></section><section class="card learn-matrix"><h3>Nature: Comparisons</h3><h4>Shared Points (All 3 Poems)</h4><ul><li>All explore the power of nature</li><li>They examine the man&#39;s relationship with the natural world, exploring the idea of balance and the impact that nature can have</li><li>All examine the sublime</li></ul><h4>The Prelude</h4><ul><li>Nature is dominant and causes man to reflect on his state</li><li>Significant psychological and physical impact – causes man to reflect</li></ul><h4>Storm on the Island</h4><ul><li>Nature is dismissed – man seeks dominance over nature</li><li>Explores the impact of nature but it is man&#39;s thought processes and imagination that gives nature its power</li></ul><h4>Exposure</h4><ul><li>Nature is dominant and causes man to reflect on his state</li><li>Significant psychological and physical impact – causes man to regress to a basic state</li></ul></section><section class="card learn-matrix"><h3>Powerful Rulers &amp; Institutions: Comparisons</h3><h4>Shared Points (Ozymandias &amp; My Last Duchess)</h4><ul><li>Both poems explore the nature of powerful leaders</li><li>Both poems explore leaders who are corrupt and narcissistic</li><li>Both poets criticise leaders</li></ul><h4>Ozymandias</h4><ul><li>Explores the power of the state</li><li>The ruler&#39;s power fades</li><li>Nature overwhelms Ozymandias</li></ul><h4>My Last Duchess</h4><ul><li>Explores patriarchal power</li><li>The Duke still retains control over the Duchess as he controls the one-sided narrative</li><li>The Duke&#39;s power is not overwhelmed</li></ul><h4>Powerful Institutions: Shared Points (London &amp; Tissue)</h4><ul><li>Both explore institutions that are corrupt</li><li>Both explore the failure of institutions and the impact they can have</li><li>Both challenge the status quo</li></ul><h4>London</h4><ul><li>Blake offers mental freedom and free thought as the solutions to the issues he explores</li><li>As a Romantic poet, Blake criticises authority and aspects of the Industrial Revolution</li></ul><h4>Tissue</h4><ul><li>Dharker offers light and transparency as the solution to the issues she explores</li><li>Dharker draws upon the traditions of Romanticism and champions nature</li></ul></section><section class="card learn-matrix"><h3>Identity: Comparisons</h3><h4>Shared Points (The Émigrée &amp; Checking Out Me History)</h4><ul><li>Both poems deal with the loss of identity</li><li>Both poems explore the power of one&#39;s own history and how it shapes a personal narrative/i function practiceDeckData(){
 const rows=poems.flatMap(p=>(p[3]||[]).map((x,i)=>{
  const note=(exactNotes[p[0]]||[]).find(n=>n[0]===x[0]);
  // Keep the Learn booklet analysis as its original, separate bullet points.
  const analysisPoints=Array.isArray(note?.[2])?[...note[2]]:String(note?.[2]||x[2]||'').split(/(?<=[.!?])\\s+/).filter(Boolean);
  return {id:p[0]+'-'+i,poem:p[0],author:p[1]||'',theme:p[2]||'',quote:x[0]||'',method:note?.[1]||x[1]||'',analysisPoints,analysis:analysisPoints.join(' '),context:x[3]||''};
 })).filter(x=>x.quote);
 // Include the complete second quotation from Learn's exact notes where it is not already in the poem data.
 const existing=new Set(rows.map(x=>x.poem+'|'+x.quote));
 return rows.concat(poems.flatMap(p=>(exactNotes[p[0]]||[]).filter(n=>!existing.has(p[0]+'|'+n[0])).map((n,i)=>({
  id:p[0]+'-extra-'+i,poem:p[0],author:p[1]||'',theme:p[2]||'',quote:n[0],method:n[1]||'',
  analysisPoints:Array.isArray(n[2])?[...n[2]]:String(n[2]||'').split(/(?<=[.!?])\s+/).filter(Boolean),
  analysis:Array.isArray(n[2])?n[2].join(' '):String(n[2]||''),context:p[3]?.[0]?.[3]||''
 }))));
}

function practiceQuickQuiz(){

   '<section class="quiz-setup"><div class="quiz-setup-intro"><span class="rev-kicker">BUILD YOUR ROUND</span><h2>Test what you know.</h2><p>Mix recall, analysis and application. Every question is drawn from your course notes.</p></div>'+

 function makeQuestion(c,type,i){
  if(type==='single'){
   if(difficulty==='challenge'){
    const pool=practiceShuffle([...new Set(all.map(x=>x.method).filter(Boolean))]);
    const options=practiceShuffle([...new Set([c.method,...pool])]).slice(0,4);
    return {type,poem:c.poem,quote:c.quote,prompt:'Which method is used in this quotation?',display:'“'+c.quote+'”',options,correct:c.method,explanation:c.analysis};
   }
   const options=practiceShuffle([...new Set([c.poem,...practiceShuffle(poems.filter(p=>p[0]!==c.poem).map(p=>p[0])).slice(0,3)])]);
   return {type,poem:c.poem,quote:c.quote,prompt:'Which poem does this quotation come from?',display:'“'+c.quote+'”',options,correct:c.poem,explanation:c.analysis};
  }
  if(type==='truefalse'){
   const truth=Math.random()>.5,other=practiceShuffle(poems.filter(p=>p[0]!==c.poem))[0]?.[0]||c.poem;
   const named=truth?c.poem:other;
   return {type,poem:c.poem,quote:c.quote,prompt:'The quotation below comes from '+named+'.',display:'“'+c.quote+'”',correct:truth?'true':'false',explanation:'The quotation is from '+c.poem+'. '+c.analysis};
  }
  if(type==='multi'){
   const otherContext=practiceShuffle(all.filter(x=>x.poem!==c.poem&&x.context&&x.context!==c.context))[0]?.context||'';
   const statements=[
    {value:'theme',label:'The poem explores '+c.theme+'.',correct:true},
    {value:'method',label:'The quotation uses '+c.method+'.',correct:true},
    {value:'context',label:'Relevant context: '+c.context+'.',correct:true},
    {value:'other',label:'Relevant context: '+otherContext+'.',correct:false}
   ];
   return {type,poem:c.poem,quote:c.quote,prompt:'Select every accurate statement about this quotation and its poem.',display:'“'+c.quote+'”',options:practiceShuffle(statements),correct:['theme','method','context'],explanation:c.analysis+' '+c.context};
  }
  const tokens=[...c.quote.matchAll(/\b[A-Za-z]{3,}\b/g)];
  const missing=tokens[Math.min(tokens.length-1,Math.floor(tokens.length/2))]?.[0]||c.quote.split(/\s+/)[0];
  const gapQuote=c.quote.replace(missing,'□□□□');
  return {type:'gap',poem:c.poem,quote:c.quote,prompt:'Complete the missing word in this quotation.',display:'“'+gapQuote+'”',correct:missing.toLowerCase().replace(/[^\w]/g,''),expected:missing,explanation:c.analysis};

  practiceMount(practiceHeader('Quick Quiz','Question '+(position+1)+' of '+questions.length+' · '+(difficulty==='challenge'?'Challenge':'Core'))+

   '<h2>'+practiceSafe(q.prompt)+'</h2><blockquote class="quiz-question-quote">'+practiceSafe(q.display)+'</blockquote>'+answerUI+'<div id="quizQuestionFeedback" aria-live="polite"></div><div class="quiz-question-footer"><span>'+questions.length+' questions · '+difficulty+'</span><button id="quizSkip">Skip question</button></div></section>');

 function normalise(v){return String(v||'').toLowerCase().replace(/[“”"'.,!?;:…]/g,'').replace(/\s+/g,' ').trim()}
 function areaQuizQuestionBind(q){
  area.querySelectorAll('[data-quiz-answer]').forEach(b=>b.onclick=()=>answerQuestion(b.dataset.quizAnswer,q));
  $('quizSubmitMulti')?.addEventListener('click',()=>answerQuestion([...area.querySelectorAll('[data-quiz-multi]:checked')].map(x=>x.dataset.quizMulti),q));

 function answerQuestion(answer,q){
  if(answers.some(x=>x.q===q))return;
  let correct=false,shown=Array.isArray(answer)?answer:[answer];
  if(q.type==='multi')correct=q.correct.length===shown.length&&q.correct.every(x=>shown.includes(x));
  else if(q.type==='gap')correct=normalise(answer)===q.correct;
  else correct=normalise(answer)===normalise(q.correct);
  const item={q,answer:shown,correct};answers.push(item);
  if(feedbackStyle==='immediate'){
   area.querySelectorAll('[data-quiz-answer],[data-quiz-multi]').forEach(x=>x.disabled=true);

  if(q.type==='truefalse')return q.correct==='true'?'True':'False';

  await practiceAward('quick-quiz',correct,'Power & Conflict',accuracy,{total_questions:questions.length,correct_answers:correct,difficulty,question_formats:questions.map(x=>x.type),strong_topics:strong,weak_topics:weak,question_review:answers.map(x=>({prompt:x.q.prompt,display:x.q.display,poem:x.q.poem,correct:x.correct,expected:quizCorrectLabel(x.q)})),time_up:timeUp},'Quiz results',correct+' of '+questions.length+' correct',detail,started,practiceQuickQuiz);
 }
 renderSetup();
}

function practiceMatchGaps(){
 const started=Date.now(),area=$('reviseArea'),all=practiceShuffle(practiceDeckData());
 let mode='matching',matchFormat='quote-poem',gapFormat='typed',rapid=false,timed=false;
 let remaining=180,tick=null,items=[],rightOrder=[],matched=[],selected=null,attempts=[],questionIndex=0,score=0;
 function renderSetup(){
  practiceMount(practiceHeader('Match Up & Fill the Gaps','Choose a matching challenge or fill-the-gap round. Both can be played in rapid-fire mode.')+
   '<section class="match-setup"><span class="rev-kicker">CHOOSE YOUR CHALLENGE</span><h2>Make the connections.</h2><div class="match-mode-grid"><button data-game-mode="matching" class="selected"><b>Match Up</b><small>Pair quotations, methods and contexts with their correct match.</small></button><button data-game-mode="gaps"><b>Fill the Gaps</b><small>Complete exact quotations using typed or multiple-choice answers.</small></button></div>'+

   '<div class="match-session-options"><label><input type="checkbox" id="matchRapid"> Rapid-fire · 60 seconds</label><label><input type="checkbox" id="matchTimed"> Optional 3-minute timer</label></div><div class="match-setup-footer"><span>Match formats: 4 · Selection: tap-to-match · Gap formats: 2 · XP: 1,200+</span><button class="primary" id="matchStart">Start challenge →</button></div></section>');
  area.querySelectorAll('[data-game-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.gameMode;area.querySelectorAll('[data-game-mode]').forEach(x=>x.classList.toggle('selected',x===b));$('matchingSettings').classList.toggle('hidden',mode!=='matching');$('gapSettings').classList.toggle('hidden',mode!=='gaps')});

   gapFormat=area.querySelector('input[name="gapFormat"]:checked')?.value||'typed';
   rapid=$('matchRapid').checked;timed=rapid||$('matchTimed').checked;remaining=rapid?60:180;
   if(mode==='matching')startMatching();else startGaps();
   if(timed)startTimer();
  };
 }
 function startTimer(){
  tick=setInterval(()=>{remaining=Math.max(0,remaining-1);if($('matchClock'))$('matchClock').textContent=timerText();if(remaining===0){clearInterval(tick);tick=null;window.rcPracticeTimer=null;mode==='matching'?finishMatching(true):finishGaps(true)}},1000);window.rcPracticeTimer=tick;
 }
 function timerText(){return Math.floor(remaining/60)+':'+String(remaining%60).padStart(2,'0')}
 function makePairs(){
  const unique=[...new Map(all.map(x=>[x.poem,x])).values()];
  const selectedItems=practiceShuffle(unique).slice(0,Math.min(5,unique.length));
  return selectedItems.map((c,i)=>{
   let left,right;
   if(matchFormat==='method-analysis'){left=c.method||'Method';right=c.analysis||c.context||'Explanation';}
   else if(matchFormat==='context-poem'){left=c.context||c.theme||c.analysis;right=c.poem;}
   else if(matchFormat==='theme-quote'){left=c.theme||'Wider theme';right='“'+c.quote+'”';}
   else{left='“'+c.quote+'”';right=c.poem;}
   return {id:'pair-'+i,poem:c.poem,left,right,explanation:c.analysis};
  });
 }
 function startMatching(){
  items=makePairs();rightOrder=practiceShuffle(items);matched=[];selected=null;attempts=[];drawMatching();
 }
 function drawMatching(){
  const left=items.filter(x=>!matched.includes(x.id));
  const right=rightOrder.filter(x=>!matched.includes(x.id));
  practiceMount(practiceHeader('Match Up',rapid?'Rapid-fire · match as many pairs as you can.':'Choose one item on the left, then its match on the right.')+
   '<section class="match-play-screen"><div class="match-play-meta"><span class="rev-kicker">'+matchFormat.replace('-',' → ').toUpperCase()+'</span><span>'+matched.length+' / '+items.length+' pairs matched</span>'+(timed?'<strong class="quiz-clock" id="matchClock">'+timerText()+'</strong>':'')+'</div>'+practiceProgressBar(matched.length,items.length)+
   '<div class="match-pair-columns"><div><h3>Match this</h3>'+left.map(x=>'<button class="match-tile '+(selected===x.id?'selected':'')+'" data-match-left="'+x.id+'">'+practiceSafe(x.left)+'</button>').join('')+'</div><div><h3>Find its pair</h3>'+right.map(x=>'<button class="match-tile" data-match-right="'+x.id+'">'+practiceSafe(x.right)+'</button>').join('')+'</div></div><p id="matchStatus" aria-live="polite">'+(selected?'Now select the matching answer.':'Select an item to begin.')+'</p><div class="match-play-footer"><button id="matchEnd">Finish early</button><button id="matchReset" class="quiet-button">Reset pair selection</button></div></section>');
  const tryPair=rightId=>{
   if(!selected){$('matchStatus').textContent='Choose an item on the left first.';return}
   const source=items.find(x=>x.id===selected),success=selected===rightId;
   attempts.push({left:source?.left,right:items.find(x=>x.id===rightId)?.right,correct:success,poem:source?.poem});
   if(success){matched.push(selected);selected=null;if(matched.length===items.length){finishMatching(false);return}drawMatching();$('matchStatus').textContent='Pair matched.'}
   else{selected=null;drawMatching();$('matchStatus').textContent='Not a match. Try another connection.'}
  };
  area.querySelectorAll('[data-match-left]').forEach(b=>{
   b.onclick=()=>{selected=b.dataset.matchLeft;drawMatching()};
  });

   b.onclick=()=>tryPair(b.dataset.matchRight);
  });
  $('matchEnd').onclick=()=>finishMatching(false);
  $('matchReset').onclick=()=>{selected=null;drawMatching()};
 }
 async function finishMatching(timeUp){
  if(window.rcPracticeTimer){clearInterval(window.rcPracticeTimer);window.rcPracticeTimer=null}tick=null;
  const correct=matched.length,accuracy=items.length?Math.round(correct/items.length*100):0;
  const detail='<div class="practice-result-grid"><div><b>'+correct+'</b><span>Pairs matched</span></div><div><b>'+Math.max(0,items.length-correct)+'</b><span>Unmatched</span></div><div><b>'+attempts.length+'</b><span>Attempts</span></div></div><div class="quiz-detailed-review"><h3>Pair review</h3>'+items.map(x=>'<article><span>'+(matched.includes(x.id)?'MATCHED':'REVIEW')+'</span><b>'+practiceSafe(x.left)+'</b><p>Correct pair: '+practiceSafe(x.right)+'</p><small>'+practiceSafe(x.explanation||'')+'</small></article>').join('')+'</div><p>'+(timeUp?'Time is up. ':'')+'Matched '+correct+' of '+items.length+' pairs.</p>';
  await practiceAward(rapid?'rapid-fire':'match-up',correct,'Power & Conflict',accuracy,{total_questions:items.length,correct_answers:correct,attempts:attempts.length,format:matchFormat,rapid_fire:rapid,time_up:timeUp},'Matching results',correct+' of '+items.length+' pairs matched',detail,started,practiceMatchGaps);
 }
 function makeGap(c){
  const words=[...c.quote.matchAll(/\b[A-Za-z]{3,}\b/g)];
  const chosen=words[Math.min(words.length-1,Math.floor(words.length/2))]?.[0]||c.quote.split(/\s+/)[0]||'';
  return {...c,missing:chosen,masked:c.quote.replace(chosen,'□□□□')};
 }
 function startGaps(){
  items=practiceShuffle(all).slice(0,Math.min(rapid?20:6,all.length)).map(makeGap);
  questionIndex=0;score=0;attempts=[];drawGap();
 }
 function drawGap(){
  const c=items[questionIndex];if(!c){finishGaps(false);return}
  let answerUI;
  if(gapFormat==='choice'){
   const distractors=practiceShuffle([...new Set(all.flatMap(x=>[...x.quote.matchAll(/\b[A-Za-z]{3,}\b/g)].map(m=>m[0])).filter(w=>w.toLowerCase()!==c.missing.toLowerCase()))]).slice(0,3);
   answerUI='<div class="gap-choice-grid">'+practiceShuffle([c.missing,...distractors]).map(w=>'<button data-gap-answer="'+practiceSafe(w)+'">'+practiceSafe(w)+'</button>').join('')+'</div>';
  }else answerUI='<div class="gap-typed-row"><input id="gapTyped" class="field" placeholder="Type the missing word"><button id="gapSubmit" class="primary">Check answer</button></div>';
  practiceMount(practiceHeader('Fill the Gaps',rapid?'Rapid-fire · complete as many quotations as you can.':'Recall the exact word missing from the quotation.')+
   '<section class="gap-play-screen"><div class="match-play-meta"><span class="rev-kicker">'+(gapFormat==='choice'?'MULTIPLE CHOICE':'TYPE YOUR ANSWER')+'</span><span>QUESTION '+(questionIndex+1)+' / '+items.length+'</span>'+(timed?'<strong class="quiz-clock" id="matchClock">'+timerText()+'</strong>':'')+'</div>'+practiceProgressBar(questionIndex+1,items.length)+
   '<h2>Complete the quotation.</h2><blockquote class="gap-quote">“'+practiceSafe(c.masked)+'”</blockquote><p class="muted">'+practiceSafe(c.poem)+'</p>'+answerUI+'<div id="gapFeedback" aria-live="polite"></div><div class="match-play-footer"><button id="gapSkip">Skip</button></div></section>');
  area.querySelectorAll('[data-gap-answer]').forEach(b=>b.onclick=()=>checkGap(b.dataset.gapAnswer));
  $('gapSubmit')?.addEventListener('click',()=>checkGap($('gapTyped').value));
  $('gapTyped')?.addEventListener('keydown',e=>{if(e.key==='Enter')checkGap($('gapTyped').value)});
  $('gapSkip').onclick=()=>{attempts.push({poem:c.poem,quote:c.quote,answer:'Skipped',correct:false,expected:c.missing});nextGap()};
 }
 function checkGap(answer){
  const c=items[questionIndex];if(attempts.some(x=>x.quote===c.quote))return;
  const normal=v=>String(v||'').toLowerCase().replace(/[^\w]/g,'').trim(),correct=normal(answer)===normal(c.missing);
  if(correct)score++;
  attempts.push({poem:c.poem,quote:c.quote,answer:String(answer||''),correct,expected:c.missing});
  area.querySelectorAll('[data-gap-answer]').forEach(b=>b.disabled=true);
  if($('gapSubmit'))$('gapSubmit').disabled=true;
  $('gapFeedback').innerHTML='<p class="'+(correct?'rev-good':'rev-wrong')+'">'+(correct?'Correct.':'The missing word was '+practiceSafe(c.missing)+'.')+'</p><p>'+practiceSafe(c.analysis)+'</p><button id="gapNext" class="primary">Next →</button>';
  $('gapNext').onclick=nextGap;
 }
 function nextGap(){questionIndex++;if(questionIndex>=items.length)finishGaps(false);else drawGap()}
 async function finishGaps(timeUp){
  if(window.rcPracticeTimer){clearInterval(window.rcPracticeTimer);window.rcPracticeTimer=null}tick=null;
  const accuracy=items.length?Math.round(score/items.length*100):0;
  const detail='<div class="practice-result-grid"><div><b>'+score+'</b><span>Correct gaps</span></div><div><b>'+Math.max(0,items.length-score)+'</b><span>To revisit</span></div><div><b>'+accuracy+'%</b><span>Accuracy</span></div></div><div class="quiz-detailed-review"><h3>Quotation review</h3>'+attempts.map(x=>'<article><span>'+(x.correct?'CORRECT':'REVIEW')+'</span><b>'+practiceSafe(x.poem)+'</b><p>“'+practiceSafe(x.quote)+'”</p><small>Missing word: '+practiceSafe(x.expected)+'</small></article>').join('')+'</div><p>'+(timeUp?'Time is up. ':'')+'Your gaps and missed quotations are listed for review.</p>';
  await practiceAward(rapid?'rapid-fire':'fill-gaps',score,'Power & Conflict',accuracy,{total_questions:items.length,correct_answers:score,answer_format:gapFormat,rapid_fire:rapid,time_up:timeUp},'Fill the gaps results',score+' of '+items.length+' correct',detail,started,practiceMatchGaps);
 }
 renderSetup();
}

function practiceExplainIt(){
 const started=Date.now(),area=$('reviseArea'),deck=practiceShuffle(practiceDeckData());
 const uid=user.id,weakStore=practiceReadStore('rc-progression-weak-'+uid);
 let current=null,stage=0,ratings={},notes={};
 const steps=[
  {id:'idea',title:'Develop the idea',prompt:'What is the poem saying about power, conflict or human experience?',model:c=>c.context||c.theme||c.poem+' explores '+c.theme+'.'},
  {id:'method',title:'Identify the method',prompt:'Which language or structural method makes the idea effective?',model:c=>c.method},
  {id:'quote',title:'Choose the quotation',prompt:'Which precise quotation supports your point?',model:c=>'“'+c.quote+'”'},
  {id:'explanation',title:'Explain the meaning',prompt:'How does the method shape meaning, affect the reader and develop the wider message?',model:c=>c.analysis+' '+(c.context||'')}
 ];
 function renderStart(){
  practiceMount(practiceHeader('Explain It / Progression','Build a complete analytical answer in four steps. Recall first, reveal second, then assess your understanding.')+
   '<section class="progression-start"><div><span class="rev-kicker">BUILD A STRONGER ANSWER</span><h2>Idea → Method → Quotation → Explanation</h2><p>One step at a time. Your results will show exactly which part of your analysis needs more practice.</p></div><label>Choose a poem<select id="progressionPoem" class="field">'+[...new Set(deck.map(c=>c.poem))].map((name,i)=>'<option value="'+practiceSafe(name)+'">'+practiceSafe(name)+'</option>').join('')+'</select></label><label>Choose a quotation<select id="progressionQuote" class="field"></select></label><div class="progression-preview">'+steps.map((x,i)=>'<div><span>0'+(i+1)+'</span><b>'+practiceSafe(x.title)+'</b><small>'+practiceSafe(x.prompt)+'</small></div>').join('')+'</div><button id="progressionStart" class="primary">Start building my answer →</button></section>');
  $('progressionPoem').onchange=refreshQuotes;refreshQuotes();

  };
 }
 function refreshQuotes(){

  $('progressionQuote').innerHTML=deck.filter(c=>c.poem===poem).map(c=>'<option value="'+practiceSafe(c.id)+'">'+practiceSafe(c.quote)+'</option>').join('');
 }
 function renderStep(){
  const item=steps[stage],key=current.id+'|'+item.id,model=item.model(current);
  practiceMount(practiceHeader('Explain It / '+item.title,'Stage '+(stage+1)+' of 4 · Build your response from memory before revealing the model.')+
   '<section class="progression-task"><div class="progression-topline"><span class="rev-kicker">ANALYSIS BUILDER</span><span>'+practiceSafe(current.poem)+'</span></div>'+practiceProgressBar(stage+1,steps.length)+
   '<div class="progression-step-heading"><span>0'+(stage+1)+'</span><div><h2>'+practiceSafe(item.title)+'</h2><p>'+practiceSafe(item.prompt)+'</p></div></div>'+
   '<div class="progression-quote-context"><span class="rev-kicker">YOUR QUOTATION</span><blockquote>“'+practiceSafe(current.quote)+'”</blockquote></div>'+
   '<label class="progression-recall-label">Your recall<textarea id="progressionDraft" class="field" rows="5" placeholder="Write your explanation in your own words before revealing the model…">'+practiceSafe(notes[item.id]||'')+'</textarea></label>'+
   '<div class="progression-model-area"><button id="progressionReveal">Reveal model answer</button><div id="progressionModel" class="progression-model hidden"><span class="rev-kicker">MODEL ANSWER</span><p>'+practiceSafe(model)+'</p></div></div>'+
   '<div class="progression-rating"><span>How secure is this stage?</span><button id="progressionWeak">Needs more practice</button><button id="progressionStrong" class="primary">I remembered it</button></div>'+
   '<div class="progression-navigation"><button id="progressionPrevious" '+(stage===0?'disabled':'')+'>Previous stage</button><button id="progressionNext">Continue →</button><span>'+(Object.keys(ratings).length)+' / 4 stages assessed</span></div></section>');
  $('progressionReveal').onclick=()=>{$('progressionModel').classList.remove('hidden');$('progressionReveal').textContent='Model answer revealed'};

  $('progressionNext').onclick=()=>{saveDraft();if(stage===3)finishProgression();else{stage++;renderStep()}};
 }
 function markStage(secure){
  notes[steps[stage].id]=$('progressionDraft').value;
  ratings[steps[stage].id]=secure;
  const k=current.id+'|'+steps[stage].id;
  weakStore[k]=secure?Math.max(0,(weakStore[k]||0)-1):(weakStore[k]||0)+1;
