/* Hub refresh: clearer hierarchy, calmer spacing, responsive navigation */
:root{--bg:#f3f4f5;--card:#fff;--ink:#202326;--muted:#6b7178;--line:#dfe2e5;--accent:#34383d;--soft:#eceeef;--shadow:0 8px 26px rgba(20,24,28,.045)}
body{font-size:15px;background:var(--bg);line-height:1.55}
body.dark{--bg:#111315;--card:#1c2023;--ink:#f0f2f3;--muted:#aab0b5;--line:#343a3f;--accent:#d7dadd;--soft:#292e32;--shadow:0 8px 26px rgba(0,0,0,.18)}
.wrap{max-width:1240px;padding:26px 24px 72px}
header{position:relative;padding:8px 0 20px;border-bottom:1px solid var(--line)}
h1{letter-spacing:-1.5px;font-size:clamp(28px,4vw,40px)}
h2{font-size:clamp(23px,3vw,29px);letter-spacing:-.7px;margin:12px 0 4px}
h3{letter-spacing:-.25px}
p{line-height:1.7}
.nav{display:none;position:sticky;top:0;z-index:20;margin:0 -24px 26px;padding:13px 24px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);gap:9px}
.nav button,.tabs button{border-radius:12px;padding:10px 16px;white-space:nowrap;transition:background .18s,border-color .18s,transform .18s}
.nav button:hover,.tabs button:hover,button:hover{transform:translateY(-1px)}
.nav button.active,.tabs button.active{background:var(--accent);color:white;border-color:var(--accent)}
body.dark .nav button.active,body.dark .tabs button.active{color:#10151e}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px}
.card{padding:22px;border-radius:19px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:18px;margin:0 0 8px}
.card p{margin:8px 0 16px}
button{transition:transform .18s,box-shadow .18s,border-color .18s;border-radius:11px}
button.primary{background:var(--accent);border-color:var(--accent);color:white}
body.dark button.primary{color:#10151e}
.field{padding:13px 14px;margin:8px 0 16px;border-radius:12px}
.tabs{gap:10px;margin:18px 0}
.feedback{padding:18px 20px;margin:16px 0;border:1px solid var(--line);border-radius:15px}
.feedback p{margin:12px 0}
.poem.card{margin:12px 0;padding:17px 20px;border:1px solid var(--line);border-radius:15px;background:var(--card)}
.poem summary{display:flex;align-items:center;justify-content:space-between;gap:12px;line-height:1.45}
.poem summary .pill{flex-shrink:0}
details[open] summary{margin-bottom:14px}
.flash{min-height:260px;padding:30px;gap:12px}
.flash .quote{font-size:clamp(26px,4vw,38px);line-height:1.25;max-width:780px}
#reviseArea>.row{margin-top:16px;justify-content:center}
#reviseArea>.row button{min-width:112px}
.score{font-size:48px;color:var(--accent)}
.auth{box-shadow:var(--shadow)}
.right{color:#16845d}.wrong{color:#c34242}
.subject-hero{padding:26px;background:linear-gradient(120deg,var(--soft),var(--card));border:1px solid var(--line);border-radius:20px;margin:16px 0 20px}
.subject-card{display:flex;flex-direction:column;gap:8px;min-height:205px}
.subject-card .subject-icon{font-size:28px}
.subject-card button{align-self:flex-start;margin-top:auto}
.quick-links{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px}
.quick-links button{font-size:13px;padding:8px 12px}
ul{padding-left:23px;line-height:1.75}
li{padding:2px 0 5px}
@media(max-width:650px){.wrap{padding:17px 14px 45px}.nav{margin:0 -14px 20px;padding:10px 14px}.card{padding:18px}.poem summary{align-items:flex-start}.poem summary .pill{white-space:normal;text-align:right}.flash{min-height:230px}.nav{overflow-x:auto;flex-wrap:nowrap}.nav button{font-size:13px;padding:9px 12px}}

#app{display:grid;grid-template-columns:70px minmax(0,1fr);gap:20px;align-items:start}.community-rail{position:sticky;top:14px;height:calc(100vh - 28px);min-height:480px;border-radius:20px;background:linear-gradient(180deg,#292d55,#5145b9 70%,#8275f2);padding:13px 9px;display:flex;align-items:center;flex-direction:column;gap:12px;box-shadow:0 12px 30px #38308030}.rail-brand{width:44px;height:44px;border-radius:14px;background:white;color:#5145b9;display:grid;place-items:center;font-weight:950}.community-rail button{width:48px;height:46px;padding:0;border:0;background:#ffffff18;color:white;font-size:21px;border-radius:14px}.community-rail button.active,.community-rail button:hover{background:white;color:#5145b9}#page{min-width:0}.nav{display:none!important}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:18px 0}.page-mark{font-size:30px;padding:12px 16px;border-radius:16px;background:var(--soft)}.hero-card{background:linear-gradient(120deg,#5145b9,#8275f2 65%,#ed8ab4);color:white;border:0}.hero-card p{color:#f3f0ff}.hero-card button{background:white;color:#5145b9}.field{margin:10px 0 20px;min-height:48px}.auth .field{display:block;margin-bottom:22px}.question-card{padding:clamp(20px,4vw,36px);max-width:900px}.recall-box{min-height:115px}.subject-emoji{font-size:32px}.coming-card{border-style:dashed}.coming-card .pill{background:#fff0cc;color:#93600c;border:0}.answer-reveal{border-left:4px solid #7467ee}@media(max-width:720px){#app{grid-template-columns:1fr;gap:8px}.community-rail{position:sticky;top:0;z-index:30;height:auto;min-height:0;width:calc(100% + 28px);margin:0 -14px;border-radius:0 0 18px 18px;flex-direction:row;justify-content:space-around;overflow-x:auto;padding:8px}.community-rail button{width:40px;height:40px;flex:none}.rail-brand{width:38px;height:38px;flex:none}.wrap{padding-top:8px}}

const $=id=>document.getElementById(id);let user=null,profile=null,page='home',deck=[],cardIndex=0,showBack=false,quiz=null,studyStage=0,isAdmin=false;
const poems=[
['Remains','Simon Armitage','War and conflict',[['blood-shadow','Metaphor','The compound noun “blood-shadow” fuses physical violence with something that follows the speaker. A shadow is difficult to escape, so the image suggests that the memory of killing has attached itself to the soldier and continues to haunt him after the event. Armitage makes guilt feel like a permanent presence rather than a passing emotion.','The violent act leaves lasting psychological trauma; the effects of conflict continue long after the battlefield.'],['tosses his guts','Violent imagery','The verb “tosses” is casual and almost dismissive, as if the body parts are an ordinary object. This matter-of-fact diction clashes with the horrific image of “guts”, making the violence feel brutally routine. Armitage may be showing how soldiers use detached language to cope with extreme experiences.','Conflict can normalise brutality and leave soldiers emotionally detached, even while they suffer lasting guilt.']]],
['War Photographer','Carol Ann Duffy','Victims and effects of war',[['light is red','Colour imagery','The simple colour image “red” can suggest blood, danger and suffering. Its starkness makes the photograph’s subject feel immediate, while the controlled darkroom setting contrasts with the chaos of the conflict being recorded. Duffy draws attention to the photographer’s difficult role: turning distant suffering into an image others can see.','The poem explores how war creates victims and how those far away encounter their suffering through images.']]],
['Poppies','Jane Weir','Victims and effects of war',[['bandaged ... Poppies ... blockade','War imagery','The word “bandaged” suggests injury and the need to protect something vulnerable, while “blockade” implies an obstacle that cannot easily be crossed. By placing these images alongside the poppies, Weir connects the physical language of conflict with the speaker’s emotional attempt to hold on to her child. The ordinary domestic moment becomes marked by separation and loss.','War affects those left at home as well as those who fight; separation creates emotional wounds for families.']]],
['Bayonet Charge','Ted Hughes','War and conflict',[['cold clockwork','Metaphor','The metaphor “cold clockwork” makes the soldier seem mechanical, as though his body is moving through a process he cannot control. “Cold” removes warmth and humanity, while “clockwork” suggests repetitive, automatic movement. Hughes presents the soldier as overwhelmed by the machinery and violence of war rather than acting with heroic certainty.','War dehumanises individuals and reduces them to frightened bodies reacting instinctively.']]],
['Kamikaze','Beatrice Garland','Victims and effects of war',[['crabs, prawns','Natural imagery','The specific images of “crabs” and “prawns” make the sea vivid, ordinary and full of life. Their small, familiar details contrast with the distant military expectations placed on the pilot. Garland uses the remembered natural world to reveal what the pilot is being asked to abandon: an ordinary human life and the people who love him.','The poem questions the pressure of patriotic duty and shows the personal cost of conflict.']]],
['The Charge of the Light Brigade','Alfred Tennyson','War and conflict',[['valley of Death','Biblical allusion','The biblical echo of the “valley of Death” gives the battlefield the scale of a spiritual trial and makes the soldiers’ danger seem almost inevitable. The capitalised “Death” personifies their enemy as an overwhelming force. Tennyson both honours their courage and exposes the terrible cost of unquestioning obedience.','The poem presents the soldiers as courageous but vulnerable to the destructive consequences of orders.']]],
['The Prelude','William Wordsworth','Nature’s power',[['act of stealth','Diction','The phrase “act of stealth” suggests secrecy and wrongdoing, as if the speaker knows that taking the boat is a transgression. This language reveals his confidence before the mountain appears: he initially treats the natural world as something he can use. The later change in tone exposes the limits of that confidence.','Nature humbles human pride and makes the speaker recognise that he is not in control.']]],
['Storm on the Island','Seamus Heaney','Nature’s power',[['spits like a tame cat','Simile','The simile initially compares the storm to a familiar, apparently harmless pet, making the threat seem manageable. However, “spits” gives the weather an aggressive action, so the comparison becomes unsettling: something that appears tame can still attack. Heaney uses this shift to challenge the islanders’ confidence in their ability to withstand nature.','Nature is unpredictable; human confidence can be undermined by forces that seem familiar or harmless.']]],
['My Last Duchess','Robert Browning','Power and control',[['my last Duchess','Possessive pronoun','The possessive pronoun “my” makes the Duchess sound like the Duke’s property rather than an independent person. Combined with “last”, it hints at his control over her fate and reveals how he treats relationships as possessions. Browning lets the Duke expose his own arrogance through his choice of words.','The poem criticises patriarchal power and the way authority can become possessive and abusive.']]],
['London','William Blake','Power and control',[['mind-forged manacles','Metaphor','The metaphor “mind-forged manacles” turns psychological oppression into the image of physical chains. “Forged” suggests that these restraints have been made and reinforced by people and institutions, while “manacles” conveys imprisonment. Blake implies that social systems shape how people think until oppression becomes internalised.','Powerful institutions restrict freedom both physically and through the beliefs people are taught to accept.']]],
['Tissue','Imtiaz Dharker','Power and control',[['Koran ... maps ... slips','Symbolism','The list brings together sacred writing, political borders and fragile pieces of paper, suggesting that human structures depend on materials that can easily be damaged. Dharker places different kinds of authority alongside one another to question how securely people build power, identity and boundaries. The fragile paper becomes a symbol of the limits of human control.','Human systems and claims to authority are fragile; power does not last forever.']]],
['The Émigrée','Carol Rumens','Identity and place',[['bright ... shadow','Contrast','The contrast between “bright” and “shadow” places the speaker’s hopeful memory beside the darker reality of political conflict. Light suggests warmth, belonging and an idealised homeland, whereas shadow hints at danger and loss. Rumens shows that the speaker’s attachment to home survives even when the place itself has changed.','Memory can preserve identity and belonging even when conflict makes returning home difficult.']]],
['Checking Out Me History','John Agard','Identity and place',[['Dem','Dialect / pronoun','The repeated colloquial pronoun “Dem” creates a clear distinction between the speaker and the people who control the version of history he has been taught. Its repetition gives the voice rhythm and resistance, challenging the authority of the dominant group. Agard uses dialect to assert an identity that official education has marginalised.','The poem challenges cultural oppression and shows the speaker reclaiming his identity and history.']]],
['Exposure','Wilfred Owen','Victims and effects of war',[['black with snow','Colour imagery','The paradoxical image “black with snow” combines a colour associated with darkness and death with snow, which is usually associated with whiteness and purity. This disturbing contrast makes the landscape feel unnatural and hostile, reflecting the soldiers’ psychological despair. Owen presents nature not as comforting but as another force attacking exhausted men.','Nature becomes an enemy, intensifying the soldiers’ physical suffering and mental disintegration.'],['cringe in holes','Verb / imagery','The verb “cringe” suggests fear, shame and an instinctive shrinking away from danger. It makes the soldiers seem small and vulnerable, almost animal-like, while “holes” implies that they are trapped and exposed in the landscape. Owen strips away traditional images of military glory and focuses instead on the soldiers’ degradation and fear.','War reduces soldiers to vulnerable, dehumanised figures and exposes the reality behind patriotic ideas of heroism.']]],
['Ozymandias','Percy Bysshe Shelley','Power and control',[['sunk ... shattered visage','Visual imagery','The verbs “sunk” and “shattered” create a picture of a face physically broken and partly swallowed by the sand. “Shattered” suggests not only the destruction of the statue but also the collapse of Ozymandias’ authority and reputation. The fragmentary description makes his attempt to preserve his greatness seem futile: time and the natural world have outlasted the ruler and his empire.','Shelley presents political power and human pride as temporary; time and nature eventually overwhelm human achievements.'],['King of Kings','Irony / allusion','The title “King of Kings” is a biblical allusion usually associated with supreme, divine authority. Ozymandias applies this grand title to himself, revealing his arrogance and belief that he is above other rulers. The irony is that the inscription survives while the kingdom it celebrates has vanished, so the boast becomes evidence of his failure rather than his greatness.','Shelley mocks rulers who imagine themselves godlike and suggests that no human power can defeat time.']]]
];
const exactNotes={"Remains":[["inside out...tosses his guts","Horrific imagery / Colloquial language",["Brutal/unemotional language -> soldier mentally distances from violence.","\"tosses\" -> connotations of carelessness; war desensitizes soldiers.","Colloquial tone -> speaker unable to process military memories normally.","Critical stance -> attacks romanticized view of war."]],["blood-shadow","Metaphor",["Stain/shadow -> overpowering guilt; imprinted memory of dead man.","\"shadow\" -> absence of light; explores dark subject matter.","Trauma -> highlights difficulty overcoming war experiences."]]],"War Photographer":[["light is red","Colour Imagery",["Red -> connotations of blood; highlights dangers of war zones.","Red light -> links to church tabernacle where photographer seeks comfort.","Parallels -> compares priest and war photographer exposed to death/suffering."]],["blood stained.... foreign dust","Imagery",["Stained -> links to memories and deep psychological scarring.","Distance -> avoids naming a place to distance himself from horror.","Isolation -> mirrors how people isolate themselves from trauma."]]],"Poppies":[["bandaged ... Poppies ... blockade","Semantic field of war",["The semantic field reinforces the idea of pain and injury, with the physical injury explored representing the emotional injury that the speaker suffers from.","The idea of \"Poppies\" has connotations of blood and death, showing that there is no way back for the speaker to regain her previous joy of motherhood."]],["my stomach busy... making tucks, darts, pleats","Imagery",["Here, Duffy explores the psychological impact of conflict and death, from a maternal perspective.","The imagery creates a sense of unease and anxiety, with the layers of folds, mirroring the layers of grief and suffering that she experiences.","The sharpness or edged nature of those folds, mirrors the sharpness of her memories and anguish."]]],"Bayonet Charge":[["cold clockwork ....stars... nations","Metaphor",["Clockwork -> mechanical, unemotional state of existence; transformed into killers.","Exploitation -> questions how the state controls and decides their fate.","Cog in a machine -> highlights lack of choice and indignation at leadership."]],["King, honour, human dignity, etcetera","List",["Battle fear -> shows patriotic ideals are instantly replaced with fear.","Self-indulgence -> ideals are irrelevant and must be abandoned to survive.","Hollow concepts -> highlights patriotic ideas as meaningless in brutal war."]]],"Kamikaze":[["crabs, prawns..... dark prince","Contrast",["Fishing imagery -> captures childhood innocence and pure joy.","Parallels -> fish and people are both trapped, unable to escape fate.","\"dark price\" -> forebodes a darker end; war blights all life."]],["eight","Symbolism",["Infinity symbol -> flag emphasizes power of state; soldier cannot escape destiny.","Sailing knot -> reinforces idea that pilot is completely trapped.","Unlimited nature -> continuous cycle of pain/shame; cannot return to normal life."]]],"The Charge of the Light Brigade":[["valley of Death... jaws of death","Metaphor / Personification",["Biblical reference -> connotations of hell; highlights battlefield horrors.","Predator -> personifies battlefield to show the vicious nature of war.","Bravery -> emphasizes the extreme bravery of the charging soldiers."]],["honour","Imperatives / Form: Lament",["Remembrance -> emphasizes central message of respect for sacrifice.","Immortalises -> clear purpose to keep soldiers' memory alive forever.","Conflict -> questions the battle; weighs bravery against blunders of leadership.","Celebration -> poem is traditionally a lament/mourning, but twists into celebration."]]],"The Prelude":[["act of stealth","Symbolism",["Theft of boat -> highlights overwhelming pride leading to immoral actions.","Aggression -> man is aggressive, dominant, corrupt; detracts from nature.","Spiritual journey -> man discovers humanity has no authority over nature."]],["upreared its head","Personification / Enjambment",["Attack -> nature acts as a deadly force, metaphorically attacking man.","Hostile force -> nature is subverted, transforming into something harsh and brutal.","Simplistic vocabulary -> shows how nature can shock and overwhelm man's pride.","The Sublime -> inspires intense feelings of awe and terror; impacts emotional state.","Enjambment -> emphasizes intensity of weather; mirrors chaotic emotional response."]]],"Storm on the Island":[["strafe... salvo... bombarded","Semantic field of war / Blank verse",["Unpredictable force -> demonstrates nature as an active military aggressor.","No mercy -> community is left entirely at the mercy of the storm.","Romanticism subverted -> updates traditions by showing nature as hostile.","The Troubles -> context of conflict suggests war upsets balance between man and nature."]],["spits like a tame cat / a huge nothing","Simile / Oxymoron",["Aggression -> \"spits\" has connotations of unpredictable natural anger.","Domesticity -> simile offers a familiar image, undermining nature's actual power.","Imagination -> oxymoron shows human imagination exacerbates natural fears."]]],"Exposure":[["black with snow","Oxymoron",["The oxymoron creates a stifling tone, full of despair. It shows how the soldiers face a psychological struggle.","The oxymoron highlights how nature has been subverted. Nature's power is on display as it attacks the soldiers.","The idea of \"black\" has connotations of decay and moral corruption, emphasising how the equilibrium between man and nature has become disturbed by man's actions during war."]],["cringe in holes","Imagery",["The idea of \"cringe\" shows how the soldiers are left vulnerable and defeated, seeking refuge, having lost their dignity.","The imagery highlights the power of nature as the soldiers are dehumanised.","Owen shows that nature and war have reduced the soldiers to an animalistic state.","Owen's use of caesura, shows how war and nature are unpredictable, and this contributes to the soldiers' mental disintegration."]]],"My Last Duchess":[["my...I","Pronouns / Dramatic Monologue",["The pronoun \"my\" is used to highlight the Duke's possessive nature, showing how the Duchess is objectified.","Browning uses the pronouns to emphasise the Duke's self-obsession and vanity.","The pronouns, along with the form of the dramatic monologue, show that he is the sole dominant voice, with his control over the narrative mirroring how he controlled the Duchess."]],["Neptune ...Taming a sea-horse","Metaphor",["Here, the metaphor of Neptune, links to the Roman God of the sea. We can draw parallels between the Duke and Neptune as both are dominant and overwhelming.","The metaphor introduces the idea of scale, when considering the size of the sea horse compared to Neptune. This shows the power imbalance present in the household, which mirrors the power imbalance in patriarchal society.","Browning uses the poem to criticise leaders who abuse their power in a domestic setting, with him perhaps being critical over inequality in relation to who holds power."]]],"London":[["black'ning church","Symbolism",["The idea of \"black'ning\" has connotations of decay, emphasising the corrupt nature of the institution.","Through the symbolism, Blake creates a sense of shame, showing how the church has failed in its mission.","Blake is highly critical of the church, criticising their role in oppressing the poor."]],["mind-forged manacles","Metaphor",["The metaphor to show how people are shackled by poverty.","Blake uses the metaphor to highlight the idea of an inner conflict in the citizens of London, as they are left powerless due to the way that they think. This links to Rousseau's belief that authority controls and in order to achieve freedom a revolution is required.","Blake however, does not use the poem to advocate for a physical revolution. Instead he wants a revolution in the way that people think in order to challenge the status quo."]]],"Tissue":[["Koran... maps ... slips","Symbolism",["The symbolism is used to represent powerful institutions and forces, with the \"Koran\" representing religion, \"maps\" representing nations and \"slips\" representing finance.","Dharker uses the symbolism to criticise these institutions due to their divisive nature.","The poem is used to consider what the world would be like if these institutions share the characteristics of tissue, including transparency."]],["light","Symbolism",["Dharker uses the symbolism to show that nature is a force that can overpower any man made centres of power.","The idea of \"light\" has connotations of religion. Therefore, perhaps Dharker uses the symbolism to show that nature and God are the solutions to conflict and institutional corruption.","Dharker draws upon the traditions of Romanticism to champion nature."]]],"The Émigrée":[["bright.... shadow","Contrast",["Warmth -> \"bright\" connotes nostalgia, idealising her past home.","Identity -> devotion and deep emotional attachment to birthplace is central.","Reality -> \"shadow\" captures the threatening, dark reality of the current city.","Internal struggle -> highlights attempts to reconcile opposing views of home."]],["city","Setting",["Hostile place -> setting shows the direct effects of war creating a totalitarian state.","Psychological impact -> childhood vision is completely ruined by a darker reality.","Metaphor -> represents growth from dreamlike childhood to adult understanding."]]],"Checking Out Me History":[["Dem","Anaphora",["Authority conflict -> emphasizes barrier between rulers and the speaker.","Worldview -> highlights how those in power actively force their history on others.","Accusatory tone -> criticises authority for denying him his true culture."]],["carving","Metaphor",["Care -> process is slow, showing reclaiming identity takes massive effort.","Cultural identity -> highlights validation of personal history.","Resolute stance -> conveys absolute willingness to struggle against status quo."]]]};

else if(page==='learn'){p.innerHTML='<button data-go="subjects">← Subjects</button>'+shell('Step 2 · Power & Conflict','Choose a poem to open its full quote-by-quote analysis.')+poems.map((po,i)=>'<article class="card poem"><div class="row" style="justify-content:space-between"><div><h3>'+escape(po[0])+'</h3><small>'+escape(po[1])+' · '+escape(po[2])+'</small></div><button data-poem="'+i+'">Study poem →</button></div></article>').join('')+'<section class="card" style="margin-top:20px"><h3>Nature: Comparisons Matrix</h3><h4>Shared Themes (The Prelude, Storm on the Island, Exposure)</h4><ul><li>All three poems explore the immense, overwhelming power of nature.</li><li>They examine the connection, balance, and natural impact on humanity.</li><li>All explicitly explore the Sublime (feelings of awe and terrifying natural power).</li></ul><h4>Direct Commonalities</h4><ul><li>Both The Prelude and Exposure present nature as a completely dominant force.</li><li>In both poems, this absolute dominance forces man to reflect on his status.</li><li>Both poems showcase a massive physical and psychological impact on human beings.</li></ul><h4>Direct Contrasts</h4><ul><li>Storm on the Island differs because humans initially dismiss nature to seek dominance over it.</li><li>In The Prelude, natural impact leads to deep reflection; in Exposure, it forces men to regress to an animalistic state.</li><li>Unlike the other two where nature is inherently hostile, Storm on the Island shows human imagination is what gives nature its terrifying power.</li></ul></section><section class="card"><h3>Victims/Effects of War: Comparisons</h3><h4>Remains</h4><ul><li>Explores horrors of war</li><li>Speaker attempts to distance himself from war</li><li>Pain and suffering - guilt</li><li>Psychological toll</li><li>Soldier&#39;s perspective</li></ul><h4>War Photographer</h4><ul><li>Explores horrors of war</li><li>Poem shows how people distance themselves from war</li><li>Pain and suffering - civilians</li><li>Less psychological toll</li><li>Photographer&#39;s perspective</li></ul><h4>Poppies</h4><ul><li>Explores impact of war on domestic life</li><li>Speaker doesn&#39;t attempt to distance themselves from trauma of losing son</li><li>Pain and suffering - grief</li><li>Psychological toll</li><li>Maternal perspective</li></ul></section><section class="card"><h3>War: Comparisons</h3><h4>Bayonet Charge</h4><ul><li>An insight into the realities/horrors of the battlefield</li><li>Explores soldier&#39;s thought process</li><li>War = waste</li><li>State Ideology is dismissed</li></ul><h4>Kamikaze</h4><ul><li>A reflective journey towards the battlefield</li><li>Explores pilot&#39;s thought process</li><li>War = waste</li><li>State ideology is dismissed</li></ul><h4>COTLB (Charge of the Light Brigade)</h4><ul><li>An insight into the realities/horrors of the battlefield</li><li>Soldiers have no individuality</li><li>War = glorious</li><li>State ideology and patriotism is reinforced</li></ul></section><section class="card"><h3>Nature: Comparisons</h3><h4>Shared Points (All 3 Poems)</h4><ul><li>All explore the power of nature</li><li>They examine the man&#39;s relationship with the natural world, exploring the idea of balance and the impact that nature can have</li><li>All examine the sublime</li></ul><h4>The Prelude</h4><ul><li>Nature is dominant and causes man to reflect on his state</li><li>Significant psychological and physical impact – causes man to reflect</li></ul><h4>Storm on the Island</h4><ul><li>Nature is dismissed – man seeks dominance over nature</li><li>Explores the impact of nature but it is man&#39;s thought processes and imagination that gives nature its power</li></ul><h4>Exposure</h4><ul><li>Nature is dominant and causes man to reflect on his state</li><li>Significant psychological and physical impact – causes man to regress to a basic state</li></ul></section><section class="card"><h3>Powerful Rulers &amp; Institutions: Comparisons</h3><h4>Shared Points (Ozymandias &amp; My Last Duchess)</h4><ul><li>Both poems explore the nature of powerful leaders</li><li>Both poems explore leaders who are corrupt and narcissistic</li><li>Both poets criticise leaders</li></ul><h4>Ozymandias</h4><ul><li>Explores the power of the state</li><li>The ruler&#39;s power fades</li><li>Nature overwhelms Ozymandias</li></ul><h4>My Last Duchess</h4><ul><li>Explores patriarchal power</li><li>The Duke still retains control over the Duchess as he controls the one-sided narrative</li><li>The Duke&#39;s power is not overwhelmed</li></ul><h4>Powerful Institutions: Shared Points (London &amp; Tissue)</h4><ul><li>Both explore institutions that are corrupt</li><li>Both explore the failure of institutions and the impact they can have</li><li>Both challenge the status quo</li></ul><h4>London</h4><ul><li>Blake offers mental freedom and free thought as the solutions to the issues he explores</li><li>As a Romantic poet, Blake criticises authority and aspects of the Industrial Revolution</li></ul><h4>Tissue</h4><ul><li>Dharker offers light and transparency as the solution to the issues she explores</li><li>Dharker draws upon the traditions of Romanticism and champions nature</li></ul></section><section class="card"><h3>Identity: Comparisons</h3><h4>Shared Points (The Émigrée &amp; Checking Out Me History)</h4><ul><li>Both poems deal with the loss of identity</li><li>Both poems explore the power of one&#39;s own history and how it shapes a personal narrative/identity</li></ul><h4>The Émigrée</h4><ul><li>Explores the effects of war</li><li>Ends with a tone of renewal showing Agard&#39;s willingness to struggle in order to reclaim identity (wording supplied in notes)</li></ul><h4>Checking Out Me History</h4><ul><li>Explores the effects of colonialism</li><li>Has a tone of nostalgia, showing the speaker&#39;s reluctance to grow up (wording supplied in notes)</li></ul></section><section class="card"><h3>Context: Key Knowledge</h3><h4>The Sublime</h4><ul><li>The idea that nature has the power to inspire intense emotions such as awe and terror</li></ul><h4>Nature Subverted</h4><ul><li>Nature turns into a hostile force</li></ul><h4>Romanticism</h4><ul><li>Draws upon the traditions of Romanticism and:</li><li>Explores the power of nature</li><li>Explores the equilibrium between man and nature</li><li>Celebrates/champions nature</li><li>Criticises authority</li></ul><h4>Colonialism</h4><ul><li>Colonialism creates a fractured identity</li></ul></section><button data-go="revise">Continue to revision →</button>'}

function setupRevise(){let mode='flash';const area=$('reviseArea');function switchMode(m){mode=m;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id===({flash:'flashTab',blurt:'blurtTab',quiz:'quizTab'}[m])));if(m==='flash')flash();if(m==='blurt')blurt();if(m==='quiz')startQuiz()}$('flashTab').onclick=()=>switchMode('flash');$('blurtTab').onclick=()=>switchMode('blurt');$('quizTab').onclick=()=>switchMode('quiz');deck=Object.entries(exactNotes).flatMap(([poem,items])=>items.map(q=>({poem,quote:q[0],method:q[1],analysis:q[2].join(' '),bullets:q[2],hook:''})));cardIndex=0;showBack=false;flash();

function startQuiz(){const fresh=deck.slice();for(let i=fresh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fresh[i],fresh[j]]=[fresh[j],fresh[i]]}const weak=JSON.parse(localStorage.getItem('rc-weak-'+user.id)||'{}');fresh.sort((a,b)=>(weak[b.poem+'|'+b.quote]||0)-(weak[a.poem+'|'+a.quote]||0));quiz={i:0,score:0,startedAt:Date.now(),items:fresh.slice(0,8)};ask()}
function ask(){let c=quiz.items[quiz.i];area.innerHTML='<div class="card"><div class="row"><span class="pill">Question '+(quiz.i+1)+'/8</span><span class="pill">Score '+quiz.score+'</span></div><h3>Which poem does this quote come from?</h3><div class="quote">“'+escape(c.quote)+'”</div><div class="grid">'+[c.poem,...poems.filter(x=>x[0]!==c.poem).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[0])].sort(()=>Math.random()-.5).map(name=>'<button class="answer">'+escape(name)+'</button>').join('')+'</div><div id="quizfeedback"></div></div>';area.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{let ok=b.textContent===c.poem;if(ok)quiz.score++;else{const weak=JSON.parse(localStorage.getItem('rc-weak-'+user.id)||'{}');const key=c.poem+'|'+c.quote;weak[key]=(weak[key]||0)+1;localStorage.setItem('rc-weak-'+user.id,JSON.stringify(weak))}area.querySelectorAll('.answer').forEach(x=>x.disabled=true);$('quizfeedback').innerHTML='<p class="'+(ok?'right':'wrong')+'">'+(ok?'Correct!':'Not quite — it is '+escape(c.poem))+'. '+escape(c.hook)+'</p><button id="qnext" class="primary">'+(quiz.i===7?'Finish':'Next')+'</button>';$('qnext').onclick=async()=>{quiz.i++;if(quiz.i===8){area.innerHTML='<div class="card"><div class="score">'+quiz.score+'/8</div><h3>Round complete</h3><button id="again" class="primary">Play again</button></div>';$('again').onclick=startQuiz;await supabase.from('study_sessions').insert({user_id:user.id,subject_id:'english-lit',activity:'quick-quiz',score:quiz.score*10,duration_seconds:Math.round((Date.now()-quiz.startedAt)/1000)});}else ask()}})}}
async function setupFriends(){$('findfriend').onclick=async()=>{let name=$('friendname').value.trim().toLowerCase();if(!name)return;let r=await supabase.from('profiles').select('id,username').eq('username',name).maybeSingle();if(r.error||!r.data)return say('friendmsg','No matching username found.');if(r.data.id===user.id)return say('friendmsg','That is your own account.');let prior=await supabase.from('friend_requests').select('id,status').eq('sender_id',user.id).eq('receiver_id',r.data.id).maybeSingle();if(prior.data)return say('friendmsg',prior.data.status==='accepted'?'You are already friends.':'A request has already been sent to this user.');let ins=await supabase.from('friend_requests').insert({sender_id:user.id,receiver_id:r.data.id});say('friendmsg',ins.error?(ins.error.code==='23505'?'A request already exists between these accounts.':ins.error.message):'Friend request sent to '+r.data.username+'.')};let r=await supabase.from('friend_requests').select('id,sender_id,status').eq('receiver_id',user.id).eq('status','pending');const ids=(r.data||[]).map(x=>x.sender_id);let profileRows=[];if(ids.length){const pr=await supabase.from('profiles').select('id,username').in('id',ids);profileRows=pr.data||[]}const names=Object.fromEntries(profileRows.map(x=>[x.id,x.username]));$('requests').innerHTML=(r.data||[]).map(x=>'<div class="row"><b>'+escape(names[x.sender_id]||'Student')+'</b><button data-accept="'+x.id+'">Accept</button><button data-decline="'+x.id+'">Decline</button></div>').join('')||'No pending requests.';$('requests').onclick=async e=>{let id=e.target.dataset.accept||e.target.dataset.decline;if(!id)return;await supabase.from('friend_requests').update({status:e.target.dataset.accept?'accepted':'declined'}).eq('id',id);setupFriends()};$('newchallenge').onclick=async()=>{let r=await supabase.from('challenges').insert({creator_id:user.id,title:'Power & Conflict quick revision',subject_id:'english-lit',mode:'quote-race'}).select().single();say('challengemsg',r.error?.message||'Challenge created. Invite a friend from the Friends tab (challenge invites are coming next). ID: '+r.data.id)}}
async function loadScores(scope='friends'){let ids=[user.id];if(scope==='friends'){const fr=await supabase.from('friend_requests').select('sender_id,receiver_id').eq('status','accepted').or('sender_id.eq.'+user.id+',receiver_id.eq.'+user.id);ids=[...new Set([user.id,...(fr.data||[]).map(x=>x.sender_id===user.id?x.receiver_id:x.sender_id)])]}let q=supabase.from('study_sessions').select('user_id,score');if(scope==='friends')q=q.in('user_id',ids);else q=q.limit(1000);const sessions=await q;if(sessions.error){$('scores').textContent=sessions.error.message;return}const totals={};(sessions.data||[]).forEach(x=>totals[x.user_id]=(totals[x.user_id]||0)+Number(x.score||0));const userIds=Object.keys(totals);let names={};if(userIds.length){const pr=await supabase.from('profiles').select('id,username,display_name').in('id',userIds);(pr.data||[]).forEach(x=>names[x.id]=x.display_name||x.username)}const rows=Object.entries(totals).sort((a,b)=>b[1]-a[1]);$('scores').innerHTML=rows.map(([id,points],i)=>'<div class="poem">'+(i+1)+'. <b>'+escape(id===user.id?'You':names[id]||'Student')+'</b> — '+points+' points</div>').join('')||'No points recorded yet. Each correct quiz answer is worth 10 points.'}
async function loadAdmin(){const [pr,sr,ur]=await Promise.all([supabase.from('profiles').select('id,username,display_name').order('username'),supabase.from('study_sessions').select('user_id,activity,score,duration_seconds,created_at').order('created_at',{ascending:false}).limit(500),supabase.from('user_presence').select('user_id,last_seen,current_page,study_status,session_started_at')]);if(pr.error){$('adminUsers').textContent=pr.error.message;return}const presence=Object.fromEntries((ur.data||[]).map(x=>[x.user_id,x]));const stats={};(sr.data||[]).forEach(x=>{stats[x.user_id]??={seconds:0,points:0};stats[x.user_id].seconds+=Number(x.duration_seconds||0);stats[x.user_id].points+=Number(x.score||0)});$('adminUsers').innerHTML=(pr.data||[]).map(x=>{const p=presence[x.id],s=stats[x.id]||{seconds:0,points:0},online=p&&Date.now()-new Date(p.last_seen).getTime()<90000;return '<div class="feedback"><b>'+escape(x.username)+'</b> · '+(online?'Online':'Offline')+'<p>Status: '+escape(p?.study_status||'offline')+' · Studying page: '+escape(p?.current_page||'—')+' · Current session: '+(online?Math.round((Date.now()-new Date(p.session_started_at).getTime())/60000):0)+' min · Recorded quiz time: '+Math.round(s.seconds/60)+' min · Points: '+s.points+'</p><label>Display name</label><input class="field" id="rename-'+x.id+'" value="'+escape(x.display_name||x.username)+'"><button data-rename="'+x.id+'">Save display name</button></div>'}).join('');$('adminUsers').onclick=async e=>{const id=e.target.dataset.rename;if(!id)return;const val=$('rename-'+id).value.trim();if(!val)return;const r=await supabase.from('profiles').update({display_name:val}).eq('id',id);if(r.error)alert(r.error.message);else loadAdmin()}}
async function startPresence(){if(!user?.id)return;if(window.rcPresenceTimer)clearInterval(window.rcPresenceTimer);const uid=user.id,sessionStart=new Date().toISOString();const send=async()=>{if(!user?.id||user.id!==uid)return;const {error}=await supabase.from('user_presence').upsert({user_id:uid,last_seen:new Date().toISOString(),current_page:page,study_status:['revise','poem'].includes(page)?'studying':'online',session_started_at:sessionStart},{onConflict:'user_id'});if(error)console.warn('Presence update failed:',error.message)};await send();window.rcPresenceTimer=setInterval(send,30000)}
supabase.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();
