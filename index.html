<style>
:root{--bg:#f5f6f7;--card:#fff;--ink:#17191d;--muted:#68707c;--line:#e0e3e8;--accent:#20252d;--soft:#eef0f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif}body.dark{--bg:#111315;--card:#1b1f23;--ink:#f2f4f6;--muted:#a5adb7;--line:#30363d;--accent:#f0f2f4;--soft:#292f35}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--card);color:var(--ink);font-weight:650}button.primary{background:var(--accent);color:var(--bg)}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1100px;margin:auto;padding:22px 16px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(25px,5vw,38px);margin:0;letter-spacing:-1.3px}h2{font-size:24px;margin:8px 0}p{color:var(--muted);line-height:1.55}.nav{display:flex;gap:7px;overflow:auto;padding:18px 0}.nav button.active{background:var(--soft);border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.card h3{margin:0 0 5px}.muted{color:var(--muted)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:5px 0 12px}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 9px;font-size:12px;color:var(--muted)}.quote{font-size:25px;font-weight:800;letter-spacing:-.5px;margin:15px 0}.hidden{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.flash{min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}.flash .quote{font-size:30px}.feedback{background:var(--soft);border-radius:12px;padding:12px;margin:12px 0}.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}small{color:var(--muted)}.auth{max-width:420px;margin:45px auto}.poem{border-top:1px solid var(--line);padding:12px 0}.poem summary{font-weight:750;cursor:pointer}.poem p{margin:8px 0}.score{font-size:34px;font-weight:850}.right{color:#16845d}.wrong{color:#c34242}textarea{resize:vertical;min-height:150px}

/* Hub refresh: clearer hierarchy, calmer spacing, responsive navigation */
:root{--bg:#f3f4f5;--card:#fff;--ink:#202326;--muted:#6b7178;--line:#dfe2e5;--accent:#34383d;--soft:#eceeef;--shadow:0 8px 26px rgba(20,24,28,.045)}
body{font-size:15px;background:var(--bg);line-height:1.55}
body.dark{--bg:#111315;--card:#1c2023;--ink:#f0f2f3;--muted:#aab0b5;--line:#343a3f;--accent:#d7dadd;--soft:#292e32;--shadow:0 8px 26px rgba(0,0,0,.18)}
.wrap{max-width:1240px;padding:26px 24px 72px}
header{position:relative;padding:8px 0 20px;border-bottom:1px solid var(--line)}
h1{letter-spacing:-1.5px;font-size:clamp(28px,4vw,40px)}
h2{font-size:clamp(23px,3vw,29px);letter-spacing:-.7px;margin:12px 0 4px}
h3{letter-spacing:-.25px}
p{line-height:1.7}
.nav{position:sticky;top:0;z-index:20;margin:0 -24px 26px;padding:13px 24px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);gap:9px}
.nav button,.tabs button{border-radius:12px;padding:10px 16px;white-space:nowrap;transition:background .18s,border-color .18s,transform .18s}
.nav button:hover,.tabs button:hover,button:hover{transform:translateY(-1px)}
.nav button.active,.tabs button.active{background:var(--accent);color:white;border-color:var(--accent)}
body.dark .nav button.active,body.dark .tabs button.active{color:#10151e}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px}
.card{padding:22px;border-radius:19px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:18px;margin:0 0 8px}
.card p{margin:8px 0 16px}
button{transition:transform .18s,box-shadow .18s,border-color .18s;border-radius:11px}
button.primary{background:var(--accent);border-color:var(--accent);color:white}
body.dark button.primary{color:#10151e}
.field{padding:13px 14px;margin:8px 0 16px;border-radius:12px}
.tabs{gap:10px;margin:18px 0}
.feedback{padding:18px 20px;margin:16px 0;border:1px solid var(--line);border-radius:15px}
.feedback p{margin:12px 0}
.poem.card{margin:12px 0;padding:17px 20px;border:1px solid var(--line);border-radius:15px;background:var(--card)}
.poem summary{display:flex;align-items:center;justify-content:space-between;gap:12px;line-height:1.45}
.poem summary .pill{flex-shrink:0}
details[open] summary{margin-bottom:14px}
.flash{min-height:260px;padding:30px;gap:12px}
.flash .quote{font-size:clamp(26px,4vw,38px);line-height:1.25;max-width:780px}
#reviseArea>.row{margin-top:16px;justify-content:center}
#reviseArea>.row button{min-width:112px}
.score{font-size:48px;color:var(--accent)}
.auth{box-shadow:var(--shadow)}
.right{color:#16845d}.wrong{color:#c34242}
.subject-hero{padding:26px;background:linear-gradient(120deg,var(--soft),var(--card));border:1px solid var(--line);border-radius:20px;margin:16px 0 20px}
.subject-card{display:flex;flex-direction:column;gap:8px;min-height:205px}
.subject-card .subject-icon{font-size:28px}
.subject-card button{align-self:flex-start;margin-top:auto}
.quick-links{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px}
.quick-links button{font-size:13px;padding:8px 12px}
ul{padding-left:23px;line-height:1.75}
li{padding:2px 0 5px}
@media(max-width:650px){.wrap{padding:17px 14px 45px}.nav{margin:0 -14px 20px;padding:10px 14px}.card{padding:18px}.poem summary{align-items:flex-start}.poem summary .pill{white-space:normal;text-align:right}.flash{min-height:230px}.nav{overflow-x:auto;flex-wrap:nowrap}.nav button{font-size:13px;padding:9px 12px}}

</style></head><body><div class="wrap"><header><div><h1>Revision Club</h1><div class="muted">Learn your way. Revise together.</div></div><div class="row"><span id="who" class="pill">Not signed in</span><button id="theme">Dark mode</button><button id="logout" class="hidden">Log out</button></div></header>
<section id="auth" class="auth card"><h2>Welcome</h2><p>Create an account or sign in to save your revision and meet friends.</p><label>Email</label><input id="email" class="field" type="email" autocomplete="email"><label>Password</label><input id="password" class="field" type="password" autocomplete="current-password"><label>Username (for sign-up)</label><input id="username" class="field" maxlength="20" placeholder="e.g. QuoteWizard"><div class="row"><button class="primary" id="signup">Sign up</button><button id="login">Log in</button></div><p id="authmsg" aria-live="polite"></p></section>
<div id="app" class="hidden"><nav class="nav" id="nav"><button data-page="home" class="active">Home</button><button data-page="learn">Learn</button><button data-page="revise">Revise</button><button data-page="friends">Friends</button><button data-page="leaderboard">Leaderboard</button><button data-page="subjects">Subjects</button></nav><main id="page"></main></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://iqlwpzkkvfsestzhvgud.supabase.co','sb_publishable_P7DE6czlE2tspGAVgexEbg_VgftEkpf');
const $=id=>document.getElementById(id);let user=null,profile=null,page='home',deck=[],cardIndex=0,showBack=false,quiz=null;
const poems=[
['Remains','Simon Armitage','War and conflict',[['blood-shadow','Metaphor','The compound noun “blood-shadow” fuses physical violence with something that follows the speaker. A shadow is difficult to escape, so the image suggests that the memory of killing has attached itself to the soldier and continues to haunt him after the event. Armitage makes guilt feel like a permanent presence rather than a passing emotion.','The violent act leaves lasting psychological trauma; the effects of conflict continue long after the battlefield.'],['tosses his guts','Violent imagery','The verb “tosses” is casual and almost dismissive, as if the body parts are an ordinary object. This matter-of-fact diction clashes with the horrific image of “guts”, making the violence feel brutally routine. Armitage may be showing how soldiers use detached language to cope with extreme experiences.','Conflict can normalise brutality and leave soldiers emotionally detached, even while they suffer lasting guilt.']]],
['War Photographer','Carol Ann Duffy','Victims and effects of war',[['light is red','Colour imagery','The simple colour image “red” can suggest blood, danger and suffering. Its starkness makes the photograph’s subject feel immediate, while the controlled darkroom setting contrasts with the chaos of the conflict being recorded. Duffy draws attention to the photographer’s difficult role: turning distant suffering into an image others can see.','The poem explores how war creates victims and how those far away encounter their suffering through images.']]],
['Poppies','Jane Weir','Victims and effects of war',[['bandaged ... Poppies ... blockade','War imagery','The word “bandaged” suggests injury and the need to protect something vulnerable, while “blockade” implies an obstacle that cannot easily be crossed. By placing these images alongside the poppies, Weir connects the physical language of conflict with the speaker’s emotional attempt to hold on to her child. The ordinary domestic moment becomes marked by separation and loss.','War affects those left at home as well as those who fight; separation creates emotional wounds for families.']]],
['Bayonet Charge','Ted Hughes','War and conflict',[['cold clockwork','Metaphor','The metaphor “cold clockwork” makes the soldier seem mechanical, as though his body is moving through a process he cannot control. “Cold” removes warmth and humanity, while “clockwork” suggests repetitive, automatic movement. Hughes presents the soldier as overwhelmed by the machinery and violence of war rather than acting with heroic certainty.','War dehumanises individuals and reduces them to frightened bodies reacting instinctively.']]],
['Kamikaze','Beatrice Garland','Victims and effects of war',[['crabs, prawns','Natural imagery','The specific images of “crabs” and “prawns” make the sea vivid, ordinary and full of life. Their small, familiar details contrast with the distant military expectations placed on the pilot. Garland uses the remembered natural world to reveal what the pilot is being asked to abandon: an ordinary human life and the people who love him.','The poem questions the pressure of patriotic duty and shows the personal cost of conflict.']]],
['The Charge of the Light Brigade','Alfred Tennyson','War and conflict',[['valley of Death','Biblical allusion','The biblical echo of the “valley of Death” gives the battlefield the scale of a spiritual trial and makes the soldiers’ danger seem almost inevitable. The capitalised “Death” personifies their enemy as an overwhelming force. Tennyson both honours their courage and exposes the terrible cost of unquestioning obedience.','The poem presents the soldiers as courageous but vulnerable to the destructive consequences of orders.']]],
['The Prelude','William Wordsworth','Nature’s power',[['act of stealth','Diction','The phrase “act of stealth” suggests secrecy and wrongdoing, as if the speaker knows that taking the boat is a transgression. This language reveals his confidence before the mountain appears: he initially treats the natural world as something he can use. The later change in tone exposes the limits of that confidence.','Nature humbles human pride and makes the speaker recognise that he is not in control.']]],
['Storm on the Island','Seamus Heaney','Nature’s power',[['spits like a tame cat','Simile','The simile initially compares the storm to a familiar, apparently harmless pet, making the threat seem manageable. However, “spits” gives the weather an aggressive action, so the comparison becomes unsettling: something that appears tame can still attack. Heaney uses this shift to challenge the islanders’ confidence in their ability to withstand nature.','Nature is unpredictable; human confidence can be undermined by forces that seem familiar or harmless.']]],
['My Last Duchess','Robert Browning','Power and control',[['my last Duchess','Possessive pronoun','The possessive pronoun “my” makes the Duchess sound like the Duke’s property rather than an independent person. Combined with “last”, it hints at his control over her fate and reveals how he treats relationships as possessions. Browning lets the Duke expose his own arrogance through his choice of words.','The poem criticises patriarchal power and the way authority can become possessive and abusive.']]],
['London','William Blake','Power and control',[['mind-forged manacles','Metaphor','The metaphor “mind-forged manacles” turns psychological oppression into the image of physical chains. “Forged” suggests that these restraints have been made and reinforced by people and institutions, while “manacles” conveys imprisonment. Blake implies that social systems shape how people think until oppression becomes internalised.','Powerful institutions restrict freedom both physically and through the beliefs people are taught to accept.']]],
['Tissue','Imtiaz Dharker','Power and control',[['Koran ... maps ... slips','Symbolism','The list brings together sacred writing, political borders and fragile pieces of paper, suggesting that human structures depend on materials that can easily be damaged. Dharker places different kinds of authority alongside one another to question how securely people build power, identity and boundaries. The fragile paper becomes a symbol of the limits of human control.','Human systems and claims to authority are fragile; power does not last forever.']]],
['The Émigrée','Carol Rumens','Identity and place',[['bright ... shadow','Contrast','The contrast between “bright” and “shadow” places the speaker’s hopeful memory beside the darker reality of political conflict. Light suggests warmth, belonging and an idealised homeland, whereas shadow hints at danger and loss. Rumens shows that the speaker’s attachment to home survives even when the place itself has changed.','Memory can preserve identity and belonging even when conflict makes returning home difficult.']]],
['Checking Out Me History','John Agard','Identity and place',[['Dem','Dialect / pronoun','The repeated colloquial pronoun “Dem” creates a clear distinction between the speaker and the people who control the version of history he has been taught. Its repetition gives the voice rhythm and resistance, challenging the authority of the dominant group. Agard uses dialect to assert an identity that official education has marginalised.','The poem challenges cultural oppression and shows the speaker reclaiming his identity and history.']]],
['Exposure','Wilfred Owen','Victims and effects of war',[['black with snow','Colour imagery','The paradoxical image “black with snow” combines a colour associated with darkness and death with snow, which is usually associated with whiteness and purity. This disturbing contrast makes the landscape feel unnatural and hostile, reflecting the soldiers’ psychological despair. Owen presents nature not as comforting but as another force attacking exhausted men.','Nature becomes an enemy, intensifying the soldiers’ physical suffering and mental disintegration.'],['cringe in holes','Verb / imagery','The verb “cringe” suggests fear, shame and an instinctive shrinking away from danger. It makes the soldiers seem small and vulnerable, almost animal-like, while “holes” implies that they are trapped and exposed in the landscape. Owen strips away traditional images of military glory and focuses instead on the soldiers’ degradation and fear.','War reduces soldiers to vulnerable, dehumanised figures and exposes the reality behind patriotic ideas of heroism.']]],
['Ozymandias','Percy Bysshe Shelley','Power and control',[['sunk ... shattered visage','Visual imagery','The verbs “sunk” and “shattered” create a picture of a face physically broken and partly swallowed by the sand. “Shattered” suggests not only the destruction of the statue but also the collapse of Ozymandias’ authority and reputation. The fragmentary description makes his attempt to preserve his greatness seem futile: time and the natural world have outlasted the ruler and his empire.','Shelley presents political power and human pride as temporary; time and nature eventually overwhelm human achievements.'],['King of Kings','Irony / allusion','The title “King of Kings” is a biblical allusion usually associated with supreme, divine authority. Ozymandias applies this grand title to himself, revealing his arrogance and belief that he is above other rulers. The irony is that the inscription survives while the kingdom it celebrates has vanished, so the boast becomes evidence of his failure rather than his greatness.','Shelley mocks rulers who imagine themselves godlike and suggests that no human power can defeat time.']]]
];
const exactNotes={"Remains":[["inside out...tosses his guts","Horrific imagery / Colloquial language",["Brutal/unemotional language -> soldier mentally distances from violence.","\"tosses\" -> connotations of carelessness; war desensitizes soldiers.","Colloquial tone -> speaker unable to process military memories normally.","Critical stance -> attacks romanticized view of war."]],["blood-shadow","Metaphor",["Stain/shadow -> overpowering guilt; imprinted memory of dead man.","\"shadow\" -> absence of light; explores dark subject matter.","Trauma -> highlights difficulty overcoming war experiences."]]],"War Photographer":[["light is red","Colour Imagery",["Red -> connotations of blood; highlights dangers of war zones.","Red light -> links to church tabernacle where photographer seeks comfort.","Parallels -> compares priest and war photographer exposed to death/suffering."]],["blood stained.... foreign dust","Imagery",["Stained -> links to memories and deep psychological scarring.","Distance -> avoids naming a place to distance himself from horror.","Isolation -> mirrors how people isolate themselves from trauma."]]],"Poppies":[["bandaged ... Poppies ... blockade","Semantic field of war",["Pain/injury -> physical injury represents emotional trauma.","\"Poppies\" -> connotations of blood and death; maternal joy cannot be regained."]],["my stomach busy... making tucks, darts, pleats","Imagery",["Maternal perspective -> explores psychological impact of conflict and death.","Layers of folds -> mirrors layers of maternal grief and anxiety.","Sharpness/edged nature -> mirrors sharp memories and deep anguish."]]],"Bayonet Charge":[["cold clockwork ....stars... nations","Metaphor",["Clockwork -> mechanical, unemotional state of existence; transformed into killers.","Exploitation -> questions how the state controls and decides their fate.","Cog in a machine -> highlights lack of choice and indignation at leadership."]],["King, honour, human dignity, etcetera","List",["Battle fear -> shows patriotic ideals are instantly replaced with fear.","Self-indulgence -> ideals are irrelevant and must be abandoned to survive.","Hollow concepts -> highlights patriotic ideas as meaningless in brutal war."]]],"Kamikaze":[["crabs, prawns..... dark prince","Contrast",["Fishing imagery -> captures childhood innocence and pure joy.","Parallels -> fish and people are both trapped, unable to escape fate.","\"dark price\" -> forebodes a darker end; war blights all life."]],["eight","Symbolism",["Infinity symbol -> flag emphasizes power of state; soldier cannot escape destiny.","Sailing knot -> reinforces idea that pilot is completely trapped.","Unlimited nature -> continuous cycle of pain/shame; cannot return to normal life."]]],"The Charge of the Light Brigade":[["valley of Death... jaws of death","Metaphor / Personification",["Biblical reference -> connotations of hell; highlights battlefield horrors.","Predator -> personifies battlefield to show the vicious nature of war.","Bravery -> emphasizes the extreme bravery of the charging soldiers."]],["honour","Imperatives / Form: Lament",["Remembrance -> emphasizes central message of respect for sacrifice.","Immortalises -> clear purpose to keep soldiers' memory alive forever.","Conflict -> questions the battle; weighs bravery against blunders of leadership.","Celebration -> poem is traditionally a lament/mourning, but twists into celebration."]]],"The Prelude":[["act of stealth","Symbolism",["Theft of boat -> highlights overwhelming pride leading to immoral actions.","Aggression -> man is aggressive, dominant, corrupt; detracts from nature.","Spiritual journey -> man discovers humanity has no authority over nature."]],["upreared its head","Personification / Enjambment",["Attack -> nature acts as a deadly force, metaphorically attacking man.","Hostile force -> nature is subverted, transforming into something harsh and brutal.","Simplistic vocabulary -> shows how nature can shock and overwhelm man's pride.","The Sublime -> inspires intense feelings of awe and terror; impacts emotional state.","Enjambment -> emphasizes intensity of weather; mirrors chaotic emotional response."]]],"Storm on the Island":[["strafe... salvo... bombarded","Semantic field of war / Blank verse",["Unpredictable force -> demonstrates nature as an active military aggressor.","No mercy -> community is left entirely at the mercy of the storm.","Romanticism subverted -> updates traditions by showing nature as hostile.","The Troubles -> context of conflict suggests war upsets balance between man and nature."]],["spits like a tame cat / a huge nothing","Simile / Oxymoron",["Aggression -> \"spits\" has connotations of unpredictable natural anger.","Domesticity -> simile offers a familiar image, undermining nature's actual power.","Imagination -> oxymoron shows human imagination exacerbates natural fears."]]],"Exposure":[["black with snow","Oxymoron",["Stifling tone -> creates an oppressive atmosphere filled with deep despair.","Psychological struggle -> shows the deep internal warfare soldiers endure.","Nature subverted -> highlights how nature’s power is turned into an attacking force.","Decay & Corruption -> \"black\" implies a breakdown in equilibrium due to war."]],["cringe in holes","Imagery / Caesura",["Vulnerability -> soldiers are left defeated, looking for refuge without dignity.","Dehumanised -> imagery illustrates nature completely overpowering the men.","Animalistic state -> war and climate force soldiers to act like hidden beasts.","Mental disintegration -> caesura highlights the unpredictable nature of war and climate."]]],"The Émigrée":[["bright.... shadow","Contrast",["Warmth -> \"bright\" connotes nostalgia, idealising her past home.","Identity -> devotion and deep emotional attachment to birthplace is central.","Reality -> \"shadow\" captures the threatening, dark reality of the current city.","Internal struggle -> highlights attempts to reconcile opposing views of home."]],["city","Setting",["Hostile place -> setting shows the direct effects of war creating a totalitarian state.","Psychological impact -> childhood vision is completely ruined by a darker reality.","Metaphor -> represents growth from dreamlike childhood to adult understanding."]]],"Checking Out Me History":[["Dem","Anaphora",["Authority conflict -> emphasizes barrier between rulers and the speaker.","Worldview -> highlights how those in power actively force their history on others.","Accusatory tone -> criticises authority for denying him his true culture."]],["carving","Metaphor",["Care -> process is slow, showing reclaiming identity takes massive effort.","Cultural identity -> highlights validation of personal history.","Resolute stance -> conveys absolute willingness to struggle against status quo."]]]};
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){const {data}=await supabase.auth.getUser();user=data.user||null;$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('logout').classList.toggle('hidden',!user);if(user){let r=await supabase.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=r.data;$('who').textContent=profile?.username||user.email;render()}}
function say(id,msg){$(id).textContent=msg}
$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,username=$('username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');if(username.length<3)return say('authmsg','Username must be at least 3 characters.');const {data,error}=await supabase.auth.signUp({email,password,options:{data:{username,display_name:username}}});say('authmsg',error?.message||(data.session?'Account created!':'Check your email to confirm your account, then log in.'));if(data.session)refresh()};
$('login').onclick=async()=>{const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});say('authmsg',error?.message||'Signed in.');if(!error)refresh()};
$('logout').onclick=async()=>{await supabase.auth.signOut();refresh()};
$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'Light mode':'Dark mode';localStorage.setItem('rc-theme',document.body.classList.contains('dark')?'dark':'light')};
if(localStorage.getItem('rc-theme')==='dark'){document.body.classList.add('dark');$('theme').textContent='Light mode'}
$('nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(!b)return;page=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()};
function shell(title,sub=''){return '<h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')}
function render(){const p=$('page');if(page==='home'){p.innerHTML='<section class="card" style="padding:clamp(28px,7vw,64px);margin:22px 0"><span class="pill">REVISION CLUB · GCSE</span><h2 style="font-size:clamp(32px,6vw,54px);margin-top:20px">Your revision, one step at a time.</h2><p>Start with your subject. Move through the course in order, open a topic, then practise what you have learned.</p><button class="primary" data-go="subjects">Start learning →</button></section><div class="row"><button data-go="friends">Friends</button><button data-go="leaderboard">Leaderboard</button></div>'}
else if(page==='learn'){p.innerHTML='<button data-go="subjects">← Subjects</button>'+shell('Step 2 · Power & Conflict','Choose a poem to open its full quote-by-quote analysis.')+poems.map((po,i)=>'<article class="card poem"><div class="row" style="justify-content:space-between"><div><h3>'+escape(po[0])+'</h3><small>'+escape(po[1])+' · '+escape(po[2])+'</small></div><button data-poem="'+i+'">Study poem →</button></div></article>').join('')+'<button data-go="revise">Continue to revision →</button>'}
else if(page==='poem'){const i=Number(window.currentPoem||0),po=poems[i],exact=exactNotes[po[0]];p.innerHTML='<button data-go="learn">← All poems</button>'+shell('Step 3 · '+escape(po[0]),escape(po[1])+' · '+escape(po[2]))+(exact?exact.map(q=>'<section class="feedback"><div class="quote">“'+escape(q[0])+'”</div><span class="pill">'+escape(q[1])+'</span><ul>'+q[2].map(line=>'<li>'+escape(line)+'</li>').join('')+'</ul></section>').join(''):po[3].map(q=>'<section class="feedback"><div class="quote">“'+escape(q[0])+'”</div><span class="pill">'+escape(q[1])+'</span><p>'+escape(q[2])+'</p><p>'+escape(q[3])+'</p></section>').join(''))+'<div class="row"><button '+(i===0?'disabled':'')+' data-poem="'+(i-1)+'">← Previous poem</button><button class="primary" '+(i===poems.length-1?'disabled':'')+' data-poem="'+(i+1)+'">Next poem →</button><button data-go="revise">Go to revision →</button></div>'}
else if(page==='revise'){p.innerHTML=shell('Choose how to revise','Short sessions. Repeat the difficult ones as often as you like.')+'<div class="tabs"><button id="flashTab" class="active">Flashcards</button><button id="blurtTab">Blurting</button><button id="quizTab">Quick quiz</button></div><div id="reviseArea"></div>';setupRevise()}
else if(page==='friends'){p.innerHTML=shell('Friends','Use usernames, not real names. Friend requests are private until accepted.')+'<div class="card"><h3>Add a friend</h3><input id="friendname" class="field" placeholder="Their username"><button class="primary" id="findfriend">Find and request</button><div id="friendmsg"></div></div><div class="card" style="margin-top:12px"><h3>Your friend requests</h3><div id="requests">Loading…</div></div><div class="card" style="margin-top:12px"><h3>Challenges</h3><p>Challenge creation and live multiplayer rounds are the next social feature to wire in.</p><button id="newchallenge">Create a practice challenge</button><div id="challengemsg"></div></div>';setupFriends()}
else if(page==='leaderboard'){p.innerHTML=shell('Leaderboard','Your best saved practice scores. Complete a session to appear here.')+'<div id="scores" class="card">Loading…</div>';loadScores()}
else if(page==='subjects'){p.innerHTML='<button data-go="home">← Back</button>'+shell('Step 1 · Choose your subject','Choose the course you want to work through next.')+`<div class="subject-hero"><span class="pill">YOUR REVISION LIBRARY</span><h2>Everything in one place.</h2><p>Subjects are organised into clear sections. Your learning tools stay available across the hub.</p><div class="quick-links"><button data-subject="english">English</button><button data-subject="maths">Maths</button><button data-subject="science">Science</button><button data-subject="more">More subjects</button></div></div><div class="grid"><article class="card subject-card"><span class="subject-icon">📖</span><h3>English Literature</h3><p>Power &amp; Conflict poetry, Macbeth and key quotation practice.</p><button class="primary" data-open="learn">Continue to English →</button></article><article class="card subject-card"><span class="subject-icon">➗</span><h3>Maths</h3><p>Build a topic-by-topic revision area with practice and recall.</p><button data-subject="maths">Explore Maths</button></article><article class="card subject-card"><span class="subject-icon">🧪</span><h3>Science</h3><p>Biology, Chemistry and Physics revision sections.</p><button data-subject="science">Explore Science</button></article><article class="card subject-card"><span class="subject-icon">＋</span><h3>More subjects</h3><p>History, Geography, Languages and other courses can sit in this hub.</p><button data-subject="more">Explore subjects</button></article></div><div id="subjectdetail" class="card" style="margin-top:18px"><h3>English Literature</h3><p>Power &amp; Conflict is ready to study. Choose a route:</p><div class="quick-links"><button data-open="learn">Poem library</button><button data-open="revise">Flashcards &amp; quizzes</button><button data-open="revise">Blurting practice</button></div></div>`}}
$('page').onclick=e=>{const b=e.target.closest('[data-go],[data-open],[data-subject],[data-poem]');if(!b)return;if(b.dataset.poem!==undefined){window.currentPoem=Number(b.dataset.poem);page='poem';render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.go||b.dataset.open){page=b.dataset.go||b.dataset.open;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.subject==='english'){page='learn';render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.subject){const d=$('subjectdetail');if(d){const key=b.dataset.subject;const info={english:['English Literature','Power & Conflict poetry, Macbeth and quotation analysis.','Poem library','Flashcards & quizzes'],maths:['Maths','Maths topic pages are a separate build step.','Topic directory','Practice area'],science:['Science','Biology, Chemistry and Physics sections.','Biology','Chemistry & Physics'],more:['More subjects','Choose another course to add to your personal hub.','History','Geography']}[key];d.innerHTML='<span class="pill">SUBJECT SECTION</span><h3>'+info[0]+'</h3><p>'+info[1]+'</p><div class="quick-links"><button data-open="'+(key==='english'?'learn':'revise')+'">'+info[2]+'</button><button data-open="revise">'+info[3]+'</button></div>';d.scrollIntoView({behavior:'smooth',block:'nearest'})}}};
function setupRevise(){let mode='flash';const area=$('reviseArea');function switchMode(m){mode=m;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id===({flash:'flashTab',blurt:'blurtTab',quiz:'quizTab'}[m])));if(m==='flash')flash();if(m==='blurt')blurt();if(m==='quiz')startQuiz()}$('flashTab').onclick=()=>switchMode('flash');$('blurtTab').onclick=()=>switchMode('blurt');$('quizTab').onclick=()=>switchMode('quiz');deck=poems.flatMap(po=>po[3].map(q=>({poem:po[0],quote:q[0],method:q[1],analysis:q[2],hook:q[3]}))).sort(()=>Math.random()-.5);cardIndex=0;showBack=false;flash();
function flash(){let c=deck[cardIndex%deck.length];area.innerHTML='<div class="card flash" id="flip"><span class="pill">Card '+(cardIndex+1)+' of '+deck.length+'</span>'+(showBack?'<h3>'+escape(c.poem)+'</h3><div class="quote">“'+escape(c.quote)+'”</div><span class="pill">'+escape(c.method)+'</span><p><b>Analysis:</b> '+escape(c.analysis)+'</p><p><b>Link to the poem’s message:</b> '+escape(c.hook)+'</p>':'<div class="pill">QUOTE RECALL</div><div class="quote">“'+escape(c.quote)+'”</div><h3>What does this quote suggest?</h3><small>Try to recall the poem, method and meaning before revealing.</small>')+'</div><div class="row"><button id="prev">Previous</button><button id="flipBtn" class="primary">'+(showBack?'Hide answer':'Reveal answer')+'</button><button id="next">Next card</button></div>';const flip=()=>{showBack=!showBack;flash()};$('flip').onclick=flip;$('flipBtn').onclick=flip;$('prev').onclick=()=>{cardIndex=(cardIndex-1+deck.length)%deck.length;showBack=false;flash()};$('next').onclick=()=>{cardIndex++;showBack=false;flash()}}
function blurt(){area.innerHTML='<div class="card"><h3>Blurting practice</h3><p>Choose a poem, write everything you can remember, then reveal the checklist. Try again later and fill the gaps.</p><select id="blurtpoem" class="field">'+poems.map(x=>'<option>'+escape(x[0])+'</option>').join('')+'</select><textarea id="blurttext" class="field" placeholder="Write everything you remember: quotes, methods, analysis, themes…"></textarea><button id="checkblurt" class="primary">Reveal my checklist</button><div id="blurtresult"></div></div>'; $('checkblurt').onclick=()=>{let po=poems.find(x=>x[0]===$('blurtpoem').value);$('blurtresult').innerHTML='<div class="feedback"><b>Compare your notes with these key prompts:</b>'+po[3].map(q=>'<p>“'+escape(q[0])+'” · '+escape(q[1])+'<br><b>Analysis:</b> '+escape(q[2])+'</p>').join('')+'</div>'}}
function startQuiz(){quiz={i:0,score:0,items:deck.slice(0,8).sort(()=>Math.random()-.5)};ask()}
function ask(){let c=quiz.items[quiz.i];area.innerHTML='<div class="card"><div class="row"><span class="pill">Question '+(quiz.i+1)+'/8</span><span class="pill">Score '+quiz.score+'</span></div><h3>Which poem does this quote come from?</h3><div class="quote">“'+escape(c.quote)+'”</div><div class="grid">'+[c.poem,...poems.filter(x=>x[0]!==c.poem).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[0])].sort(()=>Math.random()-.5).map(name=>'<button class="answer">'+escape(name)+'</button>').join('')+'</div><div id="quizfeedback"></div></div>';area.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{let ok=b.textContent===c.poem;if(ok)quiz.score++;area.querySelectorAll('.answer').forEach(x=>x.disabled=true);$('quizfeedback').innerHTML='<p class="'+(ok?'right':'wrong')+'">'+(ok?'Correct!':'Not quite — it is '+escape(c.poem))+'. '+escape(c.hook)+'</p><button id="qnext" class="primary">'+(quiz.i===7?'Finish':'Next')+'</button>';$('qnext').onclick=async()=>{quiz.i++;if(quiz.i===8){area.innerHTML='<div class="card"><div class="score">'+quiz.score+'/8</div><h3>Round complete</h3><button id="again" class="primary">Play again</button></div>';$('again').onclick=startQuiz;await supabase.from('study_sessions').insert({user_id:user.id,subject_id:'english-lit',activity:'quick-quiz',score:quiz.score,duration_seconds:0});}else ask()}})}}
async function setupFriends(){$('findfriend').onclick=async()=>{let name=$('friendname').value.trim().toLowerCase();if(!name)return;let r=await supabase.from('profiles').select('id,username').eq('username',name).maybeSingle();if(r.error||!r.data)return say('friendmsg','No matching username found.');if(r.data.id===user.id)return say('friendmsg','That is your own account.');let prior=await supabase.from('friend_requests').select('id,status').eq('sender_id',user.id).eq('receiver_id',r.data.id).maybeSingle();if(prior.data)return say('friendmsg',prior.data.status==='accepted'?'You are already friends.':'A request has already been sent to this user.');let ins=await supabase.from('friend_requests').insert({sender_id:user.id,receiver_id:r.data.id});say('friendmsg',ins.error?(ins.error.code==='23505'?'A request already exists between these accounts.':ins.error.message):'Friend request sent to '+r.data.username+'.')};let r=await supabase.from('friend_requests').select('id,sender_id,status').eq('receiver_id',user.id).eq('status','pending');const ids=(r.data||[]).map(x=>x.sender_id);let profileRows=[];if(ids.length){const pr=await supabase.from('profiles').select('id,username').in('id',ids);profileRows=pr.data||[]}const names=Object.fromEntries(profileRows.map(x=>[x.id,x.username]));$('requests').innerHTML=(r.data||[]).map(x=>'<div class="row"><b>'+escape(names[x.sender_id]||'Student')+'</b><button data-accept="'+x.id+'">Accept</button><button data-decline="'+x.id+'">Decline</button></div>').join('')||'No pending requests.';$('requests').onclick=async e=>{let id=e.target.dataset.accept||e.target.dataset.decline;if(!id)return;await supabase.from('friend_requests').update({status:e.target.dataset.accept?'accepted':'declined'}).eq('id',id);setupFriends()};$('newchallenge').onclick=async()=>{let r=await supabase.from('challenges').insert({creator_id:user.id,title:'Power & Conflict quick revision',subject_id:'english-lit',mode:'quote-race'}).select().single();say('challengemsg',r.error?.message||'Challenge created. Invite a friend from the Friends tab (challenge invites are coming next). ID: '+r.data.id)}}
async function loadScores(){let r=await supabase.from('study_sessions').select('user_id,score,activity,created_at').order('score',{ascending:false}).limit(25);$('scores').innerHTML=r.error?escape(r.error.message):(r.data||[]).map((x,i)=>'<div class="poem">'+(i+1)+'. '+(x.user_id===user.id?'You':'Student')+' — <b>'+x.score+'</b> points · '+escape(x.activity)+'</div>').join('')||'No sessions recorded yet.'}
supabase.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();
</script></body></html>
