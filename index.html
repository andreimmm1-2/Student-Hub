bidity forms; calculate rate using a suitable change per time or 1 ÷ time. In paper chromatography place spots on a pencil baseline above the solvent, mark the solvent front and calculate Rf = distance moved by spot ÷ distance moved by solvent.","RP7 (Chemistry only) and RP8 — Identify ions in unknown salts using flame tests, precipitation reactions and other appropriate qualitative tests; analyse water samples by measuring pH and dissolved solids, then compare purification methods such as filtration, evaporation and distillation."],"terms":["Titre — volume of titrant delivered from a burette.","Concordant titres — repeated titres that closely agree.","End-point — indicator colour change showing the titration is complete.","Inert electrode — electrode that conducts but does not take part in the reaction.","Rf value — distance moved by a spot divided by distance moved by the solvent front."],"prompts":["Why is an excess insoluble base added when preparing a soluble salt?","Why should a titration be repeated to obtain concordant titres?","Which ions move to the cathode during electrolysis?","How can insulation improve a temperature-change experiment?","How can the rate of a reaction be estimated from a gas-volume graph?","Why must the solvent level start below the pencil baseline in chromatography?"],"q":"What is the formula for an Rf value?","a":["distance moved by spot ÷ distance moved by solvent front","spot distance divided by solvent distance"],"exam":"Explain how to prepare a pure, dry sample of copper sulfate crystals from dilute sulfuric acid and excess copper oxide.","mark":"Warm the dilute sulfuric acid gently, add copper oxide in excess while stirring until no more reacts, and filter to remove the unreacted solid. Gently evaporate some water from the filtrate, leave it to crystallise, then separate and dry the crystals.","gapWords":["filter","titration","inert","temperature","turbidity","distillation"],"practical":"Exam evaluation checklist: state exact apparatus and readings; record burette readings to the correct precision; use a control where appropriate; repeat until results agree; calculate means and rates; keep variables controlled; identify why crystals are not heated to dryness and why solvent must remain below the baseline.","multi":{"prompt":"Select every accurate statement about Chemistry practical methods.","options":[["a","A titration can be used to determine reacting volumes.",true],["b","A chromatography Rf value uses the solvent-front distance.",true],["c","A cation gains electrons at the anode.",false],["d","A pure salt is obtained by evaporating every drop of water as quickly as possible.",false]],"explanation":"Titration measures reacting volumes and Rf compares a spot with the solvent front. Cations gain electrons at the cathode; crystallisation is used to obtain crystals without heating to dryness."},"practicalGuides":[{"number":8,"title":"Prepare a soluble salt from an insoluble base","course":"AQA Combined Science: Trilogy","aim":"Make a pure, dry sample of a soluble salt such as copper sulfate.","method":"Warm a measured volume of dilute acid. Add insoluble metal oxide or carbonate in small portions while stirring until some remains unreacted, showing the acid has been used up. Filter to remove excess solid. Gently evaporate some water from the filtrate, allow it to cool and crystallise, then filter and dry the crystals.","variables":"Independent: identity or amount of excess insoluble base when comparing yield. Dependent: mass and appearance of crystals. Controls: acid volume and concentration, heating, stirring and crystallisation time.","analysis":"Record observations and final mass if required. Excess base prevents leftover acid contaminating the salt; filtration removes excess solid; crystallisation produces the salt in solid form.","evaluate":"Do not add base all at once. Evaporate only some water and allow crystallisation; heating to dryness can cause decomposition or loss of crystals.","safety":"Wear eye protection and handle acids, hot glassware and Bunsen burners under supervision. Use a heatproof mat and tongs."},{"number":9,"title":"Electrolysis of aqueous solutions","course":"AQA Combined Science: Trilogy","aim":"Observe products formed when aqueous ionic solutions are electrolysed with inert electrodes.","method":"Place the solution in an electrolysis cell with inert electrodes connected to a low-voltage d.c. supply. Switch on and observe changes at each electrode. Collect gases where appropriate and use suitable tests. Compare different ionic solutions and use the ions present to predict products.","variables":"Independent: identity and concentration of electrolyte. Dependent: products or observations at each electrode. Controls: electrode material and area, voltage, time and solution volume.","analysis":"Positive ions move to the negative cathode and gain electrons; negative ions move to the positive anode and lose electrons. In aqueous solutions, hydrogen or oxygen may form instead of a metal or halogen depending on competing ions.","evaluate":"Clean electrodes between tests, use similar conditions and record both electrodes separately. Distinguish observations from inferences about products.","safety":"Use low voltage and small quantities. Some products may be hazardous; do not smell gases directly and use teacher-approved solutions and tests."},{"number":10,"title":"Temperature changes in reacting solutions","course":"AQA Combined Science: Trilogy","aim":"Investigate how reactant identity or concentration affects temperature change.","method":"Measure a fixed volume into an insulated polystyrene cup and record initial temperature. Add a measured amount of the second reactant, stir consistently and record the highest or lowest temperature reached. Repeat with one factor changed at a time, keeping total volume and starting temperature controlled.","variables":"Independent: one factor such as concentration or reactant identity. Dependent: maximum temperature change. Controls: reactant volumes, starting temperature, cup and lid, stirring and measurement interval.","analysis":"Temperature change = maximum or minimum temperature − initial temperature. A rise indicates an exothermic change; a fall indicates an endothermic change. Plot temperature change against the independent variable.","evaluate":"Use an insulated cup with a lid, record temperatures frequently and repeat. Heat loss reduces the measured temperature change; keep the thermometer from touching the base.","safety":"Wear eye protection and handle acids and alkalis carefully. Use small volumes to reduce splashing."},{"number":11,"title":"Rate of reaction: gas production and turbidity","course":"AQA Combined Science: Trilogy","aim":"Investigate how concentration changes reaction rate using two measurement methods.","method":"Method A: react measured acid with a fixed mass and surface area of solid in a flask connected to a gas syringe; record gas volume at regular intervals. Method B: mix sodium thiosulfate and acid over a marked cross; record time until the cross is obscured. Change concentration systematically.","variables":"Independent: reactant concentration. Dependent: gas volume per time or time for the cross to disappear. Controls: temperature, total volume, apparatus, reactant amount and observation conditions.","analysis":"Plot gas volume against time; gradient represents rate at a point. For the cross method, use 1 ÷ time as a rate estimate. Compare initial rates and state limitations of visual judgement.","evaluate":"Use gas-tight apparatus, start timing consistently and repeat. Keep lighting, viewing position and cross design the same; a colorimeter is more objective if available.","safety":"Wear eye protection and use small quantities. Acidifying thiosulfate can release sulfur dioxide; work in good ventilation and follow risk controls."},{"number":12,"title":"Paper chromatography and Rf values","course":"AQA Combined Science: Trilogy","aim":"Separate coloured substances and compare them with known samples.","method":"Draw a pencil baseline near the bottom of chromatography paper. Apply small concentrated spots and let them dry. Stand the paper in solvent with baseline above solvent level. Allow solvent to rise, remove before it reaches the top, mark solvent front immediately and dry the chromatogram.","variables":"Independent: sample composition or solvent system. Dependent: spot positions and Rf values. Controls: paper type, solvent depth, spot size, baseline position and run time.","analysis":"Rf = distance travelled by centre of spot ÷ distance travelled by solvent front. Compare Rf values only under the same conditions. A pure substance usually gives one spot in a suitable solvent.","evaluate":"Use pencil rather than ink, keep spots small and concentrated, and repeat if spots overlap. A second solvent can help separate substances that travelled together.","safety":"Use solvents in good ventilation and away from flames. Avoid skin contact and dispose of solvent as instructed."},{"number":13,"title":"Water analysis and purification","course":"AQA Combined Science: Trilogy","aim":"Compare water samples and investigate ways to obtain cleaner water.","method":"Collect representative samples. Measure pH and dissolved solids with suitable equipment and record visible suspended material. Filter to remove insoluble particles. For distillation, heat the sample, pass vapour through a condenser and collect the condensed liquid; compare the product with the original sample.","variables":"Independent: source or treatment method. Dependent: pH, dissolved solids or visible residue. Controls: sample volume, apparatus, measurement method and temperature where relevant.","analysis":"Record results in a comparison table. Filtration removes suspended solids but not dissolved salts; distillation separates water from many dissolved substances because water evaporates and condenses separately.","evaluate":"Repeat measurements, clean probes between samples and avoid cross-contamination. Compare like-for-like sample volumes; potable water is safe to drink but not chemically pure.","safety":"Wear eye protection and handle hot glassware carefully. Never taste laboratory water samples."}]}]},"physics":{"title":"Physics","topics":[{"id":"energy","title":"Energy","tag":"Combined & Triple","summary":"Energy stores, pathways, conservation, efficiency, heating and energy resources.","notes":["Energy is stored in chemical, kinetic, thermal, gravitational potential, elastic potential, magnetic, electrostatic and nuclear stores. A system is an object or group of objects being studied.","Energy is transferred between stores by heating, mechanical work, electrical work or radiation. The total energy is conserved: it cannot be created or destroyed, only transferred.","Gravitational potential energy change = mass × gravitational field strength × change in height. Kinetic energy = ½ × mass × speed². Elastic potential energy stored by a stretched spring depends on its extension.","Power is the rate of energy transfer or work done: power = energy transferred ÷ time. One watt is one joule per second. Work done by a force = force × distance moved in the direction of the force.","Efficiency = useful energy transferred ÷ total energy supplied × 100%, or useful power output ÷ total power input × 100%. Dissipated energy spreads into less useful stores, often heating the surroundings.","Insulation reduces unwanted energy transfer by conduction, convection or radiation. Lubrication reduces friction. Renewable resources are replenished; fossil fuels and nuclear fuels are finite and have different reliability and environmental impacts.","Energy is stored in chemical, kinetic, thermal, gravitational potential, elastic potential, magnetic, electrostatic and nuclear stores. Transfers occur by heating, mechanical work, electrical work or radiation. The total energy of a closed system is conserved.","Power is the rate of energy transfer or work done: power = energy transferred ÷ time. One watt is one joule per second. A more powerful device transfers energy more quickly, but that does not automatically mean it is more efficient.","Insulation reduces unwanted energy transfer by conduction, convection and radiation. Loft insulation, cavity-wall insulation and double glazing reduce heating costs by reducing transfer to the surroundings; the best method depends on cost, installation and expected savings."],"terms":["Conservation of energy — total energy is not created or destroyed.","Dissipation — energy spreads into less useful stores, usually heating surroundings.","Power — rate of energy transfer or work done.","Efficiency — useful output as a proportion of total input.","Renewable resource — resource replenished on a human timescale.","Power — rate of energy transfer or work done.","Specific heat capacity — energy needed to raise 1 kg by 1°C.","Dissipation — spreading energy into less useful stores, often the thermal store of surroundings."],"prompts":["Name the main energy stores and transfer pathways.","How do gravitational potential and kinetic energy depend on mass, height and speed?","How is power calculated?","Why is energy conserved even when a device wastes energy?","Name the energy stores before and after a moving object is brought to rest.","A motor transfers 600 J in 20 s. Calculate its power.","How do insulation methods reduce energy transfer from a house?"],"q":"A device transfers 40 J usefully from 100 J supplied. What is its efficiency?","a":["40%"],"exam":"Explain why a phone charger becomes warm while charging and how its efficiency could be improved.","mark":"Some energy is dissipated to the thermal store of the charger and surroundings, for example due to electrical resistance. Better circuit design and reduced resistance can reduce unwanted heating; useful output as a fraction of total input then increases.","gapWords":["chemical","heating","kinetic","power","efficiency","renewable"],"practical":"Required practical focus: determine the specific heat capacity of a material by supplying measured energy with an immersion heater and measuring temperature rise. Use E = power × time, measure mass and temperature carefully, insulate the block and discuss energy losses.","commonMistakes":["Energy is not destroyed when it is dissipated; it is transferred to less useful stores.","Power is energy transferred per second, not the total energy transferred.","Efficiency is useful output divided by total input, multiplied by 100 if expressed as a percentage."],"examQuestions":[{"question":"A motor transfers 600 J of energy in 20 s. Calculate its power and state the unit.","marks":"Power = energy ÷ time = 600 ÷ 20 = 30 W. One watt is one joule per second."}],"workedExamples":[{"title":"Power from energy and time","question":"A motor transfers 600 J in 20 s. Calculate its power.","steps":["Power = energy transferred ÷ time.","P = 600 ÷ 20.","P = 30."],"answer":"30 W","note":"One watt is one joule per second."}]},{"id":"electricity","title":"Electricity","tag":"Combined & Triple","summary":"Current, charge, potential difference, resistance, series and parallel circuits, power and mains safety.","notes":["Electric current is the rate of flow of electric charge: charge transferred = current × time. Current is measured in amperes; conventional current direction is from positive to negative in the external circuit.","Potential difference is energy transferred per unit charge: energy transferred = charge × potential difference. It is measured in volts and is measured across a component with a voltmeter connected in parallel.","Resistance = potential difference ÷ current, so V = I × R. In an ohmic conductor at constant temperature, current is directly proportional to potential difference; a filament lamp's resistance rises as its filament heats.","In a series circuit, current is the same through all components, potential differences add to the supply and total resistance is the sum of component resistances. Adding resistors increases total resistance.","In a parallel circuit, each branch has the same potential difference as the supply. Current splits between branches; total current equals the sum of branch currents. Adding a branch usually reduces total resistance.","Electrical power = potential difference × current; also power = current² × resistance. Mains electricity is alternating current. Live wire is dangerous; the earth wire provides a low-resistance safety path and the fuse breaks the circuit if current is too high.","Charge is conserved in a circuit. In a series circuit, current is the same at every point and potential differences across components add to the supply. In a parallel circuit, potential difference is the same across each branch and current splits between branches.","Resistance depends on the component and conditions. For a fixed resistor at constant temperature, current is directly proportional to potential difference. A filament lamp's resistance rises as its filament heats; a diode allows current mainly in one direction.","Electrical power can be calculated using P = V I, and energy transferred using E = P t or E = Q V. The National Grid uses high potential difference to transmit power so current is lower for a given power, reducing heating losses in cables."],"terms":["Current — rate of flow of electric charge.","Potential difference — energy transferred per unit charge.","Resistance — opposition to current flow.","Series circuit — components connected in one loop.","Parallel circuit — components connected on separate branches across the same supply.","Charge — electrical property measured in coulombs.","Ohmic conductor — conductor with current directly proportional to potential difference at constant temperature.","National Grid — network that transfers electricity from power stations to consumers."],"prompts":["How are charge, current and time related?","What does potential difference measure?","Compare current and potential difference in series and parallel circuits.","How do you calculate resistance and electrical power?","Compare current and potential difference in series and parallel circuits.","Why does the resistance of a filament lamp increase as it gets hotter?","Explain why electricity is transmitted at high potential difference through the National Grid."],"q":"A 6 V lamp has a current of 2 A. What is its resistance?","a":["3 ohms","3 Ω"],"exam":"Compare current and potential difference in series and parallel circuits.","mark":"In series, current is the same at every point and potential difference is shared between components. In parallel, potential difference is the same across each branch and current divides between branches; the branch currents add to the total.","gapWords":["charge","volts","resistance","series","parallel","alternating"],"practical":"Required practical focus: investigate current-voltage characteristics for a resistor, filament lamp and diode. Connect an ammeter in series and voltmeter in parallel, vary the potential difference, record current and voltage, reverse polarity where appropriate and plot I–V graphs.","commonMistakes":["An ammeter is connected in series; a voltmeter is connected in parallel.","Potential difference is measured in volts, current in amperes and resistance in ohms.","In a parallel circuit, current is shared between branches; potential difference is the same across each branch."],"examQuestions":[{"question":"A 12 V lamp draws a current of 0.50 A. Calculate its power and the energy transferred in 60 s.","marks":"Power = V × I = 12 × 0.50 = 6 W. Energy = P × t = 6 × 60 = 360 J. Include units for both quantities."}],"workedExamples":[{"title":"Electrical power and energy","question":"A 12 V lamp draws 0.50 A for 60 s. Calculate power and energy transferred.","steps":["Power = potential difference × current.","P = 12 × 0.50 = 6 W.","Energy = power × time = 6 × 60."],"answer":"6 W and 360 J","note":"Show both stages and include units."}]},{"id":"particle-model","title":"Particle model of matter","tag":"Combined & Triple","summary":"Density, states of matter, changes of state, internal energy and specific heat capacity.","notes":["Solids contain particles close together in a regular arrangement; they vibrate about fixed positions. Liquids have particles close together but able to move past one another. Gases have particles far apart moving randomly.","The particle model explains density: density = mass ÷ volume. For a fixed mass, a larger volume gives a lower density. Use consistent units, such as kg/m³ or g/cm³.","Changes of state include melting, freezing, boiling, evaporation, condensation and sublimation. They are physical changes: the substance remains the same and mass is conserved.","Internal energy is the total kinetic and potential energy of particles in a system. Heating can increase particle kinetic energy and temperature, or increase potential energy during a change of state.","Specific heat capacity is the energy needed to raise the temperature of 1 kg of a substance by 1°C. Energy transferred = mass × specific heat capacity × temperature change.","During a change of state, temperature can remain constant while energy is transferred because energy changes particle potential energy by overcoming or forming intermolecular attractions. Evaporation can occur below boiling point at the surface.","Density is mass divided by volume. Measure mass using a balance and volume from dimensions for regular objects or water displacement for irregular solids. Convert units consistently; 1 cm³ = 1 × 10⁻⁶ m³.","During a change of state, energy changes the arrangement or separation of particles rather than their average kinetic energy. Temperature stays constant during melting or boiling of a pure substance while energy is transferred as latent heat.","Gas pressure is caused by particles colliding with the walls of a container. Increasing temperature at constant volume increases average kinetic energy and makes collisions more frequent and forceful, raising pressure. Compressing a gas increases collision frequency per unit area."],"terms":["Density — mass per unit volume.","Internal energy — total kinetic and potential energy of particles in a system.","Specific heat capacity — energy needed to raise 1 kg by 1°C.","Evaporation — change from liquid to gas at the surface.","Latent heat — energy transferred during a change of state without temperature change.","Density — mass per unit volume.","Specific latent heat — energy needed to change the state of 1 kg without changing temperature.","Internal energy — total kinetic and potential energy of the particles in a system."],"prompts":["Describe particle arrangements in solids, liquids and gases.","How do you calculate density?","What happens to internal energy during heating and a change of state?","Why can temperature remain constant during boiling?","A block has a mass of 240 g and a volume of 80 cm³. Calculate its density.","Why does temperature remain constant while a pure substance boils?","Use particle collisions to explain why gas pressure rises when temperature increases at constant volume."],"q":"What is the equation linking density, mass and volume?","a":["density = mass ÷ volume","mass divided by volume","ρ = m/v"],"exam":"Explain, using the particle model, why a gas can be compressed much more easily than a liquid.","mark":"Gas particles are widely spaced with large gaps between them, so applying pressure can bring particles closer together. Liquid particles are already close together, leaving little space to reduce.","gapWords":["vibrate","density","condensation","kinetic","specific heat capacity","evaporation"],"practical":"Required practical focus: determine the density of regular and irregular solids and liquids. Measure mass with a balance; find regular volume from dimensions, irregular volume by displacement, and liquid volume with a measuring cylinder. Repeat measurements and use suitable units.","multi":{"prompt":"Select every accurate statement about the particle model.","options":[["a","Gas particles are widely spaced and move randomly.",true],["b","Density is mass divided by volume.",true],["c","Boiling creates a new chemical substance.",false],["d","Particles stop moving when a liquid freezes.",false]],"explanation":"Gas particles are far apart and density = mass ÷ volume. Boiling and freezing are physical changes; particles continue moving or vibrating."},"commonMistakes":["During a change of state, temperature can remain constant even though energy is transferred.","Density = mass ÷ volume, not volume ÷ mass.","Gas pressure is caused by particle collisions with container walls, not by particles pushing each other apart."],"examQuestions":[{"question":"A gas is heated in a sealed rigid container. Explain why its pressure increases.","marks":"The gas particles gain average kinetic energy and move faster. They collide with the container walls more frequently and each collision produces a greater change in momentum, so the force on the walls per unit area increases."}],"workedExamples":[{"title":"Density from mass and volume","question":"An object has mass 240 g and volume 80 cm³. Calculate density.","steps":["Density = mass ÷ volume.","ρ = 240 ÷ 80."],"answer":"3.0 g/cm³","note":"Convert units first if the question asks for kg/m³."}]},{"id":"atomic-physics","title":"Atomic structure","tag":"Combined & Triple","summary":"Nuclear atoms, isotopes, radioactive decay, half-life, contamination and irradiation.","notes":["An atom has a tiny nucleus containing protons and neutrons, with electrons around it. Isotopes have the same number of protons but different numbers of neutrons; some nuclei are unstable and radioactive.","Radioactive decay is random: it is impossible to predict exactly when one particular unstable nucleus will decay. For a large sample, the overall rate of decay is predictable and measured by activity in becquerels.","Alpha radiation is a helium nucleus: it is strongly ionising but weakly penetrating and stopped by paper or skin. Beta radiation is an electron: moderately ionising and stopped by thin aluminium. Gamma is electromagnetic radiation: weakly ionising and highly penetrating.","Half-life is the time taken for the number of undecayed nuclei or activity in a sample to halve. After each half-life, half of the remaining radioactive nuclei are left; the pattern is exponential rather than a fixed amount lost each time.","Contamination occurs when radioactive material gets onto or inside an object or person. Irradiation is exposure to radiation from an external source; the source does not become part of the exposed object.","Ionising radiation can damage cells and DNA, increasing cancer risk. Risk depends on activity, radiation type, exposure time and distance or shielding. Uses include medical tracers, radiotherapy, sterilisation and thickness monitoring.","Alpha radiation is a helium nucleus, beta radiation is a fast electron emitted from the nucleus, and gamma radiation is electromagnetic radiation. Alpha is strongly ionising but weakly penetrating; gamma is weakly ionising but highly penetrating; beta is intermediate.","Half-life is the time taken for the number of undecayed nuclei or activity of a radioactive sample to halve. It is random which nucleus decays, so the decay of a large sample follows a predictable statistical pattern but individual decays cannot be predicted.","Irradiation means exposing an object to radiation; contamination means radioactive material is on or inside an object. Contamination can continue to emit radiation until the material is removed or decays. Risk depends on activity, radiation type, exposure time and distance."],"terms":["Isotope — atoms with the same proton number but different neutron numbers.","Radioactive decay — spontaneous change of an unstable nucleus, emitting radiation.","Activity — number of nuclear decays per second, measured in becquerels.","Half-life — time for activity or undecayed nuclei to halve.","Irradiation — exposure to radiation from an external source.","Half-life — time for activity or undecayed nuclei to fall to half the value.","Irradiation — exposure of an object to radiation from a source.","Contamination — unwanted radioactive material on or inside an object."],"prompts":["Compare alpha, beta and gamma radiation.","Why is radioactive decay described as random?","How does half-life affect activity over time?","Distinguish contamination from irradiation.","Compare the ionising and penetrating abilities of alpha, beta and gamma radiation.","A sample's activity falls from 800 Bq to 100 Bq. How many half-lives have passed?","Distinguish irradiation from contamination."],"q":"Which type of nuclear radiation is a helium nucleus?","a":["alpha","alpha radiation"],"exam":"Explain why alpha radiation is highly ionising but not very penetrating.","mark":"An alpha particle is relatively large and carries a +2 charge, so it interacts strongly with atoms and causes frequent ionisation. It loses energy quickly and is stopped by a short distance of air or a sheet of paper.","gapWords":["isotopes","random","penetrating","half-life","contamination","sterilisation"],"practical":"Practical and safety focus: use background-corrected count rates when interpreting radiation data. Keep source-detector distance and counting time constant, measure background radiation, use suitable shielding and never handle a radioactive source directly.","multi":{"prompt":"Select every accurate statement about nuclear radiation.","options":[["a","An alpha particle contains two protons and two neutrons.",true],["b","Decay of an individual unstable nucleus is random.",true],["c","Gamma radiation is a stream of helium nuclei.",false],["d","Irradiation means radioactive material has entered the body.",false]],"explanation":"An alpha particle is a helium nucleus, and individual decay is random. Gamma is electromagnetic radiation; radioactive material entering the body is contamination."},"commonMistakes":["Half-life does not mean every nucleus decays after the same fixed time.","Alpha is the most ionising but least penetrating of the three common nuclear radiations.","Irradiation does not automatically make an object radioactive; contamination involves radioactive material being transferred."],"examQuestions":[{"question":"A radioactive sample has an activity of 800 Bq and a half-life of 6 hours. Calculate its activity after 18 hours.","marks":"18 ÷ 6 = 3 half-lives. 800 → 400 → 200 → 100 Bq, so the activity is 100 Bq."}],"workedExamples":[{"title":"Radioactive half-life","question":"A sample has activity 800 Bq and half-life 6 hours. Find activity after 18 hours.","steps":["Number of half-lives = 18 ÷ 6 = 3.","Halve the activity three times: 800 → 400 → 200 → 100."],"answer":"100 Bq","note":"Half-life is a statistical property; individual nuclei decay randomly."}]},{"id":"forces","title":"Forces","tag":"Combined & Triple","summary":"Contact and non-contact forces, resultant force, motion graphs, Newton's laws, momentum and pressure.","notes":["Forces are pushes or pulls measured in newtons. Contact forces include friction, air resistance, tension and normal contact; non-contact forces include gravitational, magnetic and electrostatic forces.","A resultant force is the overall force after combining all forces with direction considered. Balanced forces give zero resultant force and no change in velocity; an unbalanced force changes speed, direction or both.","Work done = force × distance moved in the direction of the force. A force can transfer energy to or from an object; friction often transfers mechanical energy to thermal stores.","Speed = distance ÷ time. Acceleration = change in velocity ÷ time. On a distance-time graph, gradient is speed; on a velocity-time graph, gradient is acceleration and area under the graph is displacement.","Newton's second law links resultant force, mass and acceleration: F = m × a. Weight = mass × gravitational field strength. Mass is measured in kg and is constant; weight is a force measured in N.","Momentum = mass × velocity. In a closed system, total momentum before an interaction equals total momentum after. Stopping distance is thinking distance plus braking distance; speed, tiredness, drugs, weather and tyre or brake condition affect it.","Velocity is speed in a specified direction. Acceleration is the rate of change of velocity: acceleration = change in velocity ÷ time. A resultant force causes acceleration; if the resultant force is zero, an object remains at rest or continues at constant velocity.","Newton's second law links resultant force, mass and acceleration: F = m a. For a fixed mass, doubling the resultant force doubles acceleration; for a fixed force, doubling mass halves acceleration. Weight is the gravitational force on a mass: W = m g.","Stopping distance is thinking distance plus braking distance. Thinking distance depends on reaction time and can increase with tiredness, alcohol or drugs; braking distance depends on speed, vehicle condition, road surface, tyres and weather. At higher speeds, kinetic energy rises with the square of speed."],"terms":["Resultant force — single force with the same effect as all forces combined.","Velocity — speed in a specified direction.","Acceleration — rate of change of velocity.","Weight — gravitational force acting on a mass.","Momentum — mass multiplied by velocity.","Velocity — speed in a specified direction.","Acceleration — rate of change of velocity.","Moment — turning effect of a force about a pivot."],"prompts":["What happens to velocity when resultant force is zero?","How do you interpret gradients on distance-time and velocity-time graphs?","How are force, mass and acceleration related?","Why does stopping distance increase with speed?","How does a resultant force affect the motion of an object?","Explain why doubling speed more than doubles braking distance.","Calculate the weight of a 60 kg person using g = 9.8 N/kg."],"q":"What is the equation linking resultant force, mass and acceleration?","a":["force = mass × acceleration","f = ma","F = m × a"],"exam":"Explain why a car's braking distance increases when its speed increases.","mark":"At higher speed the car has more kinetic energy, which must be dissipated by the brakes. A greater braking force or longer time and distance are needed to transfer this energy; wet or icy roads reduce friction and increase braking distance.","gapWords":["friction","resultant","work","acceleration","weight","momentum"],"practical":"Required practical focus: investigate the relationship between force and extension for a spring. Add masses in steps, measure extension from the original length, repeat readings, plot force against extension and identify the limit of proportionality. Do not exceed the elastic limit.","multi":{"prompt":"Select every accurate statement about forces and motion.","options":[["a","A resultant force of zero means no acceleration.",true],["b","Momentum is mass multiplied by velocity.",true],["c","Mass is an object's gravitational force.",false],["d","A velocity-time graph's gradient gives distance travelled.",false]],"explanation":"Zero resultant force means constant velocity, and momentum = mass × velocity. Mass is not weight; a velocity-time graph's gradient is acceleration."},"commonMistakes":["Mass is measured in kilograms; weight is a force measured in newtons.","Zero resultant force means constant velocity, not necessarily stationary.","Braking distance is affected by speed and road conditions; thinking distance depends on reaction time."],"examQuestions":[{"question":"A resultant force of 18 N acts on a trolley of mass 6 kg. Calculate its acceleration and explain the direction.","marks":"a = F ÷ m = 18 ÷ 6 = 3 m/s². Acceleration is in the direction of the resultant force."}],"workedExamples":[{"title":"Resultant force and acceleration","question":"A resultant force of 24 N acts on an 8 kg trolley. Calculate acceleration.","steps":["Use F = m × a.","Rearrange: a = F ÷ m.","a = 24 ÷ 8."],"answer":"3 m/s²","note":"Acceleration is in the direction of the resultant force."}]},{"id":"waves","title":"Waves","tag":"Combined & Triple","summary":"Transverse and longitudinal waves, wave speed, reflection, refraction, sound and electromagnetic spectrum.","notes":["Waves transfer energy and information without transferring matter overall. Transverse waves oscillate perpendicular to the direction of travel; longitudinal waves oscillate parallel to it and contain compressions and rarefactions.","Amplitude is the maximum displacement from the undisturbed position; wavelength is the distance between equivalent points on adjacent waves; frequency is the number of waves passing a point each second.","Wave speed = frequency × wavelength. Frequency is measured in hertz and wavelength in metres, giving wave speed in metres per second. Period is the time for one complete wave and equals 1 ÷ frequency.","Reflection occurs when a wave bounces off a boundary; angle of incidence equals angle of reflection. Refraction occurs when wave speed changes at a boundary, causing a change in direction unless the wave enters along the normal.","Sound waves are longitudinal and need a medium; they cannot travel through a vacuum. The human hearing range is approximately 20 Hz to 20,000 Hz. Ultrasound has frequency above this range and can be used for imaging and cleaning.","Electromagnetic waves are transverse and all travel at the same speed in a vacuum. The spectrum from longest wavelength to shortest is radio, microwave, infrared, visible, ultraviolet, X-ray and gamma; frequency and energy increase along this sequence.","Transverse waves oscillate perpendicular to the direction of energy transfer; longitudinal waves oscillate parallel to it. Electromagnetic waves are transverse and can travel through a vacuum, whereas sound waves are longitudinal and require a medium.","Wave speed, frequency and wavelength are linked by v = f λ. Frequency is measured in hertz and wavelength in metres, giving wave speed in metres per second. When a wave enters a different medium, its speed and wavelength may change while frequency remains constant.","Refraction occurs when a wave changes speed as it crosses a boundary at an angle, causing its direction to change. Waves travelling into a slower region bend towards the normal; into a faster region they bend away from the normal. Reflection obeys angle of incidence = angle of reflection."],"terms":["Transverse wave — oscillations perpendicular to direction of energy transfer.","Longitudinal wave — oscillations parallel to direction of energy transfer.","Wavelength — distance between equivalent points on adjacent waves.","Frequency — number of complete waves passing a point per second.","Refraction — change in direction caused by a change in wave speed.","Transverse wave — oscillations perpendicular to the direction of energy transfer.","Longitudinal wave — oscillations parallel to the direction of energy transfer.","Refraction — change in direction caused by a change in wave speed."],"prompts":["Compare transverse and longitudinal waves.","How are wave speed, frequency and wavelength related?","Why does refraction happen at a boundary?","Put electromagnetic waves in order of increasing frequency.","Compare transverse and longitudinal waves using the direction of oscillation.","A wave has frequency 50 Hz and wavelength 0.8 m. Calculate its speed.","Why does a wave change direction when it enters a different medium at an angle?"],"q":"Which equation links wave speed, frequency and wavelength?","a":["wave speed = frequency × wavelength","v = f × λ","frequency times wavelength"],"exam":"Explain why a light wave changes direction when it enters glass from air at an angle.","mark":"Light travels more slowly in glass than in air. The side of the wavefront entering glass first slows first, so the wavefront pivots and the direction changes towards the normal.","gapWords":["perpendicular","frequency","wavelength","reflection","ultrasound","ultraviolet"],"practical":"Required practical focus: investigate reflection and refraction using light rays, a plane mirror or glass block. Draw a normal at the point of incidence, measure angles from the normal with a protractor and repeat. For ripple tanks, vary frequency and measure wavelength.","multi":{"prompt":"Select every accurate statement about waves.","options":[["a","Waves transfer energy without overall transfer of matter.",true],["b","Sound waves in air are longitudinal.",true],["c","Electromagnetic waves need a medium in a vacuum.",false],["d","Wavelength is measured in hertz.",false]],"explanation":"Waves transfer energy and sound in air is longitudinal. Electromagnetic waves travel through a vacuum; wavelength is measured in metres."},"commonMistakes":["Frequency is measured in hertz, wavelength in metres and wave speed in m/s.","Waves transfer energy, not the medium as a whole over long distances.","When a wave changes medium, its frequency remains constant; speed and wavelength may change."],"examQuestions":[{"question":"A water wave has a frequency of 50 Hz and a wavelength of 0.8 m. Calculate its speed.","marks":"Wave speed = frequency × wavelength = 50 × 0.8 = 40 m/s. Use metres for wavelength and include m/s."}],"workedExamples":[{"title":"Wave speed","question":"A wave has frequency 50 Hz and wavelength 0.80 m. Calculate speed.","steps":["Use wave speed = frequency × wavelength.","v = 50 × 0.80."],"answer":"40 m/s","note":"Convert wavelength to metres before substituting."}]},{"id":"magnetism","title":"Magnetism and electromagnetism","tag":"Combined & Triple","summary":"Magnetic fields, electromagnets, motor effect, induction and transformers.","notes":["Magnets have north and south poles. Like poles repel and unlike poles attract. Magnetic materials include iron, steel, nickel and cobalt; a magnetic field is the region where a magnetic material or magnet experiences a force.","Field lines show the direction a north pole would move. Outside a bar magnet, field lines go from north to south; closer lines indicate a stronger field. The Earth's magnetic field helps explain compass direction.","A current-carrying wire produces a magnetic field around it. Wrapping the wire into a coil makes the fields add; placing an iron core inside produces a stronger electromagnet. Strength increases with current and number of turns.","A current-carrying conductor in a magnetic field experiences a force if the current is not parallel to the field. This motor effect is used in electric motors and loudspeakers; force increases with current and magnetic field strength.","Electromagnetic induction occurs when a conductor cuts magnetic field lines or the magnetic field through a coil changes. The induced potential difference increases if the magnet or coil moves faster or the magnetic field is stronger.","A transformer changes alternating potential difference using two coils wound around an iron core. A changing current in the primary creates a changing magnetic field, inducing a potential difference in the secondary; step-up transformers increase voltage and step-down transformers reduce it.","Magnetic field lines show the direction a north pole would move; outside a bar magnet they run from north to south. Lines closer together indicate a stronger field. Like poles repel and unlike poles attract.","An electric current creates a magnetic field around a conductor. A coil produces a stronger, more uniform field; inserting a soft iron core makes an electromagnet stronger. Field strength can be increased by increasing current or the number of turns.","The motor effect occurs when a current-carrying conductor is placed in a magnetic field and experiences a force. Reversing the current or magnetic field reverses the force. A motor uses this effect to transfer electrical energy into kinetic energy."],"terms":["Magnetic field — region where a magnetic material or moving charge experiences a magnetic force.","Electromagnet — magnet produced by an electric current.","Motor effect — force on a current-carrying conductor in a magnetic field.","Electromagnetic induction — production of potential difference by a changing magnetic field.","Transformer — device that changes alternating potential difference by electromagnetic induction.","Electromagnet — magnet produced by an electric current, often using a coil and iron core.","Motor effect — force on a current-carrying conductor in a magnetic field.","Induction — production of a potential difference when magnetic flux linkage changes."],"prompts":["How do magnetic field lines show field direction and strength?","How can you make an electromagnet stronger?","What is the motor effect?","How can a changing magnetic field induce a potential difference?","How can the strength of an electromagnet be increased?","What happens to the force direction if current is reversed in a motor effect setup?","Explain how a generator can produce an alternating potential difference."],"q":"What happens between two north poles brought close together?","a":["they repel","repel"],"exam":"Explain how a transformer induces a potential difference in its secondary coil.","mark":"Alternating current in the primary coil creates a changing magnetic field in the iron core. This changing field passes through the secondary coil and induces an alternating potential difference across it.","gapWords":["repel","field","electromagnet","motor","induction","transformer"],"practical":"Practical focus: investigate how the strength of an electromagnet changes with current or number of coil turns. Use the same core and a consistent method of measuring strength, such as the number of paper clips lifted; vary one factor at a time.","multi":{"prompt":"Select every accurate statement about electromagnetism.","options":[["a","Like magnetic poles repel.",true],["b","A changing magnetic field can induce a potential difference.",true],["c","A transformer requires steady direct current.",false],["d","Increasing coil turns always weakens an electromagnet.",false]],"explanation":"Like poles repel and changing magnetic flux induces a potential difference. Transformers need changing fields; more turns can strengthen an electromagnet."},"commonMistakes":["A magnetic field exists around a permanent magnet or current-carrying wire; it does not require contact.","Reversing current or field reverses the motor-effect force.","A transformer requires a changing magnetic field and therefore alternating current in the primary coil."],"examQuestions":[{"question":"Explain how a simple electric motor produces a turning effect.","marks":"Current flows through a coil in a magnetic field; opposite sides of the coil experience forces in opposite directions; these forces form a couple and turn the coil. A split-ring commutator reverses current every half-turn so the turning effect remains in the same rotational direction."}],"workedExamples":[{"title":"Transformer turns ratio","question":"An ideal transformer has 1,000 primary turns and 200 secondary turns. Primary voltage is 230 V. Find secondary voltage.","steps":["Vs ÷ Vp = Ns ÷ Np.","Vs = 230 × (200 ÷ 1,000).","Vs = 230 × 0.2."],"answer":"46 V","note":"The secondary has fewer turns, so this is a step-down transformer."}]},{"id":"space-physics","title":"Space physics","tag":"Separate Science only","summary":"Solar system, satellites, life cycle of stars, red-shift and the expanding Universe.","notes":["The Solar System contains the Sun, eight planets and smaller bodies such as dwarf planets, moons, asteroids and comets. The Sun's gravity keeps planets and other orbiting bodies in their paths.","Planets orbit the Sun in approximately elliptical paths. A satellite is an object in orbit around a larger body; natural satellites include moons and artificial satellites are placed in orbit for communication, navigation, observation and research.","Stars form when gravity pulls gas and dust in a nebula together. As the material contracts, gravitational potential energy is transferred to thermal energy; when the core becomes hot and dense enough, nuclear fusion begins.","During the main sequence, hydrogen nuclei fuse to form helium, releasing energy. The outward pressure from hot gas and radiation balances the inward pull of gravity, creating a stable star.","When a Sun-like star runs out of hydrogen in its core, it expands into a red giant, sheds outer layers as a planetary nebula and leaves a white dwarf. A much more massive star can become a red supergiant, then explode as a supernova.","Light from distant galaxies is red-shifted: wavelengths are stretched towards the red end of the spectrum. More distant galaxies generally show greater red-shift, evidence that the Universe is expanding; this supports the Big Bang model."],"terms":["Nebula — cloud of gas and dust where stars can form.","Main sequence — long stable stage when a star fuses hydrogen into helium.","Red giant — expanded late stage of a Sun-like star.","Supernova — powerful explosion at the end of a massive star's life.","Red-shift — increase in wavelength of light from a receding source."],"prompts":["How does gravity cause a star to form from a nebula?","What balances gravity during the main sequence?","Compare the later life cycles of Sun-like and massive stars.","How does red-shift provide evidence that the Universe is expanding?"],"q":"What process releases energy in a main-sequence star?","a":["nuclear fusion","fusion"],"exam":"Explain how observations of red-shift support the idea that the Universe is expanding.","mark":"Light from distant galaxies is shifted towards longer, redder wavelengths, showing that the galaxies are moving away. More distant galaxies tend to have greater red-shift, indicating that space is expanding.","gapWords":["gravity","satellite","fusion","main sequence","supernova","red-shift"],"practical":"Separate Science focus: interpret spectra and red-shift evidence. Compare the observed spectral lines from distant galaxies with reference lines from elements measured in a laboratory; explain why a shift towards longer wavelengths indicates recession.","multi":{"prompt":"Select every accurate statement about space physics.","options":[["a","A main-sequence star fuses hydrogen into helium.",true],["b","Red-shift is an increase in wavelength.",true],["c","A Sun-like star normally ends in a supernova.",false],["d","Distant galaxies are generally blue-shifted because the Universe contracts.",false]],"explanation":"Main-sequence stars fuse hydrogen and red-shift means wavelength increases. A Sun-like star becomes a red giant then a white dwarf; distant galaxies are generally red-shifted."}},{"id":"physics-key-ideas","title":"Physics key ideas and scientific thinking","tag":"Cross-topic key ideas","summary":"Use models, cause and effect, fields, proportionality and equations to explain physical systems.","notes":["Physics uses models to represent systems that cannot always be observed directly. Particle models explain states and pressure; wave models explain energy transfer; circuit models describe current and potential difference.","Cause and effect links physical changes. A resultant force changes velocity; a potential difference drives charge through a circuit; a temperature difference transfers energy by heating; a changing magnetic field can induce a potential difference.","Fields explain action at a distance. Gravitational, magnetic and electric fields describe how objects can experience forces without touching; field diagrams show direction and relative strength.","Many physical relationships involve proportionality. For example, weight is proportional to mass in a uniform gravitational field, and current is proportional to potential difference for an ohmic conductor at constant temperature.","Physical laws are expressed mathematically. Rearrange equations before substituting values, convert units consistently, show working, give a sensible number of significant figures and include the correct unit.","Scientific conclusions depend on evidence. Control variables, repeat measurements, use appropriate graphs, identify anomalies, distinguish correlation from causation and evaluate whether the evidence is sufficient to support a claim."],"terms":["Model — simplified representation used to explain or predict a physical system.","Field — region where an object experiences a force without direct contact.","Resultant force — overall force after all forces are combined with direction.","Proportionality — relationship where one quantity changes in a consistent ratio with another.","Uncertainty — range within which a measured value is reasonably expected to lie."],"prompts":["Give examples of models used in GCSE Physics.","How does a field explain a force acting at a distance?","What does a resultant force tell you about motion?","What is meant by direct proportionality?","Why must units be converted before substituting into an equation?","How can repeats and graphs strengthen a scientific conclusion?"],"q":"Which term describes a region where an object experiences a force without touching its source?","a":["field","a field"],"exam":"Explain how physics uses models and mathematical relationships to predict the behaviour of unfamiliar systems.","mark":"A model simplifies a system and identifies relevant variables or interactions. A physical law expresses a relationship between measurable quantities. Substituting valid values with consistent units gives a prediction, which can be compared with experimental evidence and refined if necessary.","gapWords":["models","cause","fields","proportional","equations","evidence"],"practical":"Working scientifically and maths: plan a fair test; select equipment and measurement ranges; repeat readings; calculate means and rates; plot and interpret graphs; use gradients and areas when appropriate; convert prefixes and units; quote answers to sensible significant figures; discuss resolution and uncertainty.","multi":{"prompt":"Select every accurate statement about physical models and laws.","options":[["a","A field can describe forces acting at a distance.",true],["b","A physical equation links measurable quantities.",true],["c","A model must include every detail of the real system.",false],["d","Zero resultant force means an object must be stationary.",false]],"explanation":"Fields model non-contact forces and equations express measurable relationships. Models simplify systems; zero resultant force means constant velocity, which may be non-zero."}},{"id":"physics-required-practicals","title":"Physics required practicals","tag":"Practical skills","summary":"AQA methods for thermal energy, electrical circuits, density, springs, acceleration, waves, optics and infrared radiation.","notes":["RP1 — Specific heat capacity: measure a block's mass, fit an electric heater and thermometer, insulate the block, supply a measured power for a measured time and record temperature rise. Energy supplied = power × time; specific heat capacity = energy transferred ÷ (mass × temperature change).","RP2 (Physics only) — Thermal insulation: compare materials or thicknesses by recording temperature fall over the same time, or temperature rise under identical heating. Keep starting temperature, container, area, thickness and time controlled; reduce draughts and heat loss from the top.","RP3 and RP4 — Resistance and I–V characteristics: build circuits from circuit diagrams; connect an ammeter in series and voltmeter in parallel. Vary wire length at constant temperature or change potential difference across a resistor, filament lamp and diode; reverse polarity for a diode and plot current against potential difference.","RP5 and RP6 — Density and springs: measure mass and volume of regular solids, use water displacement for irregular objects and a measuring cylinder for liquids; calculate density = mass ÷ volume. For a spring, add masses in steps, measure extension from its original length and plot force against extension without exceeding the elastic limit.","RP7 and RP8 — Acceleration and waves: vary resultant force while keeping mass constant, then vary mass while keeping force constant; measure motion and calculate acceleration. In ripple tanks or solid-wave setups measure wavelength and frequency, then use wave speed = frequency × wavelength.","RP9 (Physics only) and RP10 — Investigate reflection from different surfaces and refraction through different materials using a ray box, normal line and protractor; measure angles from the normal. Compare how matt, shiny, light and dark surfaces absorb or emit infrared radiation, controlling distance, surface area and starting temperature."],"terms":["Specific heat capacity — energy needed to raise 1 kg of a substance by 1°C.","Resistance — potential difference divided by current.","Density — mass divided by volume.","Extension — increase in length compared with the spring's original length.","Wavelength — distance between equivalent points on adjacent waves."],"prompts":["How is energy supplied by a heater calculated in the specific heat capacity practical?","Why must the thickness and starting temperature be controlled in an insulation investigation?","How are the ammeter and voltmeter connected in an I–V investigation?","How do you find the volume of an irregular solid?","What does a force-extension graph show about a spring?","How are wave speed, frequency and wavelength connected in the ripple tank practical?"],"q":"Which instrument measures current in a circuit?","a":["ammeter","an ammeter"],"exam":"A student measures the specific heat capacity of a metal block. Explain two improvements that reduce uncertainty or energy loss.","mark":"Insulate the block and use a lid to reduce energy transfer to the surroundings. Ensure the heater and thermometer are in good contact with the block and repeat measurements. Measure mass, temperature change, power and heating time accurately; use the measured energy and mass to calculate specific heat capacity.","gapWords":["temperature","insulation","resistance","density","acceleration","reflection"],"practical":"Exam evaluation checklist: draw a correct circuit or apparatus diagram; identify control variables; state how readings are obtained; use repeated readings and means; plot a graph with labels and units; use the correct gradient or area; estimate uncertainty and identify random and systematic errors.","multi":{"prompt":"Select every accurate statement about Physics practical methods.","options":[["a","An ammeter is connected in series.",true],["b","Water displacement can be used to find the volume of an irregular solid.",true],["c","The potential difference across a component is measured with an ammeter.",false],["d","Wave speed is frequency divided by wavelength.",false]],"explanation":"An ammeter is placed in series and displacement measures irregular volume. A voltmeter measures potential difference in parallel; wave speed = frequency × wavelength."},"practicalGuides":[{"number":14,"title":"Specific heat capacity","course":"AQA Combined Science: Trilogy","aim":"Determine specific heat capacity by measuring mass, energy input and temperature rise.","method":"Measure the metal block mass. Fit an electric heater and thermometer, insulate the block and record initial temperature. Supply measured power for measured time, then record final temperature. Calculate energy transferred = power × time.","variables":"Independent: material or supplied energy. Dependent: temperature rise. Controls: block mass when comparing materials, heater power, time, insulation, thermometer position and starting temperature.","analysis":"c = E ÷ (m × ΔT). Use E in J, mass in kg and temperature change in °C or K. Unit: J/kg°C.","evaluate":"Insulate, ensure good thermal contact and repeat. Energy lost to surroundings means electrical energy supplied is not all transferred to the block; state this systematic error.","safety":"Use a low-voltage heater and keep connections dry. The block becomes hot; use a heatproof mat and allow it to cool."},{"number":15,"title":"Resistance of wires and resistor combinations","course":"AQA Combined Science: Trilogy","aim":"Investigate factors affecting resistance, including wire length and series/parallel combinations.","method":"Set up a circuit with supply, ammeter and test wire. Connect voltmeter in parallel across the wire. Change length using crocodile clips, record current and potential difference, then calculate resistance. For combinations, measure total resistance in series and parallel.","variables":"Independent: wire length or resistor arrangement. Dependent: resistance. Controls: wire material, diameter, temperature, supply voltage and contact positions.","analysis":"R = V ÷ I. Plot resistance against length; longer wire usually has greater resistance. Series resistances add; parallel total resistance is lower than each branch resistance.","evaluate":"Use low currents and switch off between readings to limit heating. Ensure tight connections and measure length from contact points. Repeat and calculate mean.","safety":"Use low-voltage supply and avoid short circuits. Wires can heat if excessive current flows; switch off before moving connections."},{"number":16,"title":"I–V characteristics","course":"AQA Combined Science: Trilogy","aim":"Compare current-voltage relationships for a resistor, filament lamp and diode.","method":"Build a circuit with component and ammeter in series, voltmeter in parallel. Include a variable resistor or adjustable supply. Change potential difference in small steps and record current and voltage. Reverse polarity for a diode. Keep resistor at constant temperature where required.","variables":"Independent: potential difference. Dependent: current. Controls: component, circuit arrangement, temperature for resistor and measurement range.","analysis":"Plot current against potential difference. Fixed resistor at constant temperature gives a straight line through origin. Filament lamp curve becomes less steep as it heats and resistance rises. Diode conducts mainly in one direction.","evaluate":"Take readings in both polarities for diode and allow lamp to cool between runs. Use small voltage steps around the diode threshold; avoid overheating.","safety":"Use low voltages and current limits. Disconnect before changing components; lamps and resistors may become hot."},{"number":17,"title":"Density of solids and liquids","course":"AQA Combined Science: Trilogy","aim":"Determine density using mass and volume measurements for regular solids, irregular solids and liquids.","method":"Measure mass on a balance. For a regular block, measure dimensions and calculate volume. For an irregular object, record water level, fully submerge it and record the rise. For a liquid, measure a known volume and determine its mass by difference.","variables":"Independent: material or sample. Dependent: calculated density. Controls: measuring method, unit conversion, balance zero and meniscus reading.","analysis":"Density = mass ÷ volume. Use consistent units such as kg/m³ or g/cm³. Cuboid volume = length × width × height; displacement volume = final level − initial level.","evaluate":"Repeat dimensions and mass readings, use appropriate instrument precision and read meniscus at eye level. Avoid trapped air bubbles and ensure solid is fully submerged.","safety":"Handle glass measuring cylinders carefully. Do not use reactive or soluble objects in water displacement."},{"number":18,"title":"Force and extension of a spring","course":"AQA Combined Science: Trilogy","aim":"Investigate the relationship between applied force and spring extension.","method":"Suspend a spring securely beside a ruler. Record original length. Add masses in regular steps, allow oscillations to stop and record new length. Calculate extension by subtracting original length. Remove loads carefully and observe whether spring returns to original length.","variables":"Independent: applied force (weight of masses). Dependent: extension. Controls: spring, ruler position, loading increments and reading method.","analysis":"Force = mass × gravitational field strength. Plot force against extension. A straight line through origin indicates direct proportionality; gradient is spring constant when force is plotted against extension.","evaluate":"Read at eye level, repeat and avoid exceeding the limit of proportionality or elastic limit. Check spring returns to original length after unloading.","safety":"Secure clamp stand and keep feet clear of falling masses. Do not overload spring."},{"number":19,"title":"Force, mass and acceleration","course":"AQA Combined Science: Trilogy","aim":"Investigate how acceleration depends on resultant force and mass.","method":"Use a trolley and runway with pulley and hanging masses, or a suitable dynamics setup. Measure acceleration using light gates or motion sensors. First vary force while keeping total mass constant; then vary mass while keeping driving force constant. Repeat each condition.","variables":"Independent: resultant force, then total mass. Dependent: acceleration. Controls: runway angle and friction, release method, sensor position and total mass or force as appropriate.","analysis":"Use F = m a. Plot acceleration against force for constant mass, then against 1 ÷ mass for constant force. Check whether data support proportional relationships and identify anomalies.","evaluate":"Reduce friction, use sufficient run-up, release without a push and keep mass distribution consistent. Repeat measurements and calculate means.","safety":"Secure hanging masses and keep the runway clear. Prevent trolley falls and use a catch box or stop."},{"number":20,"title":"Waves in a ripple tank and solids","course":"AQA Combined Science: Trilogy","aim":"Measure wave frequency, wavelength and speed and select suitable apparatus.","method":"In a ripple tank, create steady waves using a vibrator or dipper. Use a stroboscope or timer to determine frequency. Measure across several wavefront gaps and divide by the number of wavelengths. For waves in a solid, measure frequency and wavelength using suitable apparatus.","variables":"Independent: driving frequency or medium. Dependent: wavelength and calculated wave speed. Controls: water depth, source amplitude and measurement region when comparing ripple waves.","analysis":"v = f × λ. Measure several wavelengths to reduce percentage uncertainty. Frequency in Hz, wavelength in m and speed in m/s.","evaluate":"Use a stable frequency, avoid reflections near tank edges and repeat measurements. Mark wavefronts clearly; parallax and unclear crests increase uncertainty.","safety":"Keep electrical equipment dry near water. Mop spills promptly."},{"number":21,"title":"Infrared absorption and emission by surfaces","course":"AQA Combined Science: Trilogy","aim":"Investigate how surface properties affect absorption or emission of infrared radiation.","method":"Use identical containers or surfaces with different finishes, such as matt black and shiny silver. For emission, fill containers with equal volumes of hot water at the same starting temperature and record cooling at fixed intervals. For absorption, expose surfaces to the same infrared source for a fixed time and record temperature rise.","variables":"Independent: surface finish or colour. Dependent: temperature change over time. Controls: starting temperature, surface area, distance from source, container material, volume and timing.","analysis":"Plot temperature against time or compare temperature changes over equal intervals. Matt black surfaces are generally good absorbers and emitters; shiny light surfaces are poorer absorbers and emitters.","evaluate":"Use identical containers and repeat. Control distance and angle to source, insulate other surfaces and use a lid where suitable so convection and conduction do not dominate.","safety":"Avoid hot water and surfaces. Keep infrared lamps stable and do not stare into intense lamps."}]},{"id":"physics-separate-extensions","title":"Separate Physics and Higher Tier extensions","tag":"Separate Science only","summary":"Physics-only and Higher Tier depth: moments, momentum, pressure in gases, circular motion, transformers and generator applications.","notes":["A moment is the turning effect of a force: moment = force × perpendicular distance from the pivot to the force's line of action. The unit is newton metre (Nm). For a balanced object, total clockwise moment equals total anticlockwise moment.","Momentum is mass × velocity, p = mv, measured in kg m/s. In a closed system, total momentum before a collision equals total momentum after it. Momentum is a vector, so direction must be included in calculations.","The force on an object equals the rate of change of momentum: F = change in momentum ÷ time. Increasing the time taken to stop a moving object reduces the average force for the same momentum change; this explains seat belts, airbags and crumple zones.","For a fixed mass of gas at constant temperature, pressure × volume is constant. Reducing volume increases pressure because particles collide with the walls more frequently per unit area. Temperature must remain constant for this relationship to apply.","A transformer changes alternating potential difference by electromagnetic induction. The primary coil's alternating current creates a changing magnetic field in the core, inducing a potential difference in the secondary coil. For an ideal transformer, Vs ÷ Vp = Ns ÷ Np.","A generator produces a potential difference when a conductor moves through a magnetic field or the magnetic field through a coil changes. The induced potential difference increases when the magnetic field is stronger, the coil has more turns or the rate of change is greater.","Moments explain how forces rotate objects. The moment depends on force and the perpendicular distance from the pivot to the force's line of action. A larger perpendicular distance gives a larger turning effect for the same force; levers use this to multiply a turning effect.","For an object in equilibrium, the resultant force is zero and the total clockwise moment about any pivot equals the total anticlockwise moment. Choose a convenient pivot when solving a balance problem; forces acting through the pivot have zero moment.","Momentum is a vector quantity: momentum = mass × velocity. In a closed system, total momentum before an interaction equals total momentum after it. Include signs or directions when objects move in opposite directions.","Force equals the rate of change of momentum. For a fixed momentum change, increasing collision time reduces average force. Crumple zones, seat belts and airbags increase the time over which a passenger's momentum changes.","For a fixed mass of gas at constant temperature, pressure × volume remains constant. Compressing the gas reduces volume, so particles collide with container walls more frequently per unit area and pressure increases. The relationship only applies under the stated constant-temperature conditions.","A transformer changes alternating potential difference by electromagnetic induction. For an ideal transformer, secondary voltage ÷ primary voltage = secondary turns ÷ primary turns. Step-up transformers increase voltage; step-down transformers reduce it. High transmission voltage reduces current for a given power and therefore reduces heating losses."],"terms":["Moment — turning effect of a force about a pivot.","Momentum — mass multiplied by velocity.","Conservation of momentum — total momentum remains constant in a closed system.","Transformer — device that changes alternating potential difference by electromagnetic induction.","Electromagnetic induction — production of potential difference when magnetic flux linkage changes.","Moment — turning effect of a force about a pivot.","Momentum — mass multiplied by velocity, including direction.","Conservation of momentum — total momentum remains constant in a closed system.","Impulse — change in momentum, equal to force multiplied by time.","Transformer — device that changes alternating potential difference by electromagnetic induction."],"prompts":["Calculate the moment of a 15 N force acting perpendicular to a lever 0.4 m from the pivot.","A 2 kg trolley moves at 3 m/s. Calculate its momentum.","Explain why increasing collision time reduces the force in a safety feature.","How does pressure change when the volume of a fixed mass of gas is reduced at constant temperature?","How does the turns ratio determine a transformer's output potential difference?","State two ways to increase the induced potential difference in a generator.","Calculate the moment of a 15 N force acting perpendicular to a lever 0.40 m from the pivot.","State the two conditions needed for an object to be in equilibrium.","A 2 kg trolley moves at 3 m/s. Calculate its momentum.","Explain why increasing collision time reduces the force on a passenger.","How does pressure change when a fixed mass of gas is compressed at constant temperature?","A transformer has 1,000 primary turns and 200 secondary turns. Calculate secondary voltage if primary voltage is 230 V."],"q":"What is the equation for the moment of a force?","a":["force × perpendicular distance","moment = force × distance","m = f × d"],"exam":"A 2 kg trolley moving at 3 m/s collides with a stationary 1 kg trolley. Explain the conservation principle that applies to the collision.","mark":"Momentum before = 2 × 3 + 1 × 0 = 6 kg m/s. In a closed system total momentum is conserved, so total momentum after the collision is also 6 kg m/s. Direction must be included if motion reverses.","gapWords":["pivot","momentum","collision","volume","turns","induction"],"practical":"Physics-only practical focus: investigate moments using a pivoted ruler and known masses; investigate collisions using trolleys and light gates; record velocities before and after, include direction and compare total momentum. Use controlled gas-volume and pressure measurements only with suitable apparatus and risk controls.","commonMistakes":["Use the perpendicular distance to the force's line of action when calculating a moment.","Momentum has direction; do not add magnitudes blindly if objects move in opposite directions.","A transformer requires a changing magnetic field; a steady direct current does not produce continuous induction."],"examQuestions":[{"question":"A force of 15 N acts at right angles to a lever 0.40 m from its pivot. Calculate the moment.","marks":"Moment = force × perpendicular distance = 15 × 0.40 = 6.0 Nm."},{"question":"Explain why an airbag reduces the force on a passenger during a collision.","marks":"The passenger's momentum changes from its initial value to zero. The airbag increases the time taken for this change. For the same momentum change, a longer time means a smaller average force."},{"question":"A force of 15 N acts perpendicular to a lever 0.40 m from its pivot. Calculate the moment.","marks":"Moment = force × perpendicular distance = 15 × 0.40 = 6.0 Nm."},{"question":"A transformer has 1,000 turns on its primary coil and 200 turns on its secondary coil. The primary potential difference is 230 V. Calculate the secondary potential difference for an ideal transformer.","marks":"Vs ÷ Vp = Ns ÷ Np. Vs = 230 × (200 ÷ 1,000) = 46 V."},{"question":"Explain why an airbag reduces the force on a passenger during a collision.","marks":"The passenger's momentum changes from its initial value to zero. The airbag increases the time taken for this change. For the same momentum change, a longer time means a smaller average force."}]}]}};
function scienceLessonCard(subject,t,index){
 const practicalGuides=(t.practicalGuides||[]).map((g,i)=>'<details class="science-practical-guide" '+(i===0?'open':'')+'><summary><span class="science-practical-number">RP '+g.number+'</span><span><b>'+escape(g.title)+'</b><small>'+escape(g.course)+'</small></span></summary><div class="science-practical-content"><section><b>Aim</b><p>'+escape(g.aim)+'</p></section><section><b>Method</b><ol>'+g.method.split('. ').filter(Boolean).map(x=>'<li>'+escape(x.replace(/[.]$/,''))+'</li>').join('')+'</ol></section><section><b>Variables</b><p>'+escape(g.variables)+'</p></section><section><b>Results and analysis</b><p>'+escape(g.analysis)+'</p></section><section><b>Evaluation and improvements</b><p>'+escape(g.evaluate)+'</p></section><section><b>Safety</b><p>'+escape(g.safety)+'</p></section></div></details>').join('');

 const extraExam=(t.examQuestions||[]).map((q,j)=>'<div class="science-check-card science-exam-question"><b>Further exam practice · '+(j+1)+'</b><p>'+escape(q.question)+'</p><button type="button" data-sci-check="exam-extra" data-sci-subject="'+subject+'" data-sci-topic="'+t.id+'" data-sci-index="'+j+'">Reveal mark points</button><div id="scienceExamPoints-'+t.id+'-'+j+'" class="hidden"><p>'+escape(q.marks)+'</p></div></div>').join('');
 const workedExamples=(t.workedExamples||[]).map(x=>'<article class="science-worked-example"><span class="rev-kicker">WORKED EXAMPLE</span><h4>'+escape(x.title)+'</h4><p><b>Question:</b> '+escape(x.question)+'</p><ol>'+x.steps.map(step=>'<li>'+escape(step)+'</li>').join('')+'</ol><p class="science-worked-answer"><b>Answer:</b> '+escape(x.answer)+'</p><p class="muted">'+escape(x.note)+'</p></article>').join('');
 const workedExamples=(t.workedExamples||[]).map(x=>'<article class="science-worked-example"><span class="rev-kicker">WORKED EXAMPLE</span><h4>'+escape(x.title)+'</h4><p><b>Question:</b> '+escape(x.question)+'</p><ol>'+x.steps.map(step=>'<li>'+escape(step)+'</li>').join('')+'</ol><p class="science-worked-answer"><b>Answer:</b> '+escape(x.answer)+'</p><p class="muted">'+escape(x.note)+'</p></article>').join('');
 const mistakes=(t.commonMistakes||[]).map(x=>'<li>'+escape(x)+'</li>').join('');
 const prompts=(t.prompts||[]).map((x,j)=>'<li><b>Recall '+(j+1)+':</b> '+escape(x)+'</li>').join('');
 return '<article class="card science-lesson-card"><div class="science-lesson-heading"><span class="pill">'+t.tag.toUpperCase()+' · LESSON '+(index+1)+'</span><h2>'+escape(t.title)+'</h2><p class="muted">'+escape(t.summary)+'</p></div>'+
  '<section class="science-lesson-intro"><h3>Big picture</h3><p>'+escape(t.summary)+'. Build a connected explanation: define the key terms, describe each process in the correct order, link cause to effect and apply the idea to unfamiliar examples. The exam may test the same science through a new context, graph, diagram or practical result.</p></section>'+
  '<section class="science-lesson-section"><h3>What you need to know</h3><ol class="science-lesson-points">'+t.notes.map((n,j)=>'<li><b>'+['Core principle','Structure and function','Process and mechanism','Application and consequence'][j%4]+' · '+(j+1)+'</b><p>'+escape(n)+'</p></li>').join('')+'</ol></section>'+
  '<section class="science-lesson-section"><h3>Key scientific vocabulary</h3><div class="science-vocab-grid">'+t.terms.map(x=>{const z=x.split(' — ');return '<div class="science-vocab"><b>'+escape(z[0])+'</b><p>'+escape(z.slice(1).join(' — ')||'Use this term accurately in a scientific explanation.')+'</p></div>'}).join('')+'</div></section>'+
  '<section class="science-lesson-section"><h3>Guided active recall</h3><p>Try each prompt without looking back at the notes. Use complete scientific explanations rather than isolated keywords.</p><ol class="science-lesson-points">'+prompts+'</ol></section>'+
  (workedExamples?'<section class="science-lesson-section"><h3>Worked exam calculations</h3><p>Follow the method, substitute values with units and check that the final answer is sensible.</p>'+workedExamples+'</section>':'')+
