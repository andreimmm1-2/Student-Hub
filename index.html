tral, harmful or occasionally beneficial."},"commonMistakes":["Monoclonal antibodies are specific to one antigen; they are not a mixture of many antibodies.","Auxin stimulates shoot-cell elongation; unequal distribution causes a growth response rather than the shoot being pulled towards light.","Microbiology cultures must be handled using school-approved safety procedures; do not open incubated plates."],"examQuestions":[{"question":"Explain how monoclonal antibodies can be produced and used in a pregnancy test.","marks":"A lymphocyte producing an antibody to hCG is fused with a tumour cell to form a hybridoma. Hybridomas divide and produce identical antibodies. In the test, antibodies bind to hCG in urine; a labelled antibody gives a visible line when the complex is captured."},{"question":"A shoot is illuminated from one side. Explain why it bends towards the light.","marks":"Auxin accumulates on the shaded side of the shoot. Auxin stimulates cells there to elongate more than cells on the illuminated side, so the shaded side grows faster and the shoot bends towards the light."}]},{"id":"biology-required-practicals","title":"Biology required practicals","tag":"Practical skills","summary":"AQA practical methods, variables, measurements, calculations and evaluation for all ten Biology required practicals.","notes":["RP1 — Microscopy: prepare a thin specimen on a slide, add stain when appropriate, lower a coverslip, focus at low power then increase magnification. Produce a clear labelled drawing and include a scale or magnification. Magnification = image size ÷ actual size; convert units before calculating.","RP2 (Biology only) — Antiseptics and antibiotics: use aseptic technique to spread bacteria on nutrient agar, place sterile paper discs containing different treatments, include a control disc, incubate safely under school-approved conditions and measure zones of inhibition. A larger clear zone suggests greater effectiveness, but diffusion and concentration also affect the result.","RP3 — Osmosis: place equal-sized pieces of plant tissue in different known concentrations of salt or sugar solution. Blot and record starting and final mass after the same time. Calculate percentage change in mass = (change in mass ÷ starting mass) × 100; a zero change estimates the isotonic concentration.","RP4 — Food tests: Benedict's reagent with heating tests for reducing sugars (blue to green/yellow/orange/brick-red); iodine tests starch (orange-brown to blue-black); Biuret reagent tests protein (blue to lilac/purple); the emulsion test detects lipids (cloudy white emulsion). Use distilled water as a negative control where appropriate.","RP5 and RP6 — Enzyme and photosynthesis rates: for amylase, use iodine at timed intervals while controlling pH and temperature in a water bath; for pondweed, vary light intensity and measure oxygen production. Change one independent variable, repeat readings and keep other factors controlled.","RP7–RP10 — Human reaction time uses a ruler-drop or suitable timing method; RP8 (Biology only) tests seedling response to light or gravity with measurements and labelled drawings; RP9 uses quadrats and transects to estimate abundance and distribution; RP10 (Biology only) investigates milk decay by monitoring pH at controlled temperatures."],"terms":["Aseptic technique — procedures that reduce unwanted microbial contamination.","Zone of inhibition — clear area where bacterial growth is prevented.","Isotonic concentration — solution concentration where there is no net change in tissue mass.","Negative control — comparison setup expected to show no effect.","Percentage change — change divided by the starting value, multiplied by 100."],"prompts":["How do you calculate magnification from image size and actual size?","Why are aseptic technique and a control disc important in the bacterial growth practical?","How do you calculate percentage change in mass during osmosis?","Which reagents test for reducing sugars, starch, protein and lipids?","How do you keep pH and temperature controlled in the amylase practical?","How do quadrats and transects provide evidence about a species' distribution?"],"q":"Which reagent is used to test for starch?","a":["iodine","iodine solution"],"exam":"A student places equal potato cylinders in different sucrose concentrations. Explain how percentage mass change can be used to estimate the concentration of the cell sap.","mark":"Measure the initial mass and the final mass after a fixed time, blotting each piece consistently. Calculate percentage change for each concentration and plot percentage change against concentration. The concentration at which percentage change is zero is the estimate of the isotonic concentration, because there is no net movement of water.","gapWords":["magnification","inhibition","osmosis","Benedict","iodine","quadrat"],"practical":"Exam evaluation checklist: identify the independent variable, dependent variable and control variables; use a suitable range and intervals; repeat and calculate means; state units; describe how measurements are taken; explain risk controls; identify sources of error and propose a specific improvement.","multi":{"prompt":"Select every accurate statement about Biology practical methods.","options":[["a","Percentage change uses the starting value as the denominator.",true],["b","A negative control helps show whether an observed effect is due to the treatment.",true],["c","The iodine test is used to identify protein.",false],["d","A larger zone of inhibition always proves a substance is a better antibiotic in every situation.",false]],"explanation":"Percentage change is relative to the starting value, and a negative control helps identify effects due to treatment. Iodine tests starch; inhibition zones can also depend on diffusion and concentration."},"practicalGuides":[{"number":1,"title":"Microscopy of plant and animal cells","course":"AQA Combined Science: Trilogy","aim":"Observe, draw and label cells and estimate the size of structures.","method":"Prepare a thin specimen on a clean slide. Add a suitable stain where needed, lower a coverslip at an angle to reduce trapped air, focus on low power first and then increase magnification. Draw only what is observed, using clear single lines and labels. Calibrate an eyepiece graticule against a stage micrometer when measuring.","variables":"Independent: specimen or cell type. Dependent: observed structures and measured dimensions. Controls: preparation thickness, stain, magnification and illumination when comparing samples.","analysis":"Magnification = image size ÷ actual size. Convert both measurements into the same units first. Include a scale bar or magnification on the drawing.","evaluate":"Use a thin specimen, avoid over-staining, lower the coverslip gently and focus from low power to avoid damaging the slide. Repeat measurements across several cells.","safety":"Handle slides and coverslips carefully; use a mounted needle only as instructed. Follow teacher-approved procedures for biological samples."},{"number":2,"title":"Osmosis in plant tissue","course":"AQA Combined Science: Trilogy","aim":"Investigate how salt or sugar concentration affects the mass of plant tissue.","method":"Cut equal-diameter potato cylinders or equal-sized plant pieces. Blot and measure each initial mass. Place pieces in labelled concentrations using equal solution volumes and the same immersion time. Remove, blot consistently and record final mass. Repeat for each concentration using fresh tissue.","variables":"Independent: solution concentration. Dependent: mass change or percentage change. Controls: tissue source and dimensions, solution volume, temperature, immersion time and blotting method.","analysis":"Percentage change = (final mass − initial mass) ÷ initial mass × 100. Plot percentage change against concentration. The zero-change point estimates the isotonic concentration.","evaluate":"Use several repeats and calculate a mean. Keep cylinders the same size and blot in the same way; inconsistent blotting changes measured mass. Use concentrations around the zero-change point.","safety":"Use scalpels or cork borers only as directed on a cutting tile. Do not taste solutions or plant material."},{"number":3,"title":"Food tests","course":"AQA Combined Science: Trilogy","aim":"Identify reducing sugars, starch, proteins and lipids in food samples.","method":"Prepare food solutions by crushing or mixing samples with distilled water. Add Benedict’s solution and heat in a hot water bath for reducing sugars. Add iodine for starch. Use Biuret reagent for protein. For lipids, shake with ethanol, then add water and look for a cloudy emulsion. Use known positive and negative controls where possible.","variables":"Independent: food sample. Dependent: colour or emulsion result. Controls: sample mass, solvent volume, reagent volume, heating time and temperature.","analysis":"Benedict’s: blue may change through green/yellow/orange to brick-red. Iodine: orange-brown to blue-black. Biuret: blue to lilac/purple. Lipid emulsion: clear to cloudy white.","evaluate":"Use equal sample quantities and reagent volumes, label tubes and repeat unclear tests. A negative result may reflect low concentration or poor extraction, not necessarily complete absence.","safety":"Wear eye protection. Ethanol is flammable, so keep it away from naked flames; heat Benedict’s solution in a water bath."},{"number":4,"title":"Effect of pH on amylase","course":"AQA Combined Science: Trilogy","aim":"Find how pH affects the rate at which amylase digests starch.","method":"Set up a water bath to maintain constant temperature. Mix amylase and buffer at a selected pH, add starch and start timing. Every 30 seconds place a drop onto iodine on a spotting tile. Record the time when iodine remains orange-brown, showing starch has been digested. Repeat across pH values.","variables":"Independent: pH. Dependent: time to digest starch or rate (for example 1 ÷ time). Controls: temperature, amylase and starch concentrations, volumes, reaction volume and sampling interval.","analysis":"Plot rate against pH. The highest measured rate indicates the optimum pH under these conditions. Use repeats and calculate a mean; state how rate was calculated.","evaluate":"Use a consistent sampling interval and mix consistently. A shorter interval near the end point improves precision. Keep temperature constant because pH is the variable being tested.","safety":"Wear eye protection and avoid contact with enzyme solutions or iodine. Use the water bath carefully."},{"number":5,"title":"Light intensity and photosynthesis","course":"AQA Combined Science: Trilogy","aim":"Investigate how light intensity affects photosynthesis in pondweed.","method":"Place pondweed in water with a suitable supply of dissolved carbon dioxide, with the cut end arranged to release gas. Position a lamp at measured distances. Allow the plant to acclimatise, then measure oxygen over a fixed time using a gas syringe or count bubbles as a less precise estimate. Repeat at each distance.","variables":"Independent: light intensity, often changed by moving the lamp. Dependent: oxygen production per unit time. Controls: pondweed length, carbon dioxide concentration, temperature, lamp and measurement time.","analysis":"Rate = oxygen volume ÷ time, or bubbles ÷ time. For a point source, light intensity is approximately inversely proportional to distance squared. Plot rate against light intensity or 1 ÷ distance².","evaluate":"Repeat at each distance and keep temperature constant using a water bath or heat shield. Bubble size varies, so gas volume is more reliable than counting bubbles. Allow acclimatisation.","safety":"Use low-voltage lighting near water and keep electrical connections dry. Handle pondweed carefully and dispose of it as directed."},{"number":6,"title":"Human reaction time","course":"AQA Combined Science: Trilogy","aim":"Test how a chosen factor affects reaction time.","method":"Use a ruler-drop test. One participant holds a hand ready while another holds a ruler with zero level at the top of the catching hand. Release without warning and record the distance fallen before it is caught. Convert distance to reaction time if required, then repeat. Change one factor such as distraction or dominant hand.","variables":"Independent: one chosen factor. Dependent: ruler-drop distance or calculated reaction time. Controls: same participant, ruler, starting position, hand position, practice trials and environment.","analysis":"Use the same ruler-distance method consistently. Calculate a mean and compare results between conditions; identify anomalous results rather than deleting them without reason.","evaluate":"Randomise or counterbalance test order to reduce practice effects, use many repeats and standardise the release. A ruler-drop result is affected by anticipation and varies between participants.","safety":"Participation must be voluntary. Avoid unsafe distractions; protect privacy and do not use results to make medical claims."},{"number":7,"title":"Ecology sampling with quadrats and transects","course":"AQA Combined Science: Trilogy","aim":"Estimate abundance and investigate how an environmental factor affects species distribution.","method":"Select a habitat and identify a common species. Place quadrats at random coordinates to reduce bias and count individuals or estimate percentage cover. To examine a gradient, lay a transect across it and sample at regular intervals. Measure the abiotic factor at each sample point.","variables":"Independent: position along a transect or habitat condition. Dependent: abundance, frequency or percentage cover. Controls: quadrat size, sampling method, interval spacing and counting rules.","analysis":"Calculate means and compare abundance between positions or habitats. Plot abundance against distance or the measured abiotic factor. Estimate population size only when the sampling design supports extrapolation.","evaluate":"Use many randomly placed quadrats, repeat across transects and avoid selecting convenient patches. Explain limitations such as clumped distribution, seasonal change and observer judgement.","safety":"Avoid damaging habitats or removing organisms unnecessarily. Check for hazards and follow site-specific instructions."}]}]},"chemistry":{"title":"Chemistry","topics":[{"id":"atomic-structure","title":"Atomic structure and the periodic table","tag":"Combined & Triple","summary":"Atomic models, subatomic particles, isotopes, electronic structure and periodic trends.","notes":["All substances are made from atoms. An atom has a tiny, positively charged nucleus containing protons and neutrons, surrounded by negatively charged electrons in energy levels.","Relative charges are proton +1, neutron 0 and electron −1. Relative masses are approximately 1, 1 and very small for an electron. Atomic number equals proton number; mass number equals protons plus neutrons.","Atoms are electrically neutral because they contain equal numbers of protons and electrons. Ions form when atoms lose electrons to become positive or gain electrons to become negative; the nucleus does not change.","Isotopes are atoms of the same element with the same number of protons but different numbers of neutrons. Their chemical properties are very similar because they have the same electron arrangement.","Early atomic models changed as evidence improved: the plum-pudding model was replaced by a nuclear model after alpha-particle scattering showed a small, dense, positive nucleus. Later evidence led to shells and energy levels.","Elements are arranged by increasing atomic number. Group number relates to outer-shell electrons for main-group elements; elements in a group have similar chemical properties. Period number indicates the number of occupied electron shells.","An atom has a tiny positive nucleus containing protons and neutrons, with electrons in energy levels around it. Most of the atom is empty space. The nuclear model replaced earlier models when alpha-scattering results showed that most alpha particles passed through but a few were strongly deflected.","Electrons occupy shells at different distances from the nucleus. For the first 20 elements, the shell pattern is built up as 2, 8, 8, 2. The number of electrons in the outer shell helps explain chemical behaviour and the position of an element in the periodic table.","Elements in the same group have the same number of outer-shell electrons and similar chemical properties. Group 0 elements are unreactive because they have full outer shells; Group 1 metals form +1 ions and become more reactive down the group; Group 7 halogens form -1 ions and become less reactive down the group."],"terms":["Atomic number — number of protons in an atom's nucleus.","Mass number — total number of protons and neutrons.","Isotope — atoms with the same proton number but different neutron numbers.","Ion — charged particle formed by gaining or losing electrons.","Electron shell — energy level occupied by electrons.","Electron shell — energy level occupied by electrons around the nucleus.","Outer-shell electron — electron in the highest occupied energy level.","Relative atomic mass — weighted mean mass of an element's atoms compared with one-twelfth of carbon-12."],"prompts":["Where are protons, neutrons and electrons found?","How do you calculate the number of neutrons from atomic and mass numbers?","Why do isotopes of an element have similar chemical properties?","What does an element's position in the periodic table tell you?","What did alpha-scattering evidence show about the structure of an atom?","Write the electronic structure of sodium and explain why it is in Group 1.","Why do elements in the same group have similar chemical properties?"],"q":"An atom has 11 protons and 12 neutrons. What is its mass number?","a":["23"],"exam":"Explain why isotopes of the same element have the same chemical properties.","mark":"They have the same number of protons and, as neutral atoms, the same number and arrangement of electrons. Chemical reactions depend on electron arrangements, especially outer-shell electrons, so their chemical properties are similar.","gapWords":["nucleus","protons","ions","neutrons","nucleus","elements"],"practical":"Practical and model focus: interpret evidence from the alpha-scattering experiment. Most alpha particles passed through the foil, showing atoms are mostly empty space; a few were deflected strongly, indicating a small, dense, positively charged nucleus.","commonMistakes":["Atomic number counts protons; mass number counts protons plus neutrons.","Isotopes have the same number of protons but different numbers of neutrons.","The periodic table is arranged by atomic number, not relative atomic mass."],"examQuestions":[{"question":"An atom has atomic number 17 and mass number 35. State the number of protons, neutrons and electrons in a neutral atom, and explain its group.","marks":"17 protons; 35 − 17 = 18 neutrons; 17 electrons because the atom is neutral; electronic structure 2,8,7, so it has seven outer-shell electrons and belongs to Group 7."}]},{"id":"bonding","title":"Bonding, structure and properties","tag":"Combined & Triple","summary":"Ionic, covalent and metallic bonding; giant and simple structures; material properties.","notes":["Ionic bonding forms when electrons are transferred, usually from a metal atom to a non-metal atom. The resulting positive and negative ions attract strongly in all directions in a giant ionic lattice.","Covalent bonding forms when non-metal atoms share pairs of electrons. The shared electrons are attracted to both nuclei; each bond is strong, but the forces between simple molecules are often much weaker.","Metallic bonding is the electrostatic attraction between positive metal ions and delocalised electrons. The electrons can move through the structure, explaining electrical and thermal conductivity.","Ionic compounds usually have high melting points because strong attractions between ions require substantial energy to overcome. They conduct electricity when molten or dissolved because ions can move, but not when solid.","Simple molecular substances often have low melting and boiling points because intermolecular forces are weak. They do not usually conduct electricity because they have no mobile charged particles.","Giant covalent structures have many strong covalent bonds. Diamond is hard and does not conduct; graphite has layers and delocalised electrons; silicon dioxide is also a giant covalent structure. Polymers contain long covalently bonded chains.","An ionic compound forms a giant lattice of oppositely charged ions. Strong electrostatic attractions act in all directions, so much energy is needed to separate the ions. Ionic compounds conduct electricity only when molten or dissolved because the ions must be free to move.","Simple molecular substances contain strong covalent bonds within each molecule but weak intermolecular forces between molecules. Their melting and boiling points are usually low because only the weak forces between molecules need to be overcome; they do not usually conduct electricity.","Diamond is a giant covalent structure in which each carbon bonds to four others, making it hard with a very high melting point. Graphite has layers of carbon atoms, each bonded to three others; delocalised electrons carry charge and layers slide over one another."],"terms":["Ionic bond — electrostatic attraction between oppositely charged ions.","Covalent bond — a shared pair of electrons between atoms.","Metallic bond — attraction between positive metal ions and delocalised electrons.","Delocalised electron — electron free to move through a structure.","Intermolecular force — attraction between separate molecules.","Lattice — regular repeating arrangement of particles in a solid.","Intermolecular force — attraction between separate molecules.","Delocalised electron — electron not attached to one specific atom or bond."],"prompts":["Describe electron transfer and attraction in ionic bonding.","Why are covalent bonds strong but forces between simple molecules weaker?","Explain why metals conduct electricity.","Compare the electrical conductivity of solid ionic compounds and molten ionic compounds.","Explain why solid sodium chloride does not conduct but molten sodium chloride does.","Why do simple molecular substances have low melting points despite strong covalent bonds?","Compare the structures and properties of diamond and graphite."],"q":"Which type of bonding involves a shared pair of electrons?","a":["covalent"],"exam":"Explain why graphite conducts electricity but diamond does not.","mark":"Each graphite carbon atom forms three covalent bonds, leaving one electron delocalised and able to move along the layers. In diamond, each carbon forms four covalent bonds, so there are no delocalised electrons to carry charge.","gapWords":["transfer","shared","delocalised","ions","substances","graphite"],"practical":"Required practical link: relate material properties to particle structure. When testing conductivity or melting behaviour, use equal sample sizes and safe low-voltage circuits; record whether a sample is solid, molten or in solution because particle mobility changes conductivity.","commonMistakes":["Melting a simple molecular solid overcomes intermolecular forces, not the covalent bonds within molecules.","Graphite conducts because it has delocalised electrons; diamond does not.","Ionic substances conduct only when ions can move, not when the lattice is fixed."],"examQuestions":[{"question":"Explain why graphite conducts electricity and can be used as a lubricant, whereas diamond is hard and does not conduct.","marks":"In graphite each carbon forms three covalent bonds, leaving one electron delocalised and able to carry charge; the atoms form layers with weak forces between them, so layers slide. In diamond each carbon forms four strong covalent bonds in a rigid 3D structure, making it hard; there are no delocalised electrons."}]},{"id":"quantitative-chemistry","title":"Quantitative chemistry","tag":"Combined & Triple","summary":"Conservation of mass, balanced equations, relative formula mass, moles, concentrations and yields.","notes":["Chemical equations represent reactions. Formulae show the elements and atom ratios in a substance; balancing adds whole-number coefficients so each element has the same number of atoms on both sides.","Mass is conserved in a closed system because atoms are rearranged rather than created or destroyed. An apparent mass change in an open container may be caused by a gas entering or escaping.","Relative formula mass (Mr) is the sum of the relative atomic masses (Ar) of all atoms in a formula. Multiply each Ar by the number of that atom, then add the values.","The mole is a counting unit for amount of substance. Moles = mass ÷ Mr. Use the balanced equation coefficients as mole ratios to compare reactants and products.","Concentration in g/dm³ = mass of solute in grams ÷ volume of solution in dm³. Convert cm³ to dm³ by dividing by 1,000 before substituting.","Percentage yield = actual yield ÷ theoretical yield × 100. Atom economy = Mr of desired product ÷ total Mr of products × 100. Low yield can result from reversible reactions, side reactions or product loss during separation.","Balanced symbol equations conserve atoms: each element must have the same number of atoms on both sides. Change coefficients in front of formulae to balance an equation; never alter the small numbers inside a formula because that changes the substance.","Relative formula mass, Mr, is found by adding the relative atomic masses of all atoms in a formula. For example, MgO has Mr = 24 + 16 = 40. The mass of a product can then be compared with reactant masses using the balanced equation.","Percentage yield compares the amount of product actually obtained with the theoretical amount: actual yield ÷ theoretical yield × 100. Atom economy compares the mass of desired product with the total mass of products; a higher atom economy reduces waste."],"terms":["Relative atomic mass (Ar) — average mass of an atom compared with one-twelfth of carbon-12.","Relative formula mass (Mr) — total of the relative atomic masses in a formula.","Mole — amount of substance containing a fixed number of particles.","Concentration — amount of solute in a given volume of solution.","Percentage yield — actual product obtained as a percentage of the theoretical maximum.","Relative formula mass (Mr) — sum of the relative atomic masses in a formula.","Theoretical yield — maximum product predicted by the balanced equation.","Atom economy — percentage of reactant atoms incorporated into the desired product."],"prompts":["Why must chemical equations be balanced?","How do you calculate Mr from a chemical formula?","How are mass, Mr and moles related?","What is the difference between percentage yield and atom economy?","Why must symbol equations be balanced?","Calculate the Mr of CaCO₃ using Ca = 40, C = 12 and O = 16.","How do percentage yield and atom economy measure different aspects of a reaction?"],"q":"Calculate the Mr of CO₂ when Ar(C) = 12 and Ar(O) = 16.","a":["44"],"exam":"A reaction produces 8 g of product when the theoretical yield is 10 g. Calculate the percentage yield.","mark":"Percentage yield = actual yield ÷ theoretical yield × 100 = 8 ÷ 10 × 100 = 80%. Include the percentage sign and show the substitution.","gapWords":["equations","conserved","formula","moles","concentration","yield"],"practical":"Required practical link: prepare a solution of known concentration accurately. Weigh the solute, dissolve it in a small volume of distilled water, transfer quantitatively to a volumetric flask, rinse the beaker and funnel into the flask, make up to the calibration line and invert to mix.","multi":{"prompt":"Select every accurate statement about quantitative chemistry.","options":[["a","A balanced equation has the same number of each atom on both sides.",true],["b","Moles can be calculated using mass divided by Mr.",true],["c","Percentage yield is theoretical yield divided by actual yield.",false],["d","Mass is not conserved in a closed reaction system.",false]],"explanation":"Balanced equations conserve atoms and moles = mass ÷ Mr. Percentage yield uses actual ÷ theoretical yield × 100; mass is conserved in a closed system."},"commonMistakes":["Balance equations by changing coefficients, not formula subscripts.","Percentage yield uses actual yield divided by theoretical yield, then multiplied by 100.","A low yield and a low atom economy are not the same: one measures practical production, the other measures the reaction equation's use of atoms."],"examQuestions":[{"question":"A reaction has a theoretical yield of 12.0 g but produces 9.0 g of product. Calculate the percentage yield and show the calculation.","marks":"Percentage yield = actual yield ÷ theoretical yield × 100 = 9.0 ÷ 12.0 × 100 = 75%. Include the percentage sign."}],"workedExamples":[{"title":"Percentage yield","question":"A reaction has a theoretical yield of 12.0 g and produces 8.4 g. Calculate percentage yield.","steps":["Percentage yield = actual yield ÷ theoretical yield × 100.","Substitute: 8.4 ÷ 12.0 × 100.","= 70."],"answer":"70%","note":"Use actual yield over theoretical yield, then multiply by 100."}]},{"id":"chemical-changes","title":"Chemical changes","tag":"Combined & Triple","summary":"Reactivity, oxidation, acids, salts, electrolysis and extracting metals.","notes":["The reactivity series arranges metals by how readily they react. A more reactive metal can displace a less reactive metal from its compound; the pattern helps predict reactions with water, oxygen and acids.","Oxidation can be described as gain of oxygen or loss of electrons; reduction is loss of oxygen or gain of electrons. In a displacement reaction, the more reactive metal is oxidised while the displaced metal ion is reduced.","Acids in water release hydrogen ions, H⁺. Alkalis are soluble bases that release hydroxide ions, OH⁻. Neutralisation occurs when hydrogen ions react with hydroxide ions to form water.","Acid + metal → salt + hydrogen. Acid + carbonate → salt + water + carbon dioxide. Acid + base/alkali → salt + water. The salt name depends on the acid: hydrochloric acid makes chlorides, sulfuric acid makes sulfates and nitric acid makes nitrates.","Soluble salts can be made by reacting an acid with an excess insoluble base or carbonate, filtering off the excess solid and crystallising the solution. Titration is used when both reactants are soluble.","Electrolysis uses electrical energy to decompose an ionic substance. Ions move to oppositely charged electrodes: positive ions gain electrons at the cathode; negative ions lose electrons at the anode. The electrolyte must contain mobile ions.","The reactivity series ranks metals by how readily they form positive ions. A more reactive metal can displace a less reactive metal from its compound because it loses electrons more readily. Displacement reactions provide evidence for the relative reactivity of metals.","Metals more reactive than carbon are extracted by electrolysis; less reactive metals can often be extracted by reduction with carbon. This links extraction method to the metal's position in the reactivity series and has economic and energy implications.","Electrolysis uses direct current to decompose an ionic substance. Positive ions move to the negative cathode and gain electrons; negative ions move to the positive anode and lose electrons. In aqueous solutions, hydrogen or oxygen may form instead of the metal or halogen."],"terms":["Reactivity series — ranking of metals by how readily they react.","Displacement reaction — a more reactive element replaces a less reactive element in a compound.","Neutralisation — reaction of H⁺ and OH⁻ ions to form water.","Electrolysis — decomposition of an ionic substance using electricity.","Electrolyte — molten or dissolved ionic substance containing mobile ions.","Displacement reaction — reaction in which a more reactive element replaces a less reactive one in a compound.","Reduction — gain of electrons or removal of oxygen.","Electrolysis — decomposition of an ionic substance using electricity."],"prompts":["How does the reactivity series predict displacement reactions?","What is oxidation and reduction in terms of electrons?","Write word equations for acids reacting with metals and carbonates.","What happens at the cathode and anode during electrolysis?","Explain why magnesium displaces copper from copper sulfate but copper does not displace magnesium.","Why are metals above carbon in the reactivity series extracted by electrolysis?","Describe the movement and electron changes of ions during electrolysis."],"q":"Which gas is produced when an acid reacts with a reactive metal?","a":["hydrogen"],"exam":"Explain why aluminium is extracted by electrolysis rather than by reduction with carbon.","mark":"Aluminium is more reactive than carbon, so carbon cannot remove oxygen from aluminium oxide. Electrolysis supplies electrical energy to reduce aluminium ions at the cathode; this process is energy-intensive.","gapWords":["reactivity","displacement","hydrogen","hydrogen","crystallising","electrolysis"],"practical":"Required practical focus: prepare a pure, dry sample of a soluble salt from an insoluble base. Warm the acid, add excess base until no more reacts, filter, gently evaporate some water, allow crystals to form, then dry them. Avoid heating to dryness.","multi":{"prompt":"Select every accurate statement about chemical changes.","options":[["a","Hydrogen ions react with hydroxide ions to form water.",true],["b","Positive ions gain electrons at the cathode.",true],["c","A carbonate reacting with acid produces hydrogen gas.",false],["d","Solid ionic compounds conduct because ions are fixed in place.",false]],"explanation":"Neutralisation forms water from H⁺ and OH⁻, and cations gain electrons at the cathode. Acids and carbonates release carbon dioxide; ions cannot move in solid ionic compounds."},"commonMistakes":["The cathode is negative in electrolysis and attracts positive ions.","Oxidation is loss of electrons; reduction is gain of electrons (OIL RIG).","A metal's extraction method depends on its reactivity compared with carbon."],"examQuestions":[{"question":"Explain why aluminium is extracted by electrolysis rather than by heating its oxide with carbon.","marks":"Aluminium is more reactive than carbon, so carbon cannot remove oxygen from aluminium oxide. Electrolysis supplies electrical energy to decompose the molten ionic compound; aluminium ions gain electrons at the cathode."}]},{"id":"energy-changes","title":"Energy changes","tag":"Combined & Triple","summary":"Exothermic and endothermic reactions, reaction profiles, bond energies and fuel cells.","notes":["Chemical reactions involve energy changes because bonds in reactants must be broken and new bonds form in products. Breaking bonds requires energy; forming bonds releases energy.","An exothermic reaction transfers energy to the surroundings, so the surroundings warm up. Examples include combustion, many oxidations and neutralisation reactions.","An endothermic reaction takes in energy from the surroundings, so the surroundings cool down. Examples include some thermal decompositions and instant cold-pack reactions.","Reaction profiles show the energy of reactants and products. Activation energy is the minimum energy needed to start a reaction; the overall energy change is the difference between product and reactant energy levels.","Average bond energies can estimate reaction energy change: energy change = energy needed to break bonds − energy released when bonds form. A negative result indicates an exothermic reaction; a positive result indicates an endothermic reaction.","Hydrogen fuel cells generate electricity as hydrogen reacts with oxygen to form water. They can operate continuously while fuel is supplied, but the environmental impact depends on how hydrogen is produced, stored and transported.","An exothermic reaction transfers energy to the surroundings, so the surroundings warm up. An endothermic reaction takes in energy from the surroundings, so the surroundings cool down. Temperature change can be used as evidence, provided heat exchange with the environment is considered.","Reaction profile diagrams show the energy of reactants and products. For an exothermic reaction, products are at lower energy than reactants; for an endothermic reaction, products are higher. Activation energy is the minimum energy particles need for a successful reaction.","Bond breaking requires energy and bond making releases energy. The overall energy change depends on the difference between energy needed to break bonds and energy released when new bonds form. This can explain why a reaction is exothermic or endothermic."],"terms":["Exothermic — reaction that transfers energy to the surroundings.","Endothermic — reaction that takes in energy from the surroundings.","Activation energy — minimum energy particles need for a reaction to occur.","Reaction profile — diagram showing energy changes during a reaction.","Bond energy — energy needed to break one mole of a specified bond.","Reaction profile — diagram showing energy changes during a reaction.","Activation energy — minimum energy needed for a successful reaction.","Bond enthalpy — energy required to break a specified covalent bond."],"prompts":["How do bond breaking and bond formation affect energy?","How can temperature change identify an exothermic or endothermic reaction?","What does activation energy represent on a reaction profile?","How are average bond energies used to estimate reaction energy change?","How can a temperature change identify an exothermic or endothermic reaction?","On a reaction profile, where is activation energy measured?","Explain why bond breaking takes in energy but bond making releases energy."],"q":"Does an exothermic reaction warm or cool its surroundings?","a":["warm","warms"],"exam":"Explain, in terms of bond energies, why combustion is exothermic.","mark":"Energy is needed to break bonds in the fuel and oxygen. More energy is released when new bonds form in carbon dioxide and water than was needed to break the original bonds, so there is a net transfer of energy to the surroundings.","gapWords":["breaking","surroundings","endothermic","activation","released","hydrogen"],"practical":"Required practical focus: measure temperature changes when chemicals react or dissolve. Insulate the container, use a lid, measure initial and maximum/minimum temperature, keep volumes and concentrations constant and repeat. Explain heat loss to the surroundings as a limitation.","multi":{"prompt":"Select every accurate statement about reaction energy changes.","options":[["a","Breaking chemical bonds requires energy.",true],["b","An exothermic reaction transfers energy to its surroundings.",true],["c","A catalyst changes the overall energy difference between reactants and products.",false],["d","An endothermic reaction always warms its surroundings.",false]],"explanation":"Bond breaking requires energy and exothermic reactions release energy overall. A catalyst lowers activation energy but does not change the overall energy change."},"commonMistakes":["Exothermic means energy is transferred to the surroundings; endothermic means energy is taken in.","A catalyst lowers activation energy but does not change the overall energy difference between reactants and products.","Breaking bonds is endothermic; making bonds is exothermic."],"examQuestions":[{"question":"A student dissolves a salt in water and the temperature falls. Explain what this indicates about the energy transfer.","marks":"The process is endothermic because energy is transferred from the surroundings into the dissolving system. The water loses thermal energy, so its temperature falls. More energy is needed to separate particles than is released when new interactions form."}]},{"id":"rates-chemical-change","title":"The rate and extent of chemical change","tag":"Combined & Triple","summary":"Collision theory, rate factors, catalysts, reversible reactions and equilibrium.","notes":["Reaction rate describes how quickly reactants are used up or products form. It can be measured as amount of reactant used or product formed per unit time; a steeper graph means a faster rate.","Particles must collide for a reaction to occur. A collision is successful only if particles have enough energy to overcome the activation energy and are correctly oriented.","Higher temperature increases particle kinetic energy, so particles move faster and a greater proportion have energy above the activation energy. The rate therefore increases.","Higher concentration or gas pressure puts more particles into a given volume, increasing collision frequency. A larger solid surface area exposes more particles and also increases collision frequency.","A catalyst provides an alternative reaction pathway with a lower activation energy. It increases rate without being used up overall and does not change the position of equilibrium.","Some reactions are reversible. In a closed system at dynamic equilibrium, forward and reverse reactions continue at equal rates, so concentrations remain constant. Changing temperature, pressure or concentration can shift the equilibrium position.","Collision theory explains reaction rate. Particles must collide, and collisions must have energy equal to or greater than the activation energy. Increasing temperature raises average kinetic energy and the fraction of particles with enough energy to react.","Powdered solids react faster than large lumps of the same mass because they expose a larger surface area. More reactant particles are available at the surface, so collisions with other reactants happen more frequently.","A reversible reaction can proceed in both directions. In a closed system at dynamic equilibrium, forward and reverse reactions continue at equal rates, so concentrations remain constant. Changing conditions can shift the position of equilibrium to oppose the change."],"terms":["Reaction rate — change in amount of reactant or product per unit time.","Collision theory — reactions occur when particles collide successfully.","Activation energy — minimum energy needed for a successful reaction.","Catalyst — substance that increases rate without being used up overall.","Dynamic equilibrium — forward and reverse reactions occur at equal rates in a closed system.","Collision theory — model linking successful particle collisions to reaction rate.","Dynamic equilibrium — state where forward and reverse reactions occur at equal rates in a closed system.","Activation energy — minimum energy needed for a successful collision."],"prompts":["What makes a collision successful?","Explain why temperature increases reaction rate.","How do concentration, pressure and surface area affect collision frequency?","What is dynamic equilibrium?","Use collision theory to explain how higher temperature increases rate.","Why does powdered calcium carbonate react faster than equal-mass lumps?","What is dynamic equilibrium and why do concentrations remain constant?"],"q":"How does a catalyst increase reaction rate?","a":["provides an alternative pathway with lower activation energy","lowers activation energy"],"exam":"Explain, using collision theory, why powdered calcium carbonate reacts faster with acid than large chips of the same mass.","mark":"Powder has a greater total surface area exposed to the acid. More acid particles can collide with the solid each second, so the frequency of successful collisions increases and the reaction is faster.","gapWords":["rate","collide","temperature","concentration","catalyst","equilibrium"],"practical":"Required practical focus: investigate how concentration affects the rate of reaction between sodium thiosulfate and hydrochloric acid. Measure the time until a marked cross disappears, keep temperature and total volume controlled, repeat and compare rate using 1 ÷ time. Use eye protection and assess acid risks.","multi":{"prompt":"Select every accurate statement about reaction rates.","options":[["a","Higher concentration can increase collision frequency.",true],["b","A catalyst provides an alternative route with lower activation energy.",true],["c","A catalyst is used up permanently in a reaction.",false],["d","Increasing surface area reduces the number of exposed particles.",false]],"explanation":"Higher concentration and surface area can increase successful collision frequency; catalysts lower activation energy and are not used up overall."},"commonMistakes":["A catalyst provides an alternative pathway with lower activation energy; it does not increase particle energy.","At equilibrium, reactions have not stopped; forward and reverse rates are equal.","Increasing concentration usually increases collision frequency, not the energy of each collision."],"examQuestions":[{"question":"Explain, using collision theory, why increasing the concentration of acid increases the rate of reaction with magnesium.","marks":"A higher concentration means more acid particles in the same volume. Magnesium is therefore hit by acid particles more frequently; successful collisions happen more often per second, so the reaction rate increases."}]},{"id":"organic-chemistry","title":"Organic chemistry","tag":"Combined & Triple","summary":"Crude oil, hydrocarbons, fractional distillation, cracking, alkanes, alkenes and polymers.","notes":["Crude oil is a finite mixture of hydrocarbons formed from the remains of ancient organisms over millions of years. A hydrocarbon contains hydrogen and carbon only.","Crude oil is separated by fractional distillation. The mixture is heated and vapours rise through a fractionating column; fractions condense at different temperatures because they have different boiling-point ranges.","Shorter-chain hydrocarbons tend to be more volatile, have lower boiling points, flow more easily and ignite more readily. Longer-chain hydrocarbons tend to be more viscous and less flammable.","Alkanes are saturated hydrocarbons with only single carbon-carbon bonds. Their general formula is CₙH₂ₙ₊₂. Complete combustion in plentiful oxygen produces carbon dioxide and water.","Cracking breaks long-chain hydrocarbons into shorter alkanes and alkenes using heat and a catalyst or steam. It helps match supply to demand and produces alkenes used to make polymers.","Alkenes are unsaturated and contain a carbon-carbon double bond; their general formula is CₙH₂ₙ. They decolourise bromine water. Addition polymerisation joins many alkene molecules into a long-chain polymer.","Crude oil is a finite mixture of hydrocarbons formed from ancient biomass. Fractional distillation separates hydrocarbons by boiling point: the column is hot at the bottom and cooler near the top, so vapours condense at different heights.","Cracking breaks long-chain hydrocarbons into shorter alkanes and alkenes. It helps meet demand for fuels and produces alkenes used to make polymers. Thermal cracking uses high temperature; catalytic cracking uses a catalyst and different operating conditions.","Alkanes are saturated hydrocarbons with only single carbon-carbon bonds and general formula CₙH₂ₙ₊₂. Complete combustion produces carbon dioxide and water; incomplete combustion can produce carbon monoxide and soot when oxygen is limited."],"terms":["Hydrocarbon — compound containing hydrogen and carbon only.","Saturated — molecule containing only carbon-carbon single bonds.","Alkane — saturated hydrocarbon with general formula CₙH₂ₙ₊₂.","Alkene — unsaturated hydrocarbon containing a carbon-carbon double bond.","Polymer — large molecule made from many repeating monomer units.","Hydrocarbon — compound containing hydrogen and carbon only.","Saturated — molecule containing only single carbon-carbon bonds.","Cracking — breaking long-chain hydrocarbons into smaller molecules."],"prompts":["Why is crude oil described as a mixture and a finite resource?","How does fractional distillation separate crude oil?","Compare properties of short-chain and long-chain hydrocarbons.","What happens during cracking and why are alkenes useful?","How does a fractionating column separate crude oil into fractions?","Why is cracking economically useful?","Compare complete and incomplete combustion of an alkane."],"q":"Which functional feature makes an alkene unsaturated?","a":["carbon-carbon double bond","a carbon-carbon double bond","double bond"],"exam":"Explain why cracking is useful to the petrochemical industry.","mark":"Demand for shorter-chain fuels and alkenes can exceed supply. Cracking converts less useful long-chain hydrocarbons into shorter alkanes for fuels and alkenes used as chemical feedstock and monomers for polymers.","gapWords":["hydrocarbons","fractional","volatile","single","cracking","double"],"practical":"Required practical focus: test for an alkene by adding bromine water. An alkene decolourises orange bromine water because addition occurs across the carbon-carbon double bond; a saturated alkane does not decolourise it under the same conditions.","multi":{"prompt":"Select every accurate statement about hydrocarbons.","options":[["a","Crude oil is a mixture of hydrocarbons.",true],["b","Alkenes contain a carbon-carbon double bond.",true],["c","Alkanes are unsaturated compounds with a double bond.",false],["d","Cracking converts long chains only into longer chains.",false]],"explanation":"Crude oil is a mixture, and alkenes contain a C=C bond. Alkanes are saturated; cracking breaks long chains into shorter molecules, including alkenes."},"commonMistakes":["Alkanes are saturated; alkenes contain a carbon-carbon double bond and are unsaturated.","Fractional distillation separates by boiling point; it does not make new chemicals.","Incomplete combustion can produce toxic carbon monoxide."],"examQuestions":[{"question":"Explain how fractional distillation separates crude oil and why cracking is also needed.","marks":"Crude oil is heated so most hydrocarbons vaporise; vapours rise through a temperature gradient and condense at heights where their boiling points are reached. Cracking converts some long-chain fractions into shorter, more useful fuels and alkenes for polymer manufacture."}]},{"id":"chemical-analysis","title":"Chemical analysis","tag":"Combined & Triple","summary":"Pure substances, formulations, chromatography, gas tests and identifying ions.","notes":["A pure substance contains only one element or compound and has a fixed melting and boiling point. A mixture contains more than one substance and often melts or boils over a range.","Formulations are useful mixtures designed as products with particular properties, such as fuels, paints, medicines, cleaning products and alloys. Their components are selected and measured for a purpose.","Paper chromatography separates soluble substances because they have different attractions to the stationary paper and mobile solvent. A substance that is more soluble in the solvent and less attracted to paper travels further.","Use Rf = distance travelled by substance ÷ distance travelled by solvent front. The distances must be measured from the same baseline; Rf values can help compare substances when conditions are identical.","Gas tests identify common gases: hydrogen gives a squeaky pop with a lit splint; oxygen relights a glowing splint; carbon dioxide turns limewater cloudy; chlorine bleaches damp litmus paper.","Flame tests can help identify metal ions: lithium crimson, sodium yellow, potassium lilac, calcium orange-red, copper green-blue. Instrumental methods can be more reliable and sensitive when mixtures or small concentrations are involved.","Pure substances have sharp melting and boiling points. An impure substance usually melts over a range and at a lower temperature. Comparing a measured melting point with a known value helps assess purity.","Paper chromatography separates dissolved substances because they partition differently between a stationary phase (paper) and a mobile phase (solvent). Substances more soluble in the solvent and less strongly attracted to the paper travel further.","Gas tests identify common gases: hydrogen gives a squeaky pop with a lit splint; oxygen relights a glowing splint; carbon dioxide turns limewater cloudy; chlorine bleaches damp litmus paper. Use small quantities and appropriate safety controls."],"terms":["Pure substance — a single element or compound, not a mixture.","Formulation — mixture designed as a useful product with specific properties.","Chromatography — method for separating dissolved substances by their movement through a medium.","Rf value — distance moved by a substance divided by distance moved by solvent front.","Precipitate — insoluble solid formed when solutions react.","Chromatogram — pattern of separated substances after chromatography.","Stationary phase — material that remains in place during chromatography.","Mobile phase — solvent that moves through the stationary phase."],"prompts":["How can melting point evidence distinguish a pure substance from a mixture?","How does paper chromatography separate substances?","How do you calculate an Rf value?","Which tests identify hydrogen, oxygen and carbon dioxide?","How can melting point data be used to judge purity?","Why do different substances move different distances in paper chromatography?","State the tests for hydrogen, oxygen, carbon dioxide and chlorine."],"q":"Which gas turns limewater cloudy?","a":["carbon dioxide"],"exam":"A chromatogram shows two spots in one sample. What does this suggest, and how can the substances be compared?","mark":"The sample contains at least two soluble components. Compare their positions or calculate Rf values using the same solvent and conditions; matching Rf values provide evidence that components may be the same substance, but do not prove identity alone.","gapWords":["mixture","formulations","stationary","solvent","limewater","flame"],"practical":"Required practical focus: use paper chromatography to separate dyes in inks or food colourings. Draw a pencil baseline, apply small concentrated spots, place the paper in solvent below the baseline, allow the solvent to rise, mark the solvent front and calculate Rf values.","multi":{"prompt":"Select every accurate statement about chemical analysis.","options":[["a","A pure substance has a fixed melting point.",true],["b","Chromatography can separate components of a mixture.",true],["c","Oxygen turns limewater cloudy.",false],["d","Rf is solvent distance divided by substance distance.",false]],"explanation":"Pure substances have fixed melting points and chromatography separates components. Carbon dioxide turns limewater cloudy; Rf = substance distance ÷ solvent distance."},"commonMistakes":["In chromatography, draw the baseline in pencil because ink can dissolve and separate.","The Rf value is spot distance divided by solvent-front distance.","A glowing splint is used for oxygen; a lit splint with a squeaky pop is used for hydrogen."],"examQuestions":[{"question":"A chromatogram shows three spots in an unknown ink. Explain how the student can decide whether the ink contains a known dye.","marks":"Run known dyes alongside the unknown using the same solvent and conditions. Compare the positions or Rf values of the spots; a matching Rf under the same conditions is evidence that the dye may be present, although one matching result does not prove identity with absolute certainty."}]},{"id":"atmosphere","title":"Chemistry of the atmosphere","tag":"Combined & Triple","summary":"Evolution of Earth's atmosphere, greenhouse gases, climate change and pollutants.","notes":["The early atmosphere probably contained large amounts of carbon dioxide and water vapour, with nitrogen and small amounts of other gases, and little or no oxygen. Volcanic activity released gases.","As Earth cooled, water vapour condensed to form oceans. Carbon dioxide dissolved in oceans and became locked in carbonate sediment and rocks; later, photosynthetic algae and plants increased atmospheric oxygen.","Today's atmosphere is about 78% nitrogen and 21% oxygen, with small amounts of argon, carbon dioxide and other gases. The proportions of some gases vary naturally and through human activity.","Greenhouse gases, including carbon dioxide, methane and water vapour, absorb infrared radiation emitted by Earth's surface and re-emit it. This natural greenhouse effect keeps Earth warm enough for life.","Human activity increases greenhouse gas concentrations through fossil-fuel combustion, deforestation, agriculture and waste. Enhanced greenhouse warming contributes to climate change, affecting weather patterns, sea levels and ecosystems.","Combustion can release pollutants: carbon monoxide from incomplete combustion is toxic; sulfur dioxide contributes to acid rain; nitrogen oxides contribute to acid rain and respiratory problems; particulates damage health and reduce visibility.","Early Earth's atmosphere was likely produced by volcanic activity and contained much more carbon dioxide and water vapour than today, with little oxygen. As Earth cooled, water vapour condensed to form oceans and carbon dioxide dissolved or became locked in carbonate rocks and fossil fuels.","Photosynthetic algae and plants released oxygen. Over long timescales, oxygen accumulated and allowed aerobic organisms to evolve. This changed the composition of the atmosphere and created conditions for more complex life.","Greenhouse gases absorb some outgoing infrared radiation and re-emit it in all directions, keeping the lower atmosphere warmer. Human activities increase greenhouse gas concentrations, strengthening the greenhouse effect and contributing to global climate change."],"terms":["Greenhouse gas — gas that absorbs and re-emits infrared radiation.","Enhanced greenhouse effect — additional warming caused by increased greenhouse-gas concentrations.","Carbon footprint — total greenhouse-gas emissions associated with an activity or product.","Particulate — tiny solid or liquid particle suspended in air.","Incomplete combustion — burning with insufficient oxygen, producing carbon monoxide or soot.","Greenhouse effect — warming caused when atmospheric gases absorb and re-emit infrared radiation.","Carbon sink — reservoir that stores more carbon than it releases over a period.","Climate change — long-term change in average climate patterns."],"prompts":["How did oceans and photosynthetic organisms change the early atmosphere?","What gases make up most of today's atmosphere?","How does the greenhouse effect warm Earth?","Name pollutants from combustion and explain their impacts.","Describe two processes that reduced carbon dioxide in the early atmosphere.","How did photosynthetic organisms change the atmosphere?","Explain how increasing greenhouse gas concentration can raise global temperatures."],"q":"Which gas makes up the largest proportion of Earth's atmosphere?","a":["nitrogen"],"exam":"Explain how human activities can increase the greenhouse effect.","mark":"Burning fossil fuels releases carbon dioxide; deforestation reduces carbon dioxide removal by photosynthesis; agriculture and waste release methane. Higher greenhouse-gas concentrations absorb more outgoing infrared radiation, increasing warming.","gapWords":["volcanic","oceans","nitrogen","infrared","climate","combustion"],"practical":"Practical/data focus: interpret atmospheric composition and climate data. Distinguish correlation from proof of causation, compare trends over appropriate timescales and identify uncertainties in measurements and climate models.","multi":{"prompt":"Select every accurate statement about the atmosphere.","options":[["a","Nitrogen makes up the largest proportion of Earth's atmosphere.",true],["b","Greenhouse gases absorb and re-emit infrared radiation.",true],["c","Combustion of fossil fuels removes carbon dioxide.",false],["d","Sulfur dioxide has no environmental or health effects.",false]],"explanation":"The atmosphere is mostly nitrogen, and greenhouse gases absorb infrared radiation. Fossil-fuel combustion releases carbon dioxide; sulfur dioxide contributes to acid rain and respiratory problems."},"commonMistakes":["The greenhouse effect is natural and makes Earth habitable; enhanced greenhouse warming is linked to rising greenhouse gas concentrations.","Weather describes short-term conditions; climate describes long-term patterns.","Carbon dioxide is not the most abundant atmospheric gas; nitrogen is."],"examQuestions":[{"question":"Explain how photosynthesis and the formation of oceans changed the early Earth's atmosphere.","marks":"As Earth cooled, water vapour condensed and formed oceans. Carbon dioxide dissolved in oceans and became locked in carbonate sediments and rocks. Photosynthetic organisms used carbon dioxide and released oxygen, so atmospheric carbon dioxide fell and oxygen increased over time."}]},{"id":"using-resources","title":"Using resources","tag":"Combined & Triple","summary":"Finite and renewable resources, potable water, life-cycle assessment and recycling.","notes":["Humans use natural resources to provide food, water, energy and raw materials. Finite resources are used faster than they are naturally replaced; renewable resources can be replenished on a human timescale.","Potable water is safe to drink, not chemically pure water. Fresh water can be made potable by choosing a suitable source, sedimentation and filtration to remove solids, then sterilisation to kill microorganisms.","Desalination removes dissolved salts from seawater by distillation or membrane processes such as reverse osmosis. It can provide fresh water but requires energy and suitable infrastructure.","Life-cycle assessments consider environmental impacts at each stage: extracting raw materials, manufacturing, packaging, transport, use and disposal. Boundaries, data quality and weighting choices can affect conclusions.","Recycling reduces demand for raw materials and can reduce energy use and waste, but collection, sorting and reprocessing also require energy and resources. The best option depends on material, transport and processing.","Industrial processes aim to conserve resources, reduce waste and maximise useful product. A sustainable approach considers environmental, social and economic effects over the whole product life cycle.","Life-cycle assessment evaluates environmental impacts across a product's life: extracting raw materials, manufacture, packaging, transport, use and disposal. It considers energy, water, raw materials, emissions and waste. Comparisons are only fair when assumptions and system boundaries are consistent.","Potable water is safe to drink but is not chemically pure. Fresh water may be treated by filtration to remove solids and sterilisation using chlorine, ozone or ultraviolet light to kill microorganisms. Desalination can make seawater potable but requires significant energy.","Finite metal resources can be conserved by reducing use, reusing products and recycling. Recycling often saves energy and reduces mining, but collection, transport and separation also use resources. A balanced evaluation considers the whole process rather than one stage."],"terms":["Finite resource — resource used faster than it is naturally replaced.","Renewable resource — resource replenished on a human timescale.","Potable water — water safe to drink.","Desalination — removal of dissolved salts from seawater.","Life-cycle assessment — evaluation of environmental impacts across a product's life.","Potable water — water safe to drink, though not chemically pure.","Life-cycle assessment — evaluation of environmental impacts across a product's life.","Desalination — removal of dissolved salts from seawater."],"prompts":["What is the difference between a finite and renewable resource?","How is fresh water treated to make it potable?","Why does desalination require energy?","What stages are considered in a life-cycle assessment?","List the main stages considered in a life-cycle assessment.","Why is potable water not the same as pure water?","Evaluate one benefit and one limitation of recycling metals."],"q":"Does potable water mean chemically pure water?","a":["no","no, it means safe to drink"],"exam":"Evaluate why recycling metals can reduce environmental impact but does not have zero impact.","mark":"Recycling reduces mining, habitat damage and energy used to extract metals from ores. However, collection, sorting, transport and reprocessing use energy and may produce emissions; the overall benefit depends on the metal and recycling system.","gapWords":["finite","filtration","desalination","stage","recycling","sustainable"],"practical":"Practical/data focus: compare methods of water treatment or material recycling using evidence. Discuss the quality of the starting material, energy needed, waste produced, transport and whether the final product meets the required specification.","multi":{"prompt":"Select every accurate statement about resources.","options":[["a","Potable water is water that is safe to drink.",true],["b","A life-cycle assessment considers several stages of a product's life.",true],["c","Desalination adds dissolved salts to seawater.",false],["d","Recycling has no energy or environmental costs.",false]],"explanation":"Potable means safe to drink and life-cycle assessment considers stages from extraction to disposal. Desalination removes salts; recycling still requires energy and transport."},"commonMistakes":["A product's environmental impact is not determined by disposal alone; include extraction, manufacture, transport and use.","Filtration removes insoluble particles; sterilisation kills microorganisms.","Recycling usually saves resources but is not impact-free."],"examQuestions":[{"question":"A company claims a reusable bottle is always better for the environment than a disposable bottle. Explain why a life-cycle assessment is needed before accepting the claim.","marks":"Consider raw materials, manufacture, transport, washing during use and disposal for both bottles. Reusable bottles may need more resources initially but can spread that impact across many uses; conclusions depend on material, number of uses, washing, transport and assumptions used."}]},{"id":"chemistry-key-ideas","title":"Chemistry key ideas and scientific thinking","tag":"Cross-topic key ideas","summary":"Connect atoms, structure, reactions, quantities, energy, rates and the sustainable use of materials.","notes":["Chemical explanations use models of particles and atoms. Properties of materials are linked to the arrangement and movement of particles and the forces or bonds between them.","Atoms are conserved in ordinary chemical reactions: bonds break and new bonds form, but atoms are rearranged. Balanced symbol equations show the same number of each type of atom on both sides.","Quantitative chemistry connects equations to measurable amounts. Relative formula mass, moles, concentrations and balanced-equation ratios allow chemists to predict how much reactant is needed and how much product can form.","Energy changes and reaction rates are linked but are not the same. Bond changes determine whether a reaction is exothermic or endothermic; collision frequency and activation energy help determine how quickly it happens.","Patterns in the periodic table help predict chemical behaviour. Elements in a group have related outer-shell arrangements, while trends in reactivity can be used to predict displacement and extraction reactions.","Chemistry supports material choices and environmental decisions. Life-cycle assessments compare extraction, manufacture, transport, use and disposal; recycling and efficient processes can conserve finite resources but still have impacts."],"terms":["Model — simplified representation used to explain or predict a system.","Conservation of mass — total mass remains constant in a closed chemical reaction.","Stoichiometry — quantitative relationships between substances in a balanced equation.","Activation energy — minimum energy required for a successful reaction.","Life-cycle assessment — evaluation of environmental impacts across a product's life."],"prompts":["How does particle structure explain differences in material properties?","Why must a chemical equation have the same atoms on both sides?","How do balanced equations connect to moles and reacting masses?","How are reaction energy and reaction rate different?","How can periodic patterns help predict chemical reactions?","What stages should be considered in a life-cycle assessment?"],"q":"Why must a symbol equation be balanced?","a":["the same number of each type of atom must be on both sides","atoms are conserved","conservation of mass"],"exam":"Explain how the particle model, balanced equations and quantitative chemistry work together to predict the products of a reaction.","mark":"The particle model represents substances as atoms, molecules or ions. During a reaction particles rearrange and atoms are conserved, so the symbol equation is balanced. Coefficients give mole ratios, which can be combined with Mr and mass or concentration data to calculate quantities.","gapWords":["particles","balanced","moles","activation","periodic","recycling"],"practical":"Working scientifically: select appropriate apparatus and resolution; record measurements with units; repeat and calculate means; identify anomalies; use graphs and gradients where appropriate; distinguish accuracy from precision; assess uncertainty and evaluate improvements to the method.","multi":{"prompt":"Select every accurate statement connecting chemical key ideas.","options":[["a","Atoms are rearranged rather than created or destroyed in ordinary reactions.",true],["b","Balanced equations show conservation of each type of atom.",true],["c","A catalyst changes the products and overall energy change of every reaction.",false],["d","Life-cycle assessment considers only a product's use phase.",false]],"explanation":"Atoms are conserved and balanced equations represent their rearrangement. Catalysts change pathways and rate; life-cycle assessment considers multiple stages."}},{"id":"chemistry-separate-extensions","title":"Separate Chemistry extensions","tag":"Separate Science only","summary":"Additional AQA Chemistry content: nanoparticles, fullerene structures, alkene reactions, alcohols, carboxylic acids and polymers.","notes":["Nanoscience studies structures roughly 1–100 nm in size. Nanoparticles have a very large surface-area-to-volume ratio compared with the same material in bulk, so they can show different properties or be effective in smaller quantities.","Nanoparticles are used in medicine, electronics, cosmetics, sun creams and catalysts. Their usefulness depends on the application, but their small size raises questions about how they enter organisms and what risks they may pose; evaluate claims using evidence rather than assuming they are always safe or dangerous.","Graphene is a single layer of graphite in a hexagonal arrangement of carbon atoms. Fullerenes are hollow carbon molecules; Buckminsterfullerene (C₆₀) is spherical, while carbon nanotubes are cylindrical structures with a high length-to-diameter ratio and useful electrical and mechanical properties.","Alkenes have the C=C functional group and general formula CₙH₂ₙ. They undergo addition reactions: hydrogen makes an alkane, halogens add across the double bond, and steam can produce an alcohol under suitable conditions. The double bond becomes a single bond.","Alcohols contain the –OH functional group. The first four are methanol, ethanol, propanol and butanol. They burn in oxygen, mix with water to varying extents, react with sodium to release hydrogen and can be oxidised; ethanol can be produced by fermenting sugar with yeast in warm, anaerobic conditions.","Carboxylic acids contain the –COOH group. Ethanoic acid is found in vinegar. They react with carbonates to produce a salt, water and carbon dioxide, and can react with alcohols to form esters. Addition polymers form when alkene monomers join; condensation polymerisation joins monomers with two functional groups and releases a small molecule such as water.","The amount of substance is measured in moles. The Avogadro constant gives the number of particles in one mole. For a substance, moles = mass ÷ relative formula mass. A balanced equation gives the mole ratio between reactants and products; use this ratio before converting back to mass.","Solution concentration can be expressed in mol/dm³. Concentration = moles ÷ volume in dm³. Convert cm³ into dm³ by dividing by 1,000. In a titration, use the balanced equation and measured volumes to determine the unknown concentration.","An acid-alkali titration uses a pipette to measure a fixed volume of one solution into a conical flask and a burette to add the other solution. Add indicator, swirl and approach the end point dropwise. Repeat until concordant titres are obtained; use a mean of concordant results.","Dynamic equilibrium occurs in a closed system when forward and reverse reactions happen at the same rate. The concentrations remain constant, but the reactions continue. Changing temperature, pressure or concentration can shift the equilibrium position; a catalyst speeds up both directions and does not change the equilibrium position.","Bond energies can be used to estimate reaction energy change: energy change = energy to break bonds − energy released making bonds. Breaking bonds takes in energy; making bonds releases energy. The result is an estimate because tabulated bond energies are mean values.","Organic molecules are identified by functional groups. Alcohols contain –OH, carboxylic acids contain –COOH and alkenes contain C=C. Carboxylic acids react with alcohols to form esters; addition polymers are made when alkene monomers join across the double bond."],"terms":["Nanoparticle — particle typically between 1 and 100 nanometres in size.","Surface-area-to-volume ratio — surface area divided by volume; increases as a particle gets smaller.","Fullerene — hollow molecule made only from carbon atoms.","Functional group — group of atoms responsible for characteristic reactions of an organic molecule.","Addition polymerisation — joining many alkene monomers to make a polymer without forming another product.","Mole — amount of substance containing the Avogadro number of particles.","Concentration — amount of solute per unit volume of solution.","Titration — method using measured volumes to determine how much solution reacts.","Dynamic equilibrium — state in a closed system where forward and reverse reaction rates are equal.","Bond energy — energy required to break one mole of a specified covalent bond."],"prompts":["Why can nanoparticles behave differently from the same material in bulk?","What is one possible use and one possible risk of nanoparticles?","Compare the structures of graphene, Buckminsterfullerene and carbon nanotubes.","What happens to the C=C bond in an alkene addition reaction?","Describe two reactions of alcohols and the conditions for fermentation.","How can a carboxylic acid react with a carbonate, and what is formed?","A sample contains 12 g of carbon. Calculate the amount in moles using Ar(C) = 12.","A solution contains 0.25 mol in 500 cm³. Calculate its concentration in mol/dm³.","Why are concordant titres repeated and averaged?","Explain why changing temperature can alter the position of a reversible reaction's equilibrium.","How can bond energies be used to estimate whether a reaction is exothermic or endothermic?","Identify the functional groups in ethanol, ethanoic acid and ethene."],"q":"Which functional group identifies an alcohol?","a":["–OH","oh","hydroxyl group"],"exam":"Explain why nanoparticles may be effective catalysts but also require careful safety evaluation.","mark":"Their very high surface-area-to-volume ratio exposes a large proportion of atoms at the surface, so relatively small quantities can provide many active sites. Their small size may also allow them to enter organisms or cells, so exposure, toxicity and environmental persistence need evidence-based assessment.","gapWords":["structures","medicine","hexagonal","addition","fermenting","esters"],"practical":"AQA application focus: compare bulk materials and nanoparticles using particle size and surface-area-to-volume ideas; recognise functional groups in displayed formulae; predict products of addition reactions; describe fermentation conditions; explain polymer formation from monomers and identify repeating units.","multi":{"prompt":"Select every accurate statement about Separate Chemistry organic chemistry and nanoscience.","options":[["a","Alcohols contain the –OH functional group.",true],["b","Alkenes undergo addition reactions across C=C.",true],["c","Carboxylic acids contain the –NH₂ functional group.",false],["d","Nanoparticles always have a smaller surface-area-to-volume ratio than bulk material.",false]],"explanation":"Alcohols contain –OH and alkene addition occurs across C=C. Carboxylic acids contain –COOH; smaller nanoparticles have a larger surface-area-to-volume ratio."},"commonMistakes":["Convert cm³ to dm³ before using concentration in mol/dm³.","Use the balanced equation's mole ratio; do not assume every reaction has a 1:1 ratio.","A catalyst changes the rate at which equilibrium is reached, not the final equilibrium position."],"examQuestions":[{"question":"A solution contains 0.25 mol of solute in 500 cm³. Calculate its concentration in mol/dm³.","marks":"500 cm³ = 0.500 dm³. Concentration = moles ÷ volume = 0.25 ÷ 0.500 = 0.50 mol/dm³."},{"question":"Explain why a catalyst does not change the position of equilibrium in a reversible reaction.","marks":"A catalyst provides an alternative pathway with lower activation energy for both forward and reverse reactions. Both rates increase, so equilibrium is reached sooner, but the rates remain equal at the same equilibrium composition."}]},{"id":"chemistry-required-practicals","title":"Chemistry required practicals","tag":"Practical skills","summary":"AQA practical methods for salts, titrations, electrolysis, temperature change, rates, chromatography, ion tests and water purification.","notes":["RP1 — Pure soluble salt: warm a dilute acid, add an excess of an insoluble oxide or carbonate until no more reacts, filter off the excess solid, gently evaporate some water and allow the solution to crystallise. Wash and dry the crystals; do not heat to dryness.","RP2 (Chemistry only) — Titration: rinse a pipette with the known solution and transfer a measured volume to a conical flask. Add a few drops of indicator, fill a burette with the other solution, record initial and final readings, add titrant while swirling and slow to dropwise near the end-point. Repeat to obtain concordant titres; Higher Tier uses reacting volumes to calculate concentration.","RP3 — Electrolysis: investigate aqueous ionic solutions using inert electrodes and a low-voltage direct-current supply. Observe products at each electrode, identify gases with suitable tests and use the ions present to predict products; positive ions move to the cathode and negative ions to the anode.","RP4 — Temperature changes: mix measured volumes or masses of reactants in an insulated cup, record initial temperature and the highest or lowest temperature reached. Compare temperature changes while changing one factor such as concentration or reactant identity; limit heat loss and keep total volume consistent.","RP5 and RP6 — Rates and chromatography: investigate concentration effects using gas volume over time or the time for a cross to disappear as tur
