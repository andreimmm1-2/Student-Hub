/* Hub refresh: clearer hierarchy, calmer spacing, responsive navigation */

.home-intro{margin:18px 0 16px}.home-intro h2{font-size:clamp(25px,4vw,34px);margin:12px 0 4px}.home-intro p{margin:4px 0 0}.hub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.hub-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;min-height:clamp(190px,25vw,270px);padding:clamp(18px,3vw,30px);border:0;border-radius:20px;color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.12);overflow:hidden;transition:transform .18s,filter .18s}.hub-tile:hover{transform:translateY(-3px);filter:brightness(1.06)}.hub-tile:focus-visible{outline:3px solid #fff;outline-offset:3px}.learn-tile{background:linear-gradient(145deg,#315c91,#203c68)}.community-tile{background:linear-gradient(145deg,#187b6d,#14534e)}.practice-tile{background:linear-gradient(145deg,#7650a3,#49306f)}.progress-tile{background:linear-gradient(145deg,#b46b35,#704323)}.tile-icon{font-size:clamp(32px,5vw,46px);line-height:1}.tile-title{font-size:clamp(23px,3vw,30px);font-weight:800;letter-spacing:-.7px}.tile-copy{font-size:14px;color:rgba(255,255,255,.84)}.tile-arrow{position:absolute;right:22px;top:20px;font-size:24px;color:rgba(255,255,255,.85)}.home-lower{margin-top:15px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.home-lower h3{margin:9px 0 0}.home-lower p{margin:3px 0}.nav{display:flex!important}.immersive header,.immersive .nav{display:none!important}.immersive .wrap{max-width:100%;padding:12px 18px 24px}.immersive #page{max-width:1000px;margin:0 auto}.immersive .flash{min-height:55vh}.immersive .card{box-shadow:none}.immersive-exit{display:flex;justify-content:flex-end;margin-bottom:10px}

.wrap{max-width:1440px}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px clamp(18px,4vw,42px);margin:8px 0 22px;border-radius:22px;color:#fff;min-height:160px}.page-heading h2{font-size:clamp(30px,4vw,44px);margin:10px 0 4px;color:#fff}.page-heading p{color:rgba(255,255,255,.82);margin:0;max-width:680px}.page-heading .pill{border-color:rgba(255,255,255,.35);color:#fff}.page-heading-icon{font-size:clamp(48px,7vw,76px);line-height:1;opacity:.95;padding:12px}.community-heading{background:linear-gradient(120deg,#176b61,#164b63)}.practice-heading{background:linear-gradient(120deg,#65409a,#3e397e)}.progress-heading{background:linear-gradient(120deg,#a95f32,#6b452f)}.updates-heading{background:linear-gradient(120deg,#315f91,#3c477e)}.admin-heading{background:linear-gradient(120deg,#3d4859,#222c3b)}.community-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:16px;align-items:start}.community-main{grid-row:span 2}.community-board{grid-column:1/-1}.section-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}.section-heading h3{margin:0}.section-heading p{margin:4px 0}.friend-add-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.friend-add-row .field{margin:4px 0}.duel-panel{background:linear-gradient(150deg,#e9f6f3,#fff)}body.dark .duel-panel{background:linear-gradient(150deg,#183e3a,#1b1f23)}.duel-panel .tile-icon{font-size:38px;margin:12px 0}.duel-panel h3{font-size:24px}.community-board{min-width:0}.practice-page{max-width:1180px;margin:0 auto}.practice-tabs{padding:8px;background:var(--soft);border-radius:14px;width:max-content;max-width:100%}.practice-tabs button.active{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.08)}.progress-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.progress-stats .card{min-height:145px}.progress-stats .score{font-size:clamp(30px,4vw,44px);font-weight:8 /* Global glass refresh: restrained graphite, soft lavender accents, translucent surfaces. */
:root{--bg:#eef0f4;--card:rgba(255,255,255,.68);--ink:#20232b;--muted:#697180;--line:rgba(105,116,139,.19);--accent:#7667b5;--soft:rgba(128,119,168,.10);--shadow:0 12px 34px rgba(34,39,56,.075);--glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.76)}

.card,.poem.card,.poem-library-grid .poem,.subject-course,.subject-hero,.auth,.practice-start,.learn-tabs,.subject-tabs,.feedback,.activity-top,.flash-stage,.blurt-session,.quiz-session,.progression-session{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(125%);-webkit-backdrop-filter:blur(18px) saturate(125%)}
.card,.poem.card,.poem-library-grid .poem,.subject-course,.subject-hero,.auth{border-radius:20px}

const poems=[
['Remains','Simon Armitage','War and conflict',[['blood-shadow','Metaphor','The compound noun “blood-shadow” fuses physical violence with something that follows the speaker. A shadow is difficult to escape, so the image suggests that the memory of killing has attached itself to the soldier and continues to haunt him after the event. Armitage makes guilt feel like a permanent presence rather than a passing emotion.','The violent act leaves lasting psychological trauma; the effects of conflict continue long after the battlefield.'],['tosses his guts','Violent imagery','The verb “tosses” is casual and almost dismissive, as if the body parts are an ordinary object. This matter-of-fact diction clashes with the horrific image of “guts”, making the violence feel brutally routine. Armitage may be showing how soldiers use detached language to cope with extreme experiences.','Conflict can normalise brutality and leave soldiers emotionally detached, even while they suffer lasting guilt.']]],
['War Photographer','Carol Ann Duffy','Victims and effects of war',[['light is red','Colour imagery','The simple colour image “red” can suggest blood, danger and suffering. Its starkness makes the photograph’s subject feel immediate, while the controlled darkroom setting contrasts with the chaos of the conflict being recorded. Duffy draws attention to the photographer’s difficult role: turning distant suffering into an image others can see.','The poem explores how war creates victims and how those far away encounter their suffering through images.']]],
['Poppies','Jane Weir','Victims and effects of war',[['bandaged ... Poppies ... blockade','War imagery','The word “bandaged” suggests injury and the need to protect something vulnerable, while “blockade” implies an obstacle that cannot easily be crossed. By placing these images alongside the poppies, Weir connects the physical language of conflict with the speaker’s emotional attempt to hold on to her child. The ordinary domestic moment becomes marked by separation and loss.','War affects those left at home as well as those who fight; separation creates emotional wounds for families.']]],
['Bayonet Charge','Ted Hughes','War and conflict',[['cold clockwork','Metaphor','The metaphor “cold clockwork” makes the soldier seem mechanical, as though his body is moving through a process he cannot control. “Cold” removes warmth and humanity, while “clockwork” suggests repetitive, automatic movement. Hughes presents the soldier as overwhelmed by the machinery and violence of war rather than acting with heroic certainty.','War dehumanises individuals and reduces them to frightened bodies reacting instinctively.']]],
['Kamikaze','Beatrice Garland','Victims and effects of war',[['crabs, prawns','Natural imagery','The specific images of “crabs” and “prawns” make the sea vivid, ordinary and full of life. Their small, familiar details contrast with the distant military expectations placed on the pilot. Garland uses the remembered natural world to reveal what the pilot is being asked to abandon: an ordinary human life and the people who love him.','The poem questions the pressure of patriotic duty and shows the personal cost of conflict.']]],
['The Charge of the Light Brigade','Alfred Tennyson','War and conflict',[['valley of Death','Biblical allusion','The biblical echo of the “valley of Death” gives the battlefield the scale of a spiritual trial and makes the soldiers’ danger seem almost inevitable. The capitalised “Death” personifies their enemy as an overwhelming force. Tennyson both honours their courage and exposes the terrible cost of unquestioning obedience.','The poem presents the soldiers as courageous but vulnerable to the destructive consequences of orders.']]],
['The Prelude','William Wordsworth','Nature’s power',[['act of stealth','Diction','The phrase “act of stealth” suggests secrecy and wrongdoing, as if the speaker knows that taking the boat is a transgression. This language reveals his confidence before the mountain appears: he initially treats the natural world as something he can use. The later change in tone exposes the limits of that confidence.','Nature humbles human pride and makes the speaker recognise that he is not in control.']]],
['Storm on the Island','Seamus Heaney','Nature’s power',[['spits like a tame cat','Simile','The simile initially compares the storm to a familiar, apparently harmless pet, making the threat seem manageable. However, “spits” gives the weather an aggressive action, so the comparison becomes unsettling: something that appears tame can still attack. Heaney uses this shift to challenge the islanders’ confidence in their ability to withstand nature.','Nature is unpredictable; human confidence can be undermined by forces that seem familiar or harmless.']]],
['My Last Duchess','Robert Browning','Power and control',[['my last Duchess','Possessive pronoun','The possessive pronoun “my” makes the Duchess sound like the Duke’s property rather than an independent person. Combined with “last”, it hints at his control over her fate and reveals how he treats relationships as possessions. Browning lets the Duke expose his own arrogance through his choice of words.','The poem criticises patriarchal power and the way authority can become possessive and abusive.']]],
['London','William Blake','Power and control',[['mind-forged manacles','Metaphor','The metaphor “mind-forged manacles” turns psychological oppression into the image of physical chains. “Forged” suggests that these restraints have been made and reinforced by people and institutions, while “manacles” conveys imprisonment. Blake implies that social systems shape how people think until oppression becomes internalised.','Powerful institutions restrict freedom both physically and through the beliefs people are taught to accept.']]],
['Tissue','Imtiaz Dharker','Power and control',[['Koran ... maps ... slips','Symbolism','The list brings together sacred writing, political borders and fragile pieces of paper, suggesting that human structures depend on materials that can easily be damaged. Dharker places different kinds of authority alongside one another to question how securely people build power, identity and boundaries. The fragile paper becomes a symbol of the limits of human control.','Human systems and claims to authority are fragile; power does not last forever.']]],
['The Émigrée','Carol Rumens','Identity and place',[['bright ... shadow','Contrast','The contrast between “bright” and “shadow” places the speaker’s hopeful memory beside the darker reality of political conflict. Light suggests warmth, belonging and an idealised homeland, whereas shadow hints at danger and loss. Rumens shows that the speaker’s attachment to home survives even when the place itself has changed.','Memory can preserve identity and belonging even when conflict makes returning home difficult.']]],
['Checking Out Me History','John Agard','Identity and place',[['Dem','Dialect / pronoun','The repeated colloquial pronoun “Dem” creates a clear distinction between the speaker and the people who control the version of history he has been taught. Its repetition gives the voice rhythm and resistance, challenging the authority of the dominant group. Agard uses dialect to assert an identity that official education has marginalised.','The poem challenges cultural oppression and shows the speaker reclaiming his identity and history.']]],
['Exposure','Wilfred Owen','Victims and effects of war',[['black with snow','Colour imagery','The paradoxical image “black with snow” combines a colour associated with darkness and death with snow, which is usually associated with whiteness and purity. This disturbing contrast makes the landscape feel unnatural and hostile, reflecting the soldiers’ psychological despair. Owen presents nature not as comforting but as another force attacking exhausted men.','Nature becomes an enemy, intensifying the soldiers’ physical suffering and mental disintegration.'],['cringe in holes','Verb / imagery','The verb “cringe” suggests fear, shame and an instinctive shrinking away from danger. It makes the soldiers seem small and vulnerable, almost animal-like, while “holes” implies that they are trapped and exposed in the landscape. Owen strips away traditional images of military glory and focuses instead on the soldiers’ degradation and fear.','War reduces soldiers to vulnerable, dehumanised figures and exposes the reality behind patriotic ideas of heroism.']]],
['Ozymandias','Percy Bysshe Shelley','Power and control',[['sunk ... shattered visage','Visual imagery','The verbs “sunk” and “shattered” create a picture of a face physically broken and partly swallowed by the sand. “Shattered” suggests not only the destruction of the statue but also the collapse of Ozymandias’ authority and reputation. The fragmentary description makes his attempt to preserve his greatness seem futile: time and the natural world have outlasted the ruler and his empire.','Shelley presents political power and human pride as temporary; time and nature eventually overwhelm human achievements.'],['King of Kings','Irony / allusion','The title “King of Kings” is a biblical allusion usually associated with supreme, divine authority. Ozymandias applies this grand title to himself, revealing his arrogance and belief that he is above other rulers. The irony is that the inscription survives while the kingdom it celebrates has vanished, so the boast becomes evidence of his failure rather than his greatness.','Shelley mocks rulers who imagine themselves godlike and suggests that no human power can defeat time.']]]
];
const exactNotes={"Remains":[["inside out...tosses his guts","Horrific imagery / Colloquial language",["Brutal/unemotional language -> soldier mentally distances from violence.","\"tosses\" -> connotations of carelessness; war desensitizes soldiers.","Colloquial tone -> speaker unable to process military memories normally.","Critical stance -> attacks romanticized view of war."]],["blood-shadow","Metaphor",["Stain/shadow -> overpowering guilt; imprinted memory of dead man.","\"shadow\" -> absence of light; explores dark subject matter.","Trauma -> highlights difficulty overcoming war experiences."]]],"War Photographer":[["light is red","Colour Imagery",["Red -> connotations of blood; highlights dangers of war zones.","Red light -> links to church tabernacle where photographer seeks comfort.","Parallels -> compares priest and war photographer exposed to death/suffering."]],["blood stained.... foreign dust","Imagery",["Stained -> links to memories and deep psychological scarring.","Distance -> avoids naming a place to distance himself from horror.","Isolation -> mirrors how people isolate themselves from trauma."]]],"Poppies":[["bandaged ... Poppies ... blockade","Semantic field of war",["The semantic field reinforces the idea of pain and injury, with the physical injury explored representing the emotional injury that the speaker suffers from.","The idea of \"Poppies\" has connotations of blood and death, showing that there is no way back for the speaker to regain her previous joy of motherhood."]],["my stomach busy... making tucks, darts, pleats","Imagery",["Here, Duffy explores the psychological impact of conflict and death, from a maternal perspective.","The imagery creates a sense of unease and anxiety, with the layers of folds, mirroring the layers of grief and suffering that she experiences.","The sharpness or edged nature of those folds, mirrors the sharpness of her memories and anguish."]]],"Bayonet Charge":[["cold clockwork ....stars... nations","Metaphor",["Clockwork -> mechanical, unemotional state of existence; transformed into killers.","Exploitation -> questions how the state controls and decides their fate.","Cog in a machine -> highlights lack of choice and indignation at leadership."]],["King, honour, human dignity, etcetera","List",["Battle fear -> shows patriotic ideals are instantly replaced with fear.","Self-indulgence -> ideals are irrelevant and must be abandoned to survive.","Hollow concepts -> highlights patriotic ideas as meaningless in brutal war."]]],"Kamikaze":[["crabs, prawns..... dark prince","Contrast",["Fishing imagery -> captures childhood innocence and pure joy.","Parallels -> fish and people are both trapped, unable to escape fate.","\"dark price\" -> forebodes a darker end; war blights all life."]],["eight","Symbolism",["Infinity symbol -> flag emphasizes power of state; soldier cannot escape destiny.","Sailing knot -> reinforces idea that pilot is completely trapped.","Unlimited nature -> continuous cycle of pain/shame; cannot return to normal life."]]],"The Charge of the Light Brigade":[["valley of Death... jaws of death","Metaphor / Personification",["Biblical reference -> connotations of hell; highlights battlefield horrors.","Predator -> personifies battlefield to show the vicious nature of war.","Bravery -> emphasizes the extreme bravery of the charging soldiers."]],["honour","Imperatives / Form: Lament",["Remembrance -> emphasizes central message of respect for sacrifice.","Immortalises -> clear purpose to keep soldiers' memory alive forever.","Conflict -> questions the battle; weighs bravery against blunders of leadership.","Celebration -> poem is traditionally a lament/mourning, but twists into celebration."]]],"The Prelude":[["act of stealth","Symbolism",["Theft of boat -> highlights overwhelming pride leading to immoral actions.","Aggression -> man is aggressive, dominant, corrupt; detracts from nature.","Spiritual journey -> man discovers humanity has no authority over nature."]],["upreared its head","Personification / Enjambment",["Attack -> nature acts as a deadly force, metaphorically attacking man.","Hostile force -> nature is subverted, transforming into something harsh and brutal.","Simplistic vocabulary -> shows how nature can shock and overwhelm man's pride.","The Sublime -> inspires intense feelings of awe and terror; impacts emotional state.","Enjambment -> emphasizes intensity of weather; mirrors chaotic emotional response."]]],"Storm on the Island":[["strafe... salvo... bombarded","Semantic field of war / Blank verse",["Unpredictable force -> demonstrates nature as an active military aggressor.","No mercy -> community is left entirely at the mercy of the storm.","Romanticism subverted -> updates traditions by showing nature as hostile.","The Troubles -> context of conflict suggests war upsets balance between man and nature."]],["spits like a tame cat / a huge nothing","Simile / Oxymoron",["Aggression -> \"spits\" has connotations of unpredictable natural anger.","Domesticity -> simile offers a familiar image, undermining nature's actual power.","Imagination -> oxymoron shows human imagination exacerbates natural fears."]]],"Exposure":[["black with snow","Oxymoron",["The oxymoron creates a stifling tone, full of despair. It shows how the soldiers face a psychological struggle.","The oxymoron highlights how nature has been subverted. Nature's power is on display as it attacks the soldiers.","The idea of \"black\" has connotations of decay and moral corruption, emphasising how the equilibrium between man and nature has become disturbed by man's actions during war."]],["cringe in holes","Imagery",["The idea of \"cringe\" shows how the soldiers are left vulnerable and defeated, seeking refuge, having lost their dignity.","The imagery highlights the power of nature as the soldiers are dehumanised.","Owen shows that nature and war have reduced the soldiers to an animalistic state.","Owen's use of caesura, shows how war and nature are unpredictable, and this contributes to the soldiers' mental disintegration."]]],"My Last Duchess":[["my...I","Pronouns / Dramatic Monologue",["The pronoun \"my\" is used to highlight the Duke's possessive nature, showing how the Duchess is objectified.","Browning uses the pronouns to emphasise the Duke's self-obsession and vanity.","The pronouns, along with the form of the dramatic monologue, show that he is the sole dominant voice, with his control over the narrative mirroring how he controlled the Duchess."]],["Neptune ...Taming a sea-horse","Metaphor",["Here, the metaphor of Neptune, links to the Roman God of the sea. We can draw parallels between the Duke and Neptune as both are dominant and overwhelming.","The metaphor introduces the idea of scale, when considering the size of the sea horse compared to Neptune. This shows the power imbalance present in the household, which mirrors the power imbalance in patriarchal society.","Browning uses the poem to criticise leaders who abuse their power in a domestic setting, with him perhaps being critical over inequality in relation to who holds power."]]],"London":[["black'ning church","Symbolism",["The idea of \"black'ning\" has connotations of decay, emphasising the corrupt nature of the institution.","Through the symbolism, Blake creates a sense of shame, showing how the church has failed in its mission.","Blake is highly critical of the church, criticising their role in oppressing the poor."]],["mind-forged manacles","Metaphor",["The metaphor to show how people are shackled by poverty.","Blake uses the metaphor to highlight the idea of an inner conflict in the citizens of London, as they are left powerless due to the way that they think. This links to Rousseau's belief that authority controls and in order to achieve freedom a revolution is required.","Blake however, does not use the poem to advocate for a physical revolution. Instead he wants a revolution in the way that people think in order to challenge the status quo."]]],"Tissue":[["Koran... maps ... slips","Symbolism",["The symbolism is used to represent powerful institutions and forces, with the \"Koran\" representing religion, \"maps\" representing nations and \"slips\" representing finance.","Dharker uses the symbolism to criticise these institutions due to their divisive nature.","The poem is used to consider what the world would be like if these institutions share the characteristics of tissue, including transparency."]],["light","Symbolism",["Dharker uses the symbolism to show that nature is a force that can overpower any man made centres of power.","The idea of \"light\" has connotations of religion. Therefore, perhaps Dharker uses the symbolism to show that nature and God are the solutions to conflict and institutional corruption.","Dharker draws upon the traditions of Romanticism to champion nature."]]],"The Émigrée":[["bright.... shadow","Contrast",["Warmth -> \"bright\" connotes nostalgia, idealising her past home.","Identity -> devotion and deep emotional attachment to birthplace is central.","Reality -> \"shadow\" captures the threatening, dark reality of the current city.","Internal struggle -> highlights attempts to reconcile opposing views of home."]],["city","Setting",["Hostile place -> setting shows the direct effects of war creating a totalitarian state.","Psychological impact -> childhood vision is completely ruined by a darker reality.","Metaphor -> represents growth from dreamlike childhood to adult understanding."]]],"Checking Out Me History":[["Dem","Anaphora",["Authority conflict -> emphasizes barrier between rulers and the speaker.","Worldview -> highlights how those in power actively force their history on others.","Accusatory tone -> criticises authority for denying him his true culture."]],["carving","Metaphor",["Care -> process is slow, showing reclaiming identity takes massive effort.","Cultural identity -> highlights validation of personal history.","Resolute stance -> conveys absolute willingness to struggle against status quo."]]]};
Object.assign(exactNotes,{"Ozymandias":[["sunk... shattered visage","LFS: Symbolism",["“shattered” connotations destruction and ruin; symbolism of statue highlights downfall of egoistic rulers.","human power temporary and fall of powerful rulers inevitable.","Shelley's critical stance towards powerful rulers, critique of King George III.","Ozymandias mixture of Shakespearean and Petrarchan Sonnet; breaking traditional form shows nothing, including traditions, lasts forever; rebellion against sonnet form mirrors rebellion against authoritative rulers, typical of Romantics."]],["King of Kings","LFS: Allegory / Setting",["allegory religious connotations supreme power, emphasising narcissistic nature of corrupt rulers.","Shelley attacks Godlike rulers and pride.","allegory direct reference to Jesus; desert setting where temptation of Jesus took place; power as tempting force overwhelming rulers.","Romantic poet uses nature to overwhelm human creations, showing nature supreme."]]],"My Last Duchess":[["my...I","LFS: Pronouns / Dramatic Monologue",["pronoun “my” highlights Duke's possessive nature and Duchess objectification.","pronouns emphasise Duke's self-obsession and vanity.","pronouns plus dramatic monologue show he is sole dominant voice; control of narrative mirrors how he controlled Duchess."]],["Neptune ...Taming a sea-horse","LFS: Metaphor",["Neptune Roman God of sea; parallels between Duke and Neptune as dominant and overwhelming.","metaphor introduces scale; sea horse vs Neptune; power imbalance household mirrors patriarchal society.","Browning criticises leaders abusing power in domestic setting, perhaps inequality over who holds power."]]]});

async function refresh(){const {data}=await supabase.auth.getUser();user=data.user||null;$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('logout').classList.toggle('hidden',!user);if(user){let r=await supabase.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=r.data;const ar=await supabase.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();isAdmin=!!ar.data;if(isAdmin){$('navAdmin')?.classList.remove('hidden')}else{$('navAdmin')?.classList.add('hidden')}$('who').textContent=profile?.username||user.email;startPresence();render()}}

function render(){const p=$('page');document.body.classList.toggle('immersive',page==='revise');if(page==='home'){p.innerHTML='<section class="home-intro"><span class="pill">REVISION CLUB · GCSE</span><h2>What would you like to do?</h2><p>Learn, practise, revise together and track your progress.</p></section><div class="hub-grid"><button class="hub-tile learn-tile" data-go="learn"><span class="tile-icon">📚</span><span class="tile-title">Learn</span><span class="tile-copy">Subjects & study notes</span><span class="tile-arrow">↗</span></button><button class="hub-tile community-tile" data-go="community"><span class="tile-icon">👥</span><span class="tile-title">Community</span><span class="tile-copy">Friends & duels</span><span class="tile-arrow">↗</span></button><button class="hub-tile practice-tile" data-go="practice"><span class="tile-icon">⚔️</span><span class="tile-title">Practice</span><span class="tile-copy">Quizzes & flashcards</span><span class="tile-arrow">↗</span></button><button class="hub-tile progress-tile" data-go="progress"><span class="tile-icon">📈</span><span class="tile-title">Progress</span><span class="tile-copy">XP & achievements</span><span class="tile-arrow">↗</span></button></div><section class="card home-lower"><div><span class="pill">KEEP GOING</span><h3>Your revision adds up.</h3><p>Every study session helps build your knowledge and your streak.</p></div><div class="row"><button data-go="revise">Continue practising →</button><button data-go="announcements">Club updates</button></div></section>'}
else if(page==='learn'){p.innerHTML='<button data-go="subjects">← Subjects</button>'+shell('Power & Conflict','Choose a poem to open its full quote-by-quote analysis.')+'<div class="learn-library"><div class="learn-library-head"><div><span class="pill">ENGLISH LITERATURE</span><h3>Power &amp; Conflict poetry</h3><p>Choose a theme first, then open the poem you want to study.</p></div><span class="learn-count">'+poems.length+' poems</span></div><div class="learn-tabs"><button class="active" data-poem-filter="all">All poems</button>'+[...new Set(poems.map(x=>x[2]))].map(t=>'<button data-poem-filter="'+escape(t)+'">'+escape(t)+'</button>').join('')+'</div><div class="poem-library-grid">'+poems.map((po,i)=>'<article class="card poem" data-poem-theme="'+escape(po[2])+'"><div class="poem-card-top"><span class="pill">'+escape(po[2])+'</span><span class="poem-number">'+String(i+1).padStart(2,'0')+'</span></div><h3>'+escape(po[0])+'</h3><p>'+escape(po[1])+'</p><button data-poem="'+i+'">Open study page <span aria-hidden="true">→</span></button></article>').join('')+'</div></div>'+'<section class="card" style="margin-top:20px"><h3>Powerful Rulers: Comparisons Matrix</h3><h4>Shared points (Ozymandias and My Last Duchess)</h4><ul><li>Both poems explore powerful leaders.</li><li>Both explore corrupt/narcissistic leaders.</li><li>Both poets criticise leaders.</li></ul><h4>Ozymandias</h4><ul><li>Power of state.</li><li>Ruler&#39;s power fades.</li><li>Nature overwhelms Ozymandias.</li></ul><h4>My Last Duchess</h4><ul><li>Patriarchal power.</li><li>Duke retains control over Duchess through one-sided narrative.</li><li>Duke&#39;s power is not overwhelmed.</li></ul></section><section class="card" style="margin-top:20px"><h3>Nature: Comparisons Matrix</h3><h4>Shared Themes (The Prelude, Storm on the Island, Exposure)</h4><ul><li>All three poems explore the immense, overwhelming power of nature.</li><li>They examine the connection, balance, and natural impact on humanity.</li><li>All explicitly explore the Sublime (feelings of awe and terrifying natural power).</li></ul><h4>Direct Commonalities</h4><ul><li>Both The Prelude and Exposure present nature as a completely dominant force.</li><li>In both poems, this absolute dominance forces man to reflect on his status.</li><li>Both poems showcase a massive physical and psychological impact on human beings.</li></ul><h4>Direct Contrasts</h4><ul><li>Storm on the Island differs because humans initially dismiss nature to seek dominance over it.</li><li>In The Prelude, natural impact leads to deep reflection; in Exposure, it forces men to regress to an animalistic state.</li><li>Unlike the other two where nature is inherently hostile, Storm on the Island shows human imagination is what gives nature its terrifying power.</li></ul></section><section class="card"><h3>Victims/Effects of War: Comparisons</h3><h4>Remains</h4><ul><li>Explores horrors of war</li><li>Speaker attempts to distance himself from war</li><li>Pain and suffering - guilt</li><li>Psychological toll</li><li>Soldier&#39;s perspective</li></ul><h4>War Photographer</h4><ul><li>Explores horrors of war</li><li>Poem shows how people distance themselves from war</li><li>Pain and suffering - civilians</li><li>Less psychological toll</li><li>Photographer&#39;s perspective</li></ul><h4>Poppies</h4><ul><li>Explores impact of war on domestic life</li><li>Speaker doesn&#39;t attempt to distance themselves from trauma of losing son</li><li>Pain and suffering - grief</li><li>Psychological toll</li><li>Maternal perspective</li></ul></section><section class="card"><h3>War: Comparisons</h3><h4>Bayonet Charge</h4><ul><li>An insight into the realities/horrors of the battlefield</li><li>Explores soldier&#39;s thought process</li><li>War = waste</li><li>State Ideology is dismissed</li></ul><h4>Kamikaze</h4><ul><li>A reflective journey towards the battlefield</li><li>Explores pilot&#39;s thought process</li><li>War = waste</li><li>State ideology is dismissed</li></ul><h4>COTLB (Charge of the Light Brigade)</h4><ul><li>An insight into the realities/horrors of the battlefield</li><li>Soldiers have no individuality</li><li>War = glorious</li><li>State ideology and patriotism is reinforced</li></ul></section><section class="card"><h3>Nature: Comparisons</h3><h4>Shared Points (All 3 Poems)</h4><ul><li>All explore the power of nature</li><li>They examine the man&#39;s relationship with the natural world, exploring the idea of balance and the impact that nature can have</li><li>All examine the sublime</li></ul><h4>The Prelude</h4><ul><li>Nature is dominant and causes man to reflect on his state</li><li>Significant psychological and physical impact – causes man to reflect</li></ul><h4>Storm on the Island</h4><ul><li>Nature is dismissed – man seeks dominance over nature</li><li>Explores the impact of nature but it is man&#39;s thought processes and imagination that gives nature its power</li></ul><h4>Exposure</h4><ul><li>Nature is dominant and causes man to reflect on his state</li><li>Significant psychological and physical impact – causes man to regress to a basic state</li></ul></section><section class="card"><h3>Powerful Rulers &amp; Institutions: Comparisons</h3><h4>Shared Points (Ozymandias &amp; My Last Duchess)</h4><ul><li>Both poems explore the nature of powerful leaders</li><li>Both poems explore leaders who are corrupt and narcissistic</li><li>Both poets criticise leaders</li></ul><h4>Ozymandias</h4><ul><li>Explores the power of the state</li><li>The ruler&#39;s power fades</li><li>Nature overwhelms Ozymandias</li></ul><h4>My Last Duchess</h4><ul><li>Explores patriarchal power</li><li>The Duke still retains control over the Duchess as he controls the one-sided narrative</li><li>The Duke&#39;s power is not overwhelmed</li></ul><h4>Powerful Institutions: Shared Points (London &amp; Tissue)</h4><ul><li>Both explore institutions that are corrupt</li><li>Both explore the failure of institutions and the impact they can have</li><li>Both challenge the status quo</li></ul><h4>London</h4><ul><li>Blake offers mental freedom and free thought as the solutions to the issues he explores</li><li>As a Romantic poet, Blake criticises authority and aspects of the Industrial Revolution</li></ul><h4>Tissue</h4><ul><li>Dharker offers light and transparency as the solution to the issues she explores</li><li>Dharker draws upon the traditions of Romanticism and champions nature</li></ul></section><section class="card"><h3>Identity: Comparisons</h3><h4>Shared Points (The Émigrée &amp; Checking Out Me History)</h4><ul><li>Both poems deal with the loss of identity</li><li>Both poems explore the power of one&#39;s own history and how it shapes a personal narrative/identity</li></ul><h4>The Émigrée</h4><ul><li>Explores the effects of war</li><li>Ends with a tone of renewal showing Agard&#39;s willingness to struggle in order to reclaim identity (wording supplied in notes)</li></ul><h4>Checking Out Me History</h4><ul><li>Explores the effects of colonialism</li><li>Has a tone of nostalgia, showing the speaker&#39;s reluctance to grow up (wording supplied in notes)</li></ul></section><section class="card"><h3>Context: Key Knowledge</h3><h4>The Sublime</h4><ul><li>The idea that nature has the power to inspire intense emotions such as awe and terror</li></ul><h4>Nature Subverted</h4><ul><li>Nature turns into a hostile force</li></ul><h4>Romanticism</h4><ul><li>Draws upon the traditions of Romanticism and:</li><li>Explores the power of nature</li><li>Explores the equilibrium between man and nature</li><li>Celebrates/champions nature</li><li>Criticises authority</li></ul><h4>Colonialism</h4><ul><li>Colonialism creates a fractured identity</li></ul></section><button data-go="revise">Continue to revision →</button>';}else if(page==='poem'){const i=Number(window.currentPoem||0),po=poems[i],exact=exactNotes[po[0]]||[],item=exact[window.currentQuote||0];p.innerHTML='<button data-go="learn">← All poems</button>'+shell(''+escape(po[0]),escape(po[1])+' · '+escape(po[2]))+'<div class="card"><div class="pill">STEP '+(studyStage+1)+' OF 3</div><h3>'+(studyStage===0?'1. Remember the exact quote':studyStage===1?'2. Identify the method':'3. Recall the booklet analysis')+'</h3>'+(item?'<div class="quote">“'+escape(item[0])+'”</div>':'<p>No booklet quote has been supplied for this poem yet.</p>')+(studyStage>=1&&item?'<div class="learning-summary"><h3>🎯 Method / language feature</h3>'+learningPoints(item[1])+'</div>':'')+(studyStage>=2&&item?'<div class="learning-summary"><h3>💡 Remember these key points</h3><ul class="learning-points">'+item[2].map(line=>'<li>'+escape(line)+'</li>').join('')+'</ul></div>':'')+'<div class="row">'+(studyStage>0?'<button data-stage="'+(studyStage-1)+'">← Hide a step</button>':'')+(studyStage<2?'<button class="primary" data-stage="'+(studyStage+1)+'">'+(studyStage===0?'Reveal method →':'Reveal analysis →')+'</button>':'<button class="primary" data-stage="0">Try to remember again</button>')+'</div></div><div class="row" style="margin-top:12px">'+exact.map((q,qi)=>'<button data-quote="'+qi+'" class="'+(qi===(window.currentQuote||0)?'primary':'')+'">Quote '+(qi+1)+'</button>').join('')+'</div><div class="row" style="margin-top:16px"><button '+(i===0?'disabled':'')+' data-poem="'+(i-1)+'">← Previous poem</button><button class="primary" '+(i===poems.length-1?'disabled':'')+' data-poem="'+(i+1)+'">Next poem →</button><button data-go="revise">Go to revision →</button></div>'}

function setupRevise(){let mode='flash',scope='all',kind='quotes',wizardStep=0,cardAmount='20';const area=$('reviseArea');function weak(){try{return JSON.parse(localStorage.getItem('rc-weak-'+user.id)||'{}')}catch{return {}}}function save(w){localStorage.setItem('rc-weak-'+user.id,JSON.stringify(w))}function deckNow(){let q=Object.entries(exactNotes).flatMap(([poem,items])=>items.map((x,i)=>{const source=poems.find(p=>p[0]===poem)?.[3]?.[i];return {poem,quote:x[0],method:x[1],analysis:x[2].join(' '),context:source?.[3]||x[2][0]||''}}));let c=poems.flatMap(p=>(p[3]||[]).map(x=>({poem:p[0],quote:x[0],method:x[1],analysis:x[2],context:x[3]||''})));return (kind==='context'?c:q).filter(x=>scope==='all'||scope.includes(x.poem))}function filters(){return '<div class="card row"><label style="width:100%">Choose poems (select more than one with Ctrl / Command)<select id="scope" class="field" multiple size="4"><option value="all" '+(scope==='all'?'selected':'')+'>All poems</option>'+poems.map(p=>'<option value="'+escape(p[0])+'" '+(scope!=='all'&&scope.includes(p[0])?'selected':'')+'>'+escape(p[0])+'</option>').join('')+'</select></label><label style="width:100%">Card content<select id="kind" class="field"><option value="quotes" '+(kind==='quotes'?'selected':'')+'>Quotes, methods & analysis</option><option value="context" '+(kind==='context'?'selected':'')+'>Context & wider message</option></select></label></div>'}function bind(){const exit=$('exitActivity');if(exit)exit.onclick=()=>{document.body.classList.remove('activity-session');page='practice';render()};area.querySelectorAll('[data-activity-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.activityMode;index=0;revealed=false;stage=0;quiz=null;draw()});$('scope')?.addEventListener('change',e=>{const selected=[...e.target.selectedOptions].map(x=>x.value);scope=selected.includes('all')||!selected.length?'all':selected;index=0;revealed=false;draw()});$('kind')?.addEventListener('change',e=>{kind=e.target.value;index=0;revealed=false;draw()})}function exitBar(){return '<div class="activity-top"><button id="exitActivity">← Exit</button><div class="activity-switch"><button data-activity-mode="flash" class="'+(mode==='flash'?'active':'')+'">Flashcards</button><button data-activity-mode="blurt" class="'+(mode==='blurt'?'active':'')+'">Blurting</button><button data-activity-mode="quiz" class="'+(mode==='quiz'?'active':'')+'">Quick quiz</button><button data-activity-mode="progress" class="'+(mode==='progress'?'active':'')+'">Progression</button></div><span class="activity-brand">REVISION CLUB</span></div>'}function draw(){document.body.classList.remove('flash-wizard-active');document.body.classList.add('activity-session');if(mode==='flash')flash();else if(mode==='progress')progress();else if(mode==='blurt')blurt();else startQuiz()}function switchMode(m){mode=m;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.mode===m));setup()}function renderWizard(){

function setup(){if(mode==='flash'){renderWizard();return}wizardStep=0;renderOtherWizard()}$('flashTab').dataset.mode='flash';$('blurtTab').dataset.mode='blurt';$('quizTab').dataset.mode='quiz';$('flashTab').onclick=()=>switchMode('flash');$('blurtTab').onclick=()=>switchMode('blurt');$('quizTab').onclick=()=>switchMode('quiz');const tabs=$('reviseArea').parentElement.querySelector('.tabs');$('progressTab').onclick=()=>switchMode('progress');let index=0,revealed=false,stage=0;function flash(){let d=deckNow();if(cardAmount!=='all'&&cardAmount!=='endless')d=d.slice(0,Number(cardAmount));if(!d.length){area.innerHTML=exitBar()+'<div class="card"><p>No cards available for these settings.</p></div>';bind();return}index=(index+d.length)%d.length;let c=d[index],n=weak()[c.poem+'|'+c.quote]||0;area.innerHTML=exitBar()+'<div class="flash-stage"><div class="flash-flipper '+(revealed?'is-flipped':'')+'" id="flashFlip" role="button" tabindex="0" aria-label="Flashcard. Tap anywhere to flip."><section class="card flash-face flash-front"><div class="row"><span class="pill">Card '+(index+1)+' / '+d.length+'</span><span class="pill" style="color:'+(n?'#d34c4c':'#159768')+'">'+(n?'Needs review × '+n:'Looking good ✓')+'</span></div><span class="flash-kicker">'+escape(c.poem)+'</span><div class="quote">“'+escape(c.quote)+'”</div><p class="tap-cue"><span aria-hidden="true">👆</span> Tap anywhere to flip</p></section><section class="card flash-face flash-back"><div class="flash-back-scroll"><span class="flash-kicker">'+escape(c.poem)+' · ANSWER</span><div class="learning-summary"><h3>🎯 Method</h3>'+learningPoints(c.method)+'</div><div class="learning-summary"><h3>💡 Analysis</h3>'+learningPoints(c.analysis)+'</div>'+(c.context?'<div class="learning-summary"><h3>🌍 Wider message / context</h3>'+learningPoints(c.context)+'</div>':'')+'</div><p class="tap-cue">Tap anywhere to return to the quote</p></section></div></div><div class="row flash-navigation"><button id="prev">← Previous</button><button id="next">Next →</button></div><div class="row rating-controls"><button id="miss">✕ Need practice</button><button id="known" class="primary">✓ I know this</button></div>';bind();const flip=$('flashFlip');if(flip){const toggleFlip=()=>{revealed=!revealed;flip.classList.toggle('is-flipped',revealed)};flip.onclick=toggleFlip;flip.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleFlip()}}}$('prev').onclick=()=>{index--;revealed=false;flash()};$('next').onclick=()=>{index++;revealed=false;flash()};function mark(ok){let w=weak(),k=c.poem+'|'+c.quote;w[k]=ok?Math.max(0,(w[k]||0)-1):(w[k]||0)+1;if(!w[k])delete w[k];save(w);index++;revealed=false;flash()}$('known').onclick=()=>mark(true);$('miss').onclick=()=>mark(false)}function progress(){let d=deckNow();if(!d.length){flash();return}index=(index+d.length)%d.length;let c=d[index],st=[['Statement',c.context||c.poem+' explores its central ideas'],['Method',c.method],['Quote',c.quote],['Analysis',c.analysis]],v=st[stage];area.innerHTML=exitBar()+'<div class="card progression-session"><span class="pill">Progression · '+(stage+1)+' / 4</span><h3>Recall the '+v[0].toLowerCase()+'</h3><p>Try to remember it before revealing.</p><button id="revealStage" class="primary">Reveal '+v[0]+'</button><div id="stageAnswer"></div><div class="row"><button id="missStage">✕ Not yet</button><button id="knowStage" class="primary">✓ Remembered</button></div></div>';bind();$('revealStage').onclick=()=>{$('stageAnswer').innerHTML='<div class="feedback">'+escape(v[1])+'</div>'};function move(ok){let w=weak(),k=c.poem+'|'+c.quote;w[k]=ok?Math.max(0,(w[k]||0)-1):(w[k]||0)+1;if(!w[k])delete w[k];save(w);if(stage===3){stage=0;index++}else stage++;progress()}$('knowStage').onclick=()=>move(true);$('missStage').onclick=()=>move(false)}function blurt(){area.innerHTML=exitBar()+'<div class="card blurt-session"><h3>Blurting practice</h3><select id="blurtpoem" class="field">'+poems.map(p=>'<option>'+escape(p[0])+'</option>').join('')+'</select><textarea id="blurttext" class="field" placeholder="Write quotes, methods, analysis and context…"></textarea><button id="checkblurt" class="primary">Reveal checklist</button><div id="blurtresult"></div></div>';bind();$('checkblurt').onclick=()=>{let p=poems.find(x=>x[0]===$('blurtpoem').value);$('blurtresult').innerHTML=p[3].map(x=>'<p>“'+escape(x[0])+'” · '+escape(x[1])+'<br>'+escape(x[2])+'<br><b>Wider message:</b> '+escape(x[3]||'Not supplied')+'</p>').join('')}}let quizAmount=8;function startQuiz(){let d=deckNow();if(!d.length){area.innerHTML=exitBar()+'<div class="card"><h3>No quiz cards available</h3><p>Choose a different poem or card type in setup.</p></div>';bind();return}const shuffled=[...d].sort(()=>Math.random()-.5);quiz={i:0,score:0,startedAt:Date.now(),items:shuffled.slice(0,Math.min(quizAmount,d.length))};ask()}function ask(){let c=quiz.items[quiz.i];area.innerHTML=exitBar()+'<div class="card quiz-session"><span class="pill">Question '+(quiz.i+1)+' / '+quiz.items.length+'</span><h3>Which poem does this quote come from?</h3><div class="quote">“'+escape(c.quote)+'”</div><div class="grid">'+[c.poem,...poems.filter(p=>p[0]!==c.poem).slice(0,3).map(p=>p[0])].sort(()=>Math.random()-.5).map(n=>'<button class="answer">'+escape(n)+'</button>').join('')+'</div><div id="quizfeedback"></div></div>';bind();area.querySelectorAll('.answer').forEach(btn=>btn.onclick=()=>{let ok=btn.textContent===c.poem,w=weak(),k=c.poem+'|'+c.quote;if(ok){quiz.score++;w[k]=Math.max(0,(w[k]||0)-1)}else w[k]=(w[k]||0)+1;if(!w[k])delete w[k];save(w);area.querySelectorAll('.answer').forEach(x=>x.disabled=true);$('quizfeedback').innerHTML='<p>'+(ok?'Correct ✓':'Not quite — '+escape(c.poem))+'</p><p><b>Method:</b> '+escape(c.method)+'</p><p><b>Analysis:</b> '+escape(c.analysis)+'</p><button id="qnext" class="primary">Next</button>';$('qnext').onclick=async()=>{quiz.i++;if(quiz.i>=quiz.items.length){area.innerHTML=exitBar()+'<div class="card quiz-session"><h2>'+quiz.score+' / '+quiz.items.length+'</h2><p>Quiz complete</p><button id="again" class="primary">Play again</button></div>';await supabase.from('study_sessions').insert({user_id:user.id,subject_id:'english-lit',activity:'quick-quiz',score:quiz.score*10,duration_seconds:Math.round((Date.now()-quiz.startedAt)/1000)});$('again').onclick=startQuiz}else ask()}})}setup()}async function setupFriends(){$('findfriend').onclick=async()=>{let name=$('friendname').value.trim().toLowerCase();if(!name)return;let r=await supabase.from('profiles').select('id,username').eq('username',name).maybeSingle();if(r.error||!r.data)return say('friendmsg','No matching username found.');if(r.data.id===user.id)return say('friendmsg','That is your own account.');let prior=await supabase.from('friend_requests').select('id,status').eq('sender_id',user.id).eq('receiver_id',r.data.id).maybeSingle();if(prior.data)return say('friendmsg',prior.data.status==='accepted'?'You are already friends.':'A request has already been sent to this user.');let ins=await supabase.from('friend_requests').insert({sender_id:user.id,receiver_id:r.data.id});say('friendmsg',ins.error?(ins.error.code==='23505'?'A request already exists between these accounts.':ins.error.message):'Friend request sent to '+r.data.username+'.')};let r=await supabase.from('friend_requests').select('id,sender_id,status').eq('receiver_id',user.id).eq('status','pending');const ids=(r.data||[]).map(x=>x.sender_id);let profileRows=[];if(ids.length){const pr=await supabase.from('profiles').select('id,username').in('id',ids);profileRows=pr.data||[]}const names=Object.fromEntries(profileRows.map(x=>[x.id,x.username]));$('requests').innerHTML=(r.data||[]).map(x=>'<div class="row"><b>'+escape(names[x.sender_id]||'Student')+'</b><button data-accept="'+x.id+'">Accept</button><button data-decline="'+x.id+'">Decline</button></div>').join('')||'No pending requests.';$('requests').onclick=async e=>{let id=e.target.dataset.accept||e.target.dataset.decline;if(!id)return;await supabase.from('friend_requests').update({status:e.target.dataset.accept?'accepted':'declined'}).eq('id',id);setupFriends()};$('newchallenge').onclick=async()=>{let r=await supabase.from('challenges').insert({creator_id:user.id,title:'Power & Conflict duel',subject_id:'english-lit',mode:'quote-race'}).select().single();if(r.error){say('challengemsg',r.error.message);return}const join=await supabase.from('challenge_players').insert({challenge_id:r.data.id,user_id:user.id});say('challengemsg',join.error?'Duel created, but joining failed: '+join.error.message:'Duel created. Share its ID with a friend: '+r.data.id);loadChallenges()};loadChallenges()}
async function loadChallenges(){const el=$('challengeList');if(!el)return;const [cr,pr]=await Promise.all([supabase.from('challenges').select('id,title,creator_id,status,created_at').in('status',['open','active']).order('created_at',{ascending:false}).limit(30),supabase.from('challenge_players').select('challenge_id,user_id,score')]);if(cr.error){el.textContent=cr.error.message;return}const players=pr.data||[];el.innerHTML=(cr.data||[]).map(c=>{const joined=players.some(x=>x.challenge_id===c.id&&x.user_id===user.id),count=players.filter(x=>x.challenge_id===c.id).length;return '<article class="feedback"><div class="row" style="justify-content:space-between"><b>'+escape(c.title)+'</b><span class="pill">'+escape(c.status)+'</span></div><p>'+count+' player(s) · '+(c.creator_id===user.id?'Created by you':'Community duel')+'</p>'+(joined?'<span class="pill">You joined</span>':'<button data-join-challenge="'+c.id+'">Join duel →</button>')+' <small>Code: '+escape(c.id.slice(0,8))+'</small></article>'}).join('')||'<p>No open duels yet. Create one to get started.</p>';el.onclick=async e=>{const id=e.target.dataset.joinChallenge;if(!id)return;e.target.disabled=true;const ins=await supabase.from('challenge_players').insert({challenge_id:id,user_id:user.id});say('challengemsg',ins.error?(ins.error.code==='23505'?'You have already joined this duel.':ins.error.message):'You joined the duel.');loadChallenges()}}
async function loadPersonalProgress(){const el=$('personalProgress');const r=await supabase.from('study_sessions').select('score,duration_seconds,created_at,activity').eq('user_id',user.id).order('created_at',{ascending:false}).limit(500);if(r.error){el.textContent=r.error.message;return}const rows=r.data||[],xp=rows.reduce((n,x)=>n+Number(x.score||0),0),minutes=Math.round(rows.reduce((n,x)=>n+Number(x.duration_seconds||0),0)/60),today=new Date().toDateString(),todayCount=rows.filter(x=>new Date(x.created_at).toDateString()===today).length;el.innerHTML='<section class="card"><span class="pill">TOTAL XP</span><div class="score">'+xp+'</div><p>Earned from recorded revision sessions</p></section><section class="card"><span class="pill">STUDY TIME</span><div class="score">'+minutes+'</div><p>Minutes recorded</p></section><section class="card"><span class="pill">SESSIONS</span><div class="score">'+rows.length+'</div><p>Total recorded sessions</p></section><section class="card"><span class="pill">TODAY</span><div class="score">'+todayCount+'</div><p>Sessions today</p></section>'}
async function loadScores(scope='friends'){let ids=[user.id];if(scope==='friends'){const fr=await supabase.from('friend_requests').select('sender_id,receiver_id').eq('status','accepted').or('sender_id.eq.'+user.id+',receiver_id.eq.'+user.id);ids=[...new Set([user.id,...(fr.data||[]).map(x=>x.sender_id===user.id?x.receiver_id:x.sender_id)])]}const result=await supabase.rpc('get_leaderboard_scores');if(result.error){$('scores').textContent=result.error.message;return}let rows=(result.data||[]).map(x=>[x.user_id,Number(x.total_xp||0),x.username||'Student']);if(scope==='friends')rows=rows.filter(x=>ids.includes(x[0]));rows.sort((a,b)=>b[1]-a[1]);const max=Math.max(1,...rows.map(x=>x[1]));const colours=['#16a36a','#e34b4b','#3978df','#e3a12f','#8756d8','#0e9aa7'];$('scores').innerHTML=rows.map(([id,points,name],i)=>'<div class="board-row"><div class="row" style="justify-content:space-between"><b>'+(i+1)+'. '+escape(id===user.id?'You':name)+'</b><strong>'+points+' XP</strong></div><div class="bar board-bar"><span style="width:'+Math.max(4,points/max*100)+'%;background:'+colours[i%colours.length]+'"></span></div></div>').join('')||'No points recorded yet. Complete a quiz to earn XP.'}

async function loadAdmin(){const [pr,sr,ur,ar]=await Promise.all([supabase.from('profiles').select('id,username,display_name').order('username'),supabase.from('study_sessions').select('user_id,activity,score,duration_seconds,created_at').order('created_at',{ascending:false}).limit(500),supabase.from('user_presence').select('user_id,last_seen,current_page,study_status,session_started_at'),supabase.from('admin_users').select('user_id')]);if(pr.error){$('adminUsers').textContent=pr.error.message;return}const presence=Object.fromEntries((ur.data||[]).map(x=>[x.user_id,x])),admins=new Set((ar.data||[]).map(x=>x.user_id)),stats={};(sr.data||[]).forEach(x=>{stats[x.user_id]??={seconds:0,points:0};stats[x.user_id].seconds+=Number(x.duration_seconds||0);stats[x.user_id].points+=Number(x.score||0)});$('adminAccess').innerHTML='<select id="adminPerson" class="field">'+(pr.data||[]).map(x=>'<option value="'+x.id+'">'+escape(x.display_name||x.username)+' (@'+escape(x.username)+')'+(admins.has(x.id)?' · Admin':'')+'</option>').join('')+'</select><div class="row"><button id="grantAdmin" class="primary">Make admin</button><button id="removeAdmin">Remove admin</button></div><p id="adminAccessMsg"></p>';$('grantAdmin').onclick=async()=>{let r=await supabase.from('admin_users').insert({user_id:$('adminPerson').value});$('adminAccessMsg').textContent=r.error?(r.error.code==='23505'?'Already an admin.':r.error.message):'Admin access granted.';loadAdmin()};$('removeAdmin').onclick=async()=>{let id=$('adminPerson').value;if(id===user.id&&admins.size<=1){$('adminAccessMsg').textContent='Cannot remove the last admin.';return}let r=await supabase.from('admin_users').delete().eq('user_id',id);$('adminAccessMsg').textContent=r.error?r.error.message:'Admin access removed.';loadAdmin()};$('publishAnnouncement').onclick=async()=>{let title=$('announcementTitle').value.trim(),body=$('announcementBody').value.trim();if(!title||!body){$('announcementMsg').textContent='Enter a title and message.';return}let r=await supabase.from('announcements').insert({title,body,created_by:user.id});$('announcementMsg').textContent=r.error?r.error.message:'Announcement published.';if(!r.error){$('announcementTitle').value='';$('announcementBody').value=''}};$('adminUsers').innerHTML=(pr.data||[]).map(x=>{let p=presence[x.id],st=stats[x.id]||{seconds:0,points:0},online=p&&Date.now()-new Date(p.last_seen).getTime()<90000;return '<div class="feedback"><b>'+escape(x.username)+'</b> '+(admins.has(x.id)?'<span class="pill">ADMIN</span>':'')+' · '+(online?'Online':'Offline')+'<p>'+escape(p?.study_status||'offline')+' · '+escape(p?.current_page||'—')+' · Quiz time '+Math.round(st.seconds/60)+' min · Points '+st.points+'</p><input class="field" id="rename-'+x.id+'" value="'+escape(x.display_name||x.username)+'"><button data-rename="'+x.id+'">Save display name</button></div>'}).join('');$('adminUsers').onclick=async e=>{let id=e.target.dataset.rename;if(!id)return;let r=await supabase.from('profiles').update({display_name:$('rename-'+id).value.trim()}).eq('id',id);if(r.error)alert(r.error.message);else loadAdmin()}}
