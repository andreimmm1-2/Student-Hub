/* Hub refresh: clearer hierarchy, calmer spacing, responsive navigation */

.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px}

#app{display:block}#page{min-width:0}.nav{display:flex!important;overflow-x:auto}.field{margin:10px 0 18px;min-height:48px}.auth .field{display:block;margin-bottom:18px}.board-row{padding:13px 0;border-bottom:1px solid var(--line)}.board-bar{height:13px;margin-top:9px;background:var(--soft);border-radius:99px}.board-bar span{border-radius:99px;transition:width .35s ease}.subject-card{min-height:220px}.subject-card .pill{width:max-content}.coming-card{border-style:dashed}.coming-card .pill{background:#fff0cc;color:#93600c;border:0}

.home-intro{margin:18px 0 16px}.home-intro h2{font-size:clamp(25px,4vw,34px);margin:12px 0 4px}.home-intro p{margin:4px 0 0}.hub-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.hub-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;min-height:clamp(190px,25vw,270px);padding:clamp(18px,3vw,30px);border:0;border-radius:20px;color:#fff;box-shadow:0 12px 28px rgba(0,0,0,.12);overflow:hidden;transition:transform .18s,filter .18s}.hub-tile:hover{transform:translateY(-3px);filter:brightness(1.06)}.hub-tile:focus-visible{outline:3px solid #fff;outline-offset:3px}.learn-tile{background:linear-gradient(145deg,#315c91,#203c68)}.community-tile{background:linear-gradient(145deg,#187b6d,#14534e)}.practice-tile{background:linear-gradient(145deg,#315f91,#263f63)}.progress-tile{background:linear-gradient(145deg,#b46b35,#704323)}.tile-icon{font-size:clamp(32px,5vw,46px);line-height:1}.tile-title{font-size:clamp(23px,3vw,30px);font-weight:800;letter-spacing:-.7px}.tile-copy{font-size:14px;color:rgba(255,255,255,.84)}.tile-arrow{position:absolute;right:22px;top:20px;font-size:24px;color:rgba(255,255,255,.85)}.home-lower{margin-top:15px;display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.home-lower h3{margin:9px 0 0}.home-lower p{margin:3px 0}.nav{display:flex!important}.immersive header,.immersive .nav{display:none!important}.immersive .wrap{max-width:100%;padding:12px 18px 24px}.immersive #page{max-width:1000px;margin:0 auto}.immersive .flash{min-height:55vh}.immersive .card{box-shadow:none}.immersive-exit{display:flex;justify-content:flex-end;margin-bottom:10px}

.wrap{max-width:1440px}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:28px clamp(18px,4vw,42px);margin:8px 0 22px;border-radius:22px;color:#fff;min-height:160px}.page-heading h2{font-size:clamp(30px,4vw,44px);margin:10px 0 4px;color:#fff}.page-heading p{color:rgba(255,255,255,.82);margin:0;max-width:680px}.page-heading .pill{border-color:rgba(255,255,255,.35);color:#fff}.page-heading-icon{font-size:clamp(48px,7vw,76px);line-height:1;opacity:.95;padding:12px}.community-heading{background:linear-gradient(120deg,#176b61,#164b63)}.practice-heading{background:linear-gradient(120deg,#315f91,#263f63)}.progress-heading{background:linear-gradient(120deg,#a95f32,#6b452f)}.updates-heading{background:linear-gradient(120deg,#315f91,#3c477e)}.admin-heading{background:linear-gradient(120deg,#3d4859,#222c3b)}.community-layout{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);gap:16px;align-items:start}.community-main{grid-row:span 2}.community-board{grid-column:1/-1}.section-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}.section-heading h3{margin:0}.section-heading p{margin:4px 0}.friend-add-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.friend-add-row .field{margin:4px 0}.duel-panel{background:linear-gradient(150deg,#e9f6f3,#fff)}body.dark .duel-panel{background:linear-gradient(150deg,#183e3a,#1b1f23)}.duel-panel .tile-icon{font-size:38px;margin:12px 0}.duel-panel h3{font-size:24px}.community-board{min-width:0}.practice-page{max-width:1180px;margin:0 auto}.practice-tabs{padding:8px;background:var(--soft);border-radius:14px;width:max-content;max-width:100%}.practice-tabs button.active{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.08)}.progress-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.progress-stats .card{min-height:145px}.progress-stats .score{font-size:clamp(30px,4vw,44px);font-weight:8 a{padding:12px}body.activity-session #reviseArea .flash-study-card{padding:20px 16px}}

/* Polished two-sided flashcard and less wasteful activity layouts. */

/* Clear subject and course navigation, with a scannable themed poem library. */

/* Refined neutral palette: graphite, slate blue and teal; no lavender or purple accents. */
:root{--bg:#f4f5f6;--card:rgba(255,255,255,.82);--ink:#202326;--muted:#68717c;--line:#dfe3e8;--accent:#315f91;--soft:#edf1f5;--shadow:0 12px 34px rgba(30,38,48,.07);--glass:rgba(255,255,255,.74);--glass-strong:rgba(255,255,255,.9)}
body{background:linear-gradient(135deg,#f5f6f7,#eceff2);background-attachment:fixed}

.card,.poem.card,.poem-library-grid .poem,.subject-course,.subject-hero,.auth,.practice-start,.learn-tabs,.subject-tabs,.feedback,.activity-top,.flash-stage,.blurt-session,.quiz-session,.progression-session{background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(16px) saturate(115%);-webkit-backdrop-filter:blur(16px) saturate(115%)}
.card,.poem.card,.poem-library-grid .poem,.subject-course,.subject-hero,.auth{border-radius:20px}
.nav{background:var(--glass-strong);border:1px solid var(--line);box-shadow:0 8px 28px rgba(25,30,45,.06);backdrop-filter:blur(20px) saturate(120%);-webkit-backdrop-filter:blur(20px) saturate(120%)}

/* Consistent custom select controls */
.custom-select-host{position:relative;display:inline-block;width:100%;min-width:0;vertical-align:middle}
.custom-select-native{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;opacity:0!important;pointer-events:none!important}
.custom-select-trigger{width:100%;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:13px;background:var(--glass-strong);color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer;transition:border-color .18s,box-shadow .18s,background .18s}
.custom-select-trigger:hover{border-color:var(--accent)}
.custom-select-trigger:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:2px}
.custom-select-trigger:disabled{opacity:.55;cursor:not-allowed}
.custom-select-trigger .custom-select-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.custom-select-chevron{width:8px;height:8px;flex:0 0 8px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg) translateY(-2px);opacity:.65;transition:transform .18s}
.custom-select-trigger[aria-expanded="true"] .custom-select-chevron{transform:rotate(225deg) translate(-1px,-1px)}
.custom-select-menu{position:fixed;z-index:10000;min-width:180px;max-width:min(360px,calc(100vw - 24px));max-height:min(320px,calc(100dvh - 24px));overflow:auto;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--card,var(--glass-strong));color:var(--ink);box-shadow:0 16px 42px rgba(15,23,42,.2);overscroll-behavior:contain}
.custom-select-option{display:flex;width:100%;align-items:center;gap:10px;padding:10px 11px;border:0;border-radius:9px;background:transparent;color:inherit;font:inherit;font-size:13px;text-align:left;cursor:pointer}
.custom-select-option:hover,.custom-select-option[aria-selected="true"]{background:var(--soft)}
.custom-select-option[aria-selected="true"]{font-weight:750}
.custom-select-option:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.custom-select-option:disabled{opacity:.45;cursor:not-allowed}

const poems=[
['Remains','Simon Armitage','Victims and effects of war',[['blood-shadow','Metaphor','The compound noun “blood-shadow” fuses physical violence with something that follows the speaker. A shadow is difficult to escape, so the image suggests that the memory of killing has attached itself to the soldier and continues to haunt him after the event. Armitage makes guilt feel like a permanent presence rather than a passing emotion.','The violent act leaves lasting psychological trauma; the effects of conflict continue long after the battlefield.'],['tosses his guts','Violent imagery','The verb “tosses” is casual and almost dismissive, as if the body parts are an ordinary object. This matter-of-fact diction clashes with the horrific image of “guts”, making the violence feel brutally routine. Armitage may be showing how soldiers use detached language to cope with extreme experiences.','Conflict can normalise brutality and leave soldiers emotionally detached, even while they suffer lasting guilt.']]],
['War Photographer','Carol Ann Duffy','Victims and effects of war',[['light is red','Colour imagery','The simple colour image “red” can suggest blood, danger and suffering. Its starkness makes the photograph’s subject feel immediate, while the controlled darkroom setting contrasts with the chaos of the conflict being recorded. Duffy draws attention to the photographer’s difficult role: turning distant suffering into an image others can see.','The poem explores how war creates victims and how those far away encounter their suffering through images.']]],
['Poppies','Jane Weir','Victims and effects of war',[['bandaged ... Poppies ... blockade','War imagery','The word “bandaged” suggests injury and the need to protect something vulnerable, while “blockade” implies an obstacle that cannot easily be crossed. By placing these images alongside the poppies, Weir connects the physical language of conflict with the speaker’s emotional attempt to hold on to her child. The ordinary domestic moment becomes marked by separation and loss.','War affects those left at home as well as those who fight; separation creates emotional wounds for families.']]],
['Bayonet Charge','Ted Hughes','War',[['cold clockwork','Metaphor','The metaphor “cold clockwork” makes the soldier seem mechanical, as though his body is moving through a process he cannot control. “Cold” removes warmth and humanity, while “clockwork” suggests repetitive, automatic movement. Hughes presents the soldier as overwhelmed by the machinery and violence of war rather than acting with heroic certainty.','War dehumanises individuals and reduces them to frightened bodies reacting instinctively.']]],
['Kamikaze','Beatrice Garland','War',[['crab, prawns ... dark prince','Contrast','Fishing imagery -> captures childhood innocence and pure joy.','The poem questions the pressure of patriotic duty and shows the personal cost of conflict.']]],
['The Charge of the Light Brigade','Alfred Tennyson','War',[['valley of Death','Biblical allusion','The biblical echo of the “valley of Death” gives the battlefield the scale of a spiritual trial and makes the soldiers’ danger seem almost inevitable. The capitalised “Death” personifies their enemy as an overwhelming force. Tennyson both honours their courage and exposes the terrible cost of unquestioning obedience.','The poem presents the soldiers as courageous but vulnerable to the destructive consequences of orders.']]],
['The Prelude','William Wordsworth','Nature',[['act of stealth','Diction','The phrase “act of stealth” suggests secrecy and wrongdoing, as if the speaker knows that taking the boat is a transgression. This language reveals his confidence before the mountain appears: he initially treats the natural world as something he can use. The later change in tone exposes the limits of that confidence.','Nature humbles human pride and makes the speaker recognise that he is not in control.']]],
['Storm on the Island','Seamus Heaney','Nature',[['spits like a tame cat','Simile','The simile initially compares the storm to a familiar, apparently harmless pet, making the threat seem manageable. However, “spits” gives the weather an aggressive action, so the comparison becomes unsettling: something that appears tame can still attack. Heaney uses this shift to challenge the islanders’ confidence in their ability to withstand nature.','Nature is unpredictable; human confidence can be undermined by forces that seem familiar or harmless.']]],
['My Last Duchess','Robert Browning','Powerful Rulers',[['my...I','Pronouns / Dramatic Monologue','The possessive pronoun “my” makes the Duchess sound like the Duke’s property rather than an independent person. Combined with “last”, it hints at his control over her fate and reveals how he treats relationships as possessions. Browning lets the Duke expose his own arrogance through his choice of words.','The poem criticises patriarchal power and the way authority can become possessive and abusive.']]],
['London','William Blake','Powerful institutions',[['mind-forged manacles','Metaphor','The metaphor “mind-forged manacles” turns psychological oppression into the image of physical chains. “Forged” suggests that these restraints have been made and reinforced by people and institutions, while “manacles” conveys imprisonment. Blake implies that social systems shape how people think until oppression becomes internalised.','Powerful institutions restrict freedom both physically and through the beliefs people are taught to accept.']]],
['Tissue','Imtiaz Dharker','Powerful institutions',[['Koran ... maps ... slips','Symbolism','The list brings together sacred writing, political borders and fragile pieces of paper, suggesting that human structures depend on materials that can easily be damaged. Dharker places different kinds of authority alongside one another to question how securely people build power, identity and boundaries. The fragile paper becomes a symbol of the limits of human control.','Human systems and claims to authority are fragile; power does not last forever.']]],
['The Émigrée','Carol Rumens','Identity',[['bright ... shadow','Contrast','The contrast between “bright” and “shadow” places the speaker’s hopeful memory beside the darker reality of political conflict. Light suggests warmth, belonging and an idealised homeland, whereas shadow hints at danger and loss. Rumens shows that the speaker’s attachment to home survives even when the place itself has changed.','Memory can preserve identity and belonging even when conflict makes returning home difficult.']]],
['Checking Out Me History','John Agard','Identity',[['Dem','Dialect / pronoun','The repeated colloquial pronoun “Dem” creates a clear distinction between the speaker and the people who control the version of history he has been taught. Its repetition gives the voice rhythm and resistance, challenging the authority of the dominant group. Agard uses dialect to assert an identity that official education has marginalised.','The poem challenges cultural oppression and shows the speaker reclaiming his identity and history.']]],
['Exposure','Wilfred Owen','Nature',[['black with snow','Colour imagery','The paradoxical image “black with snow” combines a colour associated with darkness and death with snow, which is usually associated with whiteness and purity. This disturbing contrast makes the landscape feel unnatural and hostile, reflecting the soldiers’ psychological despair. Owen presents nature not as comforting but as another force attacking exhausted men.','Nature becomes an enemy, intensifying the soldiers’ physical suffering and mental disintegration.'],['cringe in holes','Verb / imagery','The verb “cringe” suggests fear, shame and an instinctive shrinking away from danger. It makes the soldiers seem small and vulnerable, almost animal-like, while “holes” implies that they are trapped and exposed in the landscape. Owen strips away traditional images of military glory and focuses instead on the soldiers’ degradation and fear.','War reduces soldiers to vulnerable, dehumanised figures and exposes the reality behind patriotic ideas of heroism.']]],
['Ozymandias','Percy Bysshe Shelley','Powerful Rulers',[['sunk ... shattered visage','Visual imagery','The verbs “sunk” and “shattered” create a picture of a face physically broken and partly swallowed by the sand. “Shattered” suggests not only the destruction of the statue but also the collapse of Ozymandias’ authority and reputation. The fragmentary description makes his attempt to preserve his greatness seem futile: time and the natural world have outlasted the ruler and his empire.','Shelley presents political power and human pride as temporary; time and nature eventually overwhelm human achievements.'],['King of Kings','Irony / allusion','The title “King of Kings” is a biblical allusion usually associated with supreme, divine authority. Ozymandias applies this grand title to himself, revealing his arrogance and belief that he is above other rulers. The irony is that the inscription survives while the kingdom it celebrates has vanished, so the boast becomes evidence of his failure rather than his greatness.','Shelley mocks rulers who imagine themselves godlike and suggests that no human power can defeat time.']]]
];
const exactNotes={"Remains":[["inside out...tosses his guts","Horrific imagery / Colloquial language",["Brutal/unemotional language -> soldier mentally distances from violence.","\"tosses\" -> connotations of carelessness; war desensitizes soldiers.","Colloquial tone -> speaker unable to process military memories normally.","Critical stance -> attacks romanticized view of war."]],["blood-shadow","Metaphor",["Stain/shadow -> overpowering guilt; imprinted memory of dead man.","\"shadow\" -> absence of light; explores dark subject matter.","Trauma -> highlights difficulty overcoming war experiences."]]],"War Photographer":[["light is red","Colour Imagery",["Red -> connotations of blood; highlights dangers of war zones.","Red light -> links to church tabernacle where photographer seeks comfort.","Parallels -> compares priest and war photographer exposed to death/suffering."]],["blood stained.... foreign dust","Imagery",["Stained -> links to memories and deep psychological scarring.","Distance -> avoids naming a place to distance himself from horror.","Isolation -> mirrors how people isolate themselves from trauma."]]],"Poppies":[["bandaged ... Poppies ... blockade","Semantic field of war",["The semantic field reinforces the idea of pain and injury, with the physical injury explored representing the emotional injury that the speaker suffers from.","The idea of \"Poppies\" has connotations of blood and death, showing that there is no way back for the speaker to regain her previous joy of motherhood."]],["my stomach busy... making tucks, darts, pleats","Imagery",["Here, Duffy explores the psychological impact of conflict and death, from a maternal perspective.","The imagery creates a sense of unease and anxiety, with the layers of folds, mirroring the layers of grief and suffering that she experiences.","The sharpness or edged nature of those folds, mirrors the sharpness of her memories and anguish."]]],"Bayonet Charge":[["cold clockwork ....stars... nations","Metaphor",["Clockwork -> mechanical, unemotional state of existence; transformed into killers.","Exploitation -> questions how the state controls and decides their fate.","Cog in a machine -> highlights lack of choice and indignation at leadership."]],["King, honour, human dignity, etcetera","List",["Battle fear -> shows patriotic ideals are instantly replaced with fear.","Self-indulgence -> ideals are irrelevant and must be abandoned to survive.","Hollow concepts -> highlights patriotic ideas as meaningless in brutal war."]]],"Kamikaze":[["crab, prawns ... dark prince","Contrast",["Fishing imagery -> captures childhood innocence and pure joy.","Parallels -> fish and people are both trapped, unable to escape fate.","\"dark price\" -> forebodes a darker end; war blights all life."]],["eight","Symbolism",["Infinity symbol -> flag emphasizes power of state; soldier cannot escape destiny.","Sailing knot -> reinforces idea that pilot is completely trapped.","Unlimited nature -> continuous cycle of pain/shame; cannot return to normal life."]]],"The Charge of the Light Brigade":[["valley of Death... jaws of death","Metaphor / Personification",["Biblical reference -> connotations of hell; highlights battlefield horrors.","Predator -> personifies battlefield to show the vicious nature of war.","Bravery -> emphasizes the extreme bravery of the charging soldiers."]],["honour","Imperatives / Form: Lament",["Remembrance -> emphasizes central message of respect for sacrifice.","Immortalises -> clear purpose to keep soldiers' memory alive forever.","Conflict -> questions the battle; weighs bravery against blunders of leadership.","Celebration -> poem is traditionally a lament/mourning, but twists into celebration."]]],"The Prelude":[["act of stealth","Symbolism",["Theft of boat -> highlights overwhelming pride leading to immoral actions.","Aggression -> man is aggressive, dominant, corrupt; detracts from nature.","Spiritual journey -> man discovers humanity has no authority over nature."]],["upreared its head","Personification / Enjambment",["Attack -> nature acts as a deadly force, metaphorically attacking man.","Hostile force -> nature is subverted, transforming into something harsh and brutal.","Simplistic vocabulary -> shows how nature can shock and overwhelm man's pride.","The Sublime -> inspires intense feelings of awe and terror; impacts emotional state.","Enjambment -> emphasizes intensity of weather; mirrors chaotic emotional response."]]],"Storm on the Island":[["strafe... salvo... bombarded","Semantic field of war / Blank verse",["Unpredictable force -> demonstrates nature as an active military aggressor.","No mercy -> community is left entirely at the mercy of the storm.","Romanticism subverted -> updates traditions by showing nature as hostile.","The Troubles -> context of conflict suggests war upsets balance between man and nature."]],["spits like a tame cat / a huge nothing","Simile / Oxymoron",["Aggression -> \"spits\" has connotations of unpredictable natural anger.","Domesticity -> simile offers a familiar image, undermining nature's actual power.","Imagination -> oxymoron shows human imagination exacerbates natural fears."]]],"Exposure":[["black with snow","Oxymoron",["The oxymoron creates a stifling tone, full of despair. It shows how the soldiers face a psychological struggle.","The oxymoron highlights how nature has been subverted. Nature's power is on display as it attacks the soldiers.","The idea of \"black\" has connotations of decay and moral corruption, emphasising how the equilibrium between man and nature has become disturbed by man's actions during war."]],["cringe in holes","Imagery",["The idea of \"cringe\" shows how the soldiers are left vulnerable and defeated, seeking refuge, having lost their dignity.","The imagery highlights the power of nature as the soldiers are dehumanised.","Owen shows that nature and war have reduced the soldiers to an animalistic state.","Owen's use of caesura, shows how war and nature are unpredictable, and this contributes to the soldiers' mental disintegration."]]],"My Last Duchess":[["my...I","Pronouns / Dramatic Monologue",["The pronoun \"my\" is used to highlight the Duke's possessive nature, showing how the Duchess is objectified.","Browning uses the pronouns to emphasise the Duke's self-obsession and vanity.","The pronouns, along with the form of the dramatic monologue, show that he is the sole dominant voice, with his control over the narrative mirroring how he controlled the Duchess."]],["Neptune ...Taming a sea-horse","Metaphor",["Here, the metaphor of Neptune, links to the Roman God of the sea. We can draw parallels between the Duke and Neptune as both are dominant and overwhelming.","The metaphor introduces the idea of scale, when considering the size of the sea horse compared to Neptune. This shows the power imbalance present in the household, which mirrors the power imbalance in patriarchal society.","Browning uses the poem to criticise leaders who abuse their power in a domestic setting, with him perhaps being critical over inequality in relation to who holds power."]]],"London":[["black'ning church","Symbolism",["The idea of \"black'ning\" has connotations of decay, emphasising the corrupt nature of the institution.","Through the symbolism, Blake creates a sense of shame, showing how the church has failed in its mission.","Blake is highly critical of the church, criticising their role in oppressing the poor."]],["mind-forged manacles","Metaphor",["The metaphor to show how people are shackled by poverty.","Blake uses the metaphor to highlight the idea of an inner conflict in the citizens of London, as they are left powerless due to the way that they think. This links to Rousseau's belief that authority controls and in order to achieve freedom a revolution is required.","Blake however, does not use the poem to advocate for a physical revolution. Instead he wants a revolution in the way that people think in order to challenge the status quo."]]],"Tissue":[["Koran... maps ... slips","Symbolism",["The symbolism is used to represent powerful institutions and forces, with the \"Koran\" representing religion, \"maps\" representing nations and \"slips\" representing finance.","Dharker uses the symbolism to criticise these institutions due to their divisive nature.","The poem is used to consider what the world would be like if these institutions share the characteristics of tissue, including transparency."]],["light","Symbolism",["Dharker uses the symbolism to show that nature is a force that can overpower any man made centres of power.","The idea of \"light\" has connotations of religion. Therefore, perhaps Dharker uses the symbolism to show that nature and God are the solutions to conflict and institutional corruption.","Dharker draws upon the traditions of Romanticism to champion nature."]]],"The Émigrée":[["bright.... shadow","Contrast",["Warmth -> \"bright\" connotes nostalgia, idealising her past home.","Identity -> devotion and deep emotional attachment to birthplace is central.","Reality -> \"shadow\" captures the threatening, dark reality of the current city.","Internal struggle -> highlights attempts to reconcile opposing views of home."]],["city","Setting",["Hostile place -> setting shows the direct effects of war creating a totalitarian state.","Psychological impact -> childhood vision is completely ruined by a darker reality.","Metaphor -> represents growth from dreamlike childhood to adult understanding."]]],"Checking Out Me History":[["Dem","Anaphora",["Authority conflict -> emphasizes barrier between rulers and the speaker.","Worldview -> highlights how those in power actively force their history on others.","Accusatory tone -> criticises authority for denying him his true culture."]],["carving","Metaphor",["Care -> process is slow, showing reclaiming identity takes massive effort.","Cultural identity -> highlights validation of personal history.","Resolute stance -> conveys absolute willingness to struggle against status quo."]]]};
Object.assign(exactNotes,{"Ozymandias":[["sunk... shattered visage","LFS: Symbolism",["“shattered” connotations destruction and ruin; symbolism of statue highlights downfall of egoistic rulers.","human power temporary and fall of powerful rulers inevitable.","Shelley's critical stance towards powerful rulers, critique of King George III.","Ozymandias mixture of Shakespearean and Petrarchan Sonnet; breaking traditional form shows nothing, including traditions, lasts forever; rebellion against sonnet form mirrors rebellion against authoritative rulers, typical of Romantics."]],["King of Kings","LFS: Allegory / Setting",["allegory religious connotations supreme power, emphasising narcissistic nature of corrupt rulers.","Shelley attacks Godlike rulers and pride.","allegory direct reference to Jesus; desert setting where temptation of Jesus took place; power as tempting force overwhelming rulers.","Romantic poet uses nature to overwhelm human creations, showing nature supreme."]]],"My Last Duchess":[["my...I","LFS: Pronouns / Dramatic Monologue",["pronoun “my” highlights Duke's possessive nature and Duchess objectification.","pronouns emphasise Duke's self-obsession and vanity.","pronouns plus dramatic monologue show he is sole dominant voice; control of narrative mirrors how he controlled Duchess."]],["Neptune ...Taming a sea-horse","LFS: Metaphor",["Neptune Roman God of sea; parallels between Duke and Neptune as dominant and overwhelming.","metaphor introduces scale; sea horse vs Neptune; power imbalance household mirrors patriarchal society.","Browning criticises leaders abusing power in domestic setting, perhaps inequality over who holds power."]]]});

async function refresh(){const {data}=await supabase.auth.getUser();user=data.user||null;$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('logout').classList.toggle('hidden',!user);if(user){let r=await supabase.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=r.data;const ar=await supabase.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();isAdmin=!!ar.data;if(isAdmin){$('adminButton')?.classList.remove('hidden')}else{$('adminButton')?.classList.add('hidden')}$('who').textContent=profile?.username||user.email;startPresence();render()}}
function say(id,msg){$(id).textContent=msg}
$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,username=$('username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');if(!email||!email.includes('@'))return say('authmsg','Enter a valid email address.');if(password.length<6)return say('authmsg','Password must be at least 6 characters.');if(username.length<3)return say('authmsg','Username must be at least 3 characters.');$('signup').disabled=true;try{const {data,error}=await supabase.auth.signUp({email,password,options:{data:{username,display_name:username}}});if(error){say('authmsg',error.message+' If this email already has an account, use Log in instead.');return}say('authmsg',data.session?'Account created!':'Check your inbox to confirm your email, then log in.');if(data.session)await refresh()}catch(e){say('authmsg','Sign-up failed: '+(e.message||'Please try again.'))}finally{$('signup').disabled=false}};
$('login').onclick=async()=>{const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});say('authmsg',error?.message||'Signed in.');if(!error)refresh()};
$('logout').onclick=async()=>{await supabase.auth.signOut();refresh()};

if(localStorage.getItem('rc-theme')==='dark'){document.body.classList.add('dark');$('theme').textContent='Light mode'}

const scienceStarter={"biology":{"title":"Biology","topics":[{"id":"cell-biology","title":"Cell biology","tag":"Combined & Triple","summary":"Cell structures, microscopy, specialised cells, cell division and transport.","notes":["Animal and plant cells are eukaryotic: they contain a nucleus in which the genetic material is organised as linear chromosomes. Both have a cell membrane, cytoplasm, mitochondria and ribosomes.","Bacterial cells are prokaryotic and are much smaller. Their DNA is a circular chromosome free in the cytoplasm; some also contain plasmids. They have a cell wall but no nucleus or mitochondria.","Know the function of each organelle: the nucleus contains DNA and controls cell activities; mitochondria are the site of aerobic respiration; ribosomes build proteins; the membrane controls exchange; chloroplasts absorb light for photosynthesis; the vacuole contains cell sap.","Microscopes reveal structures too small to see with the unaided eye. Magnification = image size ÷ actual size. Convert units before calculating: 1 mm = 1,000 μm and 1 μm = 1,000 nm.","Diffusion is the net movement of particles from a higher to a lower concentration. Osmosis is the net movement of water through a partially permeable membrane from a more dilute solution to a more concentrated solution.","Active transport moves substances against a concentration gradient using energy from respiration. Mitosis makes two genetically identical daughter cells for growth and repair; cells can differentiate to become specialised for particular functions.","Cell differentiation is the process by which a cell changes to become specialised. In animals, most differentiation happens early in development, although some stem cells remain in adult tissues for repair. Plant cells can often differentiate throughout life, allowing growth at meristems.","Stem cells can divide and produce cells that may differentiate into specialised types. Embryonic stem cells can form many cell types, while adult stem cells are more limited. Potential uses include replacing damaged cells; risks include rejection, infection, uncontrolled division and ethical concerns about embryo use.","To calculate magnification, use image size ÷ actual size and keep both measurements in the same units. Convert millimetres to micrometres before substituting: 1 mm = 1,000 μm. Resolution is the ability to distinguish two close points as separate; greater magnification does not automatically mean better resolution."],"terms":["Eukaryote — a cell with DNA enclosed in a nucleus.","Prokaryote — a cell without a nucleus; bacterial cells are prokaryotic.","Diffusion — net movement of particles down a concentration gradient.","Osmosis — net movement of water through a partially permeable membrane.","Active transport — movement against a concentration gradient using energy.","Differentiation — change that makes a cell specialised for a particular function.","Stem cell — unspecialised cell that can divide and differentiate.","Resolution — ability to distinguish two close points as separate."],"prompts":["What features identify an animal or plant cell as eukaryotic?","How is bacterial genetic material arranged, and how does this differ from a eukaryotic cell?","Compare diffusion, osmosis and active transport.","How does mitosis support growth and repair?","How does differentiation produce specialised cells?","Compare embryonic and adult stem cells, including one use and one risk.","A cell image is 36 mm wide and the real cell is 12 μm wide. What is the magnification?"],"q":"A cell has a cell wall, membrane, cytoplasm and circular DNA, but no nucleus. What type of cell is it?","a":["bacterial","prokaryotic","a prokaryote"],"exam":"Explain how a root hair cell is adapted for absorbing water and mineral ions from soil.","mark":"The long projection gives a large surface area for water uptake by osmosis. Its thin wall gives a short pathway. Mineral ions can be taken up by active transport against a concentration gradient, using energy from mitochondria.","gapWords":["eukaryotic","prokaryotic","mitochondria","magnification","osmosis","active transport"],"practical":"Required practical focus: use a light microscope to observe plant and animal cells. Prepare a thin sample, add an appropriate stain when needed, lower the coverslip carefully, focus from low to higher magnification and draw a labelled biological drawing. For osmosis investigations, record initial and final mass, calculate percentage change and control potato size, solution volume, concentration, time and temperature.","commonMistakes":["Magnification is image size divided by actual size, not the reverse.","A cell wall does not prove a cell is a plant cell; bacteria also have cell walls.","Mitosis produces two genetically identical daughter cells; meiosis makes genetically varied gametes."],"examQuestions":[{"question":"A student measures a cell as 36 mm on a printed image. Its actual width is 12 μm. Calculate the magnification and explain why units must be converted first.","marks":"Convert 36 mm to 36,000 μm; magnification = 36,000 ÷ 12 = ×3,000. Both measurements must use the same unit so the ratio is dimensionless."}],"workedExamples":[{"title":"Microscope magnification","question":"An image is 18 mm wide; the actual cell is 60 μm wide. Calculate magnification.","steps":["Convert 18 mm to 18,000 μm.","Magnification = image size ÷ actual size.","18,000 ÷ 60 = 300."],"answer":"×300","note":"Magnification has no unit because it is a ratio."}]},{"id":"organisation","title":"Organisation","tag":"Combined & Triple","summary":"Digestive enzymes, the heart and circulation, blood, gas exchange and plant transport.","notes":["Living organisms are organised in levels: cells form tissues, tissues form organs, organs form organ systems and systems work together in an organism. A tissue contains cells with related functions.","The digestive system breaks large, insoluble food molecules into smaller soluble molecules that can cross the gut wall. Amylase breaks starch into sugars, proteases break proteins into amino acids and lipases break lipids into fatty acids and glycerol.","Enzymes are biological catalysts. A substrate binds to a complementary active site; the reaction forms products and the enzyme can be reused. Temperature and pH affect active-site shape; extreme conditions can denature an enzyme.","The heart pumps blood through a double circulatory system: one circuit carries blood to the lungs for gas exchange and the other carries blood to the body. The right side pumps to the lungs; the left side pumps to the body at higher pressure.","Arteries carry blood away from the heart and have thick, elastic, muscular walls. Veins return blood at lower pressure and contain valves. Capillaries have very thin walls, allowing substances to diffuse between blood and tissues.","Alveoli provide a large surface area, thin moist walls and a rich blood supply for gas exchange. In plants, xylem transports water and mineral ions upwards; phloem transports dissolved sugars around the plant by translocation.","Digestive enzymes are specific because the active site has a shape complementary to its substrate. The substrate binds, a reaction occurs and products leave. Enzymes are not used up, so the same enzyme molecule can catalyse repeated reactions.","The small intestine is adapted for absorption: it is long, has many villi and microvilli to increase surface area, a thin epithelium for a short diffusion distance and a good blood supply to maintain concentration gradients. Lacteals absorb products of fat digestion.","Blood transports substances around the body. Red blood cells contain haemoglobin to carry oxygen and have a biconcave shape; white blood cells defend against pathogens; platelets help blood clot; plasma carries dissolved substances including carbon dioxide, urea, hormones and nutrients."],"terms":["Enzyme — a biological catalyst that speeds up reactions without being used up.","Substrate — the molecule an enzyme acts on.","Denaturation — a permanent change to an enzyme's active site so its substrate no longer fits.","Villus — a small-intestine projection that increases absorptive surface area.","Translocation — movement of dissolved sugars through phloem.","Villus — finger-like projection in the small intestine that increases absorption area.","Haemoglobin — protein in red blood cells that binds oxygen.","Translocation — movement of dissolved sugars through phloem."],"prompts":["What happens to starch, proteins and lipids during digestion?","How do temperature and pH affect enzyme activity?","Trace the route of blood through the double circulatory system.","How are alveoli adapted for rapid gas exchange?","Explain how the small intestine is adapted for efficient absorption.","Describe the roles of red blood cells, white blood cells, platelets and plasma.","Why do enzymes have optimum temperature and pH conditions?"],"q":"Which blood vessel carries blood away from the heart?","a":["artery","an artery"],"exam":"Explain how villi are adapted for absorption in the small intestine.","mark":"Villi and microvilli provide a large surface area. The epithelium is one cell thick, giving a short diffusion distance. A good capillary supply carries absorbed substances away and maintains concentration gradients; lacteals absorb fatty acids and glycerol.","gapWords":["tissues","amylase","active site","double","capillaries","phloem"],"practical":"Required practical focus: investigate how pH affects amylase breaking down starch. Use iodine to test samples at timed intervals; record the time until starch is no longer detected. Keep temperature, enzyme concentration, starch concentration and volumes controlled, repeat readings and compare rates using 1 ÷ time.","commonMistakes":["Arteries are defined by carrying blood away from the heart, not by carrying oxygenated blood; the pulmonary artery is an exception.","Enzymes are biological catalysts and are not used up in the reaction.","Xylem transports water and mineral ions; phloem transports dissolved sugars."],"examQuestions":[{"question":"Explain how the structure of the small intestine allows digested food molecules to be absorbed rapidly.","marks":"Villi and microvilli provide a large surface area; the epithelium is one cell thick, giving a short diffusion distance; capillaries carry absorbed glucose and amino acids away, maintaining a concentration gradient; lacteals absorb products of lipid digestion."}]},{"id":"infection-response","title":"Infection and response","tag":"Combined & Triple","summary":"Pathogens, communicable disease, body defences, vaccination and medicines.","notes":["Communicable diseases are caused by pathogens that can spread between organisms. Bacteria are living cells that may release toxins; viruses reproduce inside host cells; fungi and protists can also cause disease.","Pathogens can spread through direct contact, droplets in the air, contaminated food or water, blood and vectors such as mosquitoes. Hygiene, isolation, clean water, sanitation and vector control reduce transmission.","The body has several non-specific defences: skin forms a physical barrier, blood clotting seals wounds, mucus traps pathogens, cilia move mucus out of airways, and stomach acid kills many swallowed microbes.","White blood cells defend the body by engulfing pathogens (phagocytosis), producing antibodies that bind to specific antigens, and producing antitoxins that neutralise toxins.","Vaccination introduces harmless forms or components of a pathogen's antigen. The immune system makes specific antibodies and memory cells; a later infection triggers a faster, stronger response.","Antibiotics kill bacteria or stop them reproducing but do not work against viruses. Overuse and incomplete courses can select resistant bacteria; painkillers relieve symptoms but do not kill pathogens.","Communicable diseases are caused by pathogens that can be transferred between organisms. Transmission may occur by direct contact, droplets, contaminated food or water, body fluids or vectors. Hygiene, sanitation, isolation, vaccination and vector control interrupt different routes.","The immune system distinguishes foreign antigens from the body's own cells. Phagocytes engulf pathogens by phagocytosis. Lymphocytes recognise specific antigens and produce complementary antibodies; some form memory cells that remain after the infection.","Antibiotics treat bacterial infections by targeting bacterial structures or processes, such as cell-wall formation. They do not work against viruses because viruses reproduce inside host cells and do not have the same structures. Overuse selects resistant bacteria, so antibiotics should be used appropriately."],"terms":["Pathogen — a microorganism or agent that causes disease.","Communicable disease — an infectious disease that can spread between organisms.","Antigen — a molecule recognised by the immune system.","Antibody — a specific protein made by lymphocytes that binds to an antigen.","Antibiotic resistance — inherited ability of bacteria to survive an antibiotic that once killed them.","Phagocytosis — engulfing and digesting pathogens by a phagocyte.","Lymphocyte — white blood cell involved in specific immune responses.","Memory cell — long-lived immune cell that enables a faster response on re-exposure."],"prompts":["Compare how bacteria and viruses cause disease.","Name routes by which pathogens spread and ways to reduce transmission.","How do phagocytes and lymphocytes defend the body?","Why does vaccination protect against future infection?","Compare how phagocytes and lymphocytes defend the body.","Explain why antibiotics do not treat influenza and how resistance can spread.","How do vaccination and memory cells reduce the chance of developing symptoms?"],"q":"Why are antibiotics ineffective against influenza?","a":["influenza is caused by a virus","viruses","because influenza is viral"],"exam":"Explain how vaccination can reduce the spread of a communicable disease.","mark":"The vaccine presents pathogen antigens without causing the disease. Lymphocytes make specific antibodies and memory cells. On later exposure the response is quicker, so the pathogen is destroyed before symptoms develop; high uptake also reduces transmission.","gapWords":["pathogens","droplets","mucus","phagocytosis","antibodies","viruses"],"practical":"Practical and data focus: evaluate methods used to reduce microbial growth, such as aseptic technique and disinfectants. Consider how to keep plates uncontaminated, use a control, measure clear zones consistently and explain why cultures are incubated at a safe temperature in school laboratories.","multi":{"prompt":"Select every accurate statement about immunity.","options":[["a","Vaccination can stimulate memory-cell formation.",true],["b","Antibodies bind to specific antigens.",true],["c","Antibiotics kill influenza viruses.",false],["d","All pathogens spread only by direct contact.",false]],"explanation":"Vaccination can leave memory cells and antibodies bind specific antigens. Antibiotics act against bacteria, not viruses; pathogens spread by several routes."},"commonMistakes":["Antibiotics kill or inhibit bacteria, not viruses.","Vaccines do not usually contain a dose of antibiotics; they expose the immune system to antigens safely.","Antibiotic resistance arises through inherited variation and selection, not because an individual bacterium deliberately adapts."],"examQuestions":[{"question":"Explain how vaccination can protect a person and reduce the spread of a communicable disease.","marks":"The vaccine introduces pathogen antigens without causing the disease; lymphocytes make specific antibodies and memory cells; on later exposure the response is faster and larger, destroying the pathogen before symptoms develop; fewer infected people reduces opportunities for transmission."}]},{"id":"bioenergetics","title":"Bioenergetics","tag":"Combined & Triple","summary":"Photosynthesis, limiting factors, respiration and metabolism.","notes":["Photosynthesis transfers energy from light into chemical energy stored in glucose. Word equation: carbon dioxide + water → glucose + oxygen. The reaction requires light energy absorbed by chlorophyll in chloroplasts.","Plants use glucose for respiration, making cellulose for cell walls, making amino acids with nitrate ions, and storing carbohydrate as starch. The rate of photosynthesis can be estimated by oxygen production or carbon dioxide uptake.","Light intensity, carbon dioxide concentration and temperature can limit photosynthesis. Increasing one factor raises the rate only until another factor becomes limiting; very high temperatures can reduce the rate as enzymes lose their functional shape.","Respiration releases energy from glucose for cellular processes. Aerobic respiration uses oxygen: glucose + oxygen → carbon dioxide + water. It occurs mainly in mitochondria and releases much more energy than anaerobic respiration.","Anaerobic respiration in muscles is incomplete breakdown of glucose to lactic acid when oxygen supply cannot meet demand. In yeast and plants it produces ethanol and carbon dioxide. Anaerobic respiration releases less energy per glucose molecule.","Metabolism is the sum of all chemical reactions in cells. It includes building larger molecules, breaking down excess substances and converting glucose into other molecules; respiration supplies energy for many of these reactions.","Photosynthesis is affected by light intensity, carbon dioxide concentration and temperature. The factor in shortest supply is limiting. Increasing one factor raises the rate only until another becomes limiting; high temperatures can reduce the rate when enzymes lose their functional shape.","Glucose made in photosynthesis can be used in respiration, converted to starch for storage, used to make cellulose, or combined with nitrate ions to make amino acids and proteins. Plants therefore need mineral ions as well as light, carbon dioxide and water.","Aerobic respiration releases more energy per glucose molecule than anaerobic respiration because glucose is broken down more completely. In muscles, anaerobic respiration produces lactic acid; oxygen debt describes the extra oxygen needed after exercise to process the lactic acid and restore the body."],"terms":["Photosynthesis — process that transfers light energy into chemical energy in glucose.","Chlorophyll — green pigment that absorbs light energy.","Limiting factor — a factor in shortest supply that restricts a rate.","Aerobic respiration — energy-releasing breakdown of glucose using oxygen.","Metabolism — the sum of all chemical reactions in a cell or organism.","Oxygen debt — extra oxygen needed after exercise to restore the body to its resting state.","Starch — insoluble carbohydrate used by plants for energy storage.","Limiting factor — variable that restricts the rate when it is in shortest supply."],"prompts":["Write the word equation for photosynthesis and explain where it occurs.","How can light intensity, carbon dioxide and temperature limit photosynthesis?","Compare aerobic and anaerobic respiration.","What does metabolism include?","Explain what happens to the rate of photosynthesis when light is increased but carbon dioxide is limiting.","Give four different uses of glucose in a plant.","Compare aerobic and anaerobic respiration in humans."],"q":"Which gas is required for aerobic respiration?","a":["oxygen"],"exam":"Explain why increasing light intensity eventually stops increasing the rate of photosynthesis.","mark":"At low light intensity, light is limiting. As intensity rises, another factor such as carbon dioxide concentration or temperature becomes limiting. Once that factor limits the reaction, more light cannot increase the rate.","gapWords":["light","glucose","limiting","oxygen","lactic acid","metabolism"],"practical":"Required practical focus: investigate the effect of light intensity on photosynthesis using pondweed. Measure oxygen bubbles or gas volume at set distances; change one variable, allow the plant to acclimatise, repeat, and control temperature and carbon dioxide concentration. Bubble count is an estimate and can vary with bubble size.","multi":{"prompt":"Select every accurate statement about bioenergetics.","options":[["a","Photosynthesis transfers light energy into chemical energy.",true],["b","Aerobic respiration uses oxygen.",true],["c","Chlorophyll is found in mitochondria.",false],["d","Energy is created during respiration.",false]],"explanation":"Photosynthesis stores energy in glucose in chloroplasts, and aerobic respiration uses oxygen. Chlorophyll is in chloroplasts and energy is transferred, not created."},"commonMistakes":["Photosynthesis stores energy in glucose; respiration transfers energy from glucose to usable forms.","Increasing light cannot raise the rate indefinitely if carbon dioxide or temperature becomes limiting.","Anaerobic respiration in human muscles produces lactic acid, not ethanol."],"examQuestions":[{"question":"A plant is moved into brighter light, but its photosynthesis rate barely changes. Explain why.","marks":"Light may no longer be the limiting factor. Carbon dioxide concentration or temperature may restrict the rate; increasing light further has little effect until the limiting factor is increased. The rate may also fall if temperature becomes high enough to affect enzymes."}]},{"id":"homeostasis","title":"Homeostasis and response","tag":"Combined & Triple","summary":"Nervous coordination, hormones, blood glucose, temperature and water balance.","notes":["Homeostasis is regulation of internal conditions to keep them near optimum levels for cells. Receptors detect changes, coordination centres process information and effectors produce a response.","Most homeostatic systems use negative feedback: a change away from a set level triggers responses that oppose the change. When conditions return towards the normal range, the corrective response is reduced.","The nervous system produces rapid, short-lived responses. A stimulus is detected by receptors; impulses travel along sensory neurones to the central nervous system and then along motor neurones to effectors.","A reflex arc is a rapid automatic pathway: receptor → sensory neurone → relay neurone in the CNS → motor neurone → effector. Synapses use chemical neurotransmitters to pass the signal between neurones.","Hormones are chemical messengers released by endocrine glands into the blood. They usually act more slowly than nerve impulses but their effects can last longer. The pituitary gland coordinates several other glands.","Blood glucose is regulated by the pancreas. Insulin lowers blood glucose by promoting uptake and conversion of glucose to glycogen; glucagon raises it by stimulating glycogen breakdown. Type 1 diabetes involves insufficient insulin; Type 2 involves body cells responding poorly to insulin.","The nervous pathway for a voluntary response is receptor → sensory neurone → central nervous system → motor neurone → effector. A reflex arc includes a relay neurone and produces a rapid, automatic response that reduces the time available for conscious processing.","Synapses are small gaps between neurones. An electrical impulse causes neurotransmitter chemicals to be released; they diffuse across the gap and bind to receptors on the next neurone, starting a new electrical impulse. Transmission is one-way because neurotransmitter is released from one side.","The menstrual cycle is controlled by hormones. FSH stimulates an egg to mature; oestrogen rebuilds the uterus lining and inhibits FSH while stimulating LH; a surge in LH triggers ovulation; progesterone maintains the lining and inhibits FSH and LH. Hormonal contraception changes these signals."],"terms":["Homeostasis — regulation of internal conditions within narrow limits.","Negative feedback — response that reverses a change away from a set level.","Receptor — cell or organ that detects a stimulus.","Effector — muscle or gland that carries out a response.","Hormone — chemical messenger transported in the blood.","Synapse — junction between neurones where neurotransmitters pass a signal.","Neurotransmitter — chemical released to transmit a signal across a synapse.","Ovulation — release of an egg from an ovary."],"prompts":["Describe the components of a homeostatic control system.","How does negative feedback restore a condition towards its normal level?","Trace the pathway of a reflex arc.","Compare insulin and glucagon.","Trace an impulse through a reflex arc in the correct order.","Explain how a neurotransmitter passes a signal across a synapse.","Describe the roles of FSH, oestrogen, LH and progesterone in the menstrual cycle."],"q":"Which hormone lowers blood glucose concentration?","a":["insulin"],"exam":"Explain how the body responds when blood glucose concentration rises after a meal.","mark":"The pancreas detects the rise and releases insulin. Cells take up more glucose; liver and muscle cells convert excess glucose to glycogen. Blood glucose falls towards its normal level by negative feedback.","gapWords":["receptors","negative feedback","sensory","synapses","endocrine","insulin"],"practical":"Required practical focus: investigate reaction time using a ruler-drop test. Keep the method and starting position consistent, repeat measurements, calculate a mean and consider outliers. A ruler-drop result is influenced by anticipation and practice, so compare groups cautiously.","multi":{"prompt":"Select every accurate statement about homeostasis.","options":[["a","Receptors detect changes in conditions.",true],["b","Negative feedback usually opposes a change away from a set level.",true],["c","Insulin raises blood glucose concentration.",false],["d","A reflex response is coordinated only by hormones.",false]],"explanation":"Receptors detect stimuli and negative feedback counteracts the deviation. Insulin lowers blood glucose; reflex arcs use neurones and the CNS."},"commonMistakes":["Insulin lowers blood glucose; glucagon raises it.","A reflex is coordinated through the nervous system and is not the same as a hormone response.","Negative feedback reverses a change away from the normal range; it does not amplify the change."],"examQuestions":[{"question":"Explain how the body brings an increased blood glucose concentration back towards its normal level after a meal.","marks":"The pancreas detects the rise and releases insulin; body cells take up more glucose; liver and muscle cells convert excess glucose to glycogen; the fall in blood glucose reduces the stimulus and insulin release, completing negative feedback."}]},{"id":"inheritance","title":"Inheritance, variation and evolution","tag":"Combined & Triple","summary":"DNA, genes, chromosomes, reproduction, inheritance, selection and evolution.","notes":["DNA is a polymer that carries genetic information. A gene is a section of DNA that codes for a particular protein; chromosomes are long DNA molecules carrying many genes. Human body cells usually contain 23 pairs of chromosomes.","Meiosis makes gametes with half the normal chromosome number. Fertilisation joins two gametes, restoring the full number and mixing genetic information from two parents.","Sexual reproduction combines genetic information from two parents and produces variation. Asexual reproduction involves one parent and produces genetically similar offspring, except for mutations.","An allele is a version of a gene. In simple genetic crosses, dominant alleles are expressed when one copy is present; recessive alleles are expressed only when two copies are present. Genotypes describe alleles; phenotypes are observable characteristics.","Variation may be genetic, environmental or caused by both. Mutations are changes in DNA; most have no effect or are harmful, but a few create an advantage in a particular environment.","Natural selection occurs when individuals with advantageous inherited characteristics are more likely to survive and reproduce. They pass alleles to offspring; over many generations these alleles become more common, producing evolution.","Meiosis involves two cell divisions after DNA has been copied. It produces four haploid cells with half the chromosome number. In humans, gametes contain 23 chromosomes; fertilisation combines two gametes and restores 46 chromosomes.","Punnett squares show possible combinations of alleles. Write the parental genotypes, identify the allele in each gamete, combine them and calculate the proportion of each genotype. A probability describes expected outcomes over many offspring, not a guarantee for one family.","Evolution by natural selection depends on inherited variation. Random mutations introduce new alleles; individuals with advantageous alleles are more likely to survive and reproduce in a particular environment. Over generations, those alleles become more common in the population."],"terms":["Gene — a section of DNA that codes for a protein or functional product.","Allele — an alternative version of a gene.","Genotype — the alleles an organism possesses for a characteristic.","Phenotype — observable characteristics produced by genes and environment.","Natural selection — differential survival and reproduction due to inherited variation.","Haploid — cell containing one set of chromosomes.","Diploid — cell containing two sets of chromosomes.","Punnett square — diagram used to predict possible allele combinations in offspring."],"prompts":["How are DNA, genes and chromosomes related?","Why does meiosis create gametes with half the chromosome number?","Distinguish genotype from phenotype.","Explain how natural selection can lead to evolution.","Why do gametes have half the chromosome number of body cells?","A heterozygous pair have a child. How would you use a Punnett square to find the probability of a recessive phenotype?","Explain how natural selection can increase antibiotic resistance in bacteria."],"q":"What is an alternative version of a gene called?","a":["allele","an allele"],"exam":"Explain how a population of bacteria can become resistant to an antibiotic.","mark":"Random mutation creates genetic variation; some bacteria already carry a resistance allele. The antibiotic kills susceptible bacteria, while resistant bacteria survive and reproduce. They pass the allele on, so the frequency of resistance increases over generations.","gapWords":["DNA","meiosis","variation","recessive","mutation","selection"],"practical":"Required practical/data focus: use model organisms or simulations to investigate inheritance and variation. For genetic crosses, define alleles, write parental genotypes, work out gametes, construct a Punnett square and state genotype or phenotype probabilities clearly.","multi":{"prompt":"Select every accurate statement about inheritance.","options":[["a","An allele is a version of a gene.",true],["b","Meiosis produces gametes with half the usual chromosome number.",true],["c","A phenotype is the alleles an organism carries.",false],["d","Mutations always improve survival.",false]],"explanation":"Alleles are gene versions and meiosis halves chromosome number. Genotype describes alleles; phenotype describes observable characteristics, and mutations can be neutral, harmful or advantageous."},"commonMistakes":["A dominant allele is not necessarily more common or better; it is expressed when one copy is present.","A Punnett square gives probabilities, not a certain prediction for a particular child.","Individuals do not evolve during their lifetime; populations change over generations."],"examQuestions":[{"question":"A population of bacteria is exposed to an antibiotic. Explain how antibiotic-resistant bacteria can become more common over several generations.","marks":"Random mutation creates variation; some bacteria already have an allele that confers resistance; susceptible bacteria are killed by the antibiotic; resistant bacteria survive and reproduce; they pass the allele to offspring, increasing its frequency."}]},{"id":"ecology","title":"Ecology","tag":"Combined & Triple","summary":"Ecosystems, interdependence, adaptation, biodiversity and material cycles.","notes":["An ecosystem is a community of organisms interacting with each other and their non-living environment. A habitat is where an organism lives; a population is all organisms of one species in an area; a community is all populations there.","Organisms are interdependent: changes to one population can affect others through feeding relationships, competition, pollination, seed dispersal and disease. Food chains show feeding relationships and arrows point in the direction energy is transferred.","Only some biomass and energy pass to the next trophic level. Energy is lost through respiration, movement, heat, waste and uneaten material; less energy is therefore available at higher trophic levels.","Adaptations are features that help an organism survive and reproduce in its environment. They may be structural, behavioural or functional. Extremophiles are adapted to conditions such as high temperature, high salt or high pressure.","Biodiversity is the variety of living organisms. It can be reduced by habitat destruction, pollution, climate change, overexploitation and introduced species. Conservation protects habitats and species and can maintain ecosystem services.","The carbon cycle moves carbon between atmosphere, organisms, oceans and rocks. Photosynthesis removes carbon dioxide; respiration, decomposition and combustion release it. The water cycle includes evaporation, condensation and precipitation.","Sampling must be representative. Randomly place quadrats to reduce selection bias, use the same quadrat size and sampling method, and take enough samples to calculate a mean. A transect records how species distribution changes along an environmental gradient.","Biomass transfer between trophic levels is inefficient. Some material is not eaten, some is indigestible and leaves as waste, and organisms use energy in respiration and movement. Energy is dissipated as heat, so less energy is available to support biomass at higher trophic levels.","Decomposition is faster in warm, moist, oxygen-rich conditions because decomposer microorganisms and their enzymes work more rapidly. Carbon is returned to the atmosphere through respiration by decomposers; nutrient ions are returned to soil and can be absorbed by plants."],"terms":["Ecosystem — community of organisms interacting with their environment.","Population — all organisms of one species in an area.","Trophic level — position of an organism in a food chain or web.","Biodiversity — variety of living organisms in an area or on Earth.","Decomposition — breakdown of dead material and waste by microorganisms.","Quadrat — square sampling frame used to estimate abundance or frequency.","Transect — line or belt used to study changes in distribution across a habitat.","Biomass — mass of biological material in an organism or trophic level."],"prompts":["Distinguish a habitat, population, community and ecosystem.","Why is less biomass transferred to each higher trophic level?","Give examples of structural, behavioural and functional adaptations.","Describe how carbon moves through an ecosystem.","How would you sample the distribution of a plant species across a sloping field?","Explain why less biomass is available at each higher trophic level.","Describe how temperature, water and oxygen affect decomposition."],"q":"What term describes the variety of living organisms in an area?","a":["biodiversity"],"exam":"Explain why removing a top predator can affect several populations in a food web.","mark":"Predator numbers may control prey populations. Removing the predator can allow prey numbers to rise, increasing consumption of plants or smaller animals. This changes competition and food availability elsewhere, causing linked population changes.","gapWords":["ecosystem","energy","trophic","adaptations","biodiversity","photosynthesis"],"practical":"Required practical focus: estimate the distribution of organisms using quadrats and transects. Use random coordinates to avoid bias, sample enough locations, calculate a mean or frequency, and compare habitats while controlling sampling area and method.","multi":{"prompt":"Select every accurate statement about ecosystems.","options":[["a","Food-chain arrows show the direction of energy transfer.",true],["b","Energy is lost from trophic levels through respiration and waste.",true],["c","All biomass is transferred to the next trophic level.",false],["d","A population contains every species in an ecosystem.",false]],"explanation":"Food-chain arrows show energy transfer and energy is lost through respiration, waste and uneaten material. A population is one species."},"commonMistakes":["Energy flows through an ecosystem and is dissipated; matter such as carbon is recycled.","Food-chain arrows point in the direction energy is transferred, from food to consumer.","A single quadrat is unlikely to represent an entire habitat; use random repeats."],"examQuestions":[{"question":"A student compares plant abundance in two habitats using quadrats. Describe a reliable method and explain how the results should be analysed.","marks":"Use random coordinates to position quadrats in each habitat; keep quadrat size and counting method the same; take many samples; count or estimate percentage cover; calculate a mean for each habitat; compare means and consider variation or anomalous samples."}]},{"id":"biology-key-ideas","title":"Biology key ideas and scientific thinking","tag":"Cross-topic key ideas","summary":"Connect cells, genes, energy transfers, ecosystems and the methods used to investigate living systems.","notes":["Cell theory links the organisation of life: cells are the basic units, specialised cells form tissues, tissues form organs and organ systems, and each level depends on the work of the levels below it.","DNA provides instructions for making proteins. Protein structure and activity help determine cell function; changes in DNA can alter proteins and contribute to inherited variation.","Photosynthesis transfers light energy into chemical energy in biomass, while respiration releases energy from food molecules for cell processes. Matter is conserved and atoms are recycled through living organisms and the environment.","Homeostasis keeps internal conditions within narrow limits so enzymes and cells work effectively. Receptors detect changes and control systems coordinate responses, often through negative feedback.","Natural selection links variation to evolution: inherited characteristics that improve reproductive success can become more common over generations. Environmental change can alter which characteristics are advantageous.","Ecological systems depend on interdependence and cycling. Energy enters most food webs through photosynthesis and is transferred between trophic levels, while carbon and water are recycled through the environment."],"terms":["Cell theory — idea that cells are the basic units of living organisms.","Protein — biological molecule whose structure determines its function.","Metabolism — sum of chemical reactions in cells and organisms.","Homeostasis — regulation of internal conditions within narrow limits.","Interdependence — ways organisms rely on one another in an ecosystem."],"prompts":["How does biological organisation link cells to organ systems?","How can a change in DNA affect a cell's function?","How do photosynthesis and respiration connect energy transfer and matter cycling?","Why is homeostasis important for enzyme activity?","How can natural selection change a population over generations?","How are energy flow and material cycles different in ecosystems?"],"q":"What is the term for all chemical reactions taking place in a cell or organism?","a":["metabolism"],"exam":"Explain how photosynthesis, feeding and respiration link energy transfer with the carbon cycle.","mark":"Photosynthesis removes carbon dioxide and stores energy in glucose and biomass. Feeding transfers carbon in organic molecules through food chains. Respiration by plants, animals and microorganisms releases carbon dioxide; decomposition and combustion also return carbon to the atmosphere.","gapWords":["cells","proteins","respiration","homeostasis","selection","carbon"],"practical":"Working scientifically: identify independent, dependent and control variables; choose a valid method and suitable range; repeat measurements; calculate means and percentage change; plot an appropriate graph; identify anomalous results; describe uncertainty and evaluate whether the evidence supports the conclusion.","multi":{"prompt":"Select every accurate statement connecting biological key ideas.","options":[["a","Photosynthesis transfers light energy into chemical energy.",true],["b","Materials such as carbon are recycled through ecosystems.",true],["c","Energy is recycled indefinitely through a food web.",false],["d","Natural selection acts on characteristics acquired during one individual's lifetime.",false]],"explanation":"Photosynthesis stores energy in biomass and matter is recycled. Energy flows and is dissipated; natural selection changes inherited allele frequencies over generations."}},{"id":"biology-separate-extensions","title":"Separate Biology extensions","tag":"Separate Science only","summary":"Additional AQA Biology content: DNA structure, protein synthesis, genetic engineering, cloning and reproduction.","notes":["DNA is a polymer made from two strands twisted into a double helix. Each nucleotide contains a sugar, a phosphate group and one base. The four bases are adenine (A), thymine (T), cytosine (C) and guanine (G); A pairs with T and C pairs with G.","A sequence of three DNA bases is a code for a particular amino acid. The order of bases determines the order of amino acids in a protein. (Higher Tier) Ribosomes assemble amino acids in the order specified by the genetic information; the chain folds into a specific shape that determines protein function.","The human genome is the entire genetic material of a human. Understanding the genome can help scientists identify genes associated with inherited disorders, improve diagnosis and treatment, and study human migration and ancestry.","Genetic engineering modifies an organism's genome by transferring a gene to give a desired characteristic. Restriction enzymes can isolate a gene; a vector such as a bacterial plasmid or virus carries it into target cells. The modified cells can express the useful gene.","Genetically engineered bacteria can produce human insulin. GM crops may be engineered for resistance to insect attack or herbicides, or for other useful characteristics. Evaluation should consider potential benefits, ecological effects, food security, ethics and uncertainty.","Cloning produces genetically identical copies. Plant tissue culture grows many plants from small groups of cells; cuttings and runners are simpler plant methods. In adult cell cloning, a body-cell nucleus is placed into an egg cell whose nucleus has been removed, stimulated to divide, then the embryo can be implanted.","Monoclonal antibodies are identical antibodies produced by clones of a single lymphocyte. A lymphocyte making the required antibody is fused with a tumour cell to form a hybridoma, which can divide repeatedly and produce the antibody. The antibody binds to one specific antigen.","Monoclonal antibodies can be used in pregnancy tests, diagnosis and targeted treatment. In a pregnancy test, antibodies bind to the hormone hCG and a labelled antibody produces a visible line. In medicine, antibodies can target antigens on particular cells, but treatment can have side effects and may not work for every patient.","Plant hormones coordinate growth and responses. Auxin stimulates cell elongation; when light reaches a shoot from one side, auxin accumulates on the shaded side so it grows faster and the shoot bends towards light. Roots respond differently to auxin concentration and tend to grow downwards.","Gibberellins stimulate seed germination and flowering in some plants, while ethene controls fruit ripening. Plant hormones are used in agriculture: selective weedkillers, rooting powders, fruit-ripening control and tissue culture can improve crop production.","The rate of decay of milk can be investigated by adding a pH indicator and measuring the time taken for a colour change at different temperatures. Bacteria produce lactic acid as they metabolise lactose, reducing pH. Temperature affects microbial growth and enzyme activity; very high temperature can kill or inhibit microorganisms.","Microbiology practical work requires aseptic technique: disinfect work surfaces, use sterile equipment, minimise the time that culture plates are open and secure lids with approved tape. Incubation conditions must be chosen by the school to reduce risk; never open cultures after incubation unless instructed by a qualified teacher."],"terms":["Nucleotide — DNA monomer made from a sugar, phosphate group and base.","Genome — the complete genetic material of an organism.","Complementary base pairing — A pairs with T, and C pairs with G in DNA.","Vector — carrier such as a plasmid or virus used to transfer a gene.","Clone — genetically identical copy of a cell or organism.","Monoclonal antibody — identical antibody molecules made by clones of one lymphocyte.","Hybridoma — cell formed by fusing an antibody-producing lymphocyte with a tumour cell.","Auxin — plant hormone that controls cell elongation and tropic responses.","Gibberellin — plant hormone involved in seed germination and growth.","Ethene — plant hormone that promotes fruit ripening."],"prompts":["What three components make up a DNA nucleotide?","How does the sequence of DNA bases determine the structure of a protein?","What is meant by the human genome, and why is it useful to study?","Describe the main stages of genetic engineering using a plasmid vector.","Evaluate one potential benefit and one risk of a GM crop.","How does adult cell cloning produce an embryo genetically like the donor?","Describe how a hybridoma is produced and why it can make monoclonal antibodies.","Explain how a pregnancy test uses monoclonal antibodies to detect hCG.","Use auxin distribution to explain why a shoot bends towards light.","Compare the roles of auxin, gibberellin and ethene.","Explain how temperature can affect the rate of milk decay and why pH can be used as an indicator.","State four aseptic techniques that reduce contamination risk in microbiology."],"q":"Which DNA base pairs with cytosine?","a":["guanine","G"],"exam":"Explain how a bacterial plasmid can be used to genetically engineer bacteria to produce human insulin.","mark":"A gene coding for human insulin is isolated using enzymes. A bacterial plasmid is cut and the gene inserted to make recombinant DNA. The plasmid is returned to a bacterium, which reproduces and expresses the gene; insulin is then collected and purified.","gapWords":["helix","ribosomes","genome","vector","herbicides","nucleus"],"practical":"AQA application focus: interpret diagrams of DNA, plasmids and vectors; explain why complementary base pairing matters; compare advantages and limitations of tissue culture, embryo cloning and adult cell cloning; evaluate GM applications using evidence and ethical, social and environmental factors.","multi":{"prompt":"Select every accurate statement about DNA and genetic engineering.","options":[["a","A nucleotide contains a sugar, phosphate and base.",true],["b","A plasmid can be used as a vector.",true],["c","A gene is made from amino acids.",false],["d","All mutations produce a beneficial phenotype.",false]],"explanation":"DNA is a nucleotide polymer and plasmids can act as vectors. Genes are DNA sequences, not amino-acid chains; mutations may be neu
