<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revision Club</title>
<style>
:root{--bg:#f5f6f7;--card:#fff;--ink:#17191d;--muted:#68707c;--line:#e0e3e8;--accent:#20252d;--soft:#eef0f3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,sans-serif}body.dark{--bg:#111315;--card:#1b1f23;--ink:#f2f4f6;--muted:#a5adb7;--line:#30363d;--accent:#f0f2f4;--soft:#292f35}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--card);color:var(--ink);font-weight:650}button.primary{background:var(--accent);color:var(--bg)}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1100px;margin:auto;padding:22px 16px 60px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:clamp(25px,5vw,38px);margin:0;letter-spacing:-1.3px}h2{font-size:24px;margin:8px 0}p{color:var(--muted);line-height:1.55}.nav{display:flex;gap:7px;overflow:auto;padding:18px 0}.nav button.active{background:var(--soft);border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}.card h3{margin:0 0 5px}.muted{color:var(--muted)}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:5px 0 12px}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:4px 9px;font-size:12px;color:var(--muted)}.quote{font-size:25px;font-weight:800;letter-spacing:-.5px;margin:15px 0}.hidden{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.flash{min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer}.flash .quote{font-size:30px}.feedback{background:var(--soft);border-radius:12px;padding:12px;margin:12px 0}.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}small{color:var(--muted)}.auth{max-width:420px;margin:45px auto}.poem{border-top:1px solid var(--line);padding:12px 0}.poem summary{font-weight:750;cursor:pointer}.poem p{margin:8px 0}.score{font-size:34px;font-weight:850}.right{color:#16845d}.wrong{color:#c34242}textarea{resize:vertical;min-height:150px}
</style></head><body><div class="wrap"><header><div><h1>Revision Club</h1><div class="muted">Learn your way. Revise together.</div></div><div class="row"><span id="who" class="pill">Not signed in</span><button id="theme">Dark mode</button><button id="logout" class="hidden">Log out</button></div></header>
<section id="auth" class="auth card"><h2>Welcome</h2><p>Create an account or sign in to save your revision and meet friends.</p><label>Email</label><input id="email" class="field" type="email" autocomplete="email"><label>Password</label><input id="password" class="field" type="password" autocomplete="current-password"><label>Username (for sign-up)</label><input id="username" class="field" maxlength="20" placeholder="e.g. QuoteWizard"><div class="row"><button class="primary" id="signup">Sign up</button><button id="login">Log in</button></div><p id="authmsg" aria-live="polite"></p></section>
<div id="app" class="hidden"><nav class="nav" id="nav"><button data-page="home" class="active">Home</button><button data-page="learn">Learn</button><button data-page="revise">Revise</button><button data-page="friends">Friends</button><button data-page="leaderboard">Leaderboard</button><button data-page="subjects">Subjects</button></nav><main id="page"></main></div></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://iqlwpzkkvfsestzhvgud.supabase.co','sb_publishable_P7DE6czlE2tspGAVgexEbg_VgftEkpf');
const $=id=>document.getElementById(id);let user=null,profile=null,page='home',deck=[],cardIndex=0,showBack=false,quiz=null;
const poems=[
['Remains','Simon Armitage','War and conflict',[['blood-shadow','Metaphor','Guilt follows the soldier like a shadow.','Guilt and trauma remain after conflict.'],['tosses his guts','Violent imagery','The blunt, casual verb makes violence sound disturbingly routine.','War can desensitise soldiers.']]],
['War Photographer','Carol Ann Duffy','Victims and effects of war',[['light is red','Colour imagery','Red suggests blood and suffering; the darkroom resembles a sacred space.','The photographer records human suffering.']]],
['Poppies','Jane Weir','Victims and effects of war',[['bandaged ... Poppies ... blockade','War imagery','Physical injury echoes emotional pain and separation.','War hurts families as well as soldiers.']]],
['Bayonet Charge','Ted Hughes','War and conflict',[['cold clockwork','Metaphor','The soldier seems like a machine, caught in forces beyond his control.','War strips away humanity.']]],
['Kamikaze','Beatrice Garland','Victims and effects of war',[['crabs, prawns','Natural imagery','The remembered beauty of nature contrasts with military duty.','A human life is caught between family and national expectation.']]],
['The Charge of the Light Brigade','Alfred Tennyson','War and conflict',[['valley of Death','Biblical allusion','The battlefield is presented as hellish and deadly.','The soldiers face almost certain death.']]],
['The Prelude','William Wordsworth','Nature’s power',[['act of stealth','Diction','The speaker recognises his guilt and arrogance.','Human pride is humbled by nature.']]],
['Storm on the Island','Seamus Heaney','Nature’s power',[['spits like a tame cat','Simile','A familiar animal image makes the storm seem unpredictable.','Nature can be deceptive and powerful.']]],
['My Last Duchess','Robert Browning','Power and control',[['my last Duchess','Possessive pronoun','The Duke speaks as if he owns the Duchess.','Power becomes control and possession.']]],
['London','William Blake','Power and control',[['mind-forged manacles','Metaphor','People are trapped by systems and beliefs.','Institutions can imprison people psychologically.']]],
['Tissue','Imtiaz Dharker','Power and control',[['Koran ... maps ... slips','Symbolism','Paper represents religion, borders and money: human systems are fragile.','Human power is temporary.']]],
['The Émigrée','Carol Rumens','Identity and place',[['bright ... shadow','Contrast','The speaker’s idealised memory clashes with political reality.','Home remains powerful in memory.']]],
['Checking Out Me History','John Agard','Identity and place',[['Dem','Dialect / pronoun','The repeated word separates the speaker from those controlling history.','The speaker challenges imposed identity.']]],
['Exposure','Wilfred Owen','Victims and effects of war',[['black with snow','Colour imagery','The hostile landscape makes nature feel threatening and bleak.','The weather becomes an enemy to soldiers.'],['cringe in holes','Verb / imagery','The soldiers are reduced to fearful, vulnerable figures.','War strips away comfort and dignity.']]],
['Ozymandias','Percy Bysshe Shelley','Power and control',[['sunk ... shattered visage','Visual imagery','The broken statue symbolises the collapse of the ruler’s power.','Time destroys human pride.'],['King of Kings','Irony / allusion','The boast is contradicted by the ruined statue and empty desert.','Power cannot defeat time.']]]
];
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function refresh(){const {data}=await supabase.auth.getUser();user=data.user||null;$('auth').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('logout').classList.toggle('hidden',!user);if(user){let r=await supabase.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=r.data;$('who').textContent=profile?.username||user.email;render()}}
function say(id,msg){$(id).textContent=msg}
$('signup').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,username=$('username').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');if(username.length<3)return say('authmsg','Username must be at least 3 characters.');const {data,error}=await supabase.auth.signUp({email,password,options:{data:{username,display_name:username}}});say('authmsg',error?.message||(data.session?'Account created!':'Check your email to confirm your account, then log in.'));if(data.session)refresh()};
$('login').onclick=async()=>{const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});say('authmsg',error?.message||'Signed in.');if(!error)refresh()};
$('logout').onclick=async()=>{await supabase.auth.signOut();refresh()};
$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'Light mode':'Dark mode';localStorage.setItem('rc-theme',document.body.classList.contains('dark')?'dark':'light')};
if(localStorage.getItem('rc-theme')==='dark'){document.body.classList.add('dark');$('theme').textContent='Light mode'}
$('nav').onclick=e=>{const b=e.target.closest('button[data-page]');if(!b)return;page=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()};
function shell(title,sub=''){return '<h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')}
function render(){const p=$('page');if(page==='home'){p.innerHTML=shell('Good to see you, '+escape(profile?.username||'student')+' 👋','Pick a revision method. No lessons to unlock and no fixed order.')+'<div class="grid"><article class="card"><h3>📖 Learn</h3><p>Understand all 15 Power & Conflict poems with quote explanations and comparison themes.</p><button data-go="learn">Open learning</button></article><article class="card"><h3>🧠 Flashcards</h3><p>Active recall for quotes, methods and analysis.</p><button data-go="revise">Start revising</button></article><article class="card"><h3>✍️ Blurting</h3><p>Write everything you remember, then check what you missed.</p><button data-go="revise">Start blurting</button></article><article class="card"><h3>🤝 Friends</h3><p>Find classmates by username, send friend requests and take on challenges.</p><button data-go="friends">Find friends</button></article></div><div class="card" style="margin-top:12px"><b>First exam focus: Power & Conflict</b><p>15 poems · 30 starter quote prompts · four comparison themes. Other subjects can be added without changing the revision tools.</p></div>'}
else if(page==='learn'){p.innerHTML=shell('Learn · Power & Conflict','Open a poem to explore the short quote prompts, methods and quick analysis. The comparison categories keep war and its human effects distinct.')+poems.map((po,i)=>'<details class="poem card"><summary>'+escape(po[0])+' <span class="pill">'+escape(po[2])+'</span></summary><p class="muted">'+escape(po[1])+'</p>'+po[3].map(q=>'<div class="feedback"><div class="quote">“'+escape(q[0])+'”</div><span class="pill">'+escape(q[1])+'</span><p>'+escape(q[2])+'</p><b>'+escape(q[3])+'</b></div>').join('')+'</details>').join('')}
else if(page==='revise'){p.innerHTML=shell('Choose how to revise','Short sessions. Repeat the difficult ones as often as you like.')+'<div class="tabs"><button id="flashTab" class="active">Flashcards</button><button id="blurtTab">Blurting</button><button id="quizTab">Quick quiz</button></div><div id="reviseArea"></div>';setupRevise()}
else if(page==='friends'){p.innerHTML=shell('Friends','Use usernames, not real names. Friend requests are private until accepted.')+'<div class="card"><h3>Add a friend</h3><input id="friendname" class="field" placeholder="Their username"><button class="primary" id="findfriend">Find and request</button><div id="friendmsg"></div></div><div class="card" style="margin-top:12px"><h3>Your friend requests</h3><div id="requests">Loading…</div></div><div class="card" style="margin-top:12px"><h3>Challenges</h3><p>Challenge creation and live multiplayer rounds are the next social feature to wire in.</p><button id="newchallenge">Create a practice challenge</button><div id="challengemsg"></div></div>';setupFriends()}
else if(page==='leaderboard'){p.innerHTML=shell('Leaderboard','Your best saved practice scores. Complete a session to appear here.')+'<div id="scores" class="card">Loading…</div>';loadScores()}
else if(page==='subjects'){p.innerHTML=shell('Your subject library','The revision activities are shared across subjects. Add content by topic rather than building a separate website for every subject.')+'<div class="grid">'+[['📖','English Literature','Power & Conflict · Macbeth'],['➗','Maths','Topics to add'],['🧪','Science','Biology · Chemistry · Physics'],['＋','Add another subject','History · Geography · Languages']].map(x=>'<article class="card"><h3>'+x[0]+' '+x[1]+'</h3><p>'+x[2]+'</p></article>').join('')+'</div>'}}
$('page').onclick=e=>{const b=e.target.closest('[data-go]');if(b){page=b.dataset.go;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));render()}};
function setupRevise(){let mode='flash';const area=$('reviseArea');function switchMode(m){mode=m;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.id===({flash:'flashTab',blurt:'blurtTab',quiz:'quizTab'}[m])));if(m==='flash')flash();if(m==='blurt')blurt();if(m==='quiz')startQuiz()}$('flashTab').onclick=()=>switchMode('flash');$('blurtTab').onclick=()=>switchMode('blurt');$('quizTab').onclick=()=>switchMode('quiz');deck=poems.flatMap(po=>po[3].map(q=>({poem:po[0],quote:q[0],method:q[1],analysis:q[2],hook:q[3]}))).sort(()=>Math.random()-.5);cardIndex=0;showBack=false;flash();
function flash(){let c=deck[cardIndex%deck.length];area.innerHTML='<div class="card flash" id="flip"><span class="pill">Card '+(cardIndex+1)+' of '+deck.length+'</span>'+(showBack?'<h3>'+escape(c.poem)+'</h3><div class="quote">'+escape(c.quote)+'</div><span class="pill">'+escape(c.method)+'</span><p>'+escape(c.analysis)+'</p><b>'+escape(c.hook)+'</b>':'<h3>'+escape(c.poem)+'</h3><div class="quote">What is the quote and what does it show?</div><small>Tap to reveal</small>')+'</div><div class="row"><button id="prev">Previous</button><button id="flipBtn" class="primary">'+(showBack?'Hide answer':'Reveal answer')+'</button><button id="next">Next card</button></div>';const flip=()=>{showBack=!showBack;flash()};$('flip').onclick=flip;$('flipBtn').onclick=flip;$('prev').onclick=()=>{cardIndex=(cardIndex-1+deck.length)%deck.length;showBack=false;flash()};$('next').onclick=()=>{cardIndex++;showBack=false;flash()}}
function blurt(){area.innerHTML='<div class="card"><h3>Blurting practice</h3><p>Choose a poem, write everything you can remember, then reveal the checklist. Try again later and fill the gaps.</p><select id="blurtpoem" class="field">'+poems.map(x=>'<option>'+escape(x[0])+'</option>').join('')+'</select><textarea id="blurttext" class="field" placeholder="Write everything you remember: quotes, methods, analysis, themes…"></textarea><button id="checkblurt" class="primary">Reveal my checklist</button><div id="blurtresult"></div></div>'; $('checkblurt').onclick=()=>{let po=poems.find(x=>x[0]===$('blurtpoem').value);$('blurtresult').innerHTML='<div class="feedback"><b>Compare your notes with these key prompts:</b>'+po[3].map(q=>'<p>“'+escape(q[0])+'” · '+escape(q[1])+'<br>'+escape(q[2])+'</p>').join('')+'</div>'}}
function startQuiz(){quiz={i:0,score:0,items:deck.slice(0,8).sort(()=>Math.random()-.5)};ask()}
function ask(){let c=quiz.items[quiz.i];area.innerHTML='<div class="card"><div class="row"><span class="pill">Question '+(quiz.i+1)+'/8</span><span class="pill">Score '+quiz.score+'</span></div><h3>Which poem does this quote come from?</h3><div class="quote">“'+escape(c.quote)+'”</div><div class="grid">'+poems.slice().sort(()=>Math.random()-.5).slice(0,4).map(x=>'<button class="answer">'+escape(x[0])+'</button>').join('')+'</div><div id="quizfeedback"></div></div>';area.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{let ok=b.textContent===c.poem;if(ok)quiz.score++;area.querySelectorAll('.answer').forEach(x=>x.disabled=true);$('quizfeedback').innerHTML='<p class="'+(ok?'right':'wrong')+'">'+(ok?'Correct!':'Not quite — it is '+escape(c.poem))+'. '+escape(c.hook)+'</p><button id="qnext" class="primary">'+(quiz.i===7?'Finish':'Next')+'</button>';$('qnext').onclick=async()=>{quiz.i++;if(quiz.i===8){area.innerHTML='<div class="card"><div class="score">'+quiz.score+'/8</div><h3>Round complete</h3><button id="again" class="primary">Play again</button></div>';$('again').onclick=startQuiz;await supabase.from('study_sessions').insert({user_id:user.id,subject_id:'english-lit',activity:'quick-quiz',score:quiz.score,duration_seconds:0});}else ask()}})}}
async function setupFriends(){$('findfriend').onclick=async()=>{let name=$('friendname').value.trim().toLowerCase();if(!name)return;let r=await supabase.from('profiles').select('id,username').eq('username',name).maybeSingle();if(r.error||!r.data)return say('friendmsg','No matching username found.');if(r.data.id===user.id)return say('friendmsg','That is your own account.');let ins=await supabase.from('friend_requests').insert({sender_id:user.id,receiver_id:r.data.id});say('friendmsg',ins.error?.message||'Friend request sent to '+r.data.username+'.')};let r=await supabase.from('friend_requests').select('id,sender_id,status,profiles:sender_id(username)').eq('receiver_id',user.id).eq('status','pending');$('requests').innerHTML=(r.data||[]).map(x=>'<div class="row"><b>'+escape(x.profiles?.username||'Student')+'</b><button data-accept="'+x.id+'">Accept</button><button data-decline="'+x.id+'">Decline</button></div>').join('')||'No pending requests.';$('requests').onclick=async e=>{let id=e.target.dataset.accept||e.target.dataset.decline;if(!id)return;await supabase.from('friend_requests').update({status:e.target.dataset.accept?'accepted':'declined'}).eq('id',id);setupFriends()};$('newchallenge').onclick=async()=>{let r=await supabase.from('challenges').insert({creator_id:user.id,title:'Power & Conflict quick revision',subject_id:'english-lit',mode:'quote-race'}).select().single();say('challengemsg',r.error?.message||'Challenge created. Invite a friend from the Friends tab (challenge invites are coming next). ID: '+r.data.id)}}
async function loadScores(){let r=await supabase.from('study_sessions').select('user_id,score,activity,created_at').order('score',{ascending:false}).limit(25);$('scores').innerHTML=r.error?escape(r.error.message):(r.data||[]).map((x,i)=>'<div class="poem">'+(i+1)+'. '+(x.user_id===user.id?'You':'Student')+' — <b>'+x.score+'</b> points · '+escape(x.activity)+'</div>').join('')||'No sessions recorded yet.'}
supabase.auth.onAuthStateChange(()=>setTimeout(refresh,0));refresh();
</script></body></html>
